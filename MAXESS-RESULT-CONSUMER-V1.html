<!--
MAXESS_RESULT_CONSUMER_V1
Purpose: Groove-ready Results-page bridge for MAXESS_RESULT_V1.
Placement: ONE standalone HTML/Code embed immediately before E01 on results.nayanet.app.
Input: #maxess-result=<URL-safe-base64(JSON)>
Output: window.MAXESS_RESULT + MAXESS_RESULT_READY + maxess:result-updated.
Design law: no demo/fallback scores; never invent a result; prefer the current URL payload.
Hardened behavior: late hash availability, late-loaded result sections, repeated safe hydration,
session persistence, hash changes, and authoritative E02 dimension labels.
-->
<script>
(function () {
  'use strict';
  if (window.__MAXESS_RESULT_CONSUMER_V1__) return;
  window.__MAXESS_RESULT_CONSUMER_V1__ = true;
  var CONTRACT = 'MAXESS_RESULT_V1';
  var READY = 'MAXESS_RESULT_READY';
  var UPDATED = 'maxess:result-updated';
  var STORAGE_KEY = 'MAXESS_RESULT_V1';
  var POLL_MS = 250;
  var MAX_POLLS = 40;
  var pollCount = 0;
  var lastSignature = '';

  function dispatch(name, detail) {
    try { window.dispatchEvent(new CustomEvent(name, { detail: detail || null })); }
    catch (e) { try { window.dispatchEvent(new Event(name)); } catch (_) {} }
  }

  function decodeBase64Url(value) {
    var normalized = String(value || '').replace(/-/g, '+').replace(/_/g, '/');
    while (normalized.length % 4) normalized += '=';
    var binary = atob(normalized), encoded = '';
    for (var i = 0; i < binary.length; i++) encoded += '%' + ('00' + binary.charCodeAt(i).toString(16)).slice(-2);
    return decodeURIComponent(encoded);
  }

  function getPayload() {
    var hash = window.location.hash || '';
    var match = hash.match(/(?:^|#|&)maxess-result=([^&]+)/i);
    return match ? decodeURIComponent(match[1]) : null;
  }

  function isValidResult(result) {
    if (!result || typeof result !== 'object') return false;
    if (result.contractVersion !== CONTRACT) return false;
    if (!Number.isFinite(Number(result.overallScore)) || Number(result.overallScore) < 0 || Number(result.overallScore) > 100) return false;
    if (!Array.isArray(result.dimensions) || result.dimensions.length !== 5) return false;
    if (!Array.isArray(result.responses) || result.responses.length !== 15) return false;
    return result.dimensions.every(function (d) {
      return d && typeof d === 'object' && typeof d.name === 'string' && d.name.trim() && Number.isFinite(Number(d.score)) && Number(d.score) >= 0 && Number(d.score) <= 100;
    });
  }

  function signature(result) {
    try { return [result.contractVersion, Number(result.overallScore), result.dimensions.map(function (d) { return String(d.name) + ':' + Number(d.score); }).join('|'), result.responses.length].join('::'); }
    catch (_) { return ''; }
  }

  function syncDimensionLabels(result) {
    if (!result || !Array.isArray(result.dimensions) || result.dimensions.length !== 5) return;
    var roots = document.querySelectorAll('#maxess-e02-v2, #maxess-e02-v3');
    roots.forEach(function (root) {
      var names = root.querySelectorAll('.e02-name');
      result.dimensions.forEach(function (dimension, index) {
        if (names[index] && dimension && dimension.name) names[index].textContent = String(dimension.name).toUpperCase();
      });
    });
  }

  function publish(result, source) {
    if (!isValidResult(result)) return false;
    var nextSignature = signature(result), changed = nextSignature !== lastSignature;
    window.MAXESS_RESULT = result;
    try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(result)); } catch (_) {}
    syncDimensionLabels(result);
    if (changed) {
      lastSignature = nextSignature;
      dispatch(READY, { result: result, source: source || 'hash' });
      dispatch(UPDATED, { result: result, source: source || 'hash' });
    }
    return true;
  }

  function consume() {
    var encoded = getPayload();
    if (encoded) {
      try { if (publish(JSON.parse(decodeBase64Url(encoded)), 'hash')) return true; } catch (_) {}
    }
    try { if (publish(JSON.parse(sessionStorage.getItem(STORAGE_KEY) || 'null'), 'session')) return true; } catch (_) {}
    return false;
  }

  function hydrate() {
    if (consume()) { pollCount = MAX_POLLS; return; }
    pollCount += 1;
    if (pollCount < MAX_POLLS) window.setTimeout(hydrate, POLL_MS);
  }

  window.MAXESS_RESULT_CONSUMER_V1 = { consume: consume, get: function () { return window.MAXESS_RESULT || null; }, contractVersion: CONTRACT, version: 'HARDENED-V1' };
  window.addEventListener('hashchange', function () { pollCount = 0; hydrate(); });
  window.addEventListener('pageshow', function () { pollCount = 0; hydrate(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { pollCount = 0; hydrate(); }, { once: true });
  else hydrate();
})();
</script>
