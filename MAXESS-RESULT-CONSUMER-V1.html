<!--
MAXESS_RESULT_CONSUMER_V1
Purpose: Groove-ready Results-page bridge.
Placement: Add this as a standalone HTML embed on results.nayanet.app.
The assessment supplies #maxess-result=<URL-safe-base64(JSON)>.
This bridge validates that payload and exposes it as window.MAXESS_RESULT for E01-E06.
Do not add demo/fallback scores here.

SURGICAL PATCH V3:
- Preserves the existing contract and public API.
- Accepts the authoritative hash/session result only.
- Re-publishes the authoritative result after late-loaded Groove sections mount.
- Relays the same authoritative result into child iframe embeds.
- Never manufactures or substitutes a score.
-->
<script>
(function () {
  'use strict';

  if (window.__MAXESS_RESULT_CONSUMER_V3__) return;
  window.__MAXESS_RESULT_CONSUMER_V3__ = true;

  var CONTRACT = 'MAXESS_RESULT_V1';
  var READY = 'MAXESS_RESULT_READY';
  var UPDATED = 'maxess:result-updated';
  var STORAGE_KEY = 'MAXESS_RESULT_V1';
  var REPLAY = 'MAXESS_RESULT_REPLAY';

  function dispatch(name, detail) {
    try {
      window.dispatchEvent(new CustomEvent(name, { detail: detail || null }));
    } catch (e) {
      try { window.dispatchEvent(new Event(name)); } catch (_) {}
    }
  }

  function decodeBase64Url(value) {
    var normalized = String(value || '').replace(/-/g, '+').replace(/_/g, '/');
    while (normalized.length % 4) normalized += '=';
    return decodeURIComponent(Array.prototype.map.call(atob(normalized), function (c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
  }

  function getPayload() {
    var hash = window.location.hash || '';
    var match = hash.match(/(?:^|#|&)maxess-result=([^&]+)/);
    return match ? decodeURIComponent(match[1]) : null;
  }

  function isValidResult(result) {
    if (!result || typeof result !== 'object') return false;
    if (result.contractVersion !== CONTRACT) return false;
    if (!Number.isFinite(Number(result.overallScore))) return false;
    if (Number(result.overallScore) < 0 || Number(result.overallScore) > 100) return false;
    if (!Array.isArray(result.dimensions) || result.dimensions.length !== 5) return false;
    if (!Array.isArray(result.responses) || result.responses.length !== 15) return false;
    return result.dimensions.every(function (d) {
      return d && typeof d === 'object' && Number.isFinite(Number(d.score));
    });
  }

  function relayToEmbeds(result) {
    if (!isValidResult(result)) return;
    var message = { type: READY, result: result };
    try {
      var frames = document.querySelectorAll('iframe');
      for (var i = 0; i < frames.length; i += 1) {
        try {
          if (frames[i].contentWindow) frames[i].contentWindow.postMessage(message, '*');
        } catch (_) {}
      }
    } catch (_) {}
  }

  function normalize(detail) {
    if (isValidResult(detail)) return detail;
    if (detail && isValidResult(detail.result)) return detail.result;
    return null;
  }

  function publish(result, source) {
    if (!isValidResult(result)) return false;
    window.MAXESS_RESULT = result;

    try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(result)); } catch (_) {}

    try {
      if (!Object.prototype.hasOwnProperty.call(result, 'result')) {
        Object.defineProperty(result, 'result', {
          value: result,
          enumerable: false,
          configurable: true
        });
      }
    } catch (_) {}

    dispatch(READY, result);
    dispatch(UPDATED, result);
    relayToEmbeds(result);
    return true;
  }

  function consume() {
    var encoded = getPayload();
    if (!encoded) return false;

    try {
      var result = JSON.parse(decodeBase64Url(encoded));
      if (!isValidResult(result)) return false;
      return publish(result, 'hash');
    } catch (e) {
      return false;
    }
  }

  function restore() {
    try {
      var stored = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || 'null');
      return publish(stored, 'session');
    } catch (_) {
      return false;
    }
  }

  function boot() {
    if (!consume()) restore();
  }

  boot();

  window.MAXESS_RESULT_CONSUMER_V1 = {
    consume: consume,
    get: function () { return window.MAXESS_RESULT || null; },
    replay: function () {
      var result = window.MAXESS_RESULT;
      if (!isValidResult(result)) return false;
      dispatch(REPLAY, result);
      dispatch(READY, result);
      dispatch(UPDATED, result);
      relayToEmbeds(result);
      return true;
    },
    contractVersion: CONTRACT
  };

  window.addEventListener('hashchange', boot);

  [0, 50, 250, 750, 1500, 3000].forEach(function (delay) {
    window.setTimeout(function () {
      if (window.MAXESS_RESULT_CONSUMER_V1) {
        window.MAXESS_RESULT_CONSUMER_V1.replay();
      }
    }, delay);
  });

  window.addEventListener('pageshow', function () {
    window.setTimeout(function () {
      if (window.MAXESS_RESULT_CONSUMER_V1) {
        window.MAXESS_RESULT_CONSUMER_V1.replay();
      }
    }, 0);
  });
})();
</script>
