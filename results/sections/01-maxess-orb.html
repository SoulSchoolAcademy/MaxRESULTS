<!--
MAXESS RESULTS — SECTION 01: THE ORB
Version: 1.0.0
Created: 2026-08-18
Purpose: First modular Results section. This is intentionally standalone and does not depend on the legacy 8,000-line Results source.
Data contract: window.MAXESS_RESULT = { overallScore:number, band:string, dimensions?:Array<{name:string,score:number}> }
Integration rule: Mount this section after the assessment has produced the authoritative MAXESS_RESULT object.
-->
<section id="maxess-orb-section" class="mxr-orb-section" aria-labelledby="mxr-orb-title">
  <div class="mxr-orb-stage">
    <div class="mxr-orb-copy">
      <p class="mxr-eyebrow">MAXESS · YOUR AI MASTERY RESULTS</p>
      <h1 id="mxr-orb-title">Your AI capability<br><em>has a shape.</em></h1>
      <p class="mxr-intro">You didn't just receive a number. You created a picture of how you currently think, direct, evaluate, iterate, and build with AI.</p>
      <div class="mxr-actions">
        <button class="mxr-button mxr-button-primary" type="button" data-mxr-scroll="#maxess-results-next">Explore Your Results <span aria-hidden="true">↓</span></button>
        <button class="mxr-button mxr-button-quiet" type="button" data-mxr-scroll="#maxess-results-naya">Meet Naya <span aria-hidden="true">→</span></button>
      </div>
    </div>

    <div class="mxr-orb-wrap" aria-label="Your MAXESS score" role="img">
      <div class="mxr-orb-halo mxr-halo-a"></div>
      <div class="mxr-orb-halo mxr-halo-b"></div>
      <div class="mxr-orbit mxr-orbit-outer" aria-hidden="true"><i></i></div>
      <div class="mxr-orbit mxr-orbit-middle" aria-hidden="true"><i></i></div>
      <div class="mxr-orbit mxr-orbit-inner" aria-hidden="true"><i></i></div>
      <div class="mxr-orb">
        <div class="mxr-orb-sheen"></div>
        <div class="mxr-orb-core"></div>
        <div class="mxr-score-content">
          <span class="mxr-score-label">MAXESS SCORE</span>
          <strong class="mxr-score" data-mxr-score>—</strong>
          <span class="mxr-band" data-mxr-band>Calculating</span>
        </div>
      </div>
      <div class="mxr-orb-particles" aria-hidden="true"></div>
    </div>
  </div>

  <div class="mxr-orb-meta" aria-live="polite">
    <div><strong data-mxr-meta-score>—</strong><span>overall capability</span></div>
    <div><strong data-mxr-meta-band>—</strong><span>current mastery range</span></div>
    <div><strong>5</strong><span>capability dimensions</span></div>
  </div>
</section>

<style>
#maxess-orb-section{--mxr-bg:#040307;--mxr-white:#fff;--mxr-soft:rgba(255,255,255,.72);--mxr-muted:rgba(255,255,255,.48);--mxr-purple:#a66cff;--mxr-violet:#d7b5ff;--mxr-deep:#160a22;position:relative;isolation:isolate;overflow:hidden;min-height:min(920px,100svh);display:flex;flex-direction:column;justify-content:center;padding:clamp(70px,8vw,120px) clamp(20px,5vw,80px);color:var(--mxr-white);background:radial-gradient(ellipse 70% 55% at 70% 50%,rgba(137,63,221,.18),transparent 65%),radial-gradient(ellipse 50% 45% at 18% 18%,rgba(111,48,187,.12),transparent 70%),var(--mxr-bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#maxess-orb-section:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 70% 50%,rgba(255,255,255,.045) 0 1px,transparent 1.5px);background-size:18px 18px;mask-image:linear-gradient(90deg,transparent 0,#000 35%,#000 85%,transparent 100%);opacity:.25}#maxess-orb-section:after{content:"";position:absolute;inset:auto 0 0;height:32%;z-index:-1;background:linear-gradient(180deg,transparent,var(--mxr-bg))}.mxr-orb-stage{width:min(1420px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,.82fr) minmax(460px,.9fr);gap:clamp(30px,7vw,120px);align-items:center}.mxr-orb-copy{position:relative;z-index:3}.mxr-eyebrow{display:inline-flex;align-items:center;gap:10px;margin:0;color:var(--mxr-violet);font-size:11px;font-weight:850;letter-spacing:.18em;text-transform:uppercase}.mxr-eyebrow:before{content:"";width:30px;height:1px;background:linear-gradient(90deg,var(--mxr-purple),transparent)}.mxr-orb-copy h1{margin:18px 0 0;max-width:720px;font-size:clamp(48px,6.5vw,96px);line-height:.92;letter-spacing:-.06em;font-weight:780}.mxr-orb-copy h1 em{font-style:normal;background:linear-gradient(110deg,#fff 8%,#e1c5ff 48%,#9a5cff 90%);-webkit-background-clip:text;background-clip:text;color:transparent}.mxr-intro{max-width:650px;margin:25px 0 0;color:var(--mxr-soft);font-size:clamp(16px,1.45vw,20px);line-height:1.58}.mxr-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}.mxr-button{min-height:54px;padding:0 20px;border:1px solid rgba(255,255,255,.16);border-radius:16px;color:#fff;font:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:transform .22s ease,filter .22s ease,background .22s ease}.mxr-button:hover{transform:translateY(-3px);filter:brightness(1.08)}.mxr-button:focus-visible{outline:2px solid #fff;outline-offset:4px}.mxr-button-primary{background:linear-gradient(135deg,#d8b5ff,#8649e9 50%,#401078);box-shadow:0 16px 40px rgba(101,43,180,.32),inset 0 1px rgba(255,255,255,.6)}.mxr-button-quiet{background:rgba(255,255,255,.045)}.mxr-orb-wrap{position:relative;width:min(680px,88vw);aspect-ratio:1;margin:auto;display:grid;place-items:center}.mxr-orb-halo{position:absolute;border-radius:50%;pointer-events:none}.mxr-halo-a{inset:8%;background:radial-gradient(circle,rgba(164,92,255,.22),transparent 66%);filter:blur(26px);animation:mxr-breathe 6s ease-in-out infinite}.mxr-halo-b{inset:18%;background:radial-gradient(circle,rgba(74,30,113,.3),transparent 65%);filter:blur(14px);animation:mxr-breathe 8s ease-in-out infinite reverse}.mxr-orb{position:relative;width:58%;aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 33% 25%,rgba(255,255,255,.3) 0 3%,transparent 12%),radial-gradient(circle at 55% 54%,#4b2470 0,#211032 35%,#10091a 64%,#040307 100%);box-shadow:0 0 0 1px rgba(255,255,255,.16),inset 22px 18px 60px rgba(255,255,255,.04),inset -24px -30px 70px rgba(0,0,0,.72),0 35px 90px rgba(0,0,0,.62),0 0 90px rgba(146,74,255,.24);z-index:4}.mxr-orb:before{content:"";position:absolute;inset:7%;border-radius:50%;border:1px solid rgba(214,181,255,.25);box-shadow:inset 0 0 35px rgba(166,108,255,.13),0 0 35px rgba(166,108,255,.12)}.mxr-orb:after{content:"";position:absolute;inset:17%;border-radius:50%;border:1px solid rgba(255,255,255,.075)}.mxr-orb-sheen{position:absolute;width:72%;height:44%;left:4%;top:2%;border-radius:50%;transform:rotate(-24deg);background:radial-gradient(ellipse,rgba(255,255,255,.13),transparent 66%);filter:blur(8px)}.mxr-orb-core{position:absolute;width:25%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(226,190,255,.8) 8%,rgba(166,108,255,.3) 38%,transparent 70%);filter:blur(2px);box-shadow:0 0 30px rgba(206,165,255,.7),0 0 70px rgba(151,73,255,.45);animation:mxr-core 4.5s ease-in-out infinite}.mxr-score-content{position:relative;z-index:8;text-align:center;text-shadow:0 2px 20px rgba(0,0,0,.75)}.mxr-score-label{display:block;color:rgba(255,255,255,.58);font-size:9px;font-weight:900;letter-spacing:.22em}.mxr-score{display:block;margin-top:12px;font-size:clamp(72px,9vw,132px);line-height:.8;letter-spacing:-.09em;font-weight:820}.mxr-band{display:inline-flex;margin-top:20px;padding:8px 13px;border:1px solid rgba(214,181,255,.28);border-radius:999px;background:rgba(166,108,255,.1);font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.mxr-orbit{position:absolute;border:1px solid rgba(214,181,255,.18);border-radius:50%;transform:rotate(-20deg);z-index:5;pointer-events:none}.mxr-orbit i{position:absolute;display:block;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 30px var(--mxr-purple),0 0 55px rgba(166,108,255,.7)}.mxr-orbit-outer{inset:4%;transform:rotate(24deg) skewX(-8deg);animation:mxr-orbit-a 16s linear infinite}.mxr-orbit-outer i{left:14%;top:-6px}.mxr-orbit-middle{inset:13%;transform:rotate(-42deg) skewX(10deg);animation:mxr-orbit-b 11s linear infinite reverse}.mxr-orbit-middle i{right:6%;bottom:10%}.mxr-orbit-inner{inset:22%;transform:rotate(68deg);animation:mxr-orbit-a 8s linear infinite}.mxr-orbit-inner i{left:12%;top:-5px;width:8px;height:8px}.mxr-orb-particles{position:absolute;inset:2%;border-radius:50%;z-index:3;pointer-events:none}.mxr-orb-particles:before,.mxr-orb-particles:after{content:"";position:absolute;inset:8%;border-radius:50%;background:conic-gradient(from 12deg,transparent 0 9%,rgba(215,181,255,.8) 9.2% 9.6%,transparent 9.8% 24%,rgba(255,255,255,.6) 24.2% 24.5%,transparent 24.7% 48%,rgba(166,108,255,.8) 48.2% 48.7%,transparent 49% 74%,rgba(255,255,255,.55) 74.2% 74.6%,transparent 74.8% 100%);mask-image:radial-gradient(circle,transparent 0 52%,#000 54% 100%);animation:mxr-spin 22s linear infinite}.mxr-orb-particles:after{inset:16%;opacity:.7;transform:rotate(70deg);animation-duration:14s;animation-direction:reverse}.mxr-orb-meta{width:min(980px,100%);margin:clamp(40px,6vw,70px) auto 0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.08)}.mxr-orb-meta div{padding:18px 20px;text-align:center}.mxr-orb-meta div+div{border-left:1px solid rgba(255,255,255,.08)}.mxr-orb-meta strong{display:block;font-size:20px;letter-spacing:-.02em}.mxr-orb-meta span{display:block;margin-top:3px;color:var(--mxr-muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}@keyframes mxr-spin{to{transform:rotate(360deg)}}@keyframes mxr-orbit-a{to{transform:rotate(384deg) skewX(-8deg)}}@keyframes mxr-orbit-b{to{transform:rotate(-402deg) skewX(10deg)}}@keyframes mxr-core{0%,100%{transform:scale(.92);opacity:.75}50%{transform:scale(1.08);opacity:1}}@keyframes mxr-breathe{0%,100%{transform:scale(.94);opacity:.7}50%{transform:scale(1.06);opacity:1}}@media (max-width:900px){.mxr-orb-stage{grid-template-columns:1fr;text-align:center}.mxr-orb-copy{order:1}.mxr-orb-wrap{order:2;width:min(600px,92vw)}.mxr-eyebrow{justify-content:center}.mxr-intro{margin-left:auto;margin-right:auto}.mxr-actions{justify-content:center}.mxr-orb-meta{margin-top:20px}}@media (max-width:560px){#maxess-orb-section{min-height:auto;padding-top:72px}.mxr-orb-wrap{width:100%;max-width:440px}.mxr-orb{width:57%}.mxr-orb-copy h1{font-size:clamp(43px,13vw,62px)}.mxr-intro{font-size:15px}.mxr-button{width:100%}.mxr-orb-meta{grid-template-columns:1fr}.mxr-orb-meta div+div{border-left:0;border-top:1px solid rgba(255,255,255,.08)}}@media (prefers-reduced-motion:reduce){.mxr-halo-a,.mxr-halo-b,.mxr-orb-core,.mxr-orbit,.mxr-orb-particles:before,.mxr-orb-particles:after{animation:none!important}.mxr-button{transition:none}}
</style>

<script>
(function(){
  'use strict';
  var root=document.getElementById('maxess-orb-section');
  if(!root)return;
  var fallback={overallScore:82,band:'Advancing'};
  var result=window.MAXESS_RESULT||fallback;
  var score=Math.max(0,Math.min(100,Number(result.overallScore)||0));
  var band=result.band||({0:'Foundation',51:'Developing',76:'Advancing',91:'Mastering'}[score]||'Developing');
  var scoreEls=root.querySelectorAll('[data-mxr-score],[data-mxr-meta-score]');
  for(var i=0;i<scoreEls.length;i++)scoreEls[i].textContent=String(Math.round(score));
  var bandEls=root.querySelectorAll('[data-mxr-band],[data-mxr-meta-band]');
  for(var j=0;j<bandEls.length;j++)bandEls[j].textContent=band;
  root.setAttribute('aria-label','Your MAXESS score is '+Math.round(score)+' out of 100. Your current mastery range is '+band+'.');
  var buttons=root.querySelectorAll('[data-mxr-scroll]');
  for(var k=0;k<buttons.length;k++)buttons[k].addEventListener('click',function(){var target=document.querySelector(this.getAttribute('data-mxr-scroll'));if(target)target.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});});
})();
</script>
