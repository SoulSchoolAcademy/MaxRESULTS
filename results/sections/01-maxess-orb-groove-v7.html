<script>
(() => {
  'use strict';
  const root = document.getElementById('maxess-section-01-v7');
  if (!root || root.dataset.initialized === 'true') return;
  root.dataset.initialized = 'true';

  const scoreEl = root.querySelector('[data-score]');
  const stageEl = root.querySelector('[data-stage]');
  const orb = root.querySelector('[data-orb]');
  const status = root.querySelector('.mxv7__sr-status');
  const listen = root.querySelector('.mxv7__listen');

  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  const toNumber = value => {
    const n = Number(value);
    return Number.isFinite(n) ? clamp(Math.round(n), 0, 100) : null;
  };

  function getProductionResult() {
    const result = window.MAXESS_RESULT;
    if (!result || typeof result !== 'object') return null;
    const score = toNumber(result.overallScore ?? result.score ?? result.totalScore);
    if (score === null) return null;
    return { score, band: String(result.band || result.masteryStage || result.stage || '').trim() };
  }

  function getPreviewResult() {
    const preview = window.MAXESS_SECTION01_PREVIEW;
    if (!preview || typeof preview !== 'object') return null;
    const score = toNumber(preview.overallScore ?? preview.score);
    if (score === null) return null;
    return { score, band: String(preview.band || preview.masteryStage || preview.stage || '').trim() };
  }

  function stageFor(score) {
    if (score <= 50) return 'Foundation';
    if (score <= 75) return 'Developing';
    if (score <= 90) return 'Advancing';
    return 'Mastering';
  }

  function colorFor(score) {
    const stops = [
      [0,[255,55,82]],
      [49,[255,55,82]],
      [59,[255,126,48]],
      [74,[255,211,65]],
      [84,[78,220,118]],
      [89,[52,207,235]],
      [94,[107,112,255]],
      [100,[235,65,255]]
    ];
    for (let i=0;i<stops.length-1;i++) {
      const a=stops[i], b=stops[i+1];
      if (score <= b[0]) {
        const t=(score-a[0])/(b[0]-a[0] || 1);
        return a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*t));
      }
    }
    return stops[stops.length-1][1];
  }

  function applyResult(data, isPreview) {
    const score = data.score;
    const stage = data.band || stageFor(score);
    const [r,g,b] = colorFor(score);
    root.style.setProperty('--mx-score', score);
    root.style.setProperty('--mx-r', r);
    root.style.setProperty('--mx-g', g);
    root.style.setProperty('--mx-b', b);
    root.style.setProperty('--mx-accent-rgb', `${r},${g},${b}`);
    root.style.setProperty('--mx-accent', `rgb(${r} ${g} ${b})`);
    scoreEl.textContent = String(score);
    stageEl.textContent = stage;
    orb.setAttribute('aria-label', `MAXESS AI score ${score} out of 100, ${stage}`);
    status.textContent = isPreview ? `Visual preview: AI score ${score}, ${stage}.` : `Your AI score is ${score} out of 100, ${stage}.`;
    root.classList.add('is-ready');
  }

  // Production is authoritative. Preview exists only when explicitly supplied.
  const production = getProductionResult();
  const preview = getPreviewResult();
  if (production) applyResult(production, false);
  else if (preview) applyResult(preview, true);
  else {
    scoreEl.textContent = '—';
    stageEl.textContent = 'RESULT AVAILABLE AFTER ASSESSMENT';
    root.classList.add('is-ready');
    status.textContent = 'MAXESS result data is not available yet.';
  }

  listen.addEventListener('click', () => {
    const target = window.NAYA_REPORT_AUDIO_URL || window.NAYA_AUDIO_URL;
    if (target) window.open(target, '_blank', 'noopener');
    else if (typeof window.NAYA_LISTEN_HANDLER === 'function') window.NAYA_LISTEN_HANDLER();
    else status.textContent = 'Naya report listening action is ready to be connected.';
  });
})();
</script>
