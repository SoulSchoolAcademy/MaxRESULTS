/* Reduced motion is a real alternative, not merely an animation speed tweak. */
@media (prefers-reduced-motion: reduce) {
  #maxess-section-01 .mx01__aurora,
  #maxess-section-01 .mx01__orb-aura--outer,
  #maxess-section-01 .mx01__orb::before,
  #maxess-section-01 .mx01__ring,
  #maxess-section-01 .mx01__core-light,
  #maxess-section-01 .mx01__core-depth,
  #maxess-section-01 .mx01__energy,
  #maxess-section-01 .mx01__microfield i,
  #maxess-section-01 .mx01__orbital-track {
    animation: none !important;
  }
  #maxess-section-01 .mx01__orbital-track { transform: rotateX(68deg) rotateZ(-35deg); }
  #maxess-section-01 .mx01__orbital-bead { opacity: 1; }
  #maxess-section-01.mx01.is-entering .mx01__naya,
  #maxess-section-01.mx01.is-entering .mx01__score-heading,
  #maxess-section-01.mx01.is-entering .mx01__orb-wrap { opacity: 1; transform: none; }

/* High contrast / forced colors */
@media (forced-colors: active) {
  #maxess-section-01 .mx01__listen { border: 1px solid ButtonText; }
  #maxess-section-01 .mx01__score { text-shadow: none; }
  #maxess-section-01 .mx01__orbital-bead { background: CanvasText; box-shadow: none; }
}
</style>

<script>
(function () {
  'use strict';

  var root = document.getElementById('maxess-section-01');
  if (!root || root.dataset.initialized === 'true') return;
  root.dataset.initialized = 'true';

  var scoreEl = root.querySelector('[data-score]');
  var stageEl = root.querySelector('[data-stage]');
  var previewNote = root.querySelector('[data-preview-note]');
  var statusEl = root.querySelector('.mx01__sr-status');
  var listenButton = root.querySelector('.mx01__listen');
  var nayaImage = root.querySelector('.mx01__naya-image');
  var nayaFallback = root.querySelector('.mx01__naya-fallback');

  /* ----------------------------------------------------------------------
     DEVELOPMENT PREVIEW
     Explicitly opt-in. Production data always wins.
     ---------------------------------------------------------------------- */
  var previewEnabled = window.MAXESS_SECTION01_PREVIEW === true;
  var previewResult = {
    overallScore: 82,
    band: 'Advancing'
  };

  function numberFrom(value) {
    var n = Number(value);
    if (!Number.isFinite(n)) return null;
    return Math.max(0, Math.min(100, n));
  }

  function findScore(result) {
    if (!result || typeof result !== 'object') return null;
    return numberFrom(
      result.overallScore != null ? result.overallScore :
      result.score != null ? result.score :
      result.aiScore != null ? result.aiScore : null
    );
  }

  function findBand(result, score) {
    if (result && typeof result.band === 'string' && result.band.trim()) return result.band.trim();
    if (result && typeof result.masteryStage === 'string' && result.masteryStage.trim()) return result.masteryStage.trim();
    if (result && typeof result.stage === 'string' && result.stage.trim()) return result.stage.trim();
    if (score == null) return 'AI MASTERY';
    if (score < 50) return 'Emerging';
    if (score < 65) return 'Developing';
    if (score < 80) return 'Advancing';
    if (score < 90) return 'Mastering';
    return 'Exceptional';
  }

  function hexToRgb(hex) {
    var clean = hex.replace('#', '');
    if (clean.length === 3) clean = clean.split('').map(function (c) { return c + c; }).join('');
    return [parseInt(clean.slice(0,2),16), parseInt(clean.slice(2,4),16), parseInt(clean.slice(4,6),16)];
  }

  var palette = [
    { p: 0, c: '#ef3f4f' },
    { p: 49, c: '#ff5361' },
    { p: 59, c: '#ff8a3d' },
    { p: 74, c: '#f5d84b' },
    { p: 84, c: '#64d96d' },
    { p: 89, c: '#39d6d0' },
    { p: 94, c: '#746cff' },
    { p: 100, c: '#ed55d9' }
  ];

  function interpolateColor(score) {
    if (score <= palette[0].p) return hexToRgb(palette[0].c);
    for (var i = 1; i < palette.length; i++) {
      var a = palette[i - 1];
      var b = palette[i];
      if (score <= b.p) {
        var t = (score - a.p) / (b.p - a.p);
        return [
          Math.round(a.c ? hexToRgb(a.c)[0] + (hexToRgb(b.c)[0] - hexToRgb(a.c)[0]) * t : 0),
          Math.round(hexToRgb(a.c)[1] + (hexToRgb(b.c)[1] - hexToRgb(a.c)[1]) * t),
          Math.round(hexToRgb(a.c)[2] + (hexToRgb(b.c)[2] - hexToRgb(a.c)[2]) * t)
        ];
      }
    }
    return hexToRgb(palette[palette.length - 1].c);
  }

  function setScoreColor(score) {
    var rgb = interpolateColor(score);
    var text = rgb.join(',');
    root.style.setProperty('--mx-accent-rgb', text);
    root.style.setProperty('--mx-score', String(score));
  }

  function revealScore(target, band) {
    var duration = 850;
    var start = performance.now();
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduced) {
      scoreEl.textContent = String(Math.round(target));
      setScoreColor(target);
      stageEl.textContent = band.toUpperCase();
      return;
    }

    function frame(now) {
      var t = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      var value = Math.round(target * eased);
      scoreEl.textContent = String(value);
      setScoreColor(value);
      if (t < 1) requestAnimationFrame(frame);
      else {
        scoreEl.textContent = String(Math.round(target));
        stageEl.textContent = band.toUpperCase();
      }
    }
    requestAnimationFrame(frame);
  }

  function applyResult(result, isPreview) {
    var score = findScore(result);
    if (score == null) {
      scoreEl.textContent = '—';
      stageEl.textContent = 'AI MASTERY';
      statusEl.textContent = 'Your MAXESS result is not available yet.';
      root.classList.add('is-ready');
      return;
    }

    var band = findBand(result, score);
    if (isPreview) previewNote.hidden = false;
    setScoreColor(0);
    root.classList.add('is-ready');
    window.setTimeout(function () { revealScore(score, band); }, 280);
    statusEl.textContent = 'Your AI Score is ' + Math.round(score) + ' out of 100. Mastery stage: ' + band + '.';
  }

  /* Naya image asset contract: accept an explicitly configured asset path.
     This avoids inventing an external asset URL and preserves the fallback. */
  var configuredNayaImage = typeof window.MAXESS_NAYA_IMAGE_URL === 'string' ? window.MAXESS_NAYA_IMAGE_URL.trim() : '';
  if (configuredNayaImage) {
    nayaImage.src = configuredNayaImage;
    nayaImage.addEventListener('load', function () {
      nayaImage.style.display = 'block';
      nayaFallback.style.display = 'none';
    }, { once: true });
  }

  listenButton.addEventListener('click', function () {
    var event = new CustomEvent('maxess:naya-listen', { detail: { section: '01', score: findScore(window.MAXESS_RESULT) } });
    root.dispatchEvent(event);
    if (typeof window.MAXESS_ON_LISTEN_NAYA === 'function') {
      window.MAXESS_ON_LISTEN_NAYA(event.detail);
    }
  });

  root.classList.add('is-entering');

  var productionResult = window.MAXESS_RESULT;
  if (productionResult && typeof productionResult === 'object' && findScore(productionResult) != null) {
    applyResult(productionResult, false);
  } else if (previewEnabled) {
    applyResult(previewResult, true);
  } else {
    applyResult(null, false);
  }

  /* Re-check once after mount for assessment systems that publish MAXESS_RESULT
     immediately after the embed initializes. This is bounded and cannot loop. */
  window.setTimeout(function () {
    var lateResult = window.MAXESS_RESULT;
    if (lateResult && findScore(lateResult) != null && scoreEl.textContent === '—') {
      applyResult(lateResult, false);
    }
  }, 900);
})();
</script>
