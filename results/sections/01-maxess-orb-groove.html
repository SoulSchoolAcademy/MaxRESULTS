          <div class="mxs01__bead-orbit mxs01__bead-orbit--secondary" aria-hidden="true"><span class="mxs01__bead mxs01__bead--small"></span></div>

            <div class="mxs01__score-content">

  <div class="mxs01__sr-only" aria-live="polite" data-announcer></div>

#maxess-section-01-groove .mxs01__micro-particles i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.72);box-shadow:0 0 8px rgba(var(--mxs-accent-rgb),.70)}
#maxess-section-01-groove .mxs01__micro-particles .p1{left:16%;top:37%;animation:mxsParticleA 5.4s ease-in-out infinite}.mxs01__micro-particles .p2{left:24%;top:70%;animation:mxsParticleB 7.2s ease-in-out infinite}.mxs01__micro-particles .p3{left:78%;top:31%;animation:mxsParticleC 6.1s ease-in-out infinite}.mxs01__micro-particles .p4{left:84%;top:61%;animation:mxsParticleA 8.1s ease-in-out infinite reverse}.mxs01__micro-particles .p5{left:36%;top:11%;width:2px;height:2px;animation:mxsParticleC 5.7s ease-in-out infinite reverse}.mxs01__micro-particles .p6{left:66%;top:14%;width:2px;height:2px;animation:mxsParticleB 6.7s ease-in-out infinite}.mxs01__micro-particles .p7{left:12%;top:55%;width:2px;height:2px;animation:mxsParticleA 9s ease-in-out infinite}.mxs01__micro-particles .p8{left:88%;top:44%;width:2px;height:2px;animation:mxsParticleC 8.7s ease-in-out infinite reverse}

/* Accessibility helper */
#maxess-section-01-groove .mxs01__sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

/* Motion */
@keyframes mxsNayaIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes mxsOrbIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes mxsOrbBreathe{0%,100%{transform:scale(.985)}50%{transform:scale(1)}}
@keyframes mxsSoft{0%,100%{opacity:.68;transform:scale(.985)}50%{opacity:1;transform:scale(1)}}
@keyframes mxsAura{0%,100%{transform:scale(.97);opacity:.72}50%{transform:scale(1.035);opacity:1}}
@keyframes mxsCore{0%,100%{transform:scale(.91);opacity:.78}50%{transform:scale(1);opacity:1}}
@keyframes mxsGlint{0%,100%{transform:scale(.8);opacity:.42}50%{transform:scale(1.35);opacity:.95}}
@keyframes mxsEnergyOne{0%,100%{transform:translateX(-2%) rotate(-17deg) scaleX(.96);opacity:.40}50%{transform:translateX(4%) rotate(-13deg) scaleX(1.02);opacity:.78}}
@keyframes mxsEnergyTwo{0%,100%{transform:translateX(2%) rotate(24deg) scaleX(.98);opacity:.28}50%{transform:translateX(-4%) rotate(29deg) scaleX(1.03);opacity:.64}}
@keyframes mxsEnergyThree{0%,100%{transform:rotate(76deg) scale(.94);opacity:.10}50%{transform:rotate(86deg) scale(1.02);opacity:.26}}
@keyframes mxsOrbitOne{from{transform:rotate(-13deg) scaleY(.92)}to{transform:rotate(347deg) scaleY(.92)}}
@keyframes mxsOrbitTwo{from{transform:rotate(31deg) scaleY(.86)}to{transform:rotate(-329deg) scaleY(.86)}}
@keyframes mxsOrbitThree{from{transform:rotate(72deg) scaleX(.82)}to{transform:rotate(432deg) scaleX(.82)}}
@keyframes mxsBeadPrimary{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes mxsBeadSecondary{from{transform:rotate(178deg)}to{transform:rotate(-182deg)}}
@keyframes mxsParticleA{0%,100%{transform:translate3d(0,0,0);opacity:.22}50%{transform:translate3d(7px,-11px,0);opacity:.86}}
@keyframes mxsParticleB{0%,100%{transform:translate3d(0,0,0);opacity:.18}50%{transform:translate3d(-8px,9px,0);opacity:.72}}
@keyframes mxsParticleC{0%,100%{transform:translate3d(0,0,0);opacity:.25}50%{transform:translate3d(5px,8px,0);opacity:.80}}
@keyframes mxsWave{from{opacity:.35}to{opacity:1}}
@keyframes mxsFloat{0%,100%{transform:translate(-50%,-50%) scale(.97)}50%{transform:translate(-50%,-50%) scale(1.04)}}
@keyframes mxsFloatReverse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* Tablet */
@media (max-width:900px){
  #maxess-section-01-groove .mxs01__scene{padding-left:24px;padding-right:24px}
  #maxess-section-01-groove .mxs01__naya{width:min(660px,calc(100vw - 48px))}
  #maxess-section-01-groove .mxs01__orbital-system{width:min(64vw,500px)}
  #maxess-section-01-groove .mxs01__score-number{font-size:clamp(70px,13vw,118px)}
}

/* Mobile: same hierarchy, no horizontal scroll, Naya becomes a compact chat + CTA. */
@media (max-width:620px){
  #maxess-section-01-groove .mxs01__scene{padding:18px 14px 22px}
  #maxess-section-01-groove .mxs01__header{font-size:8px}
  #maxess-section-01-groove .mxs01__brand{font-size:10px}
  #maxess-section-01-groove .mxs01__brand-mark{width:19px;height:19px}
  #maxess-section-01-groove .mxs01__brand-mark i{inset:5px}
  #maxess-section-01-groove .mxs01__brand-mark i:nth-child(2){inset:2px 5px}
  #maxess-section-01-groove .mxs01__brand-mark i:nth-child(3){inset:5px 2px}
  #maxess-section-01-groove .mxs01__hero{padding-top:8px}
  #maxess-section-01-groove .mxs01__naya{width:min(100%,520px);grid-template-columns:auto minmax(0,1fr);gap:11px;padding:9px;border-radius:18px}
  #maxess-section-01-groove .mxs01__naya-avatar-wrap{width:48px;height:48px;flex-basis:48px}
  #maxess-section-01-groove .mxs01__naya-copy p{font-size:12px}
  #maxess-section-01-groove .mxs01__naya-copy .mxs01__naya-soft{font-size:10px}
  #maxess-section-01-groove .mxs01__listen{grid-column:1/-1;width:100%;min-height:48px}
  #maxess-section-01-groove .mxs01__orbital-system{width:min(92vw,390px);max-width:390px}
  #maxess-section-01-groove .mxs01__score-number{margin-top:13px;font-size:clamp(64px,19vw,92px)}
  #maxess-section-01-groove .mxs01__score-stage{margin-top:16px;min-height:24px;padding:6px 9px;font-size:8px}
  #maxess-section-01-groove .mxs01__score-ring-track{stroke-width:6}
  #maxess-section-01-groove .mxs01__score-ring-value{stroke-width:7}
}
@media (max-width:380px){
  #maxess-section-01-groove .mxs01__scene{padding-left:11px;padding-right:11px}
  #maxess-section-01-groove .mxs01__header-label{display:none}
  #maxess-section-01-groove .mxs01__naya{gap:9px;padding:8px}
  #maxess-section-01-groove .mxs01__naya-avatar-wrap{width:44px;height:44px;flex-basis:44px}
  #maxess-section-01-groove .mxs01__naya-copy p{font-size:11px}
  #maxess-section-01-groove .mxs01__naya-copy .mxs01__naya-soft{font-size:9px}
  #maxess-section-01-groove .mxs01__listen-label{font-size:9px}
  #maxess-section-01-groove .mxs01__orbital-system{width:min(94vw,350px)}
}

/* Reduced motion: the Bead remains visible but static, preserving identity without travel. */
@media (prefers-reduced-motion:reduce){
  #maxess-section-01-groove .mxs01__naya,
  #maxess-section-01-groove .mxs01__orbital-system,
  #maxess-section-01-groove .mxs01__orb-aura,
  #maxess-section-01-groove .mxs01__naya-halo,
  #maxess-section-01-groove .mxs01__score-orb,
  #maxess-section-01-groove .mxs01__energy-band,
  #maxess-section-01-groove .mxs01__energy-core,
  #maxess-section-01-groove .mxs01__core-glint,
  #maxess-section-01-groove .mxs01__orbit,
  #maxess-section-01-groove .mxs01__bead-orbit,
  #maxess-section-01-groove .mxs01__micro-particles i,
  #maxess-section-01-groove .mxs01__listen.is-playing .wave{animation:none!important}
  #maxess-section-01-groove .mxs01__bead-orbit--primary{transform:rotate(0)!important}
  #maxess-section-01-groove .mxs01__bead-orbit--secondary{transform:rotate(178deg)!important}
  #maxess-section-01-groove .mxs01__listen,#maxess-section-01-groove .mxs01__score-ring-value{transition-duration:.01ms}
}
</style>

<script>
(function(){
  'use strict';
  var ROOT_ID='maxess-section-01-groove';
  var root=document.getElementById(ROOT_ID);
  if(!root||root.dataset.initialized==='true')return;
  root.dataset.initialized='true';

  var scoreEl=root.querySelector('[data-score]');
  var stageEl=root.querySelector('[data-stage]');
  var ringEl=root.querySelector('[data-score-ring]');
  var stateEl=root.querySelector('[data-data-state]');
  var announcer=root.querySelector('[data-announcer]');
  var listenButton=root.querySelector('[data-mxs01-listen]');
  var listenState=root.querySelector('#mxs01-listen-state');
  var circumference=2*Math.PI*190;
  if(ringEl){ringEl.style.strokeDasharray=circumference.toFixed(2);ringEl.style.strokeDashoffset=circumference.toFixed(2)}

  function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
  function num(v){var n=Number(v);return Number.isFinite(n)?n:null}
  function result(){
    var r=window.MAXESS_RESULT;
    if(!r||typeof r!=='object')return null;
    var score=num(r.overallScore);
    if(score===null||score<0||score>100)return null;
    return{score:score,band:typeof r.band==='string'?r.band:''};
  }
  function rgb(hex){return{r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)}}
  function hex(r,g,b){function h(v){return Math.round(v).toString(16).padStart(2,'0')}return'#'+h(r)+h(g)+h(b)}
  function mix(a,b,t){var x=rgb(a),y=rgb(b),p=clamp(t,0,1);return hex(x.r+(y.r-x.r)*p,x.g+(y.g-x.g)*p,x.b+(y.b-x.b)*p)}
  function color(score){
    var stops=[
      [0,'#FF3B5C'],[20,'#C52B5B'],[50,'#FF8A35'],[60,'#FF9D3D'],
      [75,'#FFD84A'],[84,'#39DF91'],[89,'#4C9DFF'],[94,'#8B3DFF'],[100,'#C58CFF']
    ];
    for(var i=0;i<stops.length-1;i++){var a=stops[i],b=stops[i+1];if(score<=b[0])return mix(a[1],b[1],(score-a[0])/(b[0]-a[0]))}
    return stops[stops.length-1][1];
  }
  function stage(score){if(score<=20)return'SUPPORTING';if(score<=50)return'FOUNDATION';if(score<=75)return'DEVELOPING';if(score<=90)return'ADVANCING';return'MASTERING'}
  function applyTheme(score){
    var c=color(score),r=rgb(c);
    root.style.setProperty('--mxs-accent',c);
    root.style.setProperty('--mxs-accent-soft',mix(c,'#FFFFFF',.45));
    root.style.setProperty('--mxs-accent-rgb',r.r+', '+r.g+', '+r.b);
    root.style.setProperty('--mxs-energy',(0.34+score/100*.66).toFixed(3));
  }
  function safe(){
    root.dataset.ready='false';
    scoreEl.textContent='—';
    stageEl.textContent='RESULT PENDING';
    stateEl.textContent='Your verified result will appear here.';
    root.style.setProperty('--mxs-accent','#8B3DFF');
    root.style.setProperty('--mxs-accent-soft','#C58CFF');
    root.style.setProperty('--mxs-accent-rgb','139, 61, 255');
    root.style.setProperty('--mxs-energy','.45');
    if(ringEl)ringEl.style.strokeDashoffset=circumference.toFixed(2);
  }
  function render(r){
    var s=r.score,b=stage(s),reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    applyTheme(s);root.dataset.ready='true';stageEl.textContent=(r.band||b).toUpperCase();stateEl.textContent='';
    var start=reduced?s:0,duration=reduced?1:1050,started=performance.now();
    function frame(now){
      var p=clamp((now-started)/duration,0,1),e=1-Math.pow(1-p,3),v=start+(s-start)*e;
      scoreEl.textContent=String(Math.round(v));
      if(ringEl)ringEl.style.strokeDashoffset=String(circumference*(1-v/100));
      if(p<1)window.requestAnimationFrame(frame);else{scoreEl.textContent=String(Math.round(s));if(ringEl)ringEl.style.strokeDashoffset=String(circumference*(1-s/100));if(announcer)announcer.textContent='Your MAXESS AI Score is '+Math.round(s)+', '+b+'.'}
    }
    window.requestAnimationFrame(frame);
  }
  function refresh(){var r=result();if(r)render(r);else safe()}
  function listen(){
    var playing=listenButton.classList.toggle('is-playing');
    listenState.textContent=playing?'Naya listening state active.':'Naya listening state paused.';
    root.dispatchEvent(new CustomEvent('maxess:naya-listen',{bubbles:true,detail:{playing:playing,result:result()}}));
    if(typeof window.NAYA_AUDIO_TOGGLE==='function'){try{window.NAYA_AUDIO_TOGGLE(playing,result())}catch(e){}}
  }
  listenButton.addEventListener('click',listen);
  refresh();

  /* Bounded integration watcher: MAXESS_RESULT may be injected after Groove mounts the module. */
  var attempts=0,max=80;
  var watcher=window.setInterval(function(){
    attempts++;
    if(result()){refresh();window.clearInterval(watcher);return}
    if(attempts>=max)window.clearInterval(watcher);
  },250);
})();
</script>
