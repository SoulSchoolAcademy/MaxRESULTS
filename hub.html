<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naya Power Player — 18 Powercasts</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    body { background: #010103; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 100px; }
    header { background: #06080e; border-bottom: 2px solid rgba(168,85,247,0.4); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; }
    .brand img { width: 36px; height: 36px; border-radius: 10px; border: 1px solid #fff; object-fit: contain; background: #000; }
    .main { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .hero { background: radial-gradient(circle at 50% 0%, #181c2e 0%, #040508 94%); border: 2px solid #a855f7; border-radius: 28px; padding: 32px; text-align: center; margin-bottom: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
    .hero-art-wrap { width: 280px; aspect-ratio: 1/1; margin: 0 auto 20px auto; border-radius: 20px; overflow: hidden; border: 2px solid #fff; background: #000; display: flex; align-items: center; justify-content: center; }
    .hero-art { width: 100%; height: 100%; object-fit: cover; }
    .hero-num { font-size: 0.85rem; font-weight: 900; letter-spacing: 0.25em; color: #10b981; text-transform: uppercase; margin-bottom: 6px; }
    .hero-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 16px; }
    audio { width: 100%; max-width: 480px; outline: none; border-radius: 12px; margin-top: 10px; }
    
    /* Updated thumbnail grid: clean 1:1 aspect ratio cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
    .card { background: #0a0d18; border: 1.5px solid rgba(168,85,247,0.4); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: all 0.3s ease; }
    .card:hover { transform: translateY(-4px); border-color: #10b981; box-shadow: 0 10px 30px rgba(16,185,129,0.3); }
    .card-thumb-wrap { width: 100%; aspect-ratio: 1/1; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.4); margin-bottom: 14px; background: #000; }
    .card-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-num { font-size: 0.75rem; font-weight: 900; letter-spacing: 0.2em; color: #10b981; text-transform: uppercase; margin-bottom: 4px; }
    .card-title { font-size: 0.9rem; font-weight: 800; text-align: center; margin-bottom: 14px; height: 2.6em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .play-btn { width: 100%; padding: 10px; background: rgba(168,85,247,0.2); border: 1px solid #a855f7; border-radius: 12px; color: #fff; font-weight: 800; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; }
    .card:hover .play-btn { background: #10b981; border-color: #fff; }
  </style>
</head>
<body>
  <header>
    <div class="brand" onclick="window.location.href='/'">
      <img src="/icon-192.png" alt="Logo">
      <span>Naya Power Player</span>
    </div>
    <div id="userBadge" style="background: rgba(16,185,129,0.15); border: 1px solid #10b981; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 0.85rem;">Pioneer</div>
  </header>
  <div class="main">
    <div class="hero">
      <div class="hero-art-wrap">
        <img id="mainArt" src="https://lh3.googleusercontent.com/d/1Pz7KjdlZ77FzlZn50zXe8Ces0vyv9eQk" class="hero-art" alt="Art">
      </div>
      <div class="hero-num" id="mainNum">POWERCAST 01</div>
      <h2 class="hero-title" id="mainTitle">WHAT IS NAYA POWER</h2>
      <audio id="audioPlayer" controls crossorigin="anonymous"></audio>
    </div>
    <div class="grid" id="gridContainer"></div>
  </div>
  <script>
    const eps = [
      { num: '01', title: 'WHAT IS NAYA POWER', imgId: '1Pz7KjdlZ77FzlZn50zXe8Ces0vyv9eQk', audioId: '1ci3rTF-Y2F3dDbGBtlpITOeQptAEK-1b' },
      { num: '02', title: 'Meet Your Compounding Superbrain', imgId: '1Hc45liGxcRCsIy-tLcMDj38_Z8CI4pAv', audioId: '1sYepm2HxZjdxYubkQwLDcPJlzuB6_7B1' },
      { num: '03', title: 'End AI Amnesia', imgId: '1SbJsHEpXhTtcaQv-nRZ27qiCYOH8G_Xm', audioId: '1dqTfoI61U0P0i0nd2v8cr2H63mSzOZqv' },
      { num: '04', title: 'Why Isn’t Your AI a 10', imgId: '1emgJJPTRni09qaxFNC00gnbiaHC4dzl3', audioId: '1MmnBaTXg3X81eOpvTGKT1x1CV2VzNzgL' },
      { num: '05', title: 'Drive Your AI Like a Ferrari', imgId: '1IzvsA-i3XcFZ9BLA_zgrwIqZBKNg4X5-', audioId: '1X76D-WxgIdl_Q4tvYertHpIA_Q4DN9Lq' },
      { num: '06', title: 'Turn AI Into Your Personal Sparring Partner', imgId: '1LC-arUBYNOuITFeWxMjWAUdpWa7Oj4d9', audioId: '1JiLUxXJJ48QMVXjA0dSjyyfzaiLoacQE' },
      { num: '07', title: 'Build Your Lifelong Intelligence Partner', imgId: '1X_LZrqyL_ZLR4hwlF8MVLxRiGQjUwwpw', audioId: '1oHiMHwsynsNylLBlVuhgyr7OAJ8_5uaC' },
      { num: '08', title: 'The AI Operational Partner', imgId: '1D7kYTPILBYKJO8ofk7kSk6hxExXM1bqk', audioId: '1UkM5y1IssKiFqe1rt80_bpghu_6-ORUo' },
      { num: '09', title: 'The Naya Power Superbrain', imgId: '1N_I2yuPDVJQFssR0ZsXUW8ha7tiDlX_o', audioId: '1jpJxMcSZjmj0reNBO5dhsqymI-XM1y8o' },
      { num: '10', title: 'Why Working Software Isn’t Enough', imgId: '1e9owTbaRl1n41MSj0sIMwzGXBYmflpvH', audioId: '1VJv7jwnadovPRIZrq97HQ_mc0SZvbuef' },
      { num: '11', title: 'Four Top AIs Grade Naya Power', imgId: '1tNT79ciuRx9eI0f1gcml-VAKLENcOzSW', audioId: '14-eciSBEGm_gh2QnIiw6s2AEx9wcmbQm' },
      { num: '12', title: 'A Letter From the Founder Ending AI Amnesia', imgId: '10xegmbg3-I0gaGLjhA5qRgSGmDnkww0z', audioId: '1urQtXPpKkxpBWht8nhC-5Cdk6p6uSS9X' },
      { num: '13', title: 'The Human–AI Intelligence Opera', imgId: '1uCsGhEoTYT8yRiETe34CWnSbQZKyDlT9', audioId: '19GaJdJapn1uBrHlHvpDGPg-oFmHcBAUE' },
      { num: '14', title: 'The Naya Power Operating Model', imgId: '1fi8fl6qCLFepLpqkWEcvcmcntNv-sIKx', audioId: '18l1gLA17Woei8Sd_zfROfXIBLjOpUgeq' },
      { num: '15', title: 'The NayaNET Blueprint for Collective Wisdom', imgId: '1UgE70Zk_AaNWo-A0QL1b9R4aX1RZ3VPS', audioId: '1JjL0tcNV46mYpSy6_1x7uA4tuQPaUsdh' },
      { num: '16', title: 'Welcome to NayaNET Escape AI Exhaustion', imgId: '1-j2WNutfdrGOJ3Zg2tiTtw0SZduu2iLw', audioId: '1_0mDwQ6cxd6f9L4FMt3WEJQ852qk75QM' },
      { num: '17', title: 'Curing human forgetfulness with Naya AI', imgId: '1Z9C7FZgljcNu0Y3bKPpFi7x_011P1z7i', audioId: '1sd5hXsq0Kq_QS2g4cyNOvSn5Yng5InAz' },
      { num: '18', title: 'What is a compounding superbrain', imgId: '1XapCD8t5ZS439GFEr4hL7nv7AAx8d-kr', audioId: '1N6YLq3gR_n5YRSH2lhrTh1CDDfq1Injd' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('nayanet_user_name');
      if (name) document.getElementById('userBadge').textContent = name;
      loadEp(0, false);
      
      const grid = document.getElementById('gridContainer');
      grid.innerHTML = eps.map((ep, i) => `
        <div class="card" onclick="loadEp(${i}, true)">
          <div class="card-thumb-wrap">
            <img src="https://lh3.googleusercontent.com/d/${ep.imgId}" class="card-thumb" alt="${ep.title}">
          </div>
          <div class="card-num">POWERCAST ${ep.num}</div>
          <div class="card-title">${ep.title}</div>
          <button class="play-btn">▶ Play Episode</button>
        </div>
      `).join('');
    });

    const player = document.getElementById('audioPlayer');
    const art = document.getElementById('mainArt');
    const num = document.getElementById('mainNum');
    const title = document.getElementById('mainTitle');

    function loadEp(idx, autoPlay) {
      const ep = eps[idx];
      art.src = `https://lh3.googleusercontent.com/d/${ep.imgId}`;
      num.textContent = `POWERCAST ${ep.num}`;
      title.textContent = ep.title;
      player.src = `https://docs.google.com/uc?export=download&id=${ep.audioId}`;
      player.load();
      if (autoPlay) {
        player.play().catch(e => console.log(e));
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }
  </script>
</body>
</html>
