<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12082b">
<title>MAXESS — AI Mastery Assessment</title>
<style>
:root{--bg:#05030a;--deep:#16082f;--purple:#5b25a8;--purple2:#7d3fc4;--violet:#a77cff;--white:#fff;--soft:#e9e2f5;--muted:#b9afc8;--line:rgba(255,255,255,.14);--shadow:0 35px 100px rgba(0,0,0,.55);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}button{font:inherit}button:focus-visible{outline:2px solid #fff;outline-offset:4px}
.app{min-height:100svh;min-height:100dvh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 15%,rgba(111,48,194,.28),transparent 38%),radial-gradient(circle at 15% 85%,rgba(72,26,137,.18),transparent 34%),linear-gradient(145deg,#05030a,#100620 52%,#05030a)}.app:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 0,rgba(0,0,0,.18) 70%,rgba(0,0,0,.48) 100%)}
.shell{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;padding:18px clamp(14px,3vw,36px) 22px}.top{width:min(1180px,100%);margin:0 auto 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px}.brand{font-size:clamp(19px,2vw,25px);font-weight:950;letter-spacing:.16em}.brand span{color:#b997ff}.progress{justify-self:center;width:min(440px,100%);display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.045);backdrop-filter:blur(16px)}.progress-label{white-space:nowrap;font-size:9px;font-weight:900;letter-spacing:.12em}.progress-track{height:5px;flex:1;min-width:70px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.progress-fill{display:block;width:0;height:100%;background:linear-gradient(90deg,#54208e,#a77cff);border-radius:99px;transition:width .45s var(--ease)}.progress-percent{min-width:32px;text-align:right;color:var(--muted);font-size:9px;font-weight:900}
.board{width:min(1180px,100%);margin:auto;flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(167,124,255,.35);border-radius:34px;background:radial-gradient(circle at 50% 0,rgba(128,63,211,.13),transparent 44%),linear-gradient(180deg,rgba(22,10,43,.72),rgba(5,3,10,.94));box-shadow:var(--shadow),0 0 90px rgba(84,31,157,.14),inset 0 1px 0 rgba(255,255,255,.08)}.content{position:relative;z-index:1;width:100%;padding:clamp(22px,4vw,44px);display:flex;flex:1;flex-direction:column}.command{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.naya-btn,.continue,.dialog-btn{min-height:54px;border-radius:17px;border:1px solid rgba(190,157,255,.68);color:#fff;cursor:pointer;background:linear-gradient(180deg,rgba(46,22,76,.96),rgba(14,7,25,.96));box-shadow:0 12px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .22s var(--ease),box-shadow .22s ease,border-color .22s ease}.naya-btn{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 8px}.naya-btn:hover,.continue:hover:not(:disabled),.dialog-btn:hover{transform:translateY(-2px);border-color:#e1d4ff;box-shadow:0 16px 36px rgba(0,0,0,.45),0 0 34px rgba(151,101,255,.2)}.naya-mini{width:40px;height:40px;object-fit:cover;object-position:center top;border-radius:50%;border:1px solid rgba(255,255,255,.8)}.naya-copy{display:flex;flex-direction:column;text-align:left;line-height:1.05}.naya-copy strong{font-size:14px;font-weight:950}.naya-copy span{margin-top:5px;color:#c9c0d7;font-size:10px;font-weight:700}.continue{min-width:190px;padding:0 22px;font-size:14px;font-weight:950}.continue:disabled{opacity:.5;cursor:not-allowed}.arrow{margin-left:8px}
.question{width:min(960px,100%);margin:0 auto;text-align:center}.eyebrow{display:inline-block;margin-bottom:12px;color:#cbb7f5;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.question h1{margin:0;font-size:clamp(28px,4vw,50px);line-height:1.08;letter-spacing:-.035em;font-weight:900}.rule{width:180px;max-width:35%;height:1px;margin:18px auto;background:linear-gradient(90deg,transparent,#9f6eea,transparent)}.answers{width:min(880px,100%);margin:24px auto 0;display:grid;gap:10px}.answer{width:100%;min-height:68px;display:grid;grid-template-columns:54px minmax(0,1fr) 32px;align-items:center;gap:13px;padding:7px;border:1px solid rgba(255,255,255,.1);border-radius:20px;color:#fff;text-align:left;cursor:pointer;background:linear-gradient(180deg,#171021,#0b0612);box-shadow:0 9px 22px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .2s var(--ease),border-color .2s ease,box-shadow .2s ease}.answer:hover,.answer.selected{transform:translateY(-2px);border-color:#b48dff;box-shadow:0 15px 32px rgba(0,0,0,.45),0 0 28px rgba(141,82,222,.16)}.jewel{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:radial-gradient(circle at 28% 20%,#fff,#d8c5ff 13%,#8b52d2 44%,#160a2a 100%);border:1px solid rgba(255,255,255,.65);font-weight:950}.answer-title{display:block;font-size:clamp(14px,1.55vw,17px);font-weight:900}.answer-sub{display:block;margin-top:6px;color:#d7d0e1;font-size:clamp(12px,1.4vw,15px);line-height:1.3}.chevron{width:30px;height:30px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:50%;color:#9990a6}.answer.selected .chevron{color:#fff;border-color:#b48dff}.footer{margin-top:12px;text-align:center;color:#6c6475;font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.hidden{display:none!important}.dialog{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;background:rgba(4,1,9,.66);backdrop-filter:blur(18px)}.dialog.open{display:grid;animation:fade .28s ease both}.dialog-card{position:relative;width:min(720px,calc(100vw - 28px));min-height:430px;padding:42px clamp(28px,5vw,54px) 34px;text-align:left;overflow:hidden;border:1px solid rgba(202,172,255,.36);border-radius:44px;background:radial-gradient(circle at 78% 18%,rgba(184,137,255,.25),transparent 30%),radial-gradient(circle at 25% 100%,rgba(83,26,143,.32),transparent 42%),linear-gradient(145deg,#2a1251,#16082f 58%,#0d051d);box-shadow:0 45px 120px rgba(0,0,0,.72),0 0 90px rgba(100,38,181,.28),inset 0 1px 0 rgba(255,255,255,.1)}.dialog-card:before{content:"";position:absolute;width:330px;height:330px;right:-100px;top:-105px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 70px rgba(183,132,255,.12),inset 0 0 70px rgba(255,255,255,.03)}.naya-photo{position:absolute;z-index:2;right:34px;top:28px;width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid rgba(255,255,255,.92);box-shadow:0 14px 35px rgba(0,0,0,.4),0 0 45px rgba(190,145,255,.24)}.dialog-copy{position:relative;z-index:3;max-width:520px;padding-top:96px}.dialog-title{margin:0;color:#fff;font-size:clamp(36px,6vw,58px);line-height:.98;letter-spacing:-.05em;font-weight:900}.dialog-body{margin:20px 0 0;color:#f1ebf8;font-size:clamp(16px,2vw,19px);line-height:1.62;font-weight:520}.dialog-body p{margin:0 0 10px}.dialog-body p:last-child{margin-bottom:0}.dialog-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}.dialog-btn{padding:0 27px;font-size:14px;font-weight:950}.dialog-btn.secondary{border-color:rgba(255,255,255,.2);color:#d7cfe1;background:rgba(255,255,255,.04)}.dialog-btn.is-speaking{border-color:#e5d6ff;box-shadow:0 0 35px rgba(181,133,255,.3)}
.interest-stage{max-width:1000px;margin:auto;text-align:center}.interest-stage h2{margin:0;font-size:clamp(31px,5vw,50px);letter-spacing:-.045em;line-height:1.03}.interest-stage p{max-width:650px;margin:14px auto 0;color:var(--muted);font-size:16px;line-height:1.55}.interest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}.interest-card{min-height:82px;padding:16px;text-align:left;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:linear-gradient(145deg,#171022,#09050f);color:#fff;cursor:pointer}.interest-card.selected{border-color:#a77cff;box-shadow:0 0 25px rgba(145,82,219,.15)}.interest-card strong{display:block;font-size:14px}.interest-card span{display:block;margin-top:6px;color:#aaa1b7;font-size:11px}@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}@media(max-width:700px){.top{grid-template-columns:1fr auto;gap:10px}.progress{grid-column:1/-1;grid-row:2;width:100%}.command{margin-bottom:16px}.continue{min-width:150px}.naya-copy span{display:none}.dialog-card{min-height:470px;padding:28px 22px 24px;border-radius:34px}.naya-photo{width:112px;height:112px;right:22px;top:22px}.dialog-copy{padding-top:86px}.dialog-title{font-size:clamp(34px,11vw,50px)}.dialog-body{font-size:16px}.dialog-actions{margin-top:22px}.dialog-btn{flex:1;min-width:150px}.interest-grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.shell{padding:10px 10px 16px}.board{border-radius:25px}.content{padding:18px 13px 20px}.command{align-items:stretch}.naya-btn{min-height:50px}.continue{min-width:0;padding:0 15px}.answer{grid-template-columns:45px minmax(0,1fr) 28px;gap:9px;min-height:64px}.jewel{width:43px;height:43px;border-radius:14px}.answer-sub{font-size:12px}.dialog{padding:10px}.dialog-card{width:100%;min-height:470px;padding:24px 18px 20px}.naya-photo{width:96px;height:96px;right:18px;top:18px}.dialog-copy{padding-top:76px}.dialog-title{font-size:39px}.dialog-body{font-size:15px;line-height:1.55}.dialog-btn{min-height:50px;padding:0 16px}.interest-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head>
<body><main class="app" id="app"><div class="shell"><header class="top"><div class="brand">MAX<span>ESS</span></div><div class="progress" aria-label="Assessment progress"><span class="progress-label" id="progressLabel">QUESTION 1 OF 15</span><span class="progress-track"><span class="progress-fill" id="progressFill"></span></span><span class="progress-percent" id="progressPercent">0%</span></div><div></div></header><section class="board"><div class="content"><div class="command"><button class="naya-btn" id="nayaButton" type="button"><img class="naya-mini" src="https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg" alt="Naya"><span class="naya-copy"><strong id="nayaButtonLabel">PLAY NAYA</strong><span>Listen to her guidance</span></span></button><button class="continue" id="continueButton" type="button" disabled>CONTINUE <span class="arrow">→</span></button></div><div id="questionStage"></div><div class="footer">MAXESS · AI MASTERY ASSESSMENT</div></div></section></div></main>
<div class="dialog" id="welcomeDialog" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle"><section class="dialog-card"><img class="naya-photo" src="https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg" alt="Naya"><div class="dialog-copy"><h1 class="dialog-title" id="welcomeTitle">I'm here.</h1><div class="dialog-body"><p>Let's look at this together.</p><p>It'll only take a few minutes. I'll help you understand what each question is really asking, so you can answer based on what you actually do today.</p></div><div class="dialog-actions"><button class="dialog-btn" id="startButton" type="button">LET'S GO →</button><button class="dialog-btn secondary" id="welcomePlayButton" type="button">▶ PLAY NAYA</button></div></div></section></div>
<script>(function(){'use strict';const RESULT_KEY='MAXESS_RESULT_V1';const questions=[{id:'q01',dimensionId:'craftsmanship',question:'When you ask AI to help you with something important, how much context do you usually give it?',answers:[['A','I usually give it a short request and see what happens.',0],['B','I give it some context when I remember it.',25],['C','I explain the goal and the important background.',50],['D','I give it the situation, goal, constraints and desired outcome.',75],['E','I deliberately build a complete working context so AI can reason with me.',100]]},{id:'q02',dimensionId:'direction',question:'How clearly do you usually know what you want AI to produce?',answers:[['A','I mostly figure it out as I go.',0],['B','I have a rough idea.',25],['C','I can usually describe the outcome I want.',50],['D','I define the outcome, audience and standards first.',75],['E','I design the desired result and success criteria before I begin.',100]]},{id:'q03',dimensionId:'context',question:'When AI gives you an answer that misses the mark, what do you normally do?',answers:[['A','I accept it or start over.',0],['B','I tell it that something is wrong.',25],['C','I add more information and try again.',50],['D','I diagnose what was missing and improve the context.',75],['E','I use the failure to improve the system and my future prompts.',100]]},{id:'q04',dimensionId:'evaluation',question:'How do you decide whether an AI answer is actually good?',answers:[['A','If it sounds good, I usually trust it.',0],['B','I skim it and use my judgment.',25],['C','I check important facts and obvious problems.',50],['D','I evaluate it against clear requirements.',75],['E','I systematically test quality, accuracy, usefulness and fit.',100]]},{id:'q05',dimensionId:'iteration',question:'How often do you improve your prompts or workflows after learning what works?',answers:[['A','Rarely.',0],['B','Sometimes, when something goes badly.',25],['C','I improve things when I notice a pattern.',50],['D','I deliberately refine successful workflows.',75],['E','I continuously turn lessons into reusable systems and standards.',100]]},{id:'q06',dimensionId:'craftsmanship',question:'How intentionally do you structure complex work with AI?',answers:[['A','I mostly use one prompt at a time.',0],['B','I break things up when they get difficult.',25],['C','I usually separate major steps.',50],['D','I design a sequence of specialized steps.',75],['E','I architect repeatable AI workflows with clear inputs, outputs and checks.',100]]},{id:'q07',dimensionId:'direction',question:'When collaborating with AI, how clearly do you communicate standards?',answers:[['A','I assume it will understand what good looks like.',0],['B','I correct it after it responds.',25],['C','I explain what I like and dislike.',50],['D','I define quality criteria and examples.',75],['E','I establish explicit standards, constraints and review criteria.',100]]},{id:'q08',dimensionId:'context',question:'How well do you preserve useful context across a longer AI project?',answers:[['A','I mostly start fresh each time.',0],['B','I copy important pieces when I remember.',25],['C','I keep the main information nearby.',50],['D','I maintain organized project context.',75],['E','I deliberately build durable project memory and source-of-truth systems.',100]]},{id:'q09',dimensionId:'evaluation',question:'How comfortable are you challenging an AI answer instead of accepting it?',answers:[['A','I usually assume the AI knows better.',0],['B','I question it when something feels off.',25],['C','I verify important claims.',50],['D','I actively look for weaknesses and contradictions.',75],['E','I treat AI as something to test, critique and improve.',100]]},{id:'q10',dimensionId:'iteration',question:'When a project fails, what happens next?',answers:[['A','I move on.',0],['B','I fix the immediate problem.',25],['C','I figure out what went wrong.',50],['D','I document the lesson and improve the workflow.',75],['E','I turn the root cause into a permanent guardrail so the failure becomes intelligence.',100]]},{id:'q11',dimensionId:'craftsmanship',question:'How deliberately do you choose the right AI role or tool for a task?',answers:[['A','I use whatever is open.',0],['B','I have a few favorites.',25],['C','I choose based on the task.',50],['D','I deliberately assign roles and tools.',75],['E','I orchestrate specialized capabilities as part of a larger system.',100]]},{id:'q12',dimensionId:'direction',question:'How often do you ask AI to critique or improve its own work?',answers:[['A','Almost never.',0],['B','Sometimes.',25],['C','For important work.',50],['D','As a normal part of my workflow.',75],['E','I build explicit critique and revision loops into the system.',100]]},{id:'q13',dimensionId:'context',question:'How well do you distinguish what AI should know from what it should not assume?',answers:[['A','I rarely think about that.',0],['B','I correct assumptions when they appear.',25],['C','I provide key boundaries.',50],['D','I explicitly define assumptions and unknowns.',75],['E','I make uncertainty, provenance and boundaries part of the workflow.',100]]},{id:'q14',dimensionId:'evaluation',question:'How do you know when an AI-generated result is ready to ship?',answers:[['A','When it looks finished.',0],['B','When I am reasonably happy with it.',25],['C','When I have reviewed it.',50],['D','When it passes defined quality checks.',75],['E','When it survives rigorous functional, human and quality review.',100]]},{id:'q15',dimensionId:'iteration',question:'How much of your AI learning becomes a reusable method?',answers:[['A','Very little.',0],['B','I remember useful tricks.',25],['C','I save things that work.',50],['D','I turn successful patterns into repeatable processes.',75],['E','I systematically convert experience into operating laws and better future behavior.',100]]}];const dims=[{id:'craftsmanship',name:'AI Craftsmanship'},{id:'direction',name:'Direction'},{id:'context',name:'Context'},{id:'evaluation',name:'Evaluation'},{id:'iteration',name:'Iteration'}];const state={index:0,responses:{},interests:[],audio:null};const stage=document.getElementById('questionStage'),cont=document.getElementById('continueButton'),nayaBtn=document.getElementById('nayaButton'),nayaLabel=document.getElementById('nayaButtonLabel'),dialog=document.getElementById('welcomeDialog');function band(s){return s<40?'Emerging':s<60?'Developing':s<80?'Advancing':'Mastering'}function renderQuestion(){const q=questions[state.index];document.getElementById('progressLabel').textContent='QUESTION '+(state.index+1)+' OF '+questions.length;document.getElementById('progressFill').style.width=(state.index/questions.length*100)+'%';document.getElementById('progressPercent').textContent=Math.round(state.index/questions.length*100)+'%';stage.innerHTML='<div class="question"><div class="eyebrow">'+q.dimensionId.toUpperCase()+'</div><h1>'+q.question+'</h1><div class="rule"></div><div class="answers">'+q.answers.map(a=>'<button class="answer" type="button" data-answer="'+a[0]+'"><span class="jewel">'+a[0]+'</span><span><span class="answer-title">'+({A:'Just getting started',B:'Building the habit',C:'Working intentionally',D:'Working strategically',E:'Operating at mastery'}[a[0]])+'</span><span class="answer-sub">'+a[1]+'</span></span><span class="chevron">›</span></button>').join('')+'</div></div>';document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{document.querySelectorAll('.answer').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.responses[q.id]=q.answers.find(a=>a[0]===b.dataset.answer);cont.disabled=false});cont.disabled=!state.responses[q.id]}function calc(){const ds=dims.map(d=>{const qs=questions.filter(q=>q.dimensionId===d.id),v=Math.round(qs.reduce((s,q)=>s+(state.responses[q.id]?.[2]||0),0)/qs.length);return{id:d.id,name:d.name,score:v,level:band(v)}}),overall=Math.round(ds.reduce((s,d)=>s+d.score,0)/ds.length),strongest=[...ds].sort((a,b)=>b.score-a.score)[0],opportunity=[...ds].sort((a,b)=>a.score-b.score)[0];return{overallScore:overall,masteryBand:band(overall),dimensions:ds,strongestDimension:strongest,opportunityDimension:opportunity}}function buildResult(){const s=calc(),r={contractVersion:RESULT_KEY,assessmentId:'ai-mastery',assessmentVersion:'1.0',sessionId:'maxess-'+Date.now(),completedAt:new Date().toISOString(),overallScore:s.overallScore,masteryBand:s.masteryBand,dimensions:s.dimensions,strongestDimension:s.strongestDimension,opportunityDimension:s.opportunityDimension,responses:state.responses,selectedInterests:state.interests,naya:{name:'Naya',asset:'Naya Profile 6.jpg'}};localStorage.setItem(RESULT_KEY,JSON.stringify(r));return r}function showInterests(){document.getElementById('progressLabel').textContent='FINAL STEP';document.getElementById('progressFill').style.width='100%';document.getElementById('progressPercent').textContent='100%';stage.innerHTML='<div class="interest-stage"><h2>One more thing.</h2><p>What would you most like to get better at with AI?</p><div class="interest-grid">'+['Work & Productivity','Creative Work','Business & Growth','Learning','Building Systems','Personal Goals'].map(x=>'<button class="interest-card" type="button" data-interest="'+x+'"><strong>'+x+'</strong><span>Choose what matters to you.</span></button>').join('')+'</div></div>';document.querySelectorAll('.interest-card').forEach(b=>b.onclick=()=>{b.classList.toggle('selected');state.interests=b.classList.contains('selected')?[...state.interests,b.dataset.interest]:state.interests.filter(x=>x!==b.dataset.interest)});cont.disabled=false;cont.textContent='SEE MY RESULTS →'}function finish(){const r=buildResult(),encoded=btoa(unescape(encodeURIComponent(JSON.stringify(r))));window.location.href='https://results.nayanet.app/?result='+encodeURIComponent(encoded)}cont.onclick=()=>{if(state.index<questions.length-1){state.index++;renderQuestion()}else if(stage.querySelector('.interest-stage'))finish();else showInterests()};document.getElementById('startButton').onclick=()=>{dialog.classList.remove('open');renderQuestion()};function play(){if(state.audio){state.audio.pause();state.audio=null;nayaLabel.textContent='PLAY NAYA'}else{nayaLabel.textContent='NAYA AUDIO'}}nayaBtn.onclick=play;document.getElementById('welcomePlayButton').onclick=play;renderQuestion();dialog.classList.add('open')})();</script>
</body></html>
