<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050509"><title>NayaNET — Living Intelligence</title><style>:root{--bg:#050509;--w:#f8f7ff;--d:#aaa4b2;--g:#7dffb2;--p:#ff35bb;--r:#ff315b;--v:#9c5cff;--gold:#ffd86e;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--w);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;color:inherit}.app{height:100dvh;position:relative;background:radial-gradient(circle at 50% 45%,rgba(123,55,184,.16),transparent 30%),radial-gradient(circle at 20% 20%,rgba(255,49,91,.08),transparent 25%),radial-gradient(circle at 80% 75%,rgba(0,255,194,.07),transparent 28%),#050509}.app:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(circle at center,#000,transparent 78%)}.top{position:absolute;left:0;right:0;top:0;height:74px;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;z-index:10}.logo{display:flex;gap:10px;align-items:center;font-weight:900}.logo i{font-style:normal;font-size:22px;filter:drop-shadow(0 0 12px var(--gold))}.status{display:flex;align-items:center;gap:8px;color:#c8c3cf;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.status b{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 14px var(--g)}.stage{height:100%;display:grid;place-items:center;padding:70px 20px 30px}.core{width:min(1120px,100%);height:min(700px,calc(100dvh - 105px));position:relative;display:grid;place-items:center}.tag{position:absolute;top:6%;left:50%;transform:translateX(-50%);text-align:center;z-index:4;pointer-events:none;width:90%}.tag h1{margin:0;font-size:clamp(17px,2.3vw,29px);letter-spacing:.16em;text-transform:uppercase}.tag p{margin:7px 0 0;color:#918b98;font-size:11px}.halo{position:absolute;width:min(650px,72vw);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.07);box-shadow:0 0 100px rgba(164,84,255,.11),inset 0 0 80px rgba(164,84,255,.05)}.halo:before,.halo:after{content:"";position:absolute;border-radius:50%;inset:9%;border:1px solid rgba(125,255,178,.08)}.halo:after{inset:20%;border-color:rgba(255,53,187,.11)}.naya{position:relative;width:250px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;cursor:pointer;z-index:5;background:radial-gradient(circle at 38% 32%,#fff 0 2%,#efd9ff 8%,#b66cff 24%,#6e27c8 48%,#160b27 69%,#08050d 72%);box-shadow:0 0 45px rgba(181,96,255,.5),0 0 120px rgba(255,53,187,.14),inset 0 0 35px rgba(255,255,255,.35);transition:.3s}.naya:hover{transform:scale(1.035);box-shadow:0 0 65px rgba(181,96,255,.7),0 0 150px rgba(255,53,187,.22)}.inner{width:190px;height:190px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.08)}.inner strong{display:block;font-size:35px;letter-spacing:-.04em}.inner span{display:block;margin-top:4px;color:#e6dcef;font-size:10px;letter-spacing:.18em;text-transform:uppercase}.orbit{position:absolute;inset:0;animation:orbit 30s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}.node{position:absolute;width:150px;height:94px;transform:translate(-50%,-50%);animation:counter 30s linear infinite}.node:nth-child(1){left:50%;top:5%}.node:nth-child(2){left:91%;top:28%}.node:nth-child(3){left:82%;top:78%}.node:nth-child(4){left:18%;top:78%}.node:nth-child(5){left:9%;top:28%}@keyframes counter{to{transform:translate(-50%,-50%) rotate(-360deg)}}.board{width:100%;height:100%;border:1px solid rgba(125,255,178,.52);border-radius:18px;background:linear-gradient(145deg,rgba(20,28,25,.95),rgba(10,10,14,.9));box-shadow:0 0 18px rgba(125,255,178,.15),inset 0 0 20px rgba(125,255,178,.04);position:relative;overflow:hidden;cursor:pointer;transition:.25s}.board:before{content:"";position:absolute;inset:-80%;background:conic-gradient(from 180deg,transparent 0 28%,var(--p) 34%,var(--r) 43%,var(--g) 53%,transparent 63%);animation:spin 5s linear infinite;opacity:.28}.board:after{content:"";position:absolute;inset:1px;border-radius:17px;background:linear-gradient(145deg,rgba(9,14,12,.98),rgba(9,8,13,.94));z-index:0}@keyframes spin{to{transform:rotate(360deg)}}.board:hover,.board.active{transform:translateY(-3px);border-color:#fff;box-shadow:0 0 28px rgba(125,255,178,.4),0 0 58px rgba(255,53,187,.14),inset 0 0 26px rgba(125,255,178,.08)}.board.active:before{opacity:.85}.board>*{position:relative;z-index:1;display:block}.node-icon{font-size:21px;margin:10px 0 2px 12px}.node-title{font-size:13px;font-weight:900;margin-left:12px}.node-sub{color:#9b959f;font-size:9px;margin:1px 12px}.enter{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);z-index:7}.enter button{min-width:240px;padding:15px 24px;border-radius:16px;border:1px solid rgba(125,255,178,.8);background:linear-gradient(100deg,rgba(125,255,178,.14),rgba(255,53,187,.19),rgba(255,49,91,.17));box-shadow:0 0 25px rgba(125,255,178,.25),0 0 58px rgba(255,53,187,.13),inset 0 0 18px rgba(255,255,255,.06);font-weight:950;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;overflow:hidden}.enter button:after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3s ease-in-out infinite}@keyframes sweep{45%,100%{left:115%}}.enter button:hover{border-color:#fff;box-shadow:0 0 35px rgba(125,255,178,.48),0 0 75px rgba(255,53,187,.2)}.panel{position:absolute;inset:0;z-index:20;background:rgba(4,4,8,.76);backdrop-filter:blur(22px);display:none;place-items:center;padding:24px}.panel.open{display:grid}.modal{width:min(760px,100%);max-height:84dvh;overflow:auto;border:1px solid rgba(255,255,255,.16);border-radius:28px;background:linear-gradient(145deg,rgba(24,17,32,.98),rgba(7,7,11,.98));box-shadow:0 35px 120px rgba(0,0,0,.65);padding:30px}.modal-top{display:flex;justify-content:space-between;gap:20px}.modal h2{font-size:38px;margin:5px 0}.modal p{color:var(--d)}.close{border:1px solid var(--line);background:rgba(255,255,255,.05);width:40px;height:40px;border-radius:12px;cursor:pointer}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.action{min-height:125px;text-align:left;padding:18px;border:1px solid rgba(125,255,178,.35);border-radius:18px;background:rgba(125,255,178,.035);cursor:pointer;transition:.2s}.action:hover{border-color:#fff;box-shadow:0 0 25px rgba(125,255,178,.17);transform:translateY(-2px)}.action b{display:block;font-size:17px}.action span{display:block;color:var(--d);font-size:12px;margin-top:6px}@media(max-width:760px){.top{padding:14px}.status{font-size:8px}.stage{padding:60px 8px 18px}.core{height:calc(100dvh - 90px)}.halo{width:88vw}.naya{width:175px}.inner{width:133px;height:133px}.inner strong{font-size:27px}.node{width:112px;height:78px}.node:nth-child(1){top:2%}.node:nth-child(2){left:92%;top:29%}.node:nth-child(3){left:78%;top:88%}.node:nth-child(4){left:22%;top:88%}.node:nth-child(5){left:8%;top:29%}.node-title{font-size:11px}.node-sub{font-size:8px}.node-icon{margin-top:8px}.tag{top:7%}.tag h1{font-size:13px}.tag p{font-size:8px}.enter{bottom:2%}.enter button{min-width:205px;padding:13px}.actions{grid-template-columns:1fr}.modal{padding:22px;border-radius:22px}}</style></head><body><div class="app"><header class="top"><div class="logo"><i>☀️</i><span>NayaNET</span></div><div class="status"><b></b>Living intelligence online</div></header><main class="stage"><div class="core"><div class="tag"><h1>Create · Connect · Grow with US</h1><p>The internet connected information. NayaNET connects intelligence.</p></div><div class="halo"></div><div class="orbit"><div class="node"><button class="board" data-panel="power"><span class="node-icon">⚡</span><span class="node-title">NayaPOWER</span><span class="node-sub">Activate your intelligence</span></button></div><div class="node"><button class="board" data-panel="player"><span class="node-icon">◉</span><span class="node-title">Power Player</span><span class="node-sub">Hear · Learn · Grow</span></button></div><div class="node"><button class="board" data-panel="hub"><span class="node-icon">◎</span><span class="node-title">Intelligent Hub</span><span class="node-sub">What matters now</span></button></div><div class="node"><button class="board" data-panel="network"><span class="node-icon">✦</span><span class="node-title">Your Network</span><span class="node-sub">Connect intelligence</span></button></div><div class="node"><button class="board" data-panel="maxess"><span class="node-icon">◇</span><span class="node-title">MAXESS</span><span class="node-sub">Master AI capability</span></button></div></div><div class="naya" id="naya" tabindex="0" role="button" aria-label="Meet Naya"><div class="inner"><div><strong>Naya</strong><span>Your intelligent guide</span></div></div></div><div class="enter"><button id="enter">ENTER NayaNET →</button></div></div></main><div class="panel" id="panel"><section class="modal"><div class="modal-top"><div><div class="status"><b></b>Naya is with you</div><h2 id="title">Welcome.</h2><p id="copy">Choose a world. Naya will keep you oriented.</p></div><button class="close" id="close" aria-label="Close">×</button></div><div class="actions"><button class="action" data-go="power"><b>⚡ NayaPOWER</b><span>Activate the intelligence layer behind the experience.</span></button><button class="action" data-go="player"><b>◉ Power Player</b><span>Enter the heartbeat: listen, notice, learn, act.</span></button><button class="action" data-go="hub"><b>◎ Intelligent Hub</b><span>See context, signals and what matters now.</span></button></div></section></div><script>const panel=document.getElementById('panel'),title=document.getElementById('title'),copy=document.getElementById('copy'),boards=[...document.querySelectorAll('.board')];const info={power:['NayaPOWER','Your intelligence companion is ready.'],player:['Power Player','The heartbeat of NayaNET: hear intelligence and turn attention into action.'],hub:['Intelligent Hub','Your connected intelligence environment.'],network:['Your Network','Connect with people, ideas and intelligence with purpose.'],maxess:['MAXESS','Measure capability, discover the next level, become more capable.'],naya:['Naya','I am here. Choose a world and I will help you begin.']};function openPanel(k){let x=info[k];title.textContent=x[0];copy.textContent=x[1];panel.classList.add('open');boards.forEach(b=>b.classList.toggle('active',b.dataset.panel===k))}boards.forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));document.getElementById('naya').onclick=()=>openPanel('naya');document.getElementById('naya').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openPanel('naya')};document.getElementById('enter').onclick=()=>openPanel('hub');document.getElementById('close').onclick=()=>{panel.classList.remove('open');boards.forEach(b=>b.classList.remove('active'))};panel.onclick=e=>{if(e.target===panel)document.getElementById('close').click()};document.onkeydown=e=>{if(e.key==='Escape')document.getElementById('close').click()};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openPanel(b.dataset.go));</script></div></body></html>
