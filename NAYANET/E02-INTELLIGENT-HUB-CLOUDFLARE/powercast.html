<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07040d"><title>NayaNET Powercast</title>
<style>:root{--bg:#05030a;--panel:#0d0915;--line:#2a1b38;--purple:#a855f7;--white:#fff;--muted:#a9a0b5;--good:#72f2a6;--bad:#ff7a9a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#24103a 0,#0b0611 32%,var(--bg) 65%);color:var(--white);font-family:Inter,system-ui,sans-serif;min-height:100vh}.wrap{width:min(1180px,94vw);margin:auto;padding:28px 0 60px}.brand{font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hero{text-align:center;padding:34px 10px 24px}.eyebrow{color:#c084fc;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.hero h1{font-size:clamp(34px,6vw,66px);margin:10px 0 8px}.hero p{margin:auto;color:var(--muted);max-width:720px}.layout{display:grid;grid-template-columns:360px 1fr;gap:22px}.panel{background:linear-gradient(180deg,#120c1b,#09060e);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 80px #0008;overflow:hidden}.list{padding:12px;max-height:720px;overflow:auto}.episode{width:100%;display:grid;grid-template-columns:76px 1fr;gap:12px;text-align:left;background:transparent;border:1px solid transparent;border-radius:16px;padding:9px;margin:3px 0;color:inherit;cursor:pointer}.episode.active{background:#a855f714;border-color:#a855f755}.thumb{width:76px;height:76px;border-radius:12px;object-fit:cover;background:#17101f}.epno{font-size:11px;color:#c084fc;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.eptitle{font-size:14px;font-weight:750;line-height:1.3}.main{padding:26px}.art{width:min(100%,560px);aspect-ratio:1;margin:auto;display:block;border-radius:22px;object-fit:cover;background:#120d1c}.now{text-align:center;padding:20px 0 12px}.now h2{margin:7px 0;font-size:clamp(22px,4vw,34px)}.status{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 16px;min-height:24px}.controls{display:flex;justify-content:center;gap:10px}.ctrl{width:46px;height:46px;border-radius:50%;border:1px solid #3a2850;background:#130d1c;color:inherit;cursor:pointer}.play{width:62px;height:62px;background:linear-gradient(135deg,#c084fc,#7c3aed);border:0}.ctrl:disabled{opacity:.4;cursor:not-allowed}.range{width:100%;margin:18px 0 2px;accent-color:var(--purple)}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.settings{margin-top:20px;padding:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.settings code{color:#d8b4fe}.diag{margin-top:10px;padding:12px;border-radius:12px;background:#050308;border:1px solid #21162c;white-space:pre-wrap;word-break:break-word}.ok{color:var(--good)}.bad{color:var(--bad)}audio{display:none}@media(max-width:820px){.layout{grid-template-columns:1fr}.list{max-height:420px;order:2}.main{order:1}}</style>
</head><body><div class="wrap"><div class="brand">NayaNET</div><section class="hero"><div class="eyebrow">Powercast</div><h1>Listen. Think. Compound.</h1><p>The Naya Powercast library — loading patiently when the network needs a moment.</p></section><div class="layout"><aside class="panel"><div id="episodeList" class="list">Loading Powercasts…</div></aside><main class="panel main"><img id="art" class="art" alt="Powercast artwork"><div class="now"><div id="epNo" class="epno"></div><h2 id="title">Loading…</h2></div><div id="status" class="status">Loading your experience…</div><div class="controls"><button class="ctrl" id="back" disabled>−15</button><button class="ctrl play" id="play" disabled>▶</button><button class="ctrl" id="forward" disabled>+15</button></div><input id="range" class="range" type="range" min="0" max="100" value="0" step="0.1" disabled><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div><div class="settings"><div><strong>Audio route:</strong> <code id="route">/audio?id=…</code></div><div id="diag" class="diag">Preparing the audio player…</div></div><audio id="audio" preload="metadata"></audio></main></div></div>
<script>
const $=id=>document.getElementById(id),audio=$('audio');
const state={casts:[],index:0,generation:0,loading:false,ready:false,pendingPlay:false};
const fmt=s=>Number.isFinite(s)&&s>=0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function idFromUrl(u){try{const x=new URL(u);const m=x.pathname.match(/\/d\/([A-Za-z0-9_-]+)/);return m?m[1]:x.searchParams.get('id')}catch{return null}}
function imageUrl(u){const id=idFromUrl(u);return id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1200':u}
function audioUrl(u){const id=idFromUrl(u);if(!id)throw Error('No Google Drive file ID');return location.origin+'/audio?id='+encodeURIComponent(id)}
function status(t,c=''){$('status').textContent=t;$('status').className='status '+c}
function diag(t,c=''){$('diag').textContent=t;$('diag').className='diag '+c}
function controls(on){['play','back','forward','range'].forEach(id=>$(id).disabled=!on)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){ $('episodeList').innerHTML='';state.casts.forEach((c,i)=>{const b=document.createElement('button');b.className='episode '+(i===state.index?'active':'');b.innerHTML='<img class="thumb" loading="lazy" src="'+imageUrl(c.image)+'" alt=""><div><div class="epno">Powercast '+String(c.n).padStart(2,'0')+'</div><div class="eptitle">'+esc(c.title)+'</div></div>';b.onclick=()=>select(i,false);$('episodeList').appendChild(b)}) }
function waitForReady(generation){return new Promise(resolve=>{if(generation!==state.generation)return resolve(false);if(audio.readyState>=1&&!audio.error)return resolve(true);const done=()=>{cleanup();resolve(generation===state.generation&&audio.readyState>=1&&!audio.error)};const cleanup=()=>{audio.removeEventListener('loadedmetadata',done);audio.removeEventListener('error',done)};audio.addEventListener('loadedmetadata',done);audio.addEventListener('error',done);setTimeout(()=>{cleanup();resolve(generation===state.generation&&audio.readyState>=1&&!audio.error)},15000)})}
async function playWhenReady(g){if(g!==state.generation)return;state.pendingPlay=true;status('Starting playback…');const ok=await waitForReady(g);if(g!==state.generation||!state.pendingPlay)return;if(!ok){state.pendingPlay=false;status('Audio is taking too long to load','bad');diag('No playable audio metadata after 15 seconds.\nThe player is still available — try Play again.','bad');return}try{const p=audio.play();if(p)await p;state.pendingPlay=false}catch(e){state.pendingPlay=false;if(g!==state.generation)return;if(e.name!=='AbortError'){status('Play failed','bad');diag('audio.play() failed: '+e.message,'bad')}}}
async function select(i,auto){state.generation++;const g=state.generation;state.index=i;state.loading=true;state.ready=false;state.pendingPlay=false;controls(false);audio.pause();audio.removeAttribute('src');audio.load();const c=state.casts[i];$('epNo').textContent='POWERCAST '+String(c.n).padStart(2,'0');$('title').textContent=c.title;$('art').src=imageUrl(c.image);$('route').textContent='Loading…';render();status('Loading your experience…');diag('Connecting to the audio stream…');let src;try{src=audioUrl(c.audio)}catch(e){state.loading=false;status(e.message,'bad');return}audio.src=src;$('route').textContent=src;audio.load();const ok=await waitForReady(g);if(g!==state.generation)return;state.loading=false;if(ok){state.ready=true;controls(true);$('duration').textContent=fmt(audio.duration);status('Ready — press Play','ok');diag('Audio is ready.\nDuration: '+fmt(audio.duration),'ok');if(auto)playWhenReady(g)}else{status('Still loading audio…');diag('The experience is taking a little longer than usual.\nWait a moment, then press Play.')}}
$('play').onclick=()=>{if(!state.ready||state.loading)return;if(audio.paused)playWhenReady(state.generation);else{state.pendingPlay=false;audio.pause()}};
$('back').onclick=()=>{if(state.ready)audio.currentTime=Math.max(0,audio.currentTime-15)};$('forward').onclick=()=>{if(state.ready)audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+15)};$('range').oninput=e=>{if(state.ready&&audio.duration)audio.currentTime=e.target.value/100*audio.duration};
audio.addEventListener('loadedmetadata',()=>{if(state.ready){$('duration').textContent=fmt(audio.duration);diag('Audio is ready.\nDuration: '+fmt(audio.duration),'ok')}});audio.addEventListener('timeupdate',()=>{$('current').textContent=fmt(audio.currentTime);if(audio.duration)$('range').value=audio.currentTime/audio.duration*100});audio.addEventListener('play',()=>{$('play').textContent='❚❚';status('Playing','ok')});audio.addEventListener('pause',()=>{$('play').textContent='▶';if(!audio.ended&&!state.loading&&!state.pendingPlay)status('Paused')});audio.addEventListener('ended',()=>{if(state.index<state.casts.length-1)select(state.index+1,true)});audio.addEventListener('error',()=>{if(state.loading)return;const e=audio.error;status('Audio could not be played','bad');diag('HTML5 audio error '+(e?e.code:'unknown')+'\n'+audio.currentSrc,'bad')});
(async()=>{try{status('Loading your experience…');const r=await fetch('powercasts.json',{cache:'no-store'});if(!r.ok)throw Error('powercasts.json HTTP '+r.status);state.casts=await r.json();if(!Array.isArray(state.casts)||state.casts.length!==18)throw Error('Expected 18 Powercasts');render();await select(0,false)}catch(e){$('episodeList').textContent='Powercast load failed: '+e.message;status('Library failed to load','bad')}})();
</script></body></html>
