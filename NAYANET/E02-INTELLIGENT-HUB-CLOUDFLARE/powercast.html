<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07040d">
<title>NayaNET Powercast</title>
<style>
:root{--bg:#05030a;--panel:#0d0915;--panel2:#120d1c;--line:#2a1b38;--purple:#a855f7;--purple2:#7c3aed;--white:#fff;--muted:#a9a0b5;--good:#72f2a6;--bad:#ff7a9a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#24103a 0,#0b0611 32%,var(--bg) 65%);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button{font:inherit;color:inherit}.wrap{width:min(1180px,94vw);margin:auto;padding:28px 0 60px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c084fc 22%,#7c3aed 52%,#1f0a34 72%);box-shadow:0 0 28px #a855f755}.hero{text-align:center;padding:34px 10px 24px}.eyebrow{color:#c084fc;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.hero h1{font-size:clamp(34px,6vw,66px);margin:10px 0 8px;line-height:1}.hero p{margin:0 auto;color:var(--muted);max-width:720px;font-size:16px}.layout{display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}.panel{background:linear-gradient(180deg,#120c1b,#09060e);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 80px #0008;overflow:hidden}.list{padding:12px;max-height:720px;overflow:auto}.episode{width:100%;display:grid;grid-template-columns:76px 1fr;gap:12px;text-align:left;background:transparent;border:1px solid transparent;border-radius:16px;padding:9px;margin:3px 0;cursor:pointer}.episode:hover{background:#ffffff08}.episode.active{background:#a855f714;border-color:#a855f755}.thumb{width:76px;height:76px;border-radius:12px;object-fit:cover;background:#17101f}.epno{font-size:11px;color:#c084fc;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:3px 0}.eptitle{font-size:14px;font-weight:750;line-height:1.3}.main{padding:26px}.art{width:min(100%,560px);aspect-ratio:1/1;margin:auto;border-radius:22px;object-fit:cover;background:#120d1c;box-shadow:0 0 70px #7c3aed22}.now{text-align:center;padding:20px 0 12px}.now .epno{margin-bottom:7px}.now h2{margin:0;font-size:clamp(22px,4vw,34px);line-height:1.15}.status{min-height:24px;text-align:center;color:var(--muted);font-size:13px;margin:4px 0 16px}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.ctrl{width:46px;height:46px;border-radius:50%;border:1px solid #3a2850;background:#130d1c;cursor:pointer}.ctrl:hover{border-color:#a855f7}.play{width:62px;height:62px;background:linear-gradient(135deg,#c084fc,#7c3aed);border:0;box-shadow:0 10px 30px #7c3aed55}.range{width:100%;margin:18px 0 2px;accent-color:var(--purple)}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.settings{margin-top:20px;padding:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.settings code{color:#d8b4fe}.diag{margin-top:10px;padding:12px;border-radius:12px;background:#050308;border:1px solid #21162c;white-space:pre-wrap;word-break:break-word}.ok{color:var(--good)}.bad{color:var(--bad)}audio{display:none}@media(max-width:820px){.layout{grid-template-columns:1fr}.list{max-height:420px;order:2}.main{order:1}.wrap{padding-top:18px}.main{padding:18px}.art{max-width:520px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="orb"></span><span>NayaNET</span></div>
  <section class="hero"><div class="eyebrow">Powercast</div><h1>Listen. Think. Compound.</h1><p>The Naya Powercast library — with real thumbnails and a real audio stream delivered through the NayaNET Worker.</p></section>
  <div class="layout">
    <aside class="panel"><div id="episodeList" class="list">Loading Powercasts…</div></aside>
    <main class="panel main">
      <img id="art" class="art" alt="Powercast artwork">
      <div class="now"><div id="epNo" class="epno"></div><h2 id="title">Loading…</h2></div>
      <div id="status" class="status">Preparing player…</div>
      <div class="controls"><button class="ctrl" id="back" title="Back 15 seconds">−15</button><button class="ctrl play" id="play" title="Play / pause">▶</button><button class="ctrl" id="forward" title="Forward 15 seconds">+15</button></div>
      <input id="range" class="range" type="range" min="0" max="100" value="0" step="0.1">
      <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
      <div class="settings"><div><strong>Audio route:</strong> <code id="route">/audio?id=…</code></div><div id="diag" class="diag">Waiting for a playable audio response.</div></div>
      <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
    </main>
  </div>
</div>
<script>
const WORKER_ORIGIN = location.origin;
const state={casts:[],index:0};
const $=id=>document.getElementById(id);
const audio=$('audio');
function fmt(s){if(!Number.isFinite(s)||s<0)return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0')}
function idFromUrl(u){try{const x=new URL(u);const m=x.pathname.match(/\/d\/([A-Za-z0-9_-]+)/);return m?m[1]:x.searchParams.get('id')}catch{return null}}
function imageUrl(u){const id=idFromUrl(u);return id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1200':u}
function audioUrl(u){const id=idFromUrl(u);if(!id)throw new Error('No Google Drive file ID');return WORKER_ORIGIN+'/audio?id='+encodeURIComponent(id)}
function setStatus(t,cls=''){$('status').textContent=t;$('status').className='status '+cls}
function diag(t,cls=''){$('diag').textContent=t;$('diag').className='diag '+cls}
function renderList(){
 $('episodeList').innerHTML='';
 state.casts.forEach((c,i)=>{const b=document.createElement('button');b.className='episode'+(i===state.index?' active':'');b.innerHTML='<img class="thumb" loading="lazy" src="'+imageUrl(c.image)+'" alt=""><div><div class="epno">Powercast '+String(c.n).padStart(2,'0')+'</div><div class="eptitle">'+escapeHtml(c.title)+'</div></div>';b.onclick=()=>select(i);$('episodeList').appendChild(b)});
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function select(i,autoplay=false){state.index=i;const c=state.casts[i];$('epNo').textContent='POWERCAST '+String(c.n).padStart(2,'0');$('title').textContent=c.title;$('art').src=imageUrl(c.image);$('art').onerror=()=>{$('art').style.opacity='.35'};let src;try{src=audioUrl(c.audio)}catch(e){setStatus(e.message,'bad');return}audio.pause();audio.src=src;audio.load();$('route').textContent=src;renderList();diag('Loading audio metadata…');setStatus('Ready to play');if(autoplay)audio.play().catch(e=>{setStatus('Browser blocked autoplay — press Play','bad');diag('Autoplay was blocked by the browser. This is normal; press Play.\n'+e.message,'bad')})}
$('play').onclick=()=>{if(audio.paused)audio.play().catch(e=>{setStatus('Play failed','bad');diag('audio.play() failed: '+e.message,'bad')});else audio.pause()};
$('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);$('forward').onclick=()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+15);
$('range').oninput=e=>{if(audio.duration)audio.currentTime=(e.target.value/100)*audio.duration};
audio.addEventListener('loadedmetadata',()=>{ $('duration').textContent=fmt(audio.duration);diag('Playable media metadata received.\nDuration: '+fmt(audio.duration)+'\nType: '+(audio.currentSrc||'').split('?')[0],'ok');setStatus('Ready — press Play','ok')});
audio.addEventListener('timeupdate',()=>{if(audio.duration)$('range').value=(audio.currentTime/audio.duration)*100;$('current').textContent=fmt(audio.currentTime)});
audio.addEventListener('play',()=>{$('play').textContent='❚❚';setStatus('Playing','ok')});audio.addEventListener('pause',()=>{$('play').textContent='▶';if(!audio.ended)setStatus('Paused')});
audio.addEventListener('ended',()=>{$('play').textContent='▶';setStatus('Ended');if(state.index<state.casts.length-1)select(state.index+1,true)});
audio.addEventListener('error',()=>{const e=audio.error;setStatus('Audio could not be played','bad');diag('HTML5 audio error '+(e?e.code:'unknown')+'.\nURL: '+audio.currentSrc+'\nThe Worker must return actual audio bytes, not Drive viewer HTML.','bad')});
(async()=>{try{const r=await fetch('powercasts.json',{cache:'no-store'});if(!r.ok)throw new Error('powercasts.json HTTP '+r.status);state.casts=await r.json();if(!Array.isArray(state.casts)||state.casts.length!==18)throw new Error('Expected 18 Powercasts');select(0)}catch(e){$('episodeList').textContent='Powercast load failed: '+e.message;setStatus('Library failed to load','bad')}})();
</script>
</body>
</html>
