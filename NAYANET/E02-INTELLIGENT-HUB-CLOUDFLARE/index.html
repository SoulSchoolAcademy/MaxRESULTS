<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>NayaNET — Intelligent Hub</title>
<meta name="description" content="NayaNET Intelligent Hub — a living intelligent network where humans and AI connect, create and grow together.">
<style>
:root{--bg:#05040a;--ink:#f7f5ff;--muted:#a9a3bb;--line:rgba(255,255,255,.12);--purple:#a56cff;--magenta:#ff4fca;--blue:#5b9cff;--green:#50e6a4;--gold:#ffd76a;--panel:rgba(12,10,22,.76);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}button,input{font:inherit}button{color:inherit}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#app{position:relative;min-height:100svh;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(127,71,255,.16),transparent 34%),radial-gradient(circle at 20% 15%,rgba(53,123,255,.09),transparent 28%),#05040a}
#space,#space:before,#space:after{position:absolute;inset:0;pointer-events:none}#space{background-image:radial-gradient(circle at 10% 20%,rgba(255,255,255,.6) 0 1px,transparent 1.5px),radial-gradient(circle at 76% 28%,rgba(255,255,255,.42) 0 1px,transparent 1.5px),radial-gradient(circle at 32% 78%,rgba(255,255,255,.34) 0 1px,transparent 1.5px),radial-gradient(circle at 91% 83%,rgba(255,255,255,.5) 0 1px,transparent 1.5px);opacity:.38}
#space:before{content:"";background:radial-gradient(ellipse at center,transparent 0 42%,rgba(255,255,255,.025) 58%,transparent 72%);transform:scale(1.4)}#space:after{content:"";background:conic-gradient(from 10deg at 50% 50%,transparent,rgba(165,108,255,.06),transparent 18%,rgba(91,156,255,.05),transparent 38%,rgba(255,79,202,.04),transparent 58%,rgba(80,230,164,.04),transparent 80%);filter:blur(24px);animation:drift 22s linear infinite}
@keyframes drift{to{transform:rotate(360deg)}}
header{position:absolute;z-index:30;top:0;left:0;right:0;padding:18px clamp(18px,4vw,48px);display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:.18em;font-size:12px}.brand-mark{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#ffd76a 10% 24%,#a56cff 35%,transparent 68%);box-shadow:0 0 28px rgba(165,108,255,.65)}.identity{font-size:11px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}
#field{position:absolute;inset:0;display:grid;place-items:center;perspective:1200px}.orbit{position:absolute;left:50%;top:50%;width:min(82vw,980px);height:min(82vw,980px);transform:translate(-50%,-50%) rotateX(64deg);border:1px solid rgba(255,255,255,.07);border-radius:50%;box-shadow:0 0 80px rgba(126,71,255,.05) inset;pointer-events:none}.orbit.two{width:min(61vw,720px);height:min(61vw,720px);transform:translate(-50%,-50%) rotateX(64deg) rotateZ(19deg);border-color:rgba(165,108,255,.09)}.orbit.three{width:min(44vw,520px);height:min(44vw,520px);transform:translate(-50%,-50%) rotateX(64deg) rotateZ(-26deg);border-color:rgba(91,156,255,.08)}
#rays{position:absolute;inset:0;pointer-events:none}.ray{position:absolute;left:50%;top:50%;width:42%;height:1px;transform-origin:0 50%;background:linear-gradient(90deg,rgba(165,108,255,.2),transparent);opacity:.55}.ray:nth-child(1){transform:rotate(14deg)}.ray:nth-child(2){transform:rotate(101deg)}.ray:nth-child(3){transform:rotate(193deg)}.ray:nth-child(4){transform:rotate(282deg)}
#nodes{position:absolute;inset:0}.node{--accent:var(--purple);position:absolute;width:clamp(86px,9vw,122px);height:clamp(86px,9vw,122px);border-radius:50%;border:1px solid rgba(255,255,255,.2);background:radial-gradient(circle at 36% 28%,rgba(255,255,255,.18),transparent 24%),radial-gradient(circle at 50% 58%,color-mix(in srgb,var(--accent) 34%,transparent),rgba(8,6,16,.8) 66%);box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 0 30px color-mix(in srgb,var(--accent) 26%,transparent),0 16px 44px rgba(0,0,0,.45);transform:translate(-50%,-50%);cursor:pointer;transition:transform .45s var(--ease),filter .45s var(--ease),box-shadow .45s var(--ease),opacity .45s var(--ease);display:grid;place-items:center;text-align:center;touch-action:manipulation;outline:none}.node:before{content:"";position:absolute;inset:8%;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);opacity:.7}.node:after{content:"";position:absolute;inset:-15%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 18%,transparent),transparent 68%);z-index:-1;opacity:.55;transition:opacity .4s}.node:hover,.node:focus-visible{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 0 1px rgba(255,255,255,.16) inset,0 0 48px color-mix(in srgb,var(--accent) 42%,transparent),0 20px 52px rgba(0,0,0,.5)}.node.active{transform:translate(-50%,-50%) scale(1.16);filter:saturate(1.2);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 65px color-mix(in srgb,var(--accent) 48%,transparent)}.node .num{position:absolute;top:14px;font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.55)}.node .glyph{font-size:22px;line-height:1;margin-bottom:5px}.node .label{font-size:10px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;line-height:1.25;max-width:78px}.node .group{font-size:8px;color:var(--muted);letter-spacing:.12em;margin-top:3px;text-transform:uppercase}
.n1{left:50%;top:9%;--accent:var(--purple)}.n2{left:74%;top:18%;--accent:var(--magenta)}.n3{left:91%;top:43%;--accent:var(--blue)}.n4{left:80%;top:70%;--accent:var(--purple)}.n5{left:61%;top:88%;--accent:var(--green)}.n6{left:37%;top:88%;--accent:var(--gold)}.n7{left:18%;top:70%;--accent:var(--gold)}.n8{left:9%;top:43%;--accent:var(--green)}.n9{left:20%;top:18%;--accent:var(--magenta)}.n10{left:39%;top:16%;--accent:var(--blue)}.n11{left:65%;top:54%;--accent:var(--gold)}.n12{left:35%;top:54%;--accent:var(--purple)}
#naya{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(150px,19vw,250px);height:clamp(150px,19vw,250px);border-radius:50%;display:grid;place-items:center;z-index:10}.sun-core{position:absolute;inset:19%;border-radius:50%;background:radial-gradient(circle at 50% 42%,#fff 0 4%,#ffd76a 8%,rgba(255,215,106,.9) 14%,rgba(165,108,255,.65) 35%,rgba(103,47,255,.2) 57%,transparent 72%);box-shadow:0 0 32px rgba(255,215,106,.55),0 0 90px rgba(165,108,255,.42),0 0 150px rgba(165,108,255,.18);animation:breathe 4.5s ease-in-out infinite}.sun-ring{position:absolute;inset:7%;border:1px solid rgba(255,255,255,.22);border-radius:50%;box-shadow:0 0 40px rgba(165,108,255,.12) inset;animation:spin 18s linear infinite}.sun-ring.r2{inset:0;border-color:rgba(255,215,106,.12);animation:spin 28s linear infinite reverse}.sun-ring:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff;left:13%;top:19%}.naya-copy{position:relative;z-index:2;text-align:center;text-shadow:0 2px 20px #000}.naya-copy .kicker{font-size:9px;letter-spacing:.28em;color:rgba(255,255,255,.65)}.naya-copy strong{display:block;font-size:clamp(24px,4vw,46px);letter-spacing:.08em;margin:3px 0}.naya-copy span{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.naya-pulse{position:absolute;inset:-18%;border:1px solid rgba(165,108,255,.14);border-radius:50%;animation:pulse 4.5s ease-out infinite}
@keyframes breathe{50%{transform:scale(1.05);filter:brightness(1.12)}}@keyframes pulse{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.12);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}
#prompt{position:absolute;z-index:20;left:50%;top:67%;transform:translateX(-50%);text-align:center;width:min(90vw,520px);pointer-events:none}.prompt-kicker{font-size:10px;letter-spacing:.25em;color:rgba(255,255,255,.52);text-transform:uppercase}.prompt-title{font-size:clamp(18px,2.4vw,28px);font-weight:700;margin:8px 0 4px}.prompt-sub{font-size:12px;color:var(--muted)}
#dock{position:absolute;z-index:40;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(7,6,13,.76);backdrop-filter:blur(18px);box-shadow:0 12px 50px rgba(0,0,0,.42)}.dock-btn{border:0;background:transparent;padding:10px 14px;border-radius:14px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer}.dock-btn:hover,.dock-btn:focus-visible{background:rgba(255,255,255,.08);color:#fff;outline:none}.dock-btn.primary{color:#fff;background:linear-gradient(135deg,rgba(165,108,255,.35),rgba(255,79,202,.18));box-shadow:0 0 24px rgba(165,108,255,.12) inset}.dock-plus{width:38px;height:38px;padding:0;border:1px solid rgba(255,255,255,.14);border-radius:13px;font-size:18px}
#panel{position:absolute;z-index:50;right:clamp(12px,3vw,36px);top:70px;width:min(430px,calc(100vw - 24px));max-height:calc(100svh - 150px);overflow:auto;border:1px solid rgba(255,255,255,.13);border-radius:28px;background:linear-gradient(160deg,rgba(21,17,35,.96),rgba(8,7,14,.96));box-shadow:0 30px 100px rgba(0,0,0,.62),0 0 60px rgba(165,108,255,.08);backdrop-filter:blur(28px);padding:28px;transform:translateY(14px) scale(.97);opacity:0;pointer-events:none;transition:.42s var(--ease)}#panel.open{transform:none;opacity:1;pointer-events:auto}.panel-top{display:flex;justify-content:space-between;align-items:start;gap:16px}.panel-num{font-size:9px;color:var(--muted);letter-spacing:.2em}.panel-title{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:4px 0}.panel-close{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.05);cursor:pointer}.panel-lead{color:#ded9e9;line-height:1.55;font-size:14px;margin:18px 0}.facets{display:grid;gap:8px;margin:16px 0}.facet{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(255,255,255,.035);font-size:11px}.facet i{font-style:normal;color:var(--gold)}.flow{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.flow span{padding:7px 9px;border-radius:9px;background:rgba(165,108,255,.09);border:1px solid rgba(165,108,255,.16);font-size:9px;letter-spacing:.08em;text-transform:uppercase}.flow b{color:var(--muted);font-weight:500;align-self:center}.action{display:block;width:100%;border:1px solid rgba(255,255,255,.16);border-radius:15px;padding:14px 16px;background:linear-gradient(135deg,rgba(165,108,255,.45),rgba(255,79,202,.25));font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 30px rgba(165,108,255,.12)}.action:hover,.action:focus-visible{filter:brightness(1.15);transform:translateY(-1px);outline:none}.secondary{margin-top:8px;background:rgba(255,255,255,.045);box-shadow:none}
#menu{position:absolute;z-index:60;left:50%;bottom:78px;transform:translate(-50%,12px) scale(.96);width:min(430px,calc(100vw - 24px));padding:18px;border:1px solid var(--line);border-radius:22px;background:rgba(9,8,16,.96);backdrop-filter:blur(24px);opacity:0;pointer-events:none;transition:.3s var(--ease);box-shadow:0 24px 70px rgba(0,0,0,.5)}#menu.open{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.menu-item{padding:13px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(255,255,255,.03);text-align:left;cursor:pointer}.menu-item strong{display:block;font-size:10px}.menu-item span{display:block;color:var(--muted);font-size:9px;margin-top:4px}
.toast{position:absolute;z-index:80;left:50%;top:18px;transform:translate(-50%,-16px);padding:10px 14px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(10,8,18,.9);backdrop-filter:blur(16px);font-size:10px;letter-spacing:.08em;opacity:0;pointer-events:none;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){body{overflow:hidden}header{padding:14px 16px}.identity{max-width:120px;text-align:right}.orbit{width:112vw;height:112vw}.orbit.two{width:88vw;height:88vw}.orbit.three{width:65vw;height:65vw}.node{width:74px;height:74px}.node .glyph{font-size:17px}.node .label{font-size:8px;max-width:60px}.node .group{display:none}.node .num{top:9px;font-size:7px}.n1{left:50%;top:15%}.n2{left:76%;top:23%}.n3{left:88%;top:42%}.n4{left:76%;top:68%}.n5{left:60%;top:82%}.n6{left:40%;top:82%}.n7{left:24%;top:68%}.n8{left:12%;top:42%}.n9{left:24%;top:23%}.n10{left:40%;top:19%}.n11{left:66%;top:56%}.n12{left:34%;top:56%}#naya{width:170px;height:170px}#prompt{top:70%;width:280px}.prompt-sub{font-size:10px}.dock{gap:2px}.dock-btn{padding:9px 8px;font-size:8px}.dock-plus{width:34px;height:34px}#panel{top:auto;bottom:0;right:0;width:100%;max-height:72svh;border-radius:26px 26px 0 0;padding:22px 20px}.menu-grid{grid-template-columns:repeat(2,1fr)}#menu{bottom:70px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main id="app" aria-label="NayaNET Intelligent Hub">
<div id="space"></div>
<header><div class="brand"><span class="brand-mark" aria-hidden="true"></span>NAYANET</div><div class="identity" id="identity">YOUR INTELLIGENT NETWORK</div></header>
<section id="field" aria-label="Intelligence constellation">
<div class="orbit"></div><div class="orbit two"></div><div class="orbit three"></div>
<div id="rays"><i class="ray"></i><i class="ray"></i><i class="ray"></i><i class="ray"></i></div>
<div id="nodes" aria-label="12 intelligent elements"></div>
<div id="naya"><div class="naya-pulse"></div><div class="sun-ring"></div><div class="sun-ring r2"></div><div class="sun-core"></div><div class="naya-copy"><div class="kicker">INTELLIGENCE AT THE CENTER</div><strong>NAYA</strong><span id="nayaState">Explore your intelligent network</span></div></div>
<div id="prompt"><div class="prompt-kicker">SHOW → REVEAL → EXPLAIN → INVITE</div><div class="prompt-title" id="promptTitle">You’re in.</div><div class="prompt-sub" id="promptSub">Touch an intelligence object to reveal what it can do.</div></div>
</section>
<nav id="dock" aria-label="Primary actions"><button class="dock-btn" data-action="plus" aria-label="Open utility menu">＋</button><button class="dock-btn primary" data-action="naya">NAYA</button><button class="dock-btn" data-action="maxess">MAXESS</button><button class="dock-btn" data-action="challenge">5-DAY</button></nav>
<section id="panel" role="dialog" aria-modal="false" aria-labelledby="panelTitle"><div class="panel-top"><div><div class="panel-num" id="panelNum"></div><h2 class="panel-title" id="panelTitle"></h2></div><button class="panel-close" data-action="close" aria-label="Close">×</button></div><div class="panel-lead" id="panelLead"></div><div class="facets" id="facets"></div><div class="flow" id="flow"></div><button class="action" id="panelAction"></button><button class="action secondary" data-action="close">Return to Hub</button></section>
<section id="menu" aria-label="Utility menu"><div class="menu-grid"><button class="menu-item" data-utility="identity"><strong>Smart Identity</strong><span>Name · ID · Link · Mail</span></button><button class="menu-item" data-utility="spaces"><strong>Intelligent Spaces</strong><span>Human + AI collaboration</span></button><button class="menu-item" data-utility="notes"><strong>Smart Notes</strong><span>Turn experience into intelligence</span></button><button class="menu-item" data-utility="network"><strong>Your Network</strong><span>Intelligence finding intelligence</span></button><button class="menu-item" data-utility="privacy"><strong>Privacy & Consent</strong><span>Human agency by design</span></button><button class="menu-item" data-utility="install"><strong>Install NayaNET</strong><span>Add the experience to your device</span></button></div></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<script>
const items=[
{id:'identity',title:'Smart Identity',group:'Identity',glyph:'◇',accent:'purple',lead:'Identity inside NayaNET is designed around choice. Your Smart Name can be what you choose to be called; your Smart ID is your network identity.',facets:['Smart Name — what you choose to be called','Smart ID — your network alias','Smart Link — your personal NayaNET address','Smart Mail — private network communication'],flow:['Name','ID','Link','Mail'],action:'Explore Smart Identity'},
{id:'brain',title:'Super Brain',group:'Identity',glyph:'✦',accent:'magenta',lead:'Your private intelligent system — a place to think, remember, learn, create, organize and accomplish with Naya.',facets:['Think','Remember','Learn','Create','Organize','Accomplish'],flow:['Human','Naya','Intelligence'],action:'Meet your Super Brain'},
{id:'spaces',title:'Intelligent Spaces',group:'Identity',glyph:'◎',accent:'blue',lead:'Private spaces where humans and AI can think, communicate and collaborate. The participants depend on the space you intentionally create.',facets:['Human + Naya','Human + Human','Human + Human + Naya','Human + Multiple AIs'],flow:['People','AI','Space','Collaboration'],action:'Explore Spaces'},
{id:'power',title:'Naya Power',group:'Identity',glyph:'☀',accent:'purple',lead:'Your intelligent operating layer — an amplifier for thinking, learning, creating, remembering, organizing, communicating and accomplishing.',facets:['Think smarter','Create faster','Remember what matters','Turn experience into intelligence'],flow:['You','Naya Power','Action'],action:'Open Naya Power'},
{id:'notes',title:'Smart Notes',group:'Intelligence',glyph:'◆',accent:'green',lead:'Turn experience into intelligence. Capture the moments that matter and transform them into reusable insight instead of letting them disappear.',facets:['Insight','Lesson','Breakthrough','Decision','Mistake','Question','Goal','Opportunity'],flow:['Experience','Insight','Smart Note','Intelligence'],action:'Capture a Smart Note'},
{id:'chain',title:'Collective Chain',group:'Intelligence',glyph:'⛓',accent:'gold',lead:'Collective Chain Technology is designed to let deliberately shared wisdom become reusable intelligence — without treating private intelligence as automatically collective.',facets:['Private first','Explicit consent','Shared wisdom','Collective intelligence'],flow:['Private','Consent','Shared Wisdom','Collective'],action:'See the CTC flow'},
{id:'wisdom',title:'Consolidated Wisdom',group:'Intelligence',glyph:'◈',accent:'gold',lead:'Intelligence should become clearer, not heavier. Repeated lessons can be recognized, consolidated and refined so the value survives without unnecessary duplication.',facets:['Recognize repetition','Reduce duplication','Preserve value','Strengthen the lesson'],flow:['Many Experiences','Gold','One Clearer Lesson'],action:'Reveal the gold'},
{id:'compound',title:'Compounding Intelligence',group:'Intelligence',glyph:'∞',accent:'green',lead:'Meaningful experience can become more valuable over time as patterns, lessons and decisions are refined into a clearer personal intelligence.',facets:['Daily Intelligence','Weekly Intelligence','Monthly Intelligence','Yearly Intelligence','Lifetime Intelligence'],flow:['Moment','Day','Week','Month','Year','Lifetime'],action:'See intelligence compound'},
{id:'maxess',title:'MAXESS',group:'Experience',glyph:'◉',accent:'magenta',lead:'AI Mastery Assessment. Discover where your current AI capability sits and get a precise starting point for becoming your MAX.',facets:['AI capability','Precision measurement','Personalized insight','Next-step direction'],flow:['3 Min','Assess','Score','Act'],action:'Discover your AI Score'},
{id:'challenge',title:'Five-Day Challenge',group:'Experience',glyph:'5',accent:'green',lead:'A simple path from intention to action. Five stages designed to create momentum without overwhelming you with the whole journey at once.',facets:['Day 1 — Begin','Day 2 — Learn','Day 3 — Apply','Day 4 — Compound','Day 5 — Grow'],flow:['1','2','3','4','5'],action:'Start the 5-Day Challenge'},
{id:'laws',title:'Mission & Laws',group:'Experience',glyph:'✧',accent:'gold',lead:'The network is designed around human agency: do no harm to one another, protect privacy, respect boundaries, seek consent and keep people in control.',facets:['Do no harm','Privacy','Consent','Respect','Boundaries','Safety','Human agency'],flow:['Trust','Consent','Agency','Safety'],action:'Explore the laws'},
{id:'network',title:'Your Network',group:'Experience',glyph:'✺',accent:'blue',lead:'A future where intelligence can find intelligence. Discover people, knowledge, questions and capabilities through what participants deliberately choose to share.',facets:['Subjects','Interests','Knowledge','Questions','Goals','Capabilities'],flow:['You','Intent','Discovery','Connection'],action:'Explore Your Network'}
];
const nodeHost=document.getElementById('nodes');
const icons={purple:'var(--purple)',magenta:'var(--magenta)',blue:'var(--blue)',green:'var(--green)',gold:'var(--gold)'};
items.forEach((it,i)=>{const b=document.createElement('button');b.className='node n'+(i+1);b.dataset.id=it.id;b.style.setProperty('--accent',icons[it.accent]);b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><span><div class="glyph">${it.glyph}</div><div class="label">${it.title}</div><div class="group">${it.group}</div></span>`;b.setAttribute('aria-label',it.title);b.addEventListener('click',()=>openItem(it.id));b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openItem(it.id)}});nodeHost.appendChild(b)});
const panel=document.getElementById('panel'),menu=document.getElementById('menu'),toast=document.getElementById('toast');let current=null;
function openItem(id){const it=items.find(x=>x.id===id);if(!it)return;current=it;document.querySelectorAll('.node').forEach(n=>n.classList.toggle('active',n.dataset.id===id));document.getElementById('panelNum').textContent=`${String(items.indexOf(it)+1).padStart(2,'0')} · ${it.group}`;document.getElementById('panelTitle').textContent=it.title;document.getElementById('panelLead').textContent=it.lead;document.getElementById('facets').innerHTML=it.facets.map(x=>`<div class="facet"><i>◆</i>${x}</div>`).join('');document.getElementById('flow').innerHTML=it.flow.map((x,i)=>`${i?'<b>→</b>':''}<span>${x}</span>`).join('');document.getElementById('panelAction').textContent=it.action;document.getElementById('panelAction').onclick=()=>act(it);panel.classList.add('open');menu.classList.remove('open');document.getElementById('nayaState').textContent=it.title;document.getElementById('promptTitle').textContent=it.title;document.getElementById('promptSub').textContent='One clear idea. One useful next action.';}
function closePanel(){panel.classList.remove('open');document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));current=null;document.getElementById('nayaState').textContent='Explore your intelligent network';document.getElementById('promptTitle').textContent='You’re in.';document.getElementById('promptSub').textContent='Touch an intelligence object to reveal what it can do.'}
function act(it){if(it.id==='maxess'){window.location.href='https://aiscore.nayanet.app/';return}if(it.id==='challenge'){showToast('5-Day Challenge integration point — journey begins here.');return}if(it.id==='identity'){showToast('Smart Identity is ready to become your network identity.');return}if(it.id==='chain'){animateFlow(it.flow);return}if(it.id==='compound'){animateFlow(it.flow);return}if(it.id==='notes'){showToast('Smart Note capture is the next action in this experience.');return}if(it.id==='power'){showToast('Naya Power is the intelligent operating layer.');return}showToast(`${it.title} revealed.`)}
function animateFlow(flow){const el=document.getElementById('flow');el.innerHTML='';flow.forEach((x,i)=>setTimeout(()=>{const s=document.createElement('span');s.textContent=x;s.style.opacity='0';s.style.transform='translateY(6px)';el.appendChild(s);requestAnimationFrame(()=>{s.style.transition='.4s ease';s.style.opacity='1';s.style.transform='none'})},i*320))}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2600)}
function toggleMenu(){menu.classList.toggle('open');panel.classList.remove('open')}
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='close')closePanel();if(a==='plus')toggleMenu();if(a==='naya'){closePanel();menu.classList.remove('open');showToast('Naya is at the center. Explore the field.')}if(a==='maxess'){window.location.href='https://aiscore.nayanet.app/'}if(a==='challenge'){openItem('challenge')}}));
document.querySelectorAll('[data-utility]').forEach(b=>b.addEventListener('click',()=>{const map={identity:'identity',spaces:'spaces',notes:'notes',network:'network',privacy:'laws'};if(map[b.dataset.utility])openItem(map[b.dataset.utility]);else showToast('Install NayaNET from your browser menu when supported.');}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();menu.classList.remove('open')}});
let name=new URLSearchParams(location.search).get('name')||sessionStorage.getItem('nayanetName');if(name){document.getElementById('identity').textContent=`WELCOME, ${name}`;document.getElementById('promptTitle').textContent=`Welcome, ${name}.`;sessionStorage.setItem('nayanetName',name)}
</script>
</body>
</html>
