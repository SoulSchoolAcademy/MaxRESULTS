<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020207">
  <meta name="color-scheme" content="dark">
  <title>NayaNET — Create. Connect. Grow with US.</title>
  <meta name="description" content="Welcome to NayaNET — the intelligent network where humanity and AI learn, create and grow together.">
  <link rel="stylesheet" href="/nayanet-10-experience.css">
  <link rel="stylesheet" href="/nayanet-front-door-overhaul.css">
  <link rel="stylesheet" href="/nayanet-entrance-orbs.css">
</head>
<body>
  <div class="cosmos" aria-hidden="true"><div class="cosmic-noise"></div><div class="cosmic-field"></div><div class="nebula nebula-a"></div><div class="nebula nebula-b"></div><div class="nebula nebula-c"></div><div class="starfield" id="starfield"></div></div>
  <main id="app">
    <section id="frontDoor" class="threshold standalone-entrance" aria-label="Enter NayaNET">
      <header class="threshold-bar"><button class="brand-lockup" type="button" aria-label="NayaNET home"><span class="brand-symbol">N</span><span><strong>NayaNET</strong><small>THE INTELLIGENT NETWORK</small></span></button><div class="threshold-status"><i></i><span>NETWORK ONLINE</span><b>PRIVATE BY DEFAULT</b></div></header>
      <div class="threshold-stage">
        <div class="threshold-naya" aria-hidden="true"><span class="threshold-naya-aura"></span><span class="threshold-naya-ring threshold-naya-ring-a"></span><span class="threshold-naya-ring threshold-naya-ring-b"></span><span class="threshold-naya-core"><i></i></span></div>
        <div class="threshold-copy">
          <div class="threshold-eyebrow">WELCOME TO NayaNET</div>
          <h1>NayaNET</h1>
          <p class="threshold-lead"><strong>Learn. Create. Grow with US.</strong><br>Humanity + AI, together.</p>
          <div class="threshold-invitation">Experience exceptional excellence.</div>
          <form id="entryForm" class="identity-portal"><div class="portal-label"><span>YOUR FIRST CONNECTION</span><b>SMART ID</b></div><div class="portal-input"><div class="portal-prefix" aria-hidden="true"><i></i><span>naya/</span></div><input id="nameInput" name="name" autocomplete="name" maxlength="80" placeholder="Enter your name" required aria-label="Enter your name"><button type="submit" aria-label="Enter NayaNET" disabled aria-disabled="true">ENTER NAYANET <span>↗</span></button></div><div class="portal-foot"><span><i></i> No account wall. Just enter.</span><b>Your intelligence stays yours.</b></div></form>
        </div>
      </div>
      <nav class="threshold-doors" aria-label="NayaNET intelligent doors"><button type="button" data-preview="naya" aria-label="Smart Name"><strong>SMART NAME</strong></button><button type="button" data-preview="brain" aria-label="Smart Link"><strong>SMART LINK</strong></button><button type="button" data-preview="identity" aria-label="Smart Identity"><strong>SMART IDENTITY</strong></button><button type="button" data-preview="player" aria-label="Naya Power Player"><strong>NAYA POWER PLAYER</strong></button><button type="button" data-preview="network" aria-label="Smart Brain Network"><strong>SMART BRAIN NETWORK</strong></button></nav>
    </section>
  </main>
  <script src="/nayanet-entrance.js"></script>
</body>
</html>
