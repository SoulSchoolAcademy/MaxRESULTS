<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020207">
  <meta name="color-scheme" content="dark">
  <title>NayaNET — Enter</title>
  <meta name="description" content="Welcome to NayaNET — a private, new intelligent network where humans and AI learn, create and grow together.">
  <link rel="stylesheet" href="/nayanet-10-experience.css">
  <link rel="stylesheet" href="/nayanet-front-door-overhaul.css">
  <link rel="stylesheet" href="/nayanet-entrance-page.css">
  <link rel="stylesheet" href="/nayanet-front-door-north-star-final.css">
</head>
<body>
  <div class="cosmos" aria-hidden="true"><div class="cosmic-noise"></div><div class="cosmic-field"></div><div class="nebula nebula-a"></div><div class="nebula nebula-b"></div><div class="nebula nebula-c"></div><div class="starfield" id="starfield"></div></div>
  <main id="app">
    <section id="frontDoor" class="threshold standalone-entrance north-star-front-door" aria-label="Enter NayaNET">
      <header class="threshold-bar">
        <button class="brand-lockup" type="button" aria-label="NayaNET home"><span class="brand-symbol">N</span><span><strong>NayaNET</strong><small>THE INTELLIGENT NETWORK</small></span></button>
        <div class="threshold-status" aria-label="Private network online"><i aria-hidden="true"></i><span>PRIVATE • SECURE</span><b>PRIVATE BY DEFAULT</b></div>
      </header>
      <div class="threshold-stage">
        <div class="threshold-naya" aria-hidden="true"><span class="threshold-naya-aura"></span><span class="threshold-naya-ring threshold-naya-ring-a"></span><span class="threshold-naya-ring threshold-naya-ring-b"></span><span class="threshold-naya-core"><i></i></span></div>
        <div class="threshold-copy">
          <div class="threshold-eyebrow">WELCOME TO NayaNET</div>
          <h1>NayaNET</h1>
          <p class="threshold-lead"><strong>Learn. Create. Grow. Together.</strong><br>A private, new intelligent network.</p>
          <form id="entryForm" class="identity-portal" novalidate>
            <div class="portal-input">
              <div class="portal-prefix" aria-hidden="true"><i></i><span>naya/</span></div>
              <input id="nameInput" name="name" autocomplete="name" maxlength="80" placeholder="Enter your name" required aria-label="Enter your name">
              <button type="submit" aria-label="Enter NayaNET" disabled aria-disabled="true">ENTER NAYANET <span>↗</span></button>
            </div>
          </form>
        </div>
      </div>
      <div class="ns-footer" aria-hidden="true"><span>PRIVATE</span><b>INTELLIGENT</b><span>BY DESIGN</span></div>
    </section>
  </main>
  <script src="/nayanet-entrance.js"></script>
</body>
</html>
