<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020207">
  <meta name="color-scheme" content="dark">
  <title>NayaNET — Create. Connect. Grow with US.</title>
  <meta name="description" content="Welcome to NayaNET — a private intelligent network where humanity and AI learn, create and grow together.">
  <link rel="stylesheet" href="/nayanet-10-experience.css">
  <link rel="stylesheet" href="/nayanet-front-door-overhaul.css">
  <link rel="stylesheet" href="/nayanet-entrance-page.css">
</head>
<body>
  <div class="cosmos" aria-hidden="true"><div class="cosmic-noise"></div><div class="cosmic-field"></div><div class="nebula nebula-a"></div><div class="nebula nebula-b"></div><div class="nebula nebula-c"></div><div class="starfield" id="starfield"></div></div>
  <main id="app">
    <section id="frontDoor" class="threshold standalone-entrance" aria-label="Enter NayaNET">
      <div class="entrance-atmosphere" aria-hidden="true"><span class="atmosphere-orbit orbit-a"></span><span class="atmosphere-orbit orbit-b"></span><span class="atmosphere-orbit orbit-c"></span><span class="atmosphere-particle particle-a"></span><span class="atmosphere-particle particle-b"></span><span class="atmosphere-particle particle-c"></span></div>
      <div class="threshold-stage">
        <div class="threshold-naya" aria-hidden="true"><span class="threshold-naya-aura"></span><span class="threshold-naya-ring threshold-naya-ring-a"></span><span class="threshold-naya-ring threshold-naya-ring-b"></span><span class="threshold-naya-core"><i></i></span></div>
        <div class="threshold-copy">
          <div class="threshold-eyebrow">WELCOME TO NayaNET</div>
          <h1>NayaNET</h1>
          <p class="threshold-lead"><strong>Learn. Create. Grow. Together.</strong><span>A private, new intelligent network.</span></p>
          <form id="entryForm" class="identity-portal">
            <div class="portal-input">
              <span class="portal-glint" aria-hidden="true"></span>
              <div class="portal-prefix" aria-hidden="true"><i></i></div>
              <input id="nameInput" name="name" autocomplete="name" maxlength="80" placeholder="Your name" required aria-label="Your name">
              <button type="submit" aria-label="Enter NayaNET" disabled aria-disabled="true"><span class="enter-label">ENTER NAYANET</span><span class="enter-arrow" aria-hidden="true">→</span></button>
            </div>
            <div class="portal-signal" aria-live="polite"><span><i></i> PRIVATE BY DEFAULT</span><b>IDENTITY READY</b></div>
          </form>
        </div>
      </div>
    </section>
  </main>
  <script src="/nayanet-entrance.js"></script>
</body>
</html>
