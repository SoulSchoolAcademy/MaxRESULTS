name: Build full AIScore Human V3
on:
  push:
    branches: [feat/aiscore-clean-v1]
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message != 'build: full AIScore human V3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transform existing complete V2 surgically
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          src=Path('AIScoreMAXESS-CLEAN-V2-HUMANIZED.html')
          out=Path('AIScoreMAXESS-CLEAN-V3-HUMAN-NAYA-RESULTS.html')
          html=src.read_text(encoding='utf-8')
          css=r'''
          .dialog{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:24px;background:rgba(8,3,18,.74);backdrop-filter:blur(18px)}
          .dialog.open{display:grid;animation:nayaFade .32s ease both}
          .dialog-card{position:relative;width:min(820px,94vw);max-height:min(760px,90vh);overflow:auto;padding:76px 58px 48px;text-align:left;border:1px solid rgba(221,199,255,.34);border-radius:46px;background:radial-gradient(circle at 86% 5%,rgba(226,203,255,.24),transparent 23%),radial-gradient(circle at 12% 100%,rgba(108,39,188,.32),transparent 44%),linear-gradient(145deg,#54227f 0%,#35145f 52%,#200b3d 100%);box-shadow:0 48px 130px rgba(0,0,0,.72),0 0 100px rgba(119,55,216,.28),inset 0 1px 0 rgba(255,255,255,.16);isolation:isolate}
          .dialog-card:before{content:"";position:absolute;inset:1px;border-radius:45px;background:linear-gradient(135deg,rgba(255,255,255,.09),transparent 30%,transparent 70%,rgba(255,255,255,.04));pointer-events:none}
          .naya-presence{position:absolute;right:28px;top:-82px;z-index:4}
          .presence-orb{width:176px;height:176px;border-radius:50%;overflow:hidden;background:#321252;border:4px solid rgba(255,255,255,.96);box-shadow:0 22px 55px rgba(0,0,0,.48),0 0 70px rgba(222,190,255,.32),inset 0 0 0 1px rgba(255,255,255,.18);position:relative}
          .presence-orb:before{content:"";position:absolute;inset:0;background:url('https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg') center top/cover no-repeat}
          .presence-orb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 58%,rgba(25,7,45,.15));pointer-events:none}
          .presence-copy{display:none}
          .dialog-kicker{display:none}
          .dialog-title{position:relative;z-index:2;margin:0 190px 0 0;color:#fff;font-size:clamp(38px,5vw,58px);line-height:1.01;font-weight:850;letter-spacing:-.05em}
          .dialog-body{position:relative;z-index:2;max-width:650px;margin:22px 0 0;color:#f8f1ff;font-size:clamp(17px,2vw,21px);line-height:1.58;font-weight:520;letter-spacing:-.01em}
          .dialog-body.welcome-copy p{margin:0 0 13px}.dialog-body.welcome-copy p:last-child{margin-bottom:0}
          .dialog-actions{position:relative;z-index:2;display:flex;align-items:center;gap:12px;margin-top:34px;flex-wrap:wrap}
          .dialog-btn{min-height:58px;padding:0 28px;border-radius:19px;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.11);color:#fff;font-weight:900;letter-spacing:.01em;cursor:pointer;box-shadow:0 14px 34px rgba(22,3,40,.28),inset 0 1px 0 rgba(255,255,255,.13);transition:transform .2s ease,background .2s ease,box-shadow .2s ease}
          .dialog-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.17);box-shadow:0 18px 42px rgba(22,3,40,.34),0 0 38px rgba(220,184,255,.18)}
          .dialog-btn.secondary{background:#fff;color:#3b155d;border-color:#fff}.dialog-btn.secondary:hover{background:#fff;color:#2b0b46}
          .dialog-btn.is-speaking{box-shadow:0 0 42px rgba(224,192,255,.34)}
          .naya-btn{overflow:hidden}.naya-orb{background:#321252 url('https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg') center top/cover no-repeat;border:1px solid rgba(255,255,255,.9)}.naya-orb:after{display:none}
          @keyframes nayaFade{from{opacity:0;transform:scale(.985) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
          @media(max-width:760px){.dialog{padding:16px}.dialog-card{width:min(620px,96vw);max-height:92vh;padding:108px 24px 28px;border-radius:34px}.naya-presence{right:18px;top:-60px}.presence-orb{width:132px;height:132px}.dialog-title{margin:0;font-size:clamp(34px,10vw,47px)}.dialog-body{font-size:16px;line-height:1.55;margin-top:18px}.dialog-actions{flex-direction:column;align-items:stretch;margin-top:26px}.dialog-btn{width:100%}}
          @media(max-width:420px){.dialog-card{padding:92px 20px 24px}.naya-presence{right:14px;top:-48px}.presence-orb{width:106px;height:106px}.dialog-title{font-size:35px}.dialog-body{font-size:15px}}
          @media(prefers-reduced-motion:reduce){.dialog.open{animation:none!important}}
          '''
          pat=re.compile(r'\.dialog\{.*?\.dialog-btn\.is-speaking\{[^}]*\}',re.S)
          if not pat.search(html): raise SystemExit('Naya dialog CSS not found; refusing unsafe edit')
          html=pat.sub(css.strip(),html,count=1)
          markup=re.compile(r'<div class="dialog" id="nayaDialog".*?</div>\s*<script>',re.S)
          replacement='''<div class="dialog" id="nayaDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogBody"><div class="dialog-card"><div class="naya-presence"><div class="presence-orb" id="presenceOrb" role="img" aria-label="Naya portrait"></div></div><div class="dialog-kicker" id="dialogKicker">DIRECTION · QUESTION 1</div><h2 class="dialog-title" id="dialogTitle">I'm here.</h2><div class="dialog-body" id="dialogBody"></div><div class="dialog-actions"><button class="dialog-btn" id="playNaya" type="button">PLAY NAYA <span class="arrow">▶</span></button><button class="dialog-btn secondary" id="closeNaya" type="button">LET'S GO <span class="arrow">→</span></button></div></div></div><script>'''
          if not markup.search(html): raise SystemExit('Naya dialog markup not found; refusing unsafe edit')
          html=markup.sub(replacement,html,count=1)
          html=html.replace("const target='https://results.nayanet.xyz/';const url=target+'#maxess-result='+payload;", "const target='https://results.nayanet.app/';const url=target+'?result='+encodeURIComponent(payload)+'#maxess-result='+payload;")
          html=html.replace("window.MAXESS_CLEAN_V2_HUMANIZED=true;window.MAXESS_RESULT_TARGET='https://results.nayanet.xyz/';window.NAYA_WELCOME_V2=true;", "window.MAXESS_CLEAN_V3_HUMAN_NAYA_RESULTS=true;window.MAXESS_RESULT_TARGET='https://results.nayanet.app/';window.NAYA_WELCOME_V3=true;")
          html=html.replace("$('dialogTitle').textContent=\"Hi, I'm Naya.\";", "$('dialogTitle').textContent=\"I'm here.\";")
          html=html.replace("$('dialogTitle').textContent=\"Here's what we're really looking at.\";", "$('dialogTitle').textContent=\"Let's look at this together.\";")
          html=html.replace("<p>Let's take a look.</p>", "<p>Let's look at this together.</p>")
          html=html.replace("audio:{overallReportId:NAYA_AUDIO_REPORT_SELECTION[result.masteryBand],overallReportUrl:NAYA_AUDIO_REPORTS[result.masteryBand]||null}}}", "audio:{overallReportId:NAYA_AUDIO_REPORT_SELECTION[result.masteryBand],overallReportUrl:NAYA_AUDIO_REPORTS[result.masteryBand]||null},personalization:{overallScore:result.overallScore,masteryBand:result.masteryBand,strongestDimension:{id:so.strongest.id,name:so.strongest.name,score:so.strongest.score},opportunityDimension:{id:so.opportunity.id,name:so.opportunity.name,score:so.opportunity.score},interests:Array.from(state.interests)},nayaNarrative:{overall:NARRATIVES[result.masteryBand].overall}}}")
          html=html.replace("const target='https://results.nayanet.xyz/';", "const target='https://results.nayanet.app/';")
          out.write_text(html,encoding='utf-8')
          print('FULL V3',len(html.splitlines()),len(html.encode()),'bytes')
          PY
      - name: Verify complete artifact
        run: |
          test -s AIScoreMAXESS-CLEAN-V3-HUMAN-NAYA-RESULTS.html
          grep -q "Naya%20Profile%206.jpg" AIScoreMAXESS-CLEAN-V3-HUMAN-NAYA-RESULTS.html
          grep -q "results.nayanet.app" AIScoreMAXESS-CLEAN-V3-HUMAN-NAYA-RESULTS.html
          grep -q "MAXESS_RESULT_V1" AIScoreMAXESS-CLEAN-V3-HUMAN-NAYA-RESULTS.html
          grep -q "personalization" AIScoreMAXESS-CLEAN-V3-HUMAN-NAYA-RESULTS.html
          grep -q "nayaNarrative" AIScoreMAXESS-CLEAN-V3-HUMAN-NAYA-RESULTS.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('AIScoreMAXESS-CLEAN-V3-HUMAN-NAYA-RESULTS.html').read_text()
          assert s.count('<html')==1 and s.count('</html>')==1
          assert s.count('<script>')==1 and s.count('</script>')==1
          assert 'results.nayanet.xyz' not in s
          assert len(s)>49000
          print('VERIFIED',len(s.splitlines()),len(s.encode()),'bytes')
          PY
      - name: Commit full V3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AIScoreMAXESS-CLEAN-V3-HUMAN-NAYA-RESULTS.html
          git commit -m "build: full AIScore human V3" || exit 0
          git push
