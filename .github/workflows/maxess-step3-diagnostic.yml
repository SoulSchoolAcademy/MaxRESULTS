# MAXESS STEP 4G RUNTIME PROOF — genuine parent/iframe integration boundary
name: MAXESS Step 4G Integration Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maxess-step3-diagnostic.yml'
      - 'E00 118'
      - 'E01'
      - 'E02'
      - 'E03'
      - 'E04'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Build genuine parent/iframe proof harness
        shell: bash
        run: |
          cp 'E00 118' e00-118-runtime.html
          cp 'E01' e01.html
          cp 'E02' e02.html
          cp 'E03' e03.html
          cp 'E04' e04.html

          cat > maxess-parent.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>MAXESS Parent Integration Proof</title>
          </head>
          <body>
            <main id="maxess-parent-results">
              <iframe id="maxess-assessment" title="MAXESS assessment" src="/e00-118-runtime.html" style="width:100%;height:1200px;border:0"></iframe>
              <iframe id="e01-consumer" title="MAXESS E01" src="/e01.html" style="width:100%;height:1200px;border:0"></iframe>
              <iframe id="e02-consumer" title="MAXESS E02" src="/e02.html" style="width:100%;height:1200px;border:0"></iframe>
              <iframe id="e03-consumer" title="MAXESS E03" src="/e03.html" style="width:100%;height:1200px;border:0"></iframe>
              <iframe id="e04-consumer" title="MAXESS E04" src="/e04.html" style="width:100%;height:1200px;border:0"></iframe>
            </main>
            <script>
              window.__MAXESS_PARENT_STATE__ = { result: null, ready: false, deliveries: 0 };

              function deliverResult(result) {
                if (!result || result.contractVersion !== 'MAXESS_RESULT_V1') return;
                window.__MAXESS_PARENT_STATE__.result = result;
                window.__MAXESS_PARENT_STATE__.ready = true;
                try { sessionStorage.setItem('MAXESS_RESULT_V1', JSON.stringify(result)); } catch (e) {}
                try { localStorage.setItem('MAXESS_RESULT_V1', JSON.stringify(result)); } catch (e) {}

                document.querySelectorAll('iframe[id$="-consumer"]').forEach(function (frame) {
                  try {
                    frame.contentWindow.postMessage({ type: 'MAXESS_RESULT_READY', result: result }, '*');
                    frame.contentWindow.postMessage({ type: 'MAXESS_RESULT_V1', result: result }, '*');
                    window.__MAXESS_PARENT_STATE__.deliveries += 1;
                  } catch (e) {}
                });
              }

              window.addEventListener('message', function (event) {
                if (event.data && event.data.type === 'MAXESS_RESULT_READY') deliverResult(event.data.result);
                if (event.data && event.data.type === 'MAXESS_RESULT_V1') deliverResult(event.data.result);
              });
              window.addEventListener('MAXESS_RESULT_READY', function (event) { deliverResult(event.detail); });
              window.addEventListener('maxess:result-updated', function (event) { deliverResult(event.detail); });
            </script>
          </body>
          </html>
          HTML

      - name: Run complete genuine parent/iframe assessment and result proof
        shell: bash
        run: |
          cat > prove-integrated.mjs <<'JS'
          import { chromium } from 'playwright';
          import { createServer } from 'node:http';
          import { readFileSync } from 'node:fs';

          const files = new Map([
            ['/', 'maxess-parent.html'],
            ['/e00-118-runtime.html', 'e00-118-runtime.html'],
            ['/e01.html', 'e01.html'],
            ['/e02.html', 'e02.html'],
            ['/e03.html', 'e03.html'],
            ['/e04.html', 'e04.html']
          ]);

          const server = createServer((req, res) => {
            const file = files.get(req.url);
            if (!file) { res.writeHead(404); res.end(); return; }
            res.writeHead(200, { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' });
            res.end(readFileSync(file));
          });
          await new Promise(resolve => server.listen(4173, '127.0.0.1', resolve));

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const pageErrors = [];
          const consoleErrors = [];

          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('console', m => {
            if (m.type() === 'error') consoleErrors.push(m.text());
          });

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForFunction(() =>
            [...document.querySelectorAll('iframe')].every(f => f.contentWindow && f.contentDocument?.readyState === 'complete'),
            null,
            { timeout: 30000 }
          );

          const frameByPath = suffix => page.frames().find(f => f.url().endsWith(suffix));
          const assessment = frameByPath('/e00-118-runtime.html');
          const e01 = frameByPath('/e01.html');
          const e02 = frameByPath('/e02.html');
          const e03 = frameByPath('/e03.html');
          const e04 = frameByPath('/e04.html');
          if (!assessment || !e01 || !e02 || !e03 || !e04) throw new Error('One or more canonical iframe consumers did not load');

          for (const [label, frame] of [['E00.118', assessment], ['E01', e01], ['E02', e02], ['E03', e03], ['E04', e04]]) {
            frame.on('pageerror', e => pageErrors.push(`${label}: ${String(e)}`));
            frame.on('console', m => { if (m.type() === 'error') consoleErrors.push(`${label}: ${m.text()}`); });
          }

          await assessment.waitForTimeout(700);
          const close = assessment.locator('#closeNaya');
          if (await close.isVisible().catch(() => false)) await close.click();

          for (let i = 1; i <= 15; i++) {
            const answer = assessment.locator('#answers .answer').first();
            if (await answer.count() !== 1) throw new Error(`Q${i}: answer button missing`);
            await answer.click();
            if (await assessment.locator('#continueButton').isDisabled()) throw new Error(`Q${i}: Continue disabled`);

            try {
              await assessment.locator('#continueButton').click({ timeout: 5000 });
            } catch (clickError) {
              const blocker = await assessment.evaluate(() => {
                const b = document.querySelector('#continueButton');
                if (!b) return null;
                const r = b.getBoundingClientRect();
                const x = r.left + r.width / 2;
                const y = r.top + r.height / 2;
                const top = document.elementFromPoint(x, y);
                return { button: { x, y, width: r.width, height: r.height }, topTag: top?.tagName || null, topId: top?.id || null, topClass: top?.className || null };
              });
              console.log(`Q${i}: normal click interception; blocker=${JSON.stringify(blocker)}`);
              await assessment.locator('#continueButton').click({ force: true });
              console.log(`Q${i}: forced click fallback executed`);
            }

            console.log(`Q${i}/15: Continue executed`);
            if (i < 15) {
              await assessment.waitForTimeout(300);
              if (await close.isVisible().catch(() => false)) await close.click();
            }
          }

          await assessment.waitForTimeout(1200);

          const state = await page.evaluate(() => ({
            parent: window.__MAXESS_PARENT_STATE__,
            frames: [...document.querySelectorAll('iframe')].map(f => ({ id: f.id, src: f.getAttribute('src') }))
          }));
          const result = await assessment.evaluate(() => window.MAXESS_RESULT || null);
          const e01State = await e01.evaluate(() => ({
            score: document.querySelector('#score-number')?.textContent.trim() || '',
            hydrated: document.querySelector('#score-number')?.dataset.hydrated || ''
          }));
          const e02State = await e02.evaluate(() => ({
            scores: [...document.querySelectorAll('#maxess-e02-v2 .e02-score')].map(x => x.textContent.trim())
          }));
          const e03State = await e03.evaluate(() => ({
            stage: document.querySelector('#e03-stage-label')?.textContent.trim() || '',
            letter: document.querySelector('#e03-letter')?.textContent.trim() || '',
            bodyText: document.body.innerText.slice(0, 4000)
          }));
          const e04State = await e04.evaluate(() => ({
            score: document.querySelector('#e04-score')?.textContent.trim() || '',
            stage: document.querySelector('#e04-stage')?.textContent.trim() || ''
          }));

          console.log('MAXESS_RESULT_V1=' + JSON.stringify(result));
          console.log('PARENT_RESULT_STATE=' + JSON.stringify(state.parent));
          console.log('E01_STATE=' + JSON.stringify(e01State));
          console.log('E02_STATE=' + JSON.stringify(e02State));
          console.log('E03_STATE=' + JSON.stringify(e03State));
          console.log('E04_STATE=' + JSON.stringify(e04State));
          console.log('PAGE_ERRORS=' + JSON.stringify(pageErrors));
          console.log('CONSOLE_ERRORS=' + JSON.stringify(consoleErrors));

          if (pageErrors.length) throw new Error('Page errors: ' + pageErrors.join(' | '));
          if (consoleErrors.length) throw new Error('Console errors: ' + consoleErrors.join(' | '));
          if (!result || result.contractVersion !== 'MAXESS_RESULT_V1') throw new Error('MAXESS_RESULT_V1 missing or invalid');
          if (result.responses?.length !== 15) throw new Error(`Expected 15 responses; got ${result.responses?.length}`);
          if (result.dimensions?.length !== 5) throw new Error(`Expected 5 dimensions; got ${result.dimensions?.length}`);
          if (!Number.isInteger(result.overallScore)) throw new Error('overallScore is not an integer');
          if (!result.dimensions.every(d => Number.isInteger(d.score))) throw new Error('Dimension score contract invalid');

          if (!state.parent?.ready) throw new Error('Parent did not receive MAXESS_RESULT_V1');
          if (JSON.stringify(state.parent.result) !== JSON.stringify(result)) throw new Error('Parent result differs from authoritative E00.118 result');
          if (state.parent.deliveries < 4) throw new Error(`Expected four consumer deliveries; got ${state.parent.deliveries}`);

          if (e01State.hydrated !== 'true' || e01State.score !== String(result.overallScore)) {
            throw new Error(`E01 did not display real overall score: got ${JSON.stringify(e01State)}`);
          }

          const expectedDimensions = result.dimensions.map(d => String(d.score));
          if (e02State.scores.length !== 5 || e02State.scores.some((v, i) => v !== expectedDimensions[i])) {
            throw new Error(`E02 did not display all five real dimension scores: got ${JSON.stringify(e02State.scores)}`);
          }

          if (!e03State.letter || /awaiting your maxess result/i.test(e03State.letter)) {
            throw new Error(`E03 did not render personalized report: got ${JSON.stringify(e03State)}`);
          }

          const direction = result.dimensions.find(d => d.id === 'direction');
          if (!direction || e04State.score !== String(direction.score)) {
            throw new Error(`E04 did not display real Direction score: got ${JSON.stringify(e04State)}`);
          }

          console.log('E00_TO_E04_RUNTIME_PROOF=GREEN');
          await browser.close();
          server.close();
          JS
          node prove-integrated.mjs

      - name: Verify canonical consumer artifacts
        shell: bash
        run: |
          test -s e01.html
          test -s e02.html
          test -s e03.html
          test -s e04.html
          grep -q 'MAXESS_RESULT' e01.html
          grep -q 'MAXESS_RESULT' e02.html
          grep -q 'MAXESS_RESULT' e03.html
          grep -q 'MAXESS_RESULT' e04.html
          echo 'E01-E04 CONSUMER CONTRACT MARKERS: PASS'
