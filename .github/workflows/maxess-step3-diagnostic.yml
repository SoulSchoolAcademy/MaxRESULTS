name: MAXESS Step 3 Diagnostic

on:
  push:
    paths:
      - '.github/workflows/maxess-step3-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose canonical E00 118
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('E00 118').read_text(encoding='utf-8')
          print('BYTES',len(s.encode()))
          print('LINES',len(s.splitlines()))
          for label,pos in [('SCORE-GUARD',s.find('Object.keys(S)')-700),('VALIDATE',s.find('function validate(')-500),('S-DEFINITION',s.find('const S=')),('D-DEFINITION',s.find('const D=')),('CONTINUE',s.find("$('continueButton').addEventListener"))]:
              print('\n===== '+label+' @ '+str(pos)+' =====')
              if pos>=0: print(s[pos:pos+5000])
          print('\n===== KEY MARKERS =====')
          for m in ['if(!Array.isArray(S)||Object.keys(S).length!==15)','if(!S||typeof S!==\'object\'','window.MAXESS_RESULT_V1','sessionStorage.setItem','MAXESS_RESULT_READY','closest(\'#continueButton\')','addEventListener(\'click\'']:
              print(m,s.find(m))
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          print('SCRIPT_BLOCKS',len(scripts))
          for i,js in enumerate(scripts):
              Path(f'/tmp/e00_118_script_{i}.js').write_text(js,encoding='utf-8')
              print('SCRIPT',i,'BYTES',len(js.encode()))
          PY
          for f in /tmp/e00_118_script_*.js; do [ -f "$f" ] || continue; echo "NODE CHECK $f"; node --check "$f"; done
