name: MAXESS Step 3 Diagnostic

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static boundary diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('E00 118').read_text(encoding='utf-8')
          for label,needle in [('NEXT','function next('),('SAVE','function save('),('PUBLISH','function publish('),('BUILD','function buildResult('),('VALIDATE','function validate(')]:
              p=s.find(needle)
              print(f'===== {label} @ {p} =====')
              if p>=0: print(s[max(0,p-300):p+7000])
          print('CONTINUE',s[s.find("$('continueButton').addEventListener")-200:s.find("$('continueButton').addEventListener")+700])
          print('MARKERS')
          for m in ['Object.keys(S)','window.MAXESS_RESULT_V1','sessionStorage.setItem','MAXESS_RESULT_READY','MAXESS_AISCORE']:
              print(m,s.find(m))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Execute complete 15-question MAXESS assessment
        shell: bash
        run: |
          cp 'E00 118' e00-118-runtime.html
          cat > prove-maxess.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors=[]; const consoleErrors=[];
          page.on('pageerror', e=>errors.push(String(e)));
          page.on('console', m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
          await page.goto(`file://${process.cwd()}/e00-118-runtime.html`);
          await page.waitForTimeout(500);
          const close=page.locator('#closeNaya');
          if(await close.isVisible().catch(()=>false)) await close.click();
          for(let i=1;i<=15;i++){
            const answer=page.locator('#answers .answer').first();
            if(await answer.count()!==1) throw new Error(`Q${i}: answer button missing`);
            await answer.click();
            const disabled=await page.locator('#continueButton').isDisabled();
            console.log(`Q${i}: selected=true continueDisabled=${disabled}`);
            if(disabled) throw new Error(`Q${i}: Continue remained disabled after answer selection`);
            await page.locator('#continueButton').click();
            if(i<15){ await page.waitForTimeout(250); if(await close.isVisible().catch(()=>false)) await close.click(); }
          }
          await page.waitForTimeout(500);
          const result=await page.evaluate(()=>({result:window.MAXESS_RESULT||null,localScore:document.querySelector('#localOverallScore')?.textContent||'',localResultsActive:document.querySelector('#localResults')?.classList.contains('active')||false,status:document.querySelector('#localResultsStatus')?.textContent||'',dimensions:document.querySelectorAll('#localDimensions .dimension-card').length}));
          console.log('RESULT_JSON',JSON.stringify(result)); console.log('PAGE_ERRORS',JSON.stringify(errors)); console.log('CONSOLE_ERRORS',JSON.stringify(consoleErrors));
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
          if(!result.result || result.result.contractVersion!=='MAXESS_RESULT_V1') throw new Error('No valid window.MAXESS_RESULT');
          if(result.result.responses?.length!==15) throw new Error('Result responses != 15');
          if(result.result.dimensions?.length!==5) throw new Error('Result dimensions != 5');
          if(!Number.isInteger(result.result.overallScore)) throw new Error('overallScore not integer');
          if(!result.localResultsActive) throw new Error('Local Results not active');
          if(result.localScore!==String(result.result.overallScore)) throw new Error('Local score mismatch');
          if(result.dimensions!==5) throw new Error('Local dimensions != 5');
          await browser.close();
          JS
          node prove-maxess.mjs
      - name: Execute integrated E00 to E04 handoff proof
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def body(path):
              s=Path(path).read_text(encoding='utf-8')
              m=re.search(r'<body[^>]*>([\\s\\S]*?)</body>',s,re.I)
              return m.group(1) if m else s
          parts=[body('E00 118'),body('E01'),body('E02'),body('E03'),body('E04')]
          Path('maxess-integrated.html').write_text('<!doctype html><html><head><meta charset="utf-8"><title>MAXESS integrated proof</title></head><body>'+''.join(parts)+'</body></html>',encoding='utf-8')
          PY
          cat > prove-integrated.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          await page.route('**/*',async route=>{const r=route.request();if(['image','font','media'].includes(r.resourceType()))return route.abort();return route.continue();});
          const errors=[]; const consoleErrors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          await page.goto(`file://${process.cwd()}/maxess-integrated.html`,{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(700);
          const close=page.locator('#closeNaya');
          if(await close.isVisible().catch(()=>false)) await close.click();
          for(let i=1;i<=15;i++){
            await page.locator('#answers .answer').first().click();
            if(await page.locator('#continueButton').isDisabled()) throw new Error(`Integrated Q${i}: Continue disabled`);
            await page.locator('#continueButton').click();
            if(i<15){await page.waitForTimeout(300);if(await close.isVisible().catch(()=>false))await close.click();}
          }
          await page.waitForTimeout(700);
          const state=await page.evaluate(()=>({
            result:window.MAXESS_RESULT||null,
            e01:document.querySelector('#score-number')?.textContent||'',
            e01Hydrated:document.querySelector('#score-number')?.dataset.hydrated||'',
            e02:[...document.querySelectorAll('#maxess-e02-v2 .e02-score')].map(x=>x.textContent.trim()),
            e03Stage:document.querySelector('#e03-stage-label')?.textContent||'',
            e03Letter:document.querySelector('#e03-letter')?.textContent.trim()||'',
            e04:document.querySelector('#e04-score')?.textContent||'',
            e04Stage:document.querySelector('#e04-stage')?.textContent.trim()||''
          }));
          console.log('INTEGRATED_RESULT',JSON.stringify(state));
          console.log('INTEGRATED_PAGE_ERRORS',JSON.stringify(errors));
          console.log('INTEGRATED_CONSOLE_ERRORS',JSON.stringify(consoleErrors));
          if(errors.length)throw new Error('Integrated page errors: '+errors.join(' | '));
          const r=state.result;
          if(!r||r.contractVersion!=='MAXESS_RESULT_V1'||r.responses?.length!==15||r.dimensions?.length!==5)throw new Error('Integrated result contract invalid');
          if(state.e01Hydrated!=='true'||state.e01!==String(r.overallScore))throw new Error('E01 did not display real overall score');
          const expected=r.dimensions.map(d=>String(d.score));
          if(state.e02.length!==5||state.e02.some((v,i)=>v!==expected[i]))throw new Error('E02 did not display all five real dimension scores');
          if(!state.e03Letter||/awaiting your maxess result/i.test(state.e03Letter))throw new Error('E03 did not render personalized report');
          const direction=r.dimensions.find(d=>d.id==='direction');
          if(!direction||state.e04!==String(direction.score))throw new Error('E04 did not display real Direction score');
          console.log('INTEGRATED_ASSERTIONS=GREEN');
          await browser.close();
          JS
          node prove-integrated.mjs
