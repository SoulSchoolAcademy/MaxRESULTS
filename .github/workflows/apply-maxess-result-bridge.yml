name: Apply MAXESS Assessment Results Bridge

on:
  push:
    branches:
      - main
    paths:
      - 'tools/execute_maxess_result_bridge.py'
      - '.github/workflows/apply-maxess-result-bridge.yml'

permissions:
  contents: write

concurrency:
  group: maxess-result-bridge
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Establish baseline
        run: |
          test -f 'AIScoreMAXESS code'
          git rev-parse HEAD > bridge-baseline-commit.txt
          git rev-parse HEAD:'AIScoreMAXESS code' > bridge-baseline-blob.txt
          wc -c 'AIScoreMAXESS code'

      - name: Apply deterministic bridge mutation
        run: python tools/execute_maxess_result_bridge.py

      - name: Static bridge QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('AIScoreMAXESS code')
          s=p.read_text(encoding='utf-8')
          required=[
            'MAXESS_RESULT_BRIDGE_V1',
            'window.MAXESS_RESULT',
            'MAXESS_RESULT_READY',
            'MAXESS_RESULT_V1',
            'results.nayanet.xyz',
            'overallScore',
            'fiveDimensions',
            'strongestCapability',
            'highestLeverageOpportunity',
            'selectedInterests',
            'nayaScript',
            'nayaAudio',
            'LISTEN TO NAYA',
            'Naya-Profile-black-face-zoom.jpg',
            'refusing legacy Results renderer'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing bridge evidence: '+', '.join(missing))
          if s.count('MAXESS_RESULT_BRIDGE_V1') != 1: raise SystemExit('Bridge marker count failed')
          if re.search(r'(^|\\n)(<<<<<<<|=======|>>>>>>>)( |\\n|$)',s): raise SystemExit('Conflict marker detected')
          print('ASSESSMENT BRIDGE STATIC QA: PASS')
          print('bytes:',len(s.encode()))
          print('lines:',len(s.splitlines()))
          PY

      - name: Syntax QA
        run: |
          node --check <(python - <<'PY'
          from pathlib import Path
          import re
          s=Path('AIScoreMAXESS code').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('No script blocks found')
          print('\\n'.join(scripts))
          PY
          )

      - name: Diff proof
        run: |
          git diff --check
          git diff -- 'AIScoreMAXESS code'
          test -n "$(git diff -- 'AIScoreMAXESS code')"

      - name: Commit bridge
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add 'AIScoreMAXESS code'
          git diff --cached --check
          git diff --cached --quiet && { echo 'NO BRIDGE MUTATION DETECTED'; exit 1; }
          git commit -m 'MAXESS assessment → Results bridge [MAXESS_RESULT_V1]'
          git push origin main
