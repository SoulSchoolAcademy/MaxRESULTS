name: V7 restore mail and feed
on:
  workflow_dispatch:
  push:
    paths:
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/.v7-restore-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V7 surgically
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html')
          s=p.read_text(encoding='utf-8')
          marker='NAYA_V7_MAIL_FEED_RESTORE_20260906'
          if marker in s:
              print('already patched')
              raise SystemExit(0)
          # 1) Restore Smart Mail in the sidebar if missing.
          if 'data-page="mail"' not in s:
              nav='''<div class="navlabel">COMMUNICATION</div><nav class="nav"><button data-page="mail"><span class="ico">✉</span>Smart Mail <span class="badge">NEW</span></button></nav>'''
              anchor='<div class="navlabel">SYSTEM</div>'
              if anchor not in s: raise SystemExit('SYSTEM nav anchor missing')
              s=s.replace(anchor,nav+anchor,1)
          # 2) Restore Smart Mail page if missing.
          if 'id="page-mail"' not in s:
              mail='''<section class="page" id="page-mail"><div class="pageHead"><div><div class="eyebrow">PRIVATE NETWORK COMMUNICATION</div><h1>Smart Mail</h1><p>Every mail tab is a real interaction surface — not decorative chrome.</p></div><button class="btn purple" id="composeMail">+ COMPOSE</button></div><section class="mailSurface"><div class="mailLayout"><aside class="mailCol"><div class="mailPad"><div class="mailTitle">MAILBOX</div><div class="mailNav"><button class="mailTab active" data-mailtab="inbox">Inbox <span>0</span></button><button class="mailTab" data-mailtab="sent">Sent <span>0</span></button><button class="mailTab" data-mailtab="drafts">Drafts <span id="draftCount">0</span></button><button class="mailTab" data-mailtab="connections">Connections</button><button class="mailTab" data-mailtab="rooms">Rooms</button><button class="mailTab" data-mailtab="groups">Groups</button><button class="mailTab" data-mailtab="lists">Lists</button></div><div class="alias"><b id="alias">NayaABC123</b><span>Your private NayaNET alias</span></div></div></aside><section class="mailCol mailCenter"><div class="mailCenterHead"><h2 id="mailSectionTitle">Inbox</h2><button class="btn purple small" id="mailAction">COMPOSE</button></div><div id="mailInbox"><div class="empty"><b>Your inbox is clear.</b><span>No messages are fabricated. When a real connection or room exists, its conversation appears here.</span></div></div><div class="mailCompose" id="mailComposer"><div class="eyebrow">NEW MESSAGE</div><h2 style="font-size:22px;letter-spacing:-.04em">Send a private message</h2><input id="mailTo" placeholder="Recipient alias"><textarea id="mailBody" placeholder="Write your message…"></textarea><div class="actions"><button class="btn purple" id="sendMail">SEND MESSAGE</button><button class="btn" id="cancelMail">CANCEL</button></div><div class="state" id="mailState">Text transport is ready at the UI boundary. Server delivery requires the production communication endpoint.</div></div></section><aside class="mailCol"><div class="mailPad"><div class="mailTitle">COMMUNICATION MODES</div><div class="mailKinds"><div class="mailKind">✉ Text · private network</div><div class="mailKind">🎙 Audio · next transport boundary</div><div class="mailKind">◎ 1:1 · mutual connection</div><div class="mailKind">◉ Rooms · 2 → 100+</div><div class="mailKind">▦ Groups · shared learning</div><div class="mailKind">▤ Lists · announcements</div></div><div class="state">External email integration stays outside this native network boundary.</div></div></aside></div></section></section>'''
              anchor='<section class="page" id="page-settings">'
              if anchor not in s: raise SystemExit('settings page anchor missing')
              s=s.replace(anchor,mail+anchor,1)
          # 3) Restore Smart Mail behavior if missing.
          if 'function renderMailTab(' not in s:
              js='''\nconst V7MAILKEY='nayanet_v7_mail_drafts';\nfunction openComposer(){const inbox=document.getElementById('mailInbox'),composer=document.getElementById('mailComposer');if(!inbox||!composer)return;inbox.style.display='none';composer.style.display='block';document.getElementById('mailTo')?.focus()}\nfunction renderMail(){const a=document.getElementById('alias'),d=document.getElementById('draftCount');if(a)a.textContent=load('nayanet_v7_alias','NayaABC123');if(d)d.textContent=load(V7MAILKEY,[]).length}\nfunction renderMailTab(tab){document.querySelectorAll('.mailTab').forEach(b=>b.classList.toggle('active',b.dataset.mailtab===tab));const title=document.getElementById('mailSectionTitle');if(title)title.textContent=tab.charAt(0).toUpperCase()+tab.slice(1);const composer=document.getElementById('mailComposer'),inbox=document.getElementById('mailInbox');if(composer)composer.style.display='none';if(inbox)inbox.style.display='block';if(!inbox)return;if(tab==='inbox')inbox.innerHTML='<div class="empty"><b>Your inbox is clear.</b><span>No messages are fabricated. Real conversations will appear here.</span></div>';else if(tab==='sent')inbox.innerHTML='<div class="empty"><b>Nothing sent yet.</b><span>Messages appear here after a real communication transport succeeds.</span></div>';else if(tab==='drafts'){const d=load(V7MAILKEY,[]);inbox.innerHTML=d.length?d.map(x=>'<div class="thread"><b>'+esc(x.to)+'</b><p>'+esc(x.body)+' · '+x.status+'</p></div>').join(''):'<div class="empty"><b>No drafts.</b><span>Drafts are preserved when delivery is not yet available.</span></div>'}else{const labels={connections:['Connections','Mutual-consent conversations will appear here.'],rooms:['Rooms','Shared rooms for 2 → 100+ people.'],groups:['Groups','Shared learning and working spaces.'],lists:['Lists','Announcements and structured communication.']};const a=labels[tab]||[tab,'This Smart Mail section is ready for its server-backed transport.'];inbox.innerHTML='<div class="empty"><b>'+a[0]+'</b><span>'+a[1]+'</span><button class="btn purple small" style="margin-top:18px" id="mailSectionCompose">OPEN COMPOSER</button></div>';document.getElementById('mailSectionCompose').onclick=openComposer}}\n'''
              s=s.replace('</script>',js+'</script>',1)
          # 4) Move the three beautiful activation cards into a vertical rail; keep them intact.
          css='''<style id="NAYA_V7_LAYOUT_REFINEMENT_20260906">\n#page-home.page.active{display:grid;grid-template-columns:minmax(235px,285px) minmax(0,1fr);column-gap:24px;align-items:start}\n#page-home .homeIntro,#page-home .heroState{grid-column:1/-1}\n#page-home .servicePath{grid-column:1;grid-row:3;grid-template-columns:1fr;gap:12px;margin-bottom:0}\n#page-home .featureBoard{min-height:0;height:auto;padding:21px 19px 18px;border-radius:23px}\n#page-home .powerOrb{width:92px;height:92px;margin:15px auto 14px}\n#page-home .orbCore{width:46px;height:46px}\n#page-home .orbCore span{font-size:18px}\n#page-home .featureBoard h3{font-size:22px}\n#page-home .featureBoard .lead{font-size:11px;min-height:0}\n#page-home .advantage{margin:13px 0;padding:11px 8px}\n#page-home .advantage b{font-size:9px;margin-bottom:4px}\n#page-home .advantage span{font-size:9px}\n#page-home .featureButton{min-height:49px;font-size:10px}\n#page-home .surface{grid-column:2;grid-row:3;min-width:0}\n#page-home .reportStrip{grid-column:2;grid-row:4}\n#page-home .surfaceHeader{padding:20px 22px 17px}\n#page-home .surfaceHeader h2{font-size:22px}\n#page-home .feedRow{padding:17px 22px}\n@media(max-width:1100px){#page-home.page.active{grid-template-columns:1fr 1fr}#page-home .servicePath{grid-column:1;grid-row:3}#page-home .surface{grid-column:2;grid-row:3}#page-home .reportStrip{grid-column:1/-1;grid-row:4}}\n@media(max-width:900px){#page-home.page.active{display:block}#page-home .servicePath{display:grid;grid-template-columns:1fr;margin-bottom:18px}#page-home .surface{margin-top:18px}#page-home .reportStrip{margin-top:18px}}\n</style>\n'''
          s=s.replace('</head>',css+'</head>',1)
          # 5) Add a real-looking, clearly labeled demo Intelligent Block feed to the center without deleting the existing activity surface.
          feed='''<section class="surface" id="naya-v7-intelligent-block-feed"><div class="surfaceHeader"><div><div class="eyebrow">LIVING INTELLIGENCE · DEMO</div><h2>Intelligent Block Feed</h2><p>One subject. Four perspectives. Scroll the intelligence exactly like a social feed — without turning private intelligence into social content.</p></div><button class="btn blue small" data-page="reports">DAILY INTELLIGENCE BRIEFING</button></div><article class="iblock"><div class="iblockTop"><span>8:47 AM · TODAY</span><b>BREAKTHROUGH</b></div><h3>V7 finally feels like an intelligence home, not a dashboard.</h3><div class="iperspectives"><div class="ip human"><strong>HUMAN NOTE</strong><p>I realized the Hub should feel like a living stream of what I am learning, not a collection of tools I have to manage.</p></div><div class="ip naya"><strong>NAYA NOTE</strong><p>The breakthrough is architectural: the user's intelligence becomes the primary object, while tools become pathways around it.</p></div><div class="ip machine"><strong>MACHINE NOTE</strong><p>Event ID: demo-v7-0847 · source: Smart Note · privacy: private · state: locally represented.</p></div><div class="ip feed"><strong>INTELLIGENT FEED</strong><p>Make the intelligence stream the center of the Hub. Preserve the source, perspective, and time so future synthesis can compound it.</p></div></div></article><article class="iblock"><div class="iblockTop"><span>11:47 AM · TODAY</span><b>DECISION</b></div><h3>Keep the beautiful activation path — move it beside the intelligence.</h3><div class="iperspectives"><div class="ip human"><strong>HUMAN NOTE</strong><p>Connect GitHub, Sync Intelligence, and Get Connected are beautiful. They should stay visible without consuming the center feed.</p></div><div class="ip naya"><strong>NAYA NOTE</strong><p>These are activation pathways, not the destination. A side rail keeps them accessible while giving the intelligence room to breathe.</p></div><div class="ip machine"><strong>MACHINE NOTE</strong><p>Event ID: demo-v7-1147 · source: Smart Note · type: decision · status: preserved.</p></div><div class="ip feed"><strong>INTELLIGENT FEED</strong><p>Activation remains one click away; the chronological block stream becomes the primary home surface.</p></div></div></article></section>'''
          ibcss='''<style id="NAYA_V7_INTELLIGENT_BLOCK_DEMO_20260906">\n#naya-v7-intelligent-block-feed{margin-top:0}#naya-v7-intelligent-block-feed .surfaceHeader{align-items:center}.iblock{padding:22px 24px;border-bottom:1px solid var(--line);background:linear-gradient(145deg,#111118,#09090d)}.iblock:last-child{border-bottom:0}.iblockTop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:11px}.iblockTop span{font-size:9px;font-weight:950;letter-spacing:.08em;color:#c8c3ce}.iblockTop b{font-size:8px;color:var(--emerald);letter-spacing:.12em}.iblock h3{font-size:18px;line-height:1.25;letter-spacing:-.035em;margin:0 0 16px}.iperspectives{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.ip{padding:13px;border:1px solid #ffffff15;border-radius:14px;background:#07070a;box-shadow:inset 0 1px #fff2,0 9px 20px #0007}.ip strong{display:block;font-size:8px;letter-spacing:.13em;margin-bottom:7px}.ip p{font-size:10px;line-height:1.55;color:#d4d0d9;margin:0}.ip.human{border-color:#55e39a35}.ip.human strong{color:#55e39a}.ip.naya{border-color:#55b9ee35}.ip.naya strong{color:#55b9ee}.ip.machine{border-color:#6675ff35}.ip.machine strong{color:#6675ff}.ip.feed{border-color:#b27cff35}.ip.feed strong{color:#b27cff}@media(max-width:700px){.iperspectives{grid-template-columns:1fr}.iblock{padding:19px 17px}}\n</style>\n'''
          s=s.replace('</head>',ibcss+'</head>',1)
          # Place demo feed before the existing report strip and keep the old live activity as a secondary surface below it.
          anchor='<div class="reportStrip">'
          if anchor not in s: raise SystemExit('reportStrip anchor missing')
          s=s.replace(anchor,feed+anchor,1)
          # 6) Smart Mail behavior wiring, safely additive.
          wire='''\n<script id="NAYA_V7_MAIL_WIRING_20260906">\ndocument.addEventListener('click',e=>{const mt=e.target.closest('[data-mailtab]');if(mt){renderMailTab(mt.dataset.mailtab);return}});document.getElementById('composeMail')?.addEventListener('click',openComposer);document.getElementById('mailAction')?.addEventListener('click',openComposer);document.getElementById('cancelMail')?.addEventListener('click',()=>{document.getElementById('mailComposer').style.display='none';document.getElementById('mailInbox').style.display='block'});document.getElementById('sendMail')?.addEventListener('click',()=>{const to=document.getElementById('mailTo').value.trim(),body=document.getElementById('mailBody').value.trim(),st=document.getElementById('mailState');if(!to||!body){st.textContent='Recipient and message are required. Nothing was sent.';return}const d=load(V7MAILKEY,[]);d.unshift({id:Date.now(),to,body,createdAt:new Date().toISOString(),status:'pending_server_delivery'});save(V7MAILKEY,d);st.textContent='MESSAGE PRESERVED · server delivery is blocked until the production communication endpoint is connected.';renderMail();renderMailTab('drafts')});renderMail();\n</script>\n'''
          s=s.replace('</body>',wire+'</body>',1)
          # Marker is intentionally last so partial edits never masquerade as complete.
          s=s.replace('</body>','<!-- '+marker+' -->\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
          PY
      - name: Commit and remove patch workflow
        run: |
          rm -f CLOUDFLARE-INTELLIGENT-HUB-V7/.v7-restore-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLOUDFLARE-INTELLIGENT-HUB-V7/index.html CLOUDFLARE-INTELLIGENT-HUB-V7/.v7-restore-trigger .github/workflows/v7-restore-mail-and-feed.yml
          git commit -m 'V7 restore Smart Mail and intelligent block feed' || exit 0
          git push
          git rm .github/workflows/v7-restore-mail-and-feed.yml
          git commit -m 'Remove temporary V7 patch workflow'
          git push
