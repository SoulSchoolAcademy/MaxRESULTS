name: Package NayaNET Intelligent Hub — Cloudflare V4

on:
  push:
    branches: [main]
    paths:
      - 'CLOUDFLARE-INTELLIGENT-HUB/**'
      - '.github/workflows/package-cloudflare-intelligent-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_DIR: CLOUDFLARE-INTELLIGENT-HUB
  ZIP_NAME: NayaNET-Intelligent-Hub-V4-Cloudflare.zip

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate package before archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PACKAGE_DIR/index.html"
          test -f "$PACKAGE_DIR/README.md"
          test -f "$PACKAGE_DIR/_headers"
          test ! -e "$PACKAGE_DIR/.git"
          grep -Fq 'NayaNET' "$PACKAGE_DIR/index.html"
          grep -Fq 'MAKE DIGITAL OBJECTS FEEL PHYSICAL' "$PACKAGE_DIR/index.html"
          grep -Fq 'PRIVATE BY DEFAULT' "$PACKAGE_DIR/index.html"
          grep -Fq 'live connector' "$PACKAGE_DIR/index.html"
          grep -Fq 'Source → build artifact → deployment → exact public runtime → independent observation' "$PACKAGE_DIR/README.md"
          node --check <(sed -n '/<script>/,/<\/script>/p' "$PACKAGE_DIR/index.html" | sed '1d;$d')
          test "$(find "$PACKAGE_DIR" -type f | wc -l)" -eq 3

      - name: Build ZIP from exact validated directory
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$ZIP_NAME"
          cd "$PACKAGE_DIR"
          zip -r "../$ZIP_NAME" . -x '*.DS_Store'
          cd ..
          unzip -t "$ZIP_NAME"
          unzip -l "$ZIP_NAME"
          test -s "$ZIP_NAME"

      - name: Upload Cloudflare package artifact
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-V4-Cloudflare
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30
