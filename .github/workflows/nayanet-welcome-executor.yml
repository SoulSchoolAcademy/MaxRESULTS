name: NayaNET welcome executor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nayanet-welcome-executor.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Surgical patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('NAYANETHUB.html')
          s=p.read_text(encoding='utf-8')
          if 'id="nayanet-login-welcome"' not in s:
            css='''<style id="nayanet-login-welcome-style">#nayanet-login-welcome{padding:34px 0 28px;margin:0;border-bottom:1px solid #ffffff12}#nayanet-login-welcome h1{margin:0;font-size:clamp(42px,6vw,78px);line-height:.92;letter-spacing:-.07em;font-weight:900}#nayanet-login-welcome .nhw-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;color:#bdb8c7;font-size:11px;font-weight:700;letter-spacing:.04em}#nayanet-login-welcome .nhw-meta span{padding:7px 10px;border:1px solid #ffffff18;border-radius:10px;background:#09090d}#nayanet-login-welcome .nhw-meta strong{color:#fff}@media(max-width:900px){#nayanet-login-welcome{padding:24px 0 22px}#nayanet-login-welcome h1{font-size:clamp(38px,11vw,58px)}#nayanet-login-welcome .nhw-meta{font-size:10px}}</style>'''
            block='''<section id="nayanet-login-welcome" aria-label="NayaNET welcome"><h1 id="nayanet-login-greeting">Good evening, Shawn.</h1><div class="nhw-meta"><span id="nayanet-login-time"><strong>--:--</strong></span><span id="nayanet-login-date"><strong>Loading date…</strong></span><span><strong id="nayanet-login-country">Canada</strong></span></div></section><script id="nayanet-login-welcome-runtime">(function(){function u(){var n=new Date(),h=n.getHours(),g=h<12?'Good morning, Shawn.':h<18?'Good afternoon, Shawn.':'Good evening, Shawn.',t=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(n),d=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(n),r=(navigator.language||'').match(/[-_]([A-Z]{2})$/i),m={CA:'Canada',US:'United States',GB:'United Kingdom',AU:'Australia',NZ:'New Zealand'},c=r?m[r[1].toUpperCase()]||'Canada':'Canada',x=document.getElementById('nayanet-login-greeting'),y=document.getElementById('nayanet-login-time'),z=document.getElementById('nayanet-login-date'),w=document.getElementById('nayanet-login-country');if(x)x.textContent=g;if(y)y.innerHTML='<strong>'+t+'</strong>';if(z)z.innerHTML='<strong>'+d+'</strong>';if(w)w.textContent=c}u();setInterval(u,30000)})();</script>'''
            if '</style><style id="nayanet-surgical-menu-style">' not in s: raise SystemExit('Expected V7 style boundary missing')
            s=s.replace('</style><style id="nayanet-surgical-menu-style">','</style>'+css+'<style id="nayanet-surgical-menu-style">',1)
            a=s.find('<header class="topbar">');e=s.find('</header>',a)
            if a<0 or e<0: raise SystemExit('Expected topbar boundary missing')
            e+=len('</header>');s=s[:e]+block+s[e:];p.write_text(s,encoding='utf-8')
          v=p.read_text(encoding='utf-8')
          assert v.count('id="nayanet-login-welcome"')==1
          assert v.count('id="nayanet-login-welcome-runtime"')==1
          print('SURGICAL WELCOME VERIFIED')
      - name: Commit and remove executor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NAYANETHUB.html
          git rm .github/workflows/nayanet-welcome-executor.yml
          git diff --cached --check
          git commit -m "Add dynamic welcome header to NayaNET Hub"
          git push origin main
