name: Superbrain Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superbrain-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain-gate:
    name: brain-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile Superbrain runtime
        run: python -m py_compile .naya/memory/smart_notes_v3.py .naya/memory/duplicate_entity_audit.py .naya/memory/relationship_graph.py .naya/memory/entity_resolution.py .naya/memory/contradiction_supersession.py .naya/memory/superbrain_health.py .naya/memory/retrieval_benchmark.py .naya/memory/cis_state.py .naya/runtime/continuity_enforcement.py .naya/runtime/canonical_event_store.py .naya/runtime/outbox.py .naya/runtime/restore_context.py .naya/tests/test_superbrain_gate.py .naya/tests/test_continuity_enforcement.py .naya/tests/test_intelligence_layer.py .naya/tests/test_cold_start_and_cis.py

      - name: Validate canonical memory
        run: python .naya/memory/smart_notes_v3.py validate

      - name: Run duplicate/entity audit
        run: python .naya/memory/duplicate_entity_audit.py

      - name: Rebuild relationship graph
        run: python .naya/memory/relationship_graph.py

      - name: Run Superbrain regression suite
        run: python .naya/tests/test_superbrain_gate.py

      - name: Run execution continuity regression suite
        run: python .naya/tests/test_continuity_enforcement.py

      - name: Run intelligence-layer regression suite
        run: python .naya/tests/test_intelligence_layer.py

      - name: Run cold-start and CIS acceptance checks
        run: python .naya/tests/test_cold_start_and_cis.py

      - name: Enforce execution continuity on meaningful events
        run: python .naya/runtime/continuity_enforcement.py validate

      - name: Build and verify derived index
        run: |
          python .naya/memory/smart_notes_v3.py index > /tmp/superbrain-index.json
          python .naya/memory/smart_notes_v3.py validate

      - name: Retrieval baseline and smoke test
        run: |
          python .naya/memory/smart_notes_v3.py retrieve "Superbrain CIS Naya Power" --limit 5
          python .naya/memory/retrieval_benchmark.py

      - name: Superbrain health metrics
        run: python .naya/memory/superbrain_health.py

      - name: Daily CIS smoke test
        run: |
          python .naya/memory/smart_notes_v3.py daily-report --day 2026-08-25 --timezone America/Vancouver
          python .naya/memory/cis_state.py --day 2026-08-25 --timezone America/Vancouver

      - name: Emit continuity gate receipt
        run: |
          echo "SUPERBRAIN CONTINUITY CONTRACT: VERIFIED BY THIS JOB"
          echo "MEANINGFUL EXECUTION CHECKS: paired representations, verification state, durable receipt, delivery state, AI-to-AI handoff, learning, next action"
          echo "INTELLIGENCE LAYER: idempotency, explicit resolution, supersession, outbox state machine, health metrics, retrieval baseline, cold-start restore, next-day CIS state"

# Keep this workflow self-triggering on every main push so the latest intelligence-layer repair is independently re-proven.
