name: MAXESS Nitro V2 Execution

# Mutation workflow: explicit dispatch only.
# Automatic pushes use repository-integrity.yml for verification and must not
# silently rewrite the working product artifact.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          fetch-depth: 0

      - name: Lock check
        run: |
          test "${GITHUB_REPOSITORY}" = "SoulSchoolAcademy/MaxRESULTS"
          test "${GITHUB_REF_NAME}" = "maxess-results-v21-working"
          test -f '20260817 912am RESULTS PAGE CODE'
          test -f tools/nitro_aaa_upgrade.py

      - name: Execute Nitro guard with captured diagnostics
        shell: bash
        run: |
          set -o pipefail
          python -u tools/nitro_aaa_upgrade.py 2>&1 | tee nitro-execution.log

      - name: Verify result
        run: |
          python -m py_compile tools/nitro_aaa_upgrade.py
          python - <<'PY'
          from pathlib import Path
          p=Path('20260817 912am RESULTS PAGE CODE'); s=p.read_text(encoding='utf-8')
          assert len(s)>500000
          assert 'MAXESS-NITRO-AAA-UPGRADE v3' in s
          assert 'maxess-nitro-aaa-css' in s
          assert 'maxess-nitro-aaa-js' in s
          assert 'window.MAXESS_RESULT' in s
          print('verified bytes',len(s.encode()),'lines',len(s.splitlines()))
          PY

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxess-nitro-v2-evidence
          path: nitro-execution.log
          if-no-files-found: ignore

      - name: Commit only verified Nitro mutation
        if: success()
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add '20260817 912am RESULTS PAGE CODE'
          git diff --cached --quiet && exit 0
          git commit -m 'MAXESS Nitro V3 AAA upgrade — verified [nitro-generated]'
          git push origin maxess-results-v21-working
