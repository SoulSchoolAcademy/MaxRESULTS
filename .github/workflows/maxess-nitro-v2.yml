name: MAXESS Nitro V2 Execution

on:
  push:
    branches: [maxess-results-v21-working]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          fetch-depth: 0
      - name: Lock check
        run: |
          test "${GITHUB_REPOSITORY}" = "SoulSchoolAcademy/MaxRESULTS"
          test "${GITHUB_REF_NAME}" = "maxess-results-v21-working"
          test -f '20260817 912am RESULTS PAGE CODE'
          test -f tools/nitro_aaa_upgrade.py
      - name: Execute Nitro upgrade with captured diagnostics
        shell: bash
        run: |
          set -o pipefail
          python -u tools/nitro_aaa_upgrade.py 2>&1 | tee nitro-execution.log
      - name: Verify result
        run: |
          python -m py_compile tools/nitro_aaa_upgrade.py
          python - <<'PY'
          from pathlib import Path
          p=Path('20260817 912am RESULTS PAGE CODE'); s=p.read_text(encoding='utf-8')
          assert len(s)>500000, len(s)
          assert len(s.splitlines())>6500, len(s.splitlines())
          assert s.count('MAXESS-NITRO-AAA-UPGRADE v2')==1
          assert s.count('maxess-nitro-aaa-css')==1
          assert s.count('maxess-nitro-aaa-js')==1
          assert 'window.MAXESS_RESULT' in s
          assert s.lower().count('</html>')==1
          print('verified bytes',len(s.encode()),'lines',len(s.splitlines()))
          PY
      - name: Candidate QA
        run: python tools/qa_v21_candidate_v2.py
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxess-nitro-v2-evidence
          path: nitro-execution.log
          if-no-files-found: ignore
      - name: Commit verified upgrade
        if: success()
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add '20260817 912am RESULTS PAGE CODE' BASELINE-NITRO-20260817.html V21-CANDIDATE-QA-V2.md
          git diff --cached --quiet && exit 0
          git commit -m 'MAXESS Nitro V2 AAA upgrade — verified [nitro-generated]'
          git push origin maxess-results-v21-working
