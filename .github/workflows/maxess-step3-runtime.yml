name: MAXESS Step 3 Runtime Proof

on:
  push:
    paths:
      - '.github/workflows/maxess-step3-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply temporary E00.118 surgical repair in test workspace
        shell: python
        run: |
          from pathlib import Path
          p=Path('E00 118'); s=p.read_text(encoding='utf-8')
          replacements=[
            ('<button class="continue" id="continueButton" type="button" disabled>', '<button class="continue" id="continueButton" type="button" aria-disabled="true">'),
            ('#maxess-ai-score .continue:disabled{opacity:.72;color:rgba(255,255,255,.42);border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 20px rgba(0,0,0,.3)}', '#maxess-ai-score .continue[aria-disabled="true"]{opacity:.72;color:rgba(255,255,255,.42);border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 20px rgba(0,0,0,.3);cursor:not-allowed}'),
            ('function updateContinue(){const disabled=!state.selected||state.finalizing||state.mode!==\'ASSESSMENT\';$(\'continueButton\').disabled=disabled;$(\'continueButton\').setAttribute(\'aria-disabled\',String(disabled));}', 'function updateContinue(){const disabled=!state.selected||state.finalizing||state.mode!==\'ASSESSMENT\';$(\'continueButton\').setAttribute(\'aria-disabled\',String(disabled));}'),
            ('$(\'continueButton\').addEventListener(\'click\',e=>{e.preventDefault();e.stopPropagation();next();},{capture:true});', '''let maxessContinueExecuting=false;
function executeContinueBoundary(e){
 const target=e.target instanceof Element?e.target:null;
 const btn=target?.closest('#continueButton');
 const root=$(\'maxess-ai-score\');
 if(!btn||!root?.contains(btn))return;
 if(state.finalizing||state.mode!==\'ASSESSMENT\'||!state.selected)return;
 if(maxessContinueExecuting)return;
 maxessContinueExecuting=true;
 e.preventDefault();
 e.stopPropagation();
 try{next();}finally{maxessContinueExecuting=false;}
}
document.addEventListener('click',executeContinueBoundary,true);''')
          ]
          for old,new in replacements:
              if old not in s: raise SystemExit('Missing canonical marker: '+old[:100])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('TEMP_REPAIR_APPLIED bytes=',len(s.encode()))
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Execute complete 15-question MAXESS assessment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('E00 118').read_text(encoding='utf-8')
          Path('e00-118-runtime.html').write_text(html,encoding='utf-8')
          PY
          cat > prove-maxess.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors=[]; const consoleErrors=[];
          page.on('pageerror', e=>errors.push(String(e)));
          page.on('console', m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
          await page.goto(`file://${process.cwd()}/e00-118-runtime.html`);
          await page.waitForTimeout(300);
          const close=page.locator('#closeNaya');
          if(await close.isVisible().catch(()=>false)) await close.click();
          for(let i=1;i<=15;i++){
            const answer=page.locator('#answers .answer').first();
            if(await answer.count()!==1) throw new Error(`Q${i}: answer button missing`);
            await answer.click();
            const disabled=await page.locator('#continueButton').isDisabled();
            console.log(`Q${i}: selected=true continueDisabled=${disabled}`);
            if(disabled) throw new Error(`Q${i}: Continue remained disabled after answer selection`);
            await page.locator('#continueButton').click();
            if(i<15){
              await page.waitForTimeout(180);
              if(await close.isVisible().catch(()=>false)) await close.click();
            }
          }
          await page.waitForTimeout(250);
          const result=await page.evaluate(()=>({
            result:window.MAXESS_RESULT||null,
            localScore:document.querySelector('#localOverallScore')?.textContent||'',
            localResultsActive:document.querySelector('#localResults')?.classList.contains('active')||false,
            status:document.querySelector('#localResultsStatus')?.textContent||'',
            dimensions:document.querySelectorAll('#localDimensions .dimension-card').length
          }));
          console.log('RESULT_JSON',JSON.stringify(result));
          console.log('PAGE_ERRORS',JSON.stringify(errors));
          console.log('CONSOLE_ERRORS',JSON.stringify(consoleErrors));
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
          if(!result.result || result.result.contractVersion!=='MAXESS_RESULT_V1') throw new Error('No valid window.MAXESS_RESULT');
          if(result.result.responses?.length!==15) throw new Error('Result responses != 15');
          if(result.result.dimensions?.length!==5) throw new Error('Result dimensions != 5');
          if(!Number.isInteger(result.result.overallScore)) throw new Error('overallScore not integer');
          if(!result.result.masteryBand) throw new Error('masteryBand missing');
          if(!result.localResultsActive) throw new Error('Local Results not active');
          if(result.localScore!==String(result.result.overallScore)) throw new Error('Local score mismatch');
          if(result.dimensions!==5) throw new Error('Local dimensions != 5');
          console.log('E00_AUTHORITATIVE_RESULT=PASS');
          await browser.close();
          JS
          node prove-maxess.mjs
      - name: Commit only verified E00.118 repair and remove temporary machinery
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD^ -- .github/workflows/maxess-step3-runtime.yml
          git rm -f .github/workflows/maxess-e00-118-surgical-repair.yml E00_118_REPAIR_TRIGGER
          git add 'E00 118' .github/workflows/maxess-step3-runtime.yml
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git commit -m 'fix E00.118 Continue terminal boundary'
          git push origin main
