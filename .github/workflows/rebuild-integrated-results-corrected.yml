name: MAXESS Results — Corrected Q15 Handoff + Complete E01-E09 Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-integrated-results-corrected.yml'
      - 'AISCORE.NAYANET.APP 2026 08 21 447'
      - 'docs/smart-notes/**'
      - 'MAXESS-RESULTS-INTEGRATED-V1.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main assessment authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout authoritative Results working source
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          path: active-results
          fetch-depth: 1

      - name: Repair Q15 final handoff surgically
        shell: python
        run: |
          from pathlib import Path
          p = Path('AISCORE.NAYANET.APP 2026 08 21 447')
          text = p.read_text(encoding='utf-8')
          old_state = "const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false};"
          new_state = "const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false,finalizing:false};"
          if old_state in text:
              text = text.replace(old_state, new_state, 1)
          old_fn = "function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.completed=true;try{publish()}catch(e){console.error('MAXESS report publish failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          new_fn = "function continueAssessment(event){if(event){event.preventDefault();event.stopPropagation();if(event.stopImmediatePropagation)event.stopImmediatePropagation()}if(state.finalizing||!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.finalizing=true;state.completed=true;const button=$('continueButton');button.disabled=true;button.setAttribute('aria-disabled','true');$('continueText').textContent='Loading Results…';try{if(!publish())throw new Error('MAXESS final Results publish returned false.')}catch(e){state.finalizing=false;button.disabled=false;button.setAttribute('aria-disabled','false');$('continueText').textContent='Continue';console.error('MAXESS final Results handoff failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          if old_fn in text:
              text = text.replace(old_fn, new_fn, 1)
          elif 'function continueAssessment(event)' not in text:
              raise SystemExit('Q15 handler anchor missing')
          listener_old = "$('continueButton').addEventListener('click',continueAssessment);"
          listener_new = "$('continueButton').addEventListener('click',continueAssessment,true);"
          if listener_old in text:
              text = text.replace(listener_old, listener_new, 1)
          marker = "window.MAXESS_CLEAN_V1_REPAIR_APPLIED=true;window.NAYA_WELCOME_V1=true;window.MAXESS_RESULT_BRIDGE_V2=true;"
          if marker in text and 'window.MAXESS_Q15_HANDOFF_V447=true;' not in text:
              text = text.replace(marker, marker + "window.MAXESS_Q15_HANDOFF_V447=true;", 1)
          if 'window.MAXESS_Q15_HANDOFF_V447=true;' not in text:
              raise SystemExit('Q15 release marker missing')
          p.write_text(text, encoding='utf-8')

      - name: Build complete Results from baseline with only E01-E04 dynamic overrides
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re

          active = Path('active-results')
          baseline = active / 'BASELINE-WORKING.html'
          if not baseline.exists():
              raise SystemExit('AUTHORITATIVE BASELINE MISSING')

          dynamic = {
              'e01': active / 'E01-SECTION-01-WORKING.html',
              'maxess-e02-v3': active / 'E02-SECTION-02-WORKING.html',
              'e03': active / 'E03-SECTION-03-WORKING.html',
              'e04': active / 'E04-SECTION-04-WORKING.html',
          }
          for sid, path in dynamic.items():
              if not path.exists():
                  raise SystemExit(f'DYNAMIC SOURCE MISSING: {sid}')

          base = baseline.read_text(encoding='utf-8')

          def body_inner(text):
              a = text.lower().find('<body')
              if a < 0: raise SystemExit('BODY MISSING')
              a = text.find('>', a)
              b = text.lower().rfind('</body>')
              if a < 0 or b < 0: raise SystemExit('BODY BOUNDARY INVALID')
              return text[a+1:b]

          def find_element(text, sid):
              m = re.search(r'<([A-Za-z][\\w:-]*)\\b[^>]*\\bid=["\\']' + re.escape(sid) + r'["\\'][^>]*>', text, re.I)
              if not m: return None
              tag = m.group(1)
              start = m.start()
              pos = m.end()
              depth = 1
              token = re.compile(r'</?' + re.escape(tag) + r'\\b[^>]*>', re.I)
              for t in token.finditer(text, pos):
                  raw = t.group(0)
                  if raw.startswith('</'):
                      depth -= 1
                      if depth == 0: return text[start:t.end()]
                  elif not raw.rstrip().endswith('/>'):
                      depth += 1
              return None

          def style_blocks(text):
              return re.findall(r'<style\\b[^>]*>.*?</style>', text, re.I|re.S)

          # Remove only the four dynamic sections from the complete baseline.
          for sid in dynamic:
              existing = find_element(base, sid)
              if not existing:
                  raise SystemExit(f'BASELINE DYNAMIC SECTION MISSING: {sid}')
              base = base.replace(existing, '', 1)

          # Insert the current E01-E04 bodies before preserved E05.
          e05 = re.search(r'<([A-Za-z][\\w:-]*)\\b[^>]*\\bid=["\\']e05["\\'][^>]*>', base, re.I)
          if not e05:
              raise SystemExit('PRESERVED E05 MISSING')
          insert_at = e05.start()
          bodies = []
          for sid, path in dynamic.items():
              source = path.read_text(encoding='utf-8')
              bodies.append(body_inner(source))
          base = base[:insert_at] + '\\n'.join(bodies) + '\\n' + base[insert_at:]

          # Preserve all existing section scripts. Add only current E01-E04 styles.
          head = base.lower().find('</head>')
          if head < 0: raise SystemExit('HEAD MISSING')
          styles = []
          for path in dynamic.values():
              styles.extend(style_blocks(path.read_text(encoding='utf-8')))

          bridge = '''<script id="maxess-complete-results-bridge-v4">\n(function(){'use strict';if(window.__MAXESS_COMPLETE_RESULTS_BRIDGE_V4__)return;window.__MAXESS_COMPLETE_RESULTS_BRIDGE_V4__=true;var C='MAXESS_RESULT_V1';function emit(n,r){try{window.dispatchEvent(new CustomEvent(n,{detail:r}))}catch(e){}}function decode(v){try{var s=decodeURIComponent(String(v||'')).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)}catch(e){return null}}function read(){var h=location.hash||'',m=h.match(/(?:^#|&)maxess-result=([^&]*)/i);if(!m)return null;var j=decode(m[1]);if(!j)return null;try{return JSON.parse(j)}catch(e){return null}}function valid(r){return !!(r&&typeof r==='object'&&r.contractVersion===C&&Number.isFinite(Number(r.overallScore))&&Number(r.overallScore)>=0&&Number(r.overallScore)<=100&&Array.isArray(r.dimensions)&&r.dimensions.length===5&&Array.isArray(r.responses)&&r.responses.length===15)}function boot(){var r=read();if(!valid(r))return false;window.MAXESS_RESULT=r;emit('MAXESS_RESULT_READY',r);emit('maxess:result-updated',r);return true}window.MAXESS_RESULT_CONSUMER_V4={consume:boot,get:function(){return window.MAXESS_RESULT||null},contractVersion:C};if(!boot()&&document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else if(!window.MAXESS_RESULT)window.setTimeout(boot,0);window.addEventListener('hashchange',boot);window.addEventListener('pageshow',boot)})();\n</script>'''
          base = base[:head] + '\\n' + '\\n'.join(styles) + '\\n' + bridge + '\\n' + base[head:]

          ids = ['e01','maxess-e02-v3','e03','e04','e05','e06','e07','e08','e09']
          for sid in ids:
              n = len(re.findall(r'<[^>]+\\bid=["\\']' + re.escape(sid) + r'["\\']', base, re.I))
              if n != 1: raise SystemExit(f'SECTION COUNT FAILED {sid}: {n}')
          if base.lower().count('<html') != 1 or base.lower().count('</html>') != 1:
              raise SystemExit('DOCUMENT SHELL COUNT FAILED')
          if base.lower().count('<!doctype html>') != 1:
              raise SystemExit('DOCTYPE COUNT FAILED')
          if base.count('maxess-complete-results-bridge-v4') != 1:
              raise SystemExit('RESULTS BRIDGE COUNT FAILED')
          for bad in ['name: MAXESS Results','shell: python','from pathlib import','jobs:','workflow_dispatch:','<<<<<<<','>>>>>>>']:
              if bad in base: raise SystemExit('RAW SOURCE CONTAMINATION: ' + bad)
          out = Path('MAXESS-RESULTS-INTEGRATED-V1.html')
          out.write_text(base, encoding='utf-8')
          digest = hashlib.sha256(base.encode('utf-8')).hexdigest()
          Path('MAXESS-COMPLETE-INTEGRATED-BUILD.md').write_text(f'''# MAXESS Complete Results Build\n\n- Assessment authority: 447\n- Dynamic: E01, E02, E03, E04\n- Static/preserved: E05, E06, E07, E08, E09\n- E02 authoritative source ID: maxess-e02-v3\n- Runtime authority: window.MAXESS_RESULT\n- Results bridge: V4, one global bridge\n- SHA-256: {digest}\n- Bytes: {len(base.encode('utf-8'))}\n- Lines: {len(base.splitlines())}\n''', encoding='utf-8')
          print('BUILD PASS', digest, len(base.encode('utf-8')), len(base.splitlines()))

      - name: Validate Q15 source and generated HTML
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'function continueAssessment(event)' 'AISCORE.NAYANET.APP 2026 08 21 447' >/dev/null
          grep -F 'window.MAXESS_Q15_HANDOFF_V447=true;' 'AISCORE.NAYANET.APP 2026 08 21 447' >/dev/null
          grep -F "location.assign('https://results.nayanet.app/#maxess-result='+payload)" 'AISCORE.NAYANET.APP 2026 08 21 447' >/dev/null
          node --check <(python - <<'PY'
          import re
          s=open('AISCORE.NAYANET.APP 2026 08 21 447',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script\\b[^>]*>(.*?)</script>',s,re.I|re.S)))
          PY
          )
          node --check <(python - <<'PY'
          import re
          s=open('MAXESS-RESULTS-INTEGRATED-V1.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script\\b[^>]*>(.*?)</script>',s,re.I|re.S)))
          PY
          )
          echo 'RUNTIME SOURCE QA PASS'

      - name: Upload generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAXESS-RESULTS-INTEGRATED-V1
          path: |
            MAXESS-RESULTS-INTEGRATED-V1.html
            MAXESS-COMPLETE-INTEGRATED-BUILD.md

      - name: Commit verified artifact
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add 'AISCORE.NAYANET.APP 2026 08 21 447' 'MAXESS-RESULTS-INTEGRATED-V1.html' 'MAXESS-COMPLETE-INTEGRATED-BUILD.md'
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'MAXESS: corrected E02 v3 integration and verified Q15 handoff'
          git push origin main

# Guardrails:
# - Existing 447 assessment is authoritative.
# - E01-E04 are the only dynamic sections.
# - E05-E09 are preserved from the complete baseline.
# - E01-E04 scripts are preserved; section hydration is not stripped.
# - No new Results renderer is introduced.
# - Do not ship until generated HTML passes structural and JavaScript QA.
