name: Execute MAXESS Section 01

# Governed one-shot Section 01 checkpoint trigger.
# The workflow is intentionally path-scoped to prevent repeated execution.

on:
  push:
    branches:
      - maxess-results-v21-working
    paths:
      - .github/workflows/execute-maxess-section01.yml
      - tools/execute_maxess_section01.py

permissions:
  contents: write

jobs:
  section01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          fetch-depth: 0

      - name: Configure identity
        run: |
          git config user.name "Naya Lead Mode"
          git config user.email "naya-lead-mode@users.noreply.github.com"

      - name: Execute Section 01 Golden Master refinement
        run: python tools/execute_maxess_section01.py

      - name: Rebuild canonical artifact
        run: python tools/build_v21_canonical.py

      - name: Verify Section 01 source delta
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          p = Path('tools/build_v21_canonical.py')
          s = p.read_text(encoding='utf-8')
          required = [
              'MAXESS-SECTION-01-GOLDEN-MASTER',
              'b1s1-naya',
              'b1s1-listen',
              'b1s1-orb-live',
              'b1s1-orbital-bead',
              'b1s1-bridge',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('SECTION 01 evidence missing: ' + ', '.join(missing))
          if 'window.MAXESS_RESULT' not in s:
              raise SystemExit('MAXESS_RESULT authority marker missing')
          if re.search(r'(^|\n)(<<<<<<<|=======|>>>>>>>)( |\n|$)', s):
              raise SystemExit('Unresolved conflict marker remains in builder')
          print('SECTION 01 SOURCE VERIFICATION: PASS')
          print('BUILDER SHA256:', hashlib.sha256(s.encode('utf-8')).hexdigest())
          PY

      - name: Run focused Section 01 verification
        run: |
          python -m py_compile tools/execute_maxess_section01.py tools/build_v21_canonical.py
          echo "Section 01 focused verification: PASS"

      - name: Commit verified Section 01 checkpoint
        run: |
          git add "20260817 912am RESULTS PAGE CODE" tools/build_v21_canonical.py V21-CANONICAL-BUILD-RESULT.md
          if git diff --cached --quiet; then
            echo "No product delta to checkpoint."
            exit 1
          fi
          git commit -m "MAXESS Section 01 Golden Master checkpoint"
          git push origin maxess-results-v21-working
