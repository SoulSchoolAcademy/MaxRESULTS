name: Execute and Verify MAXESS Section 01

# Deterministic mutation lane for the single active E01 delivery artifact.
# The runner reads the COMPLETE artifact locally, applies the explicit patch,
# verifies protected behavior, and commits the SAME artifact back to GitHub.

on:
  push:
    branches:
      - maxess-results-v21-working
    paths:
      - 'E01-SECTION-01-WORKING.html'
      - 'tools/execute_e01_refinement.py'
      - 'docs/MAXESS-NITRO-SECTION-01-INDEX.md'
      - 'docs/MAXESS-NITRO-SECTION-01-GUARDRAILS.md'
      - '.github/workflows/execute-maxess-section01.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: execute-maxess-section01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  section01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          fetch-depth: 0

      - name: Verify canonical execution contracts
        run: |
          test -f NAYA-REPO-LOCK.md
          test -f NITRO-MASTER-EXECUTION-PROTOCOL.md
          test -f docs/MAXESS-NITRO-SECTION-01-INDEX.md
          test -f docs/MAXESS-NITRO-SECTION-01-GUARDRAILS.md
          test -f E01-SECTION-01-WORKING.html
          test -f tools/execute_e01_refinement.py
          grep -q 'E01-SECTION-01-WORKING.html' docs/MAXESS-NITRO-SECTION-01-INDEX.md
          grep -q 'E01-SECTION-01-WORKING.html' docs/MAXESS-NITRO-SECTION-01-GUARDRAILS.md
          echo "SECTION 01 CONTRACT ROUTING: PASS"

      - name: Establish complete-file baseline
        run: |
          git rev-parse HEAD > e01-baseline-commit.txt
          git rev-parse HEAD:E01-SECTION-01-WORKING.html > e01-baseline-blob.txt
          wc -c E01-SECTION-01-WORKING.html

      - name: Execute deterministic E01 mutation
        run: python tools/execute_e01_refinement.py

      - name: Static Section 01 integrity gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('E01-SECTION-01-WORKING.html').read_text(encoding='utf-8')
          required = [
              '<!doctype html>',
              'nitro-e01-v28',
              'NAYA',
              'LISTEN TO NAYA',
              'YOUR AI SCORE',
              'window.MAXESS_RESULT',
              'overallScore',
              'class="orb"',
              'class="bead"',
              'orb-breathe',
              'orb-orbit',
              'prefers-reduced-motion:reduce',
              'maxess:naya-listen',
              'This isn’t your judgment. It’s your map — it’s your starting point.',
              'This number is a starting point — <strong>not a verdict.</strong>',
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit('Missing required Section 01 evidence: ' + ', '.join(missing))
          if s.count('id="e01"') != 1:
              raise SystemExit('Expected exactly one E01 root id')
          if s.count('id="listen"') != 1:
              raise SystemExit('Expected exactly one primary Listen control')
          if 'translateX(220px)' not in s or 'translateX(140px)' not in s:
              raise SystemExit('Orb geometry regression')
          if 'width:14px;height:14px' not in s or 'width:11px;height:11px' not in s:
              raise SystemExit('Bead geometry regression')
          if 'width:min(280px,78%)' not in s:
              raise SystemExit('Mobile Orb ceiling regression')
          if re.search(r'(^|\n)(<<<<<<<|=======|>>>>>>>)( |\n|$)', s):
              raise SystemExit('Unresolved conflict marker remains in E01 source')
          print('SECTION 01 STATIC INTEGRITY: PASS')
          print('BYTES:', len(s.encode('utf-8')))
          print('LINES:', len(s.splitlines()))
          PY

      - name: Score-source and safety gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('E01-SECTION-01-WORKING.html').read_text(encoding='utf-8')
          if not re.search(r'window\.MAXESS_RESULT\s*&&\s*typeof window\.MAXESS_RESULT', s):
              raise SystemExit('Production result authority guard missing')
          if re.search(r'overallScore\s*:\s*82\b', s):
              raise SystemExit('Hard-coded production score detected')
          print('RESULT SOURCE / SAFE FAILURE GATE: PASS')
          PY

      - name: Diff proof
        run: |
          git diff --check
          git diff -- E01-SECTION-01-WORKING.html
          test -n "$(git diff -- E01-SECTION-01-WORKING.html)"

      - name: Commit only verified E01 mutation
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add E01-SECTION-01-WORKING.html
          git diff --cached --check
          git diff --cached --quiet && { echo 'NO E01 MUTATION DETECTED'; exit 1; }
          git commit -m 'MAXESS E01 Section 01 refinement — verified in place [nitro-v28]'
          git push origin maxess-results-v21-working
