name: Deploy V7 Intelligent Hub

on:
  push:
    branches: [main]
    paths:
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/**'
      - '.github/workflows/deploy-v7-intelligent-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nayanet-v7-canonical-production
  cancel-in-progress: true

jobs:
  deploy-v7:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLOUDFLARE-INTELLIGENT-HUB-V7
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Validate exact V7 artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s worker.js
          test -s wrangler.jsonc
          test -s v7-smart-note-runtime.js
          test -s v7-release-enhancements.js
          test -s v7-intelligence-distribution.js
          grep -Fq 'v7-smart-note-runtime.js' index.html
          grep -Fq 'v7-release-enhancements.js' index.html
          grep -Fq 'NayaNET — Intelligent Hub V7' index.html
          node --check worker.js
          node --check v7-smart-note-runtime.js
          node --check v7-release-enhancements.js
          node --check v7-intelligence-distribution.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('<html') == 1 and s.count('</html>') == 1, 'HTML boundary invalid'
          assert s.count('v7-smart-note-runtime.js') == 1, 'runtime marker count invalid'
          assert s.count('v7-release-enhancements.js') == 1, 'enhancement marker count invalid'
          print('V7 artifact validation: PASS')
          print('index.html bytes:', len(s.encode()))
          print('enhancement bytes:', Path('v7-release-enhancements.js').stat().st_size)
          print('distribution bytes:', Path('v7-intelligence-distribution.js').stat().st_size)
          PY

      - name: Deploy exact V7 source to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc

      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          echo "WORKER=nayanet-v7-intelligent-hub"
          echo "RUNTIME=https://noisy-block-35d0.nayanet.workers.dev/"
