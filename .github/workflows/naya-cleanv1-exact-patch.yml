name: Naya CLEAN V1 Exact Patch
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact user-supplied CLEAN V1 source
        shell: python
        run: |
          from pathlib import Path
          p=Path('AIScoreMAXESS-CLEAN-V1.html')
          s=p.read_text(encoding='utf-8')
          marker='/* NAYA_IMAGE_AAA_V1 */'
          if marker in s: raise SystemExit('Patch already present.')
          css='''<style>\n/* NAYA_IMAGE_AAA_V1 */\n.naya-portrait{width:92px;height:92px;flex:0 0 92px;border-radius:50%;padding:3px;background:linear-gradient(145deg,#fff,#dfceff 45%,#8150e8);box-shadow:0 0 0 6px rgba(138,92,255,.12),0 0 38px rgba(138,92,255,.34),0 14px 34px rgba(0,0,0,.55);overflow:hidden}.naya-portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 16%;border-radius:50%;border:2px solid rgba(255,255,255,.96)}.dialog .naya-presence{flex-direction:column;gap:12px;margin-bottom:24px;text-align:center}.dialog .presence-copy{text-align:center}.dialog .presence-copy strong{font-size:20px}.dialog .presence-copy span{font-size:12px}.naya-orb{background-image:url('https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg');background-size:cover;background-position:center 16%;background-repeat:no-repeat}.naya-orb:after{background:rgba(0,0,0,.24);border-radius:50%;box-shadow:inset 0 0 0 999px rgba(0,0,0,.08)}@media(max-width:760px){.naya-portrait{width:78px;height:78px;flex-basis:78px}.dialog .naya-presence{margin-bottom:18px}}</style>'''
          s=s.replace('</head>',css+'</head>',1)
          needle='<div class="naya-presence">'
          if needle not in s: raise SystemExit('Naya presence container missing; refusing edit.')
          s=s.replace(needle,needle+'<div class="naya-portrait" aria-hidden="true"><img src="https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg" alt=""></div>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate exact artifact
        shell: bash
        run: |
          test -s 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'NAYA_IMAGE_AAA_V1' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'Naya%20Profile%206.jpg' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'MAXESS_RESULT_V1' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'interestStage' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'NAYA_WELCOME_V1' 'AIScoreMAXESS-CLEAN-V1.html'
          git diff --check
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('AIScoreMAXESS-CLEAN-V1.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/aiscore.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('bytes',len(s.encode('utf-8')),'lines',len(s.splitlines()),'scripts',len(scripts))
          PY
          node --check /tmp/aiscore.js
      - name: Commit artifact and remove runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'AIScoreMAXESS-CLEAN-V1.html'
          git rm -- .github/workflows/naya-cleanv1-exact-patch.yml
          git rm -- NAYA_EXACT_TRIGGER.txt || true
          git commit -m 'AAA Naya portrait integration for exact CLEAN V1 assessment'
          git push origin HEAD:naya-cleanv1-exact-execute
