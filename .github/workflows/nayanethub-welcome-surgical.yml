name: NayaNET Hub — Surgical Welcome

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surgical-welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add only the personalized welcome to NAYANETHUB.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NAYANETHUB.html')
          text = path.read_text(encoding='utf-8')
          marker = 'id="nh-greeting"'
          if marker in text:
              print('Welcome already present; no source change required.')
              raise SystemExit(0)

          css = '''\n<style id="nh-greeting-style">\n.nh-greeting{margin:0 0 30px;padding:30px 34px;border:1px solid #d86cff55;border-radius:24px;background:radial-gradient(700px 260px at 80% 0%,#d86cff18,transparent 65%),linear-gradient(145deg,#17121e,#09090d);box-shadow:inset 0 1px #fff5,0 24px 55px #000b;position:relative;overflow:hidden}.nh-greeting:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#d86cff,#6675ff);box-shadow:0 0 22px #d86cff55}.nh-greeting-kicker{font-size:8px;font-weight:1000;letter-spacing:.18em;color:#bda7ff;margin-bottom:10px}.nh-greeting-title{font-size:clamp(38px,5vw,68px);line-height:.95;letter-spacing:-.065em;font-weight:900;margin:0}.nh-greeting-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.nh-greeting-meta span{padding:8px 11px;border:1px solid #ffffff18;border-radius:10px;background:#08080c;color:#cfc8d7;font-size:8px;font-weight:900;letter-spacing:.07em}.nh-greeting-meta span:first-child{border-color:#55b9ee55}.nh-greeting-meta span:nth-child(2){border-color:#55e39a55}.nh-greeting-meta span:nth-child(3){border-color:#e8c76655}@media(max-width:700px){.nh-greeting{padding:24px 20px;border-radius:20px}.nh-greeting-title{font-size:42px}.nh-greeting-meta{display:grid;grid-template-columns:1fr}}\n</style>\n'''

          html = '''<section id="nh-greeting" class="nh-greeting" aria-live="polite">\n<div class="nh-greeting-kicker">NAYANET · YOUR INTELLIGENCE TODAY</div>\n<h1 id="nh-greeting-title" class="nh-greeting-title">Good morning, Shawn.</h1>\n<div class="nh-greeting-meta"><span id="nh-greeting-time">TIME</span><span id="nh-greeting-date">DATE</span><span id="nh-greeting-country">COUNTRY</span></div>\n</section>\n'''

          script = '''<script id="nh-greeting-script">\n(()=>{\n'use strict';\nconst countryFromTimeZone=()=>{const z=Intl.DateTimeFormat().resolvedOptions().timeZone||'';const m=[['America/Edmonton','Canada'],['America/Vancouver','Canada'],['America/Winnipeg','Canada'],['America/Regina','Canada'],['America/Toronto','Canada'],['America/Halifax','Canada'],['America/St_Johns','Canada'],['America/Whitehorse','Canada'],['America/Yellowknife','Canada'],['America/Los_Angeles','United States'],['America/Denver','United States'],['America/Chicago','United States'],['America/New_York','United States'],['America/Phoenix','United States'],['America/Anchorage','United States'],['Pacific/Honolulu','United States'],['Europe/London','United Kingdom'],['Europe/Dublin','Ireland'],['Europe/Paris','France'],['Europe/Berlin','Germany'],['Europe/Madrid','Spain'],['Europe/Rome','Italy'],['Europe/Amsterdam','Netherlands'],['Europe/Brussels','Belgium'],['Europe/Lisbon','Portugal'],['Asia/Tokyo','Japan'],['Asia/Seoul','South Korea'],['Asia/Shanghai','China'],['Asia/Hong_Kong','Hong Kong'],['Asia/Singapore','Singapore'],['Asia/Kolkata','India'],['Australia/Sydney','Australia'],['Australia/Melbourne','Australia'],['Pacific/Auckland','New Zealand']];return m.find(x=>z===x[0])?.[1]||z.split('/')[0]||'Canada'};\nconst update=()=>{const d=new Date(),h=d.getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';const title=document.getElementById('nh-greeting-title');const t=document.getElementById('nh-greeting-time');const dt=document.getElementById('nh-greeting-date');const c=document.getElementById('nh-greeting-country');if(title)title.textContent=g+', Shawn.';if(t)t.textContent=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(d);if(dt)dt.textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d);if(c)c.textContent=countryFromTimeZone()};\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',update);else update();setInterval(update,30000);\n})();\n</script>\n'''

          if '</head>' not in text or '<section class="page active" id="page-home">' not in text:
              raise SystemExit('Canonical Hub structure not found; refusing to edit.')

          text = text.replace('</head>', css + '</head>', 1)
          anchor = '<section class="page active" id="page-home">'
          text = text.replace(anchor, anchor + html, 1)
          text = text.replace('</body>', script + '</body>', 1)
          path.write_text(text, encoding='utf-8')
          print('Inserted only the scoped personalized welcome.')
          PY

      - name: Verify surgical change
        shell: bash
        run: |
          test -s NAYANETHUB.html
          grep -q 'id="nh-greeting"' NAYANETHUB.html
          grep -q 'Good morning, Shawn.' NAYANETHUB.html
          grep -q 'Good afternoon' NAYANETHUB.html
          grep -q 'Good evening' NAYANETHUB.html
          grep -q 'nh-greeting-time' NAYANETHUB.html
          grep -q 'nh-greeting-date' NAYANETHUB.html
          grep -q 'nh-greeting-country' NAYANETHUB.html
          git diff --check
          git diff -- NAYANETHUB.html

      - name: Commit only NAYANETHUB.html
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NAYANETHUB.html
          if git diff --cached --quiet; then
            echo 'No change to commit.'
            exit 0
          fi
          git diff --cached --name-only
          git commit -m 'feat: restore personalized Hub welcome'
          git push origin HEAD:main

      - name: Remove this temporary runner from main
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/nayanethub-welcome-surgical.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: remove temporary Hub welcome runner'
          git push origin HEAD:main
