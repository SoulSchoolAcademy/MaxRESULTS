name: MAXESS Results — FINAL Surgical Q15 Handoff + Complete E01-E09

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-integrated-results-final.yml'
      - 'AISCORE.NAYANET.APP 2026 08 21 447'
      - 'docs/smart-notes/**'
      - 'MAXESS-RESULTS-INTEGRATED-V1.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assessment authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout Results authority
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          path: active-results
          fetch-depth: 1

      - name: Apply surgical 447 Q15 first-click guard
        shell: python
        run: |
          from pathlib import Path
          p = Path('AISCORE.NAYANET.APP 2026 08 21 447')
          s = p.read_text(encoding='utf-8')
          state_old = "const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false};"
          state_new = "const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false,finalizing:false};"
          if state_old in s:
              s = s.replace(state_old, state_new, 1)
          old = "function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.completed=true;try{publish()}catch(e){console.error('MAXESS report publish failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          new = "function continueAssessment(event){if(event){event.preventDefault();event.stopPropagation();if(event.stopImmediatePropagation)event.stopImmediatePropagation()}if(state.finalizing||!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.finalizing=true;state.completed=true;const button=$('continueButton');button.disabled=true;button.setAttribute('aria-disabled','true');$('continueText').textContent='Loading Results…';try{publish()}catch(e){state.finalizing=false;button.disabled=false;button.setAttribute('aria-disabled','false');$('continueText').textContent='Continue';console.error('MAXESS final Results handoff failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          if old in s:
              s = s.replace(old, new, 1)
          elif 'function continueAssessment(event)' not in s:
              raise SystemExit('Q15 handler anchor missing')
          listener_old = "$('continueButton').addEventListener('click',continueAssessment);"
          listener_new = "$('continueButton').addEventListener('click',continueAssessment,true);"
          if listener_old in s:
              s = s.replace(listener_old, listener_new, 1)
          marker = "window.MAXESS_CLEAN_V1_REPAIR_APPLIED=true;window.NAYA_WELCOME_V1=true;window.MAXESS_RESULT_BRIDGE_V2=true;"
          if 'window.MAXESS_Q15_HANDOFF_V447=true;' not in s:
              if marker not in s:
                  raise SystemExit('Q15 release marker missing')
              s = s.replace(marker, marker + 'window.MAXESS_Q15_HANDOFF_V447=true;', 1)
          p.write_text(s, encoding='utf-8')

      - name: Build complete Results from authoritative baseline with E01-E04 overrides
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re

          active = Path('active-results')
          baseline_path = active / 'BASELINE-WORKING.html'
          if not baseline_path.exists():
              raise SystemExit('AUTHORITATIVE BASELINE MISSING: active-results/BASELINE-WORKING.html')

          source_files = {
              'e01': active / 'E01-SECTION-01-WORKING.html',
              'maxess-e02-v3': active / 'E02-SECTION-02-WORKING.html',
              'e03': active / 'E03-SECTION-03-WORKING.html',
              'e04': active / 'E04-SECTION-04-WORKING.html',
          }
          for sid, path in source_files.items():
              if not path.exists():
                  raise SystemExit(f'DYNAMIC SOURCE MISSING: {path}')

          def extract_element(text, element_id):
              marker_re = re.compile(r'(<([A-Za-z][\w:-]*)\b[^>]*\bid=["\']' + re.escape(element_id) + r'["\'][^>]*>)', re.I)
              m = marker_re.search(text)
              if not m:
                  return None
              tag = m.group(2)
              start = m.start(1)
              token_re = re.compile(r'</?' + re.escape(tag) + r'\b[^>]*>', re.I)
              depth = 0
              for t in token_re.finditer(text, m.end(1)):
                  raw = t.group(0)
                  if raw.lower().startswith('</'):
                      depth -= 1
                      if depth == 0:
                          return text[start:t.end()]
                  elif not raw.rstrip().endswith('/>'):
                      depth += 1
              raise SystemExit(f'SECTION END MISSING: {element_id}')

          def source_section(text, sid):
              found = extract_element(text, sid)
              if found:
                  return found
              if re.search(r'<html\b', text, re.I):
                  body_m = re.search(r'<body\b[^>]*>(.*?)</body\s*>', text, re.I | re.S)
                  if body_m:
                      found = extract_element(body_m.group(1), sid)
                      if found:
                          return found
              raise SystemExit(f'DYNAMIC SOURCE SECTION MISSING: {sid}')

          def strip_result_consumers(text):
              out=[]; cursor=0
              for m in re.finditer(r'<script\b[^>]*>.*?</script\s*>', text, re.I | re.S):
                  out.append(text[cursor:m.start()])
                  block=m.group(0).lower()
                  removable = (
                      '__maxess_result_consumer_v2__' in block or
                      '__maxess_result_consumer_v3__' in block or
                      '__maxess_result_consumer_v4__' in block or
                      'data-maxess-result-consumer=' in block
                  )
                  if not removable:
                      out.append(m.group(0))
                  cursor=m.end()
              out.append(text[cursor:])
              return ''.join(out)

          def strip_legacy_baseline_bootstrap(text):
              out=[]; cursor=0
              for m in re.finditer(r'<script\b[^>]*>.*?</script\s*>', text, re.I | re.S):
                  out.append(text[cursor:m.start()])
                  block=m.group(0).lower()
                  removable = (
                      'maxess_result_10_10_bootstrap' in block or
                      '__maxess_result_consumer_v2__' in block or
                      '__maxess_result_consumer_v3__' in block or
                      '__maxess_result_consumer_v4__' in block or
                      'data-maxess-result-consumer=' in block
                  )
                  if not removable:
                      out.append(m.group(0))
                  cursor=m.end()
              out.append(text[cursor:])
              return ''.join(out)

          baseline = baseline_path.read_text(encoding='utf-8')
          if baseline.lower().count('<html') != 1 or baseline.lower().count('</html>') != 1:
              raise SystemExit('BASELINE INVALID: document shell count')
          if baseline.lower().count('<!doctype html>') > 1:
              raise SystemExit('BASELINE INVALID: multiple doctypes')

          for sid in ['e05','e06','e07','e08','e09']:
              if not extract_element(baseline, sid):
                  raise SystemExit(f'PROTECTED STATIC SECTION MISSING FROM BASELINE: {sid}')

          for sid in source_files:
              existing = extract_element(baseline, sid)
              if existing:
                  baseline = baseline.replace(existing, '', 1)

          dynamic_sections = []
          for sid, path in source_files.items():
              src = path.read_text(encoding='utf-8')
              dynamic_sections.append(strip_result_consumers(source_section(src, sid)))

          baseline = strip_legacy_baseline_bootstrap(baseline)
          e05 = extract_element(baseline, 'e05')
          if not e05:
              raise SystemExit('PROTECTED E05 INSERTION POINT MISSING')
          insert_at = baseline.find(e05)
          baseline = baseline[:insert_at] + '\n'.join(dynamic_sections) + '\n' + baseline[insert_at:]

          style_blocks=[]
          for path in source_files.values():
              src=path.read_text(encoding='utf-8')
              style_blocks.extend(re.findall(r'<style\b[^>]*>.*?</style\s*>', src, re.I | re.S))
          head_pos = baseline.lower().find('</head>')
          if head_pos < 0:
              raise SystemExit('RESULTS HEAD MISSING')

          bridge = '''<script id="maxess-complete-results-bridge-v5">\n(function(){'use strict';if(window.__MAXESS_COMPLETE_RESULTS_BRIDGE_V5__)return;window.__MAXESS_COMPLETE_RESULTS_BRIDGE_V5__=true;var CONTRACT='MAXESS_RESULT_V1';function emit(n,r){try{window.dispatchEvent(new CustomEvent(n,{detail:r}));}catch(e){}}function decode(v){try{var s=decodeURIComponent(String(v||'')).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u);}catch(e){return null;}}function consume(){var h=window.location.hash||'',m=h.match(/(?:^#|&)maxess-result=([^&]*)/i);if(!m)return false;var json=decode(m[1]);if(!json)return false;var r;try{r=JSON.parse(json);}catch(e){return false;}if(!r||typeof r!=='object'||r.contractVersion!==CONTRACT)return false;var score=Number(r.overallScore);if(!Number.isFinite(score)||score<0||score>100)return false;if(!Array.isArray(r.dimensions)||r.dimensions.length!==5)return false;if(!Array.isArray(r.responses)||r.responses.length!==15)return false;for(var i=0;i<5;i++){var d=r.dimensions[i];if(!d||typeof d.name!=='string'||!Number.isFinite(Number(d.score)))return false;}window.MAXESS_RESULT=r;emit('MAXESS_RESULT_READY',r);emit('maxess:result-updated',r);return true;}window.MAXESS_RESULT_CONSUMER_V5={consume:consume,get:function(){return window.MAXESS_RESULT||null},contractVersion:CONTRACT};function boot(){if(!consume()&&!window.MAXESS_RESULT){document.documentElement.setAttribute('data-maxess-result-state','missing-or-invalid');}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();window.addEventListener('hashchange',consume);window.addEventListener('pageshow',consume);})();\n</script>'''
          baseline = baseline[:head_pos] + '\n' + '\n'.join(style_blocks) + '\n' + bridge + '\n' + baseline[head_pos:]

          if not re.match(r'^\s*<!doctype html\s*>', baseline, re.I):
              baseline = '<!doctype html>\n' + baseline.lstrip()

          required_ids = ['e01','maxess-e02-v3','e03','e04','e05','e06','e07','e08','e09']
          for sid in required_ids:
              count = len(re.findall(r'<[^>]+\bid=["\']' + re.escape(sid) + r'["\']', baseline, re.I))
              if count != 1:
                  raise SystemExit(f'INTEGRATED QA FAILED: {sid} count={count}')
          if baseline.lower().count('<!doctype html>') != 1 or baseline.lower().count('<html') != 1 or baseline.lower().count('</html>') != 1:
              raise SystemExit('INTEGRATED QA FAILED: document shell')
          if '<!doctype html>' in baseline[baseline.lower().find('<body'):].lower():
              raise SystemExit('INTEGRATED QA FAILED: nested document shell')
          if baseline.count('maxess-complete-results-bridge-v5') != 1:
              raise SystemExit('INTEGRATED QA FAILED: Results bridge count')
          if 'MAXESS_RESULT_10_10_BOOTSTRAP' in baseline or '__MAXESS_RESULT_CONSUMER_V2__' in baseline or '__MAXESS_RESULT_CONSUMER_V3__' in baseline or '__MAXESS_RESULT_CONSUMER_V4__' in baseline:
              raise SystemExit('INTEGRATED QA FAILED: legacy result consumer remains')
          if 'window.MAXESS_RESULT = result' in baseline or 'fixtureMode' in baseline:
              raise SystemExit('INTEGRATED QA FAILED: baseline fallback result authority remains')
          for bad in ('name: MAXESS Results', 'shell: python', 'from pathlib import', 'workflow_dispatch:', 'jobs:', '<<<<<<<', '>>>>>>>', '```'):
              if bad.lower() in baseline.lower():
                  raise SystemExit('INTEGRATED QA FAILED: raw build source ' + bad)

          out=Path('MAXESS-RESULTS-INTEGRATED-V1.html')
          out.write_text(baseline,encoding='utf-8')
          digest=hashlib.sha256(baseline.encode('utf-8')).hexdigest()
          Path('MAXESS-COMPLETE-INTEGRATED-BUILD.md').write_text(
              '# MAXESS Complete E01-E09 Results Build\n\n'
              '- Assessment authority: 447\n'
              '- Dynamic: E01, E02 v3, E03, E04\n'
              '- Static/preserved: E05, E06, E07, E08, E09\n'
              '- Runtime authority: window.MAXESS_RESULT\n'
              '- Results bridge: V5, single global bridge\n'
              f'- SHA-256: {digest}\n'
              f'- Bytes: {len(baseline.encode("utf-8"))}\n'
              f'- Lines: {len(baseline.splitlines())}\n'
              '- Structural QA: PASS\n',encoding='utf-8')
          print('COMPLETE RESULTS BUILD PASS')
          print('SHA-256:',digest)
          print('BYTES:',len(baseline.encode('utf-8')))
          print('LINES:',len(baseline.splitlines()))

      - name: Verify JavaScript and Q15 handoff
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'function continueAssessment(event)' 'AISCORE.NAYANET.APP 2026 08 21 447' >/dev/null
          grep -F 'state.finalizing=true' 'AISCORE.NAYANET.APP 2026 08 21 447' >/dev/null
          grep -F 'window.MAXESS_Q15_HANDOFF_V447=true;' 'AISCORE.NAYANET.APP 2026 08 21 447' >/dev/null
          grep -F 'results.nayanet.app/#maxess-result=' 'AISCORE.NAYANET.APP 2026 08 21 447' >/dev/null
          grep -F 'saveResponse();stopNaya();if(state.index===14)' 'AISCORE.NAYANET.APP 2026 08 21 447' >/dev/null
          python - <<'PY'
          import re, subprocess, tempfile
          for filename in ['AISCORE.NAYANET.APP 2026 08 21 447','MAXESS-RESULTS-INTEGRATED-V1.html']:
              s=open(filename,encoding='utf-8').read()
              for js in re.findall(r'<script\b[^>]*>(.*?)</script\s*>',s,re.I|re.S):
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(js); name=f.name
                  subprocess.run(['node','--check',name],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          print('NODE SYNTAX PASS')
          PY

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAXESS-RESULTS-INTEGRATED-V1
          path: |
            MAXESS-RESULTS-INTEGRATED-V1.html
            MAXESS-COMPLETE-INTEGRATED-BUILD.md

      - name: Commit verified artifact
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add 'AISCORE.NAYANET.APP 2026 08 21 447' 'MAXESS-RESULTS-INTEGRATED-V1.html' 'MAXESS-COMPLETE-INTEGRATED-BUILD.md'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'MAXESS: harden final Results build and bridge validation'
          git push origin main

# Scope lock: E01-E04 dynamic only; E05-E09 preserved. No redesign. No new Results renderer.
