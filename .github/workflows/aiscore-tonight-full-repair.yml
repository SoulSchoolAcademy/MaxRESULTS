name: AIScore Tonight Full Repair

on:
  push:
    paths:
      - '.github/workflows/aiscore-tonight-full-repair.yml'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/maxess-aiscore-tonight-full-repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: maxess-aiscore-tonight-full-repair
          fetch-depth: 0

      - name: Surgical repair of full AIScore artifact
        shell: python
        run: |
          from pathlib import Path
          path = Path('AIScoreMAXESS code')
          source = path.read_text(encoding='utf-8')
          original_len = len(source)

          source = source.replace("const RESULTS_URL = 'https://results.nayanet.app/';", "const RESULTS_URL = 'https://results.kninet.app/';")
          source = source.replace("window.location.assign(`${RESULTS_URL}#maxess-result=${encoded}`);", "window.location.assign(`${RESULTS_URL}?result=${encodeURIComponent(encoded)}#maxess-result=${encoded}`);")
          source = source.replace('https://i.postimg.cc/bw4fyKF8/Naya-Profile-black-face-zoom.jpg', 'https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg')

          css = r'''
/* NAYA HUMAN PRESENCE — SURGICAL V2 */
.interstitial{place-items:center!important;padding:20px!important;background:radial-gradient(circle at 50% 42%,rgba(86,35,151,.30),rgba(7,2,16,.78) 48%,rgba(0,0,0,.94) 82%)!important;backdrop-filter:blur(22px) saturate(115%)!important;-webkit-backdrop-filter:blur(22px) saturate(115%)!important}
.teaching-cloud{width:min(720px,calc(100vw - 32px))!important;min-height:390px;padding:58px 58px 42px!important;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center!important;border-radius:42px!important;background:radial-gradient(circle at 52% 0%,rgba(142,91,255,.34),transparent 43%),radial-gradient(circle at 0% 100%,rgba(92,42,184,.18),transparent 42%),linear-gradient(145deg,#24113f 0%,#160c29 48%,#0a0612 100%)!important;border:1px solid rgba(202,174,255,.48)!important;box-shadow:0 45px 120px rgba(0,0,0,.78),0 0 100px rgba(116,62,255,.28),inset 0 1px 0 rgba(255,255,255,.15),inset 0 -30px 60px rgba(0,0,0,.22)!important;overflow:visible!important}
.teaching-cloud:before{content:"";position:absolute;inset:8px;border-radius:35px;border:1px solid rgba(255,255,255,.055);pointer-events:none}
.teaching-cloud .cloud-icon{display:none!important}
.maxess-naya-human{position:absolute;top:-42px;right:34px;width:96px;height:96px;padding:4px;border-radius:50%;background:linear-gradient(145deg,#fff,#d9c6ff 45%,#8754ed 100%);box-shadow:0 0 0 7px rgba(138,92,255,.14),0 0 40px rgba(138,92,255,.42),0 18px 40px rgba(0,0,0,.58);z-index:8}
.maxess-naya-human img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 18%;border-radius:50%;border:2px solid rgba(255,255,255,.94)}
.cloud-eyebrow{margin-top:8px!important;color:rgba(255,255,255,.62)!important;font-size:9px!important;letter-spacing:.18em!important}
.cloud-title{max-width:560px;margin-top:10px!important;color:#fff!important;font-family:Georgia,"Times New Roman",serif!important;font-size:clamp(34px,5vw,52px)!important;font-weight:400!important;letter-spacing:-.045em!important;line-height:.98!important;text-shadow:0 4px 30px rgba(0,0,0,.42),0 0 35px rgba(184,149,255,.18)}
.cloud-body{max-width:570px!important;margin:18px auto 0!important;color:rgba(255,255,255,.86)!important;font-size:clamp(16px,2vw,19px)!important;line-height:1.62!important;font-weight:500!important}
.cloud-actions{width:100%;max-width:520px;margin-top:28px!important;display:flex!important;justify-content:center!important;gap:12px!important}
.cloud-button{min-height:56px!important;border-radius:18px!important;padding:0 27px!important;background:rgba(7,4,13,.72)!important;border:1px solid rgba(221,205,255,.55)!important;box-shadow:0 14px 30px rgba(0,0,0,.35),0 0 28px rgba(138,92,255,.14)!important}
.cloud-button:hover{transform:translateY(-2px);border-color:#fff!important;box-shadow:0 18px 38px rgba(0,0,0,.48),0 0 38px rgba(138,92,255,.28)!important}
@media(max-width:600px){.interstitial{padding:16px!important}.teaching-cloud{width:min(100%,calc(100vw - 24px))!important;min-height:430px;padding:62px 23px 28px!important;border-radius:30px!important}.maxess-naya-human{top:-34px;right:22px;width:78px;height:78px}.cloud-title{font-size:clamp(31px,9vw,43px)!important}.cloud-body{font-size:15px!important;line-height:1.55!important}.cloud-actions{flex-direction:column!important}.cloud-button{width:100%!important}}
@media(prefers-reduced-motion:reduce){.teaching-cloud{animation:none!important}.cloud-button{transition:none!important}}
'''
          if 'NAYA HUMAN PRESENCE — SURGICAL V2' not in source:
              idx=source.rfind('</style>')
              if idx<0: raise SystemExit('No closing style tag')
              source=source[:idx]+css+'\n'+source[idx:]

          js = r'''
/* NAYA HUMAN PRESENCE — RUNTIME ENHANCEMENT */
(function(){
'use strict';
const NAYA_IMAGE='https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg';
let welcomeShown=false;
function enhanceCloud(){
 const i=document.getElementById('teachingInterstitial'); if(!i||!i.classList.contains('visible')) return;
 const c=i.querySelector('.teaching-cloud'); if(!c) return;
 let p=c.querySelector('.maxess-naya-human');
 if(!p){p=document.createElement('div');p.className='maxess-naya-human';p.innerHTML='<img src="'+NAYA_IMAGE+'" alt="Naya" loading="eager">';c.appendChild(p)}
 const e=c.querySelector('.cloud-eyebrow'),t=c.querySelector('.cloud-title'),b=c.querySelector('.cloud-body');
 if(!welcomeShown){welcomeShown=true;if(e)e.textContent='A LITTLE TIME TOGETHER';if(t)t.textContent="I'm here.";if(b)b.innerHTML="Let's look at this together.<br><br>I'll walk you through the questions and help you understand what they're really asking. Just answer based on what you actually do today — not what you think you should be doing.";const primary=c.querySelector('.cloud-button:not(.secondary)');if(primary)primary.textContent="LET'S GO →";const secondary=c.querySelector('.cloud-button.secondary');if(secondary)secondary.textContent='LISTEN TO NAYA'}else{if(e)e.textContent='A QUICK THOUGHT FROM NAYA'}
}
new MutationObserver(enhanceCloud).observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class']});document.addEventListener('DOMContentLoaded',enhanceCloud,{once:true});setTimeout(enhanceCloud,200);
})();
'''
          if 'NAYA HUMAN PRESENCE — RUNTIME ENHANCEMENT' not in source:
              idx=source.rfind('</body>')
              if idx<0: raise SystemExit('No closing body tag')
              source=source[:idx]+'<script>'+js+'</script>\n'+source[idx:]

          checks={
            'size':len(source)>=original_len*.97,
            'contract':'MAXESS_RESULT_V1' in source,
            'assessment':'MAXESS_ASSESSMENT' in source,
            'flow':'Continue to My Report' in source,
            'app':'https://results.kninet.app/' in source,
            'query':'?result=${encodeURIComponent(encoded)}' in source,
            'naya':'Naya%20Profile%206.jpg' in source,
            'human':'NAYA HUMAN PRESENCE — RUNTIME ENHANCEMENT' in source,
          }
          print(checks)
          if not all(checks.values()): raise SystemExit('Guardrail failure: '+str(checks))
          path.write_text(source,encoding='utf-8')
          print(f'FULL ARTIFACT PRESERVED: {original_len} -> {len(source)} bytes; lines={len(source.splitlines())}')

      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add 'AIScoreMAXESS code'
          git commit -m 'MAXESS AIScore full surgical Naya and Results repair' || echo 'No changes to commit'
          git push origin maxess-aiscore-tonight-full-repair
