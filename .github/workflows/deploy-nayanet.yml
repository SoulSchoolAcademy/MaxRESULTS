name: Deploy NayaNET E02 to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE/**'
      - '.github/workflows/deploy-nayanet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Validate canonical release source
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html worker.js wrangler.jsonc naya-data.js nayanet-10.js powercasts.json; do test -s "$f"; done
          node --check worker.js
          node --check naya-data.js
          node --check nayanet-10.js
          node - <<'NODE'
          const fs=require('fs');
          const casts=JSON.parse(fs.readFileSync('powercasts.json','utf8'));
          if(!Array.isArray(casts)||casts.length!==18) throw new Error('Expected 18 Powercasts');
          if(casts.some(c=>!c.n||!c.title||!c.image||!c.audio)) throw new Error('Incomplete Powercast');
          NODE
          grep -Fq '"main": "worker.js"' wrangler.jsonc
          grep -Fq '"directory": "./public"' wrangler.jsonc
          grep -Fq '"binding": "ASSETS"' wrangler.jsonc

      - name: Assemble exact Worker release package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-package
          mkdir -p release-package/public
          cp index.html nayanet-10-experience.css nayanet-elite.css nayanet-mobile-overflow.css nayanet-intelligence-feed.css nayanet-living-entrance.css nayanet-app-experience-polish.css nayanet-10.js naya-data.js nayanet-intelligence-feed.js powercasts.json _headers 404.html release-package/public/
          cp worker.js wrangler.jsonc release-package/
          test -s release-package/public/index.html
          test -s release-package/worker.js
          test -s release-package/wrangler.jsonc
          test "$(find release-package/public -maxdepth 1 -type f | wc -l | tr -d ' ')" -ge 13

      - name: Deploy exact commit to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE/release-package
          command: deploy --config wrangler.jsonc

      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          echo "NayaNET Cloudflare Worker deployed from commit: $GITHUB_SHA"
          echo "Worker name: nayanet-living-intelligence"
