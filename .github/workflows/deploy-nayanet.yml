name: Deploy NayaNET E02 to Cloudflare Review

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE/**'
      - '.github/workflows/deploy-nayanet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy E02 to Cloudflare Pages review project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
          command: pages deploy . --project-name nayanet
