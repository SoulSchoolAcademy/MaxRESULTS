name: Deploy NayaNET E02 to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE/**'
      - '.github/workflows/deploy-nayanet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Validate Cloudflare Worker release contract
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s worker.js
          test -s wrangler.jsonc
          test -s naya-data.js
          test -s nayanet-10.js
          test -s powercasts.json
          node --check worker.js
          node --check naya-data.js
          node --check nayanet-10.js
          node - <<'NODE'
          const fs=require('fs');
          const casts=JSON.parse(fs.readFileSync('powercasts.json','utf8'));
          if(!Array.isArray(casts)||casts.length!==18) throw new Error('Expected 18 Powercasts');
          if(casts.some(c=>!c.n||!c.title||!c.image||!c.audio)) throw new Error('Incomplete Powercast');
          NODE
          grep -Fq '"main": "worker.js"' wrangler.jsonc
          grep -Fq '"directory": "./public"' wrangler.jsonc
          grep -Fq '"binding": "ASSETS"' wrangler.jsonc
          echo "NayaNET Cloudflare Worker contract: OK"

      - name: Deploy exact commit to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
          command: deploy --config wrangler.jsonc --yes

      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          echo "NayaNET Cloudflare Worker deployed from commit: $GITHUB_SHA"
          echo "Worker name: nayanet-living-intelligence"
