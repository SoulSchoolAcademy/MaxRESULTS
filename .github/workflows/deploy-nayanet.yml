name: Deploy NayaNET E02 to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE/**'
      - '.github/workflows/deploy-nayanet.yml'
  workflow_dispatch:

permissions:
  contents: read

# Critical release-integrity rule: never let an older commit finish after a newer one.
concurrency:
  group: nayanet-e02-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Validate canonical release source
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html hub.html worker.js wrangler.jsonc naya-data.js nayanet-10.js nayanet-entrance.js powercasts.json; do test -s "$f"; done
          node --check worker.js
          node --check naya-data.js
          node --check nayanet-10.js
          node --check nayanet-entrance.js
          if test -f nayanet-intelligence-feed.js; then node --check nayanet-intelligence-feed.js; fi
          node - <<'NODE'
          const fs=require('fs');
          const casts=JSON.parse(fs.readFileSync('powercasts.json','utf8'));
          if(!Array.isArray(casts)||casts.length!==18) throw new Error('Expected 18 Powercasts');
          if(casts.some(c=>!c.n||!c.title||!c.image||!c.audio)) throw new Error('Incomplete Powercast');
          NODE
          grep -Fq '"main": "worker.js"' wrangler.jsonc
          grep -Fq '"directory": "."' wrangler.jsonc
          grep -Fq '"binding": "ASSETS"' wrangler.jsonc
          grep -Fq 'id="entryForm"' index.html
          grep -Fq 'id="nameInput"' index.html
          grep -Fq 'id="hub"' hub.html

      - name: Verify active Front Door authority
        shell: bash
        run: |
          set -euo pipefail
          for f in nayanet-front-door-canonical.css nayanet-front-door-10-authority.css nayanet-entrance.js naya-data.js; do test -s "$f"; done
          grep -Fq 'nayanet-front-door-canonical.css' index.html
          grep -Fq 'nayanet-front-door-10-authority.css' index.html
          grep -Fq 'nayanet-entrance.js' index.html
          grep -Fq 'naya-data.js' index.html
          if grep -Fq 'nayanet-entrance-page.css' index.html; then echo 'ERROR: obsolete entrance stylesheet still referenced'; exit 1; fi
          if grep -Fq 'nayanet-10-experience.css' index.html; then echo 'ERROR: obsolete experience stylesheet still referenced'; exit 1; fi
          jewels=$(grep -o 'class="jewel"' index.html | wc -l)
          test "$jewels" -eq 48

      - name: Inspect release artifact contract
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s nayanet-front-door-canonical.css
          test -s nayanet-front-door-10-authority.css
          test -s nayanet-entrance.js
          test -s naya-data.js
          grep -Fq 'NayaNET' index.html
          grep -Fq 'Naya' index.html
          grep -Fq 'ENTER NAYANET' index.html
          grep -Fq '2026-09-02-front-door-10' index.html

      - name: Deploy exact canonical runtime to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
          command: deploy --config wrangler.jsonc

      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          echo "NayaNET Cloudflare Worker deployed from commit: $GITHUB_SHA"
          echo "Worker name: nayanet-living-intelligence"
