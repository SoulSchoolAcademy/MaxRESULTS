name: NayaNET surgical cleanup
on:
  push:
    branches: [nayanet-hub-release]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate statement blocks
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          phrase = 'Your life creates intelligence every day. Naya helps you capture it, understand it, remember it, compound it, and use it.'
          marker = '<!-- NAYANET-SURGICAL-QUOTE-CLEANUP -->'
          end = s.find('</body></html>')
          if end < 0:
              raise SystemExit('document end not found')
          start = s.find(marker)
          if start >= 0:
              s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Removed malformed surgical cleanup block.')
          print('Remaining exact phrase occurrences in source:', s.count(phrase))
          print('index.html bytes:', len(s.encode('utf-8')))
      - name: Commit surgical change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No source change needed"
          else
            git commit -m "Remove duplicate Intelligent Hub statement blocks"
            git push
          fi
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/nayanet-surgical-cleanup.yml || true
          git commit -m "Remove temporary surgical cleanup workflow" || true
          git push || true
