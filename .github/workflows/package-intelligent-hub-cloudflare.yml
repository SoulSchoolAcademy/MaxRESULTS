name: Package NayaNET Intelligent Hub for Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'NAYAHUB.html'
      - 'nayanet-hub-collections.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/**'
      - 'scripts/nayanet-hub-authority-correction.js'
      - 'scripts/nayanet-hub-final-polish.js'
      - 'scripts/nayanet-hub-final-execution.js'
      - '.github/workflows/package-intelligent-hub-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build canonical Hub from NAYAHUB.html
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          html=Path('NAYAHUB.html').read_text(encoding='utf-8')
          test=html
          layers=[
            ('NAYANET-NAYAHUB-INTELLIGENCE-LAYER','CLOUDFLARE-INTELLIGENT-HUB-V7/nayanet-v7-surgical-integration.js','nayanet-nayahub-intelligence'),
            ('NAYANET-NAYAHUB-COLLECTIONS-LAYER','nayanet-hub-collections.js','nayanet-nayahub-collections'),
            ('NAYANET-CANONICAL-HUB-AUTHORITY-V1','scripts/nayanet-hub-authority-correction.js','nayanet-canonical-hub-authority'),
            ('NAYANET-CANONICAL-HUB-FINAL-POLISH-V1','scripts/nayanet-hub-final-polish.js','nayanet-canonical-hub-final-polish'),
            ('NAYANET-HUB-FINAL-EXECUTION-V1','scripts/nayanet-hub-final-execution.js','nayanet-hub-final-execution')]
          for marker,path,sid in layers:
              body=Path(path).read_text(encoding='utf-8')
              if marker not in test:
                  test=test.replace('</body>',f'\n<!-- {marker} -->\n<script id="{sid}">\n{body}\n</script>\n</body>',1)
          assert test.count('<!doctype html>')==1 and test.count('</html>')==1
          assert len(test)>100000
          for needle in ['Your Intelligence Today','SMART NOTES','Intelligent Library','DAILY INTELLIGENCE BRIEFING','SHARE TO COLLECTIVE','SAVE TO MY INTELLIGENCE','NAYANET-HUB-FINAL-EXECUTION-V1']:
              assert needle in test,needle
          assert 'prompt(' not in test
          Path('index.html').write_text(test,encoding='utf-8')
          Path('_redirects').write_text('/intelligence/* /index.html 200\n',encoding='utf-8')
          Path('dist').mkdir(exist_ok=True)
          with zipfile.ZipFile('dist/NayaNET-Intelligent-Hub-Cloudflare.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write('index.html','index.html'); z.write('_redirects','_redirects')
          with zipfile.ZipFile('dist/NayaNET-Intelligent-Hub-Cloudflare.zip') as z:
              assert z.namelist()==['index.html','_redirects']
              assert z.getinfo('index.html').file_size>100000
          print('CANONICAL_HUB_RELEASE_OK',len(test))
          PY

      - name: Upload verified Cloudflare ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-Cloudflare
          path: dist/NayaNET-Intelligent-Hub-Cloudflare.zip
          if-no-files-found: error
          retention-days: 30
