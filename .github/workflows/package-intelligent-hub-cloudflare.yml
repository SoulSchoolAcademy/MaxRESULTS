name: Package NayaNET Intelligent Hub for Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'CLOUDFLARE-INTELLIGENT-HUB-V6/**'
      - '.github/workflows/package-intelligent-hub-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Validate V6 Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          test -s CLOUDFLARE-INTELLIGENT-HUB-V6/index.html
          test -s CLOUDFLARE-INTELLIGENT-HUB-V6/_headers
          test -s CLOUDFLARE-INTELLIGENT-HUB-V6/README.md
          test "$(find CLOUDFLARE-INTELLIGENT-HUB-V6 -maxdepth 1 -type f | wc -l)" -eq 3
          grep -Fq 'NayaNET' CLOUDFLARE-INTELLIGENT-HUB-V6/index.html
          grep -Fq 'GOOD MORNING' CLOUDFLARE-INTELLIGENT-HUB-V6/index.html
          grep -Fq 'LISTEN TO NAYA' CLOUDFLARE-INTELLIGENT-HUB-V6/index.html
          grep -Fq 'PERSONAL SUPERBRAIN' CLOUDFLARE-INTELLIGENT-HUB-V6/index.html
          grep -Fq 'MAKE DIGITAL OBJECTS FEEL PHYSICAL' CLOUDFLARE-INTELLIGENT-HUB-V6/README.md
          echo "Source commit: $(git rev-parse HEAD)"
          echo 'Cloudflare V6 package validation passed.'

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd CLOUDFLARE-INTELLIGENT-HUB-V6
          zip -q -r ../dist/nayanet-intelligent-hub-cloudflare-v6.zip index.html _headers README.md
          cd ..
          sha256sum dist/nayanet-intelligent-hub-cloudflare-v6.zip | tee dist/SHA256SUM.txt
          test -s dist/nayanet-intelligent-hub-cloudflare-v6.zip
          test -s dist/SHA256SUM.txt

      - name: Upload Cloudflare ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: nayanet-intelligent-hub-cloudflare-v6
          path: |
            dist/nayanet-intelligent-hub-cloudflare-v6.zip
            dist/SHA256SUM.txt
          if-no-files-found: error
          retention-days: 30
