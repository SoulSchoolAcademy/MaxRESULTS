name: V7 Smart Note Safe Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'V7 EXECUTE SMART NOTE PATCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing V7 source in place
        shell: python
        run: |
          from pathlib import Path
          p=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* V7_SMART_NOTE_RUNTIME_V2 */'
          if marker in s:
              print('Patch already present; no source change required.')
              raise SystemExit(0)
          if '</body></html>' not in s:
              raise SystemExit('SOURCE_INTEGRITY_ABORT: expected closing body/html markers')
          patch=r'''<script>
/* V7_SMART_NOTE_RUNTIME_V2 */
(function(){
  const SUPABASE_URL='https://dahisasgpfvziswqvmvm.supabase.co';
  const CONFIG=SUPABASE_URL+'/functions/v1/v7-public-config';
  const PIPE=SUPABASE_URL+'/functions/v1/v7-smart-note';
  const NAYA=SUPABASE_URL+'/functions/v1/v7-naya-note';
  let sb=null, bootPromise=null, lastKey=null;
  const status=(text,good=false)=>{['reportStatus','connectionStatus'].forEach(id=>{const e=document.getElementById(id);if(e){e.textContent=text;e.classList.toggle('good',good)}})};
  async function boot(){
    if(bootPromise)return bootPromise;
    bootPromise=(async()=>{
      const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      const cfg=await fetch(CONFIG,{headers:{Accept:'application/json'}}).then(async r=>{const j=await r.json();if(!r.ok||!j.ok||!j.supabase_url||!j.publishable_key)throw new Error('SUPABASE_PUBLIC_CLIENT_UNAVAILABLE');return j});
      sb=mod.createClient(cfg.supabase_url,cfg.publishable_key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      let {data}=await sb.auth.getSession();
      if(!data.session){const x=await sb.auth.signInAnonymously();if(x.error)throw new Error('ANONYMOUS_AUTH_UNAVAILABLE: '+x.error.message);data=x.data}
      if(!data.session)throw new Error('AUTHENTICATED_SESSION_NOT_ESTABLISHED');
      return data.session;
    })();
    return bootPromise;
  }
  async function rpc(name,args){const r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data}
  function localType(text){try{return noteType(text)}catch(_){return 'INSIGHT'}}
  function human(text){return{id:crypto.randomUUID(),text,type:localType(text),created_at:new Date().toISOString(),source:'v7_smart_note_composer',privacy:'private',status:'captured'}}
  async function preserve(h,key,stage,reason){const u=await sb.auth.getUser();const uid=u?.data?.user?.id;if(!uid)throw new Error('AUTHENTICATED_USER_REQUIRED');const data=await rpc('v7_preserve_smart_note_failure',{p_idempotency_key:key,p_user_id:uid,p_human_note:h,p_failure_stage:stage,p_failure_message:reason});localStorage.setItem('nayanet_v7_last_failure',JSON.stringify(data));return data}
  function ingest(tx){const h=tx.human_note||{};const id=tx.id||tx.machine_note?.event_id||h.id;const local={id,createdAt:h.created_at||tx.created_at||new Date().toISOString(),text:h.text||h.content||'',type:h.type||tx.machine_note?.type||'INSIGHT',pipeline:{human_note:h,naya_note:tx.naya_note||{},machine_note:tx.machine_note||{},intelligent_feed:tx.intelligent_feed||{},intelligent_block:tx.intelligent_block||{},evidence:tx.evidence||{},hub_state:tx.hub_state||{}}};const i=notes.findIndex(x=>x.id===id);if(i>=0)notes[i]=local;else notes.unshift(local);persist();renderNotes();updateMetrics();return local}
  async function create(text,key){await boot();const h=human(text);lastKey=key||crypto.randomUUID();status('HUMAN NOTE CAPTURED · NAYA INTELLIGENCE PROCESSING…');let nr;try{nr=await fetch(NAYA,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(await sb.auth.getSession()).data.session.access_token},body:JSON.stringify({human_note:h})})}catch(e){await preserve(h,lastKey,'naya_note',String(e));status('BLOCKED AT NAYA NOTE · provider unreachable · Human Note preserved. Recovery: configure Naya provider and retry.');return{ok:false,blocked_stage:'naya_note',reason:String(e)}}const nd=await nr.json().catch(()=>null);if(!nr.ok||!nd?.ok||!nd?.naya_note){const reason=nd?.reason||nd?.error||'Naya intelligence provider unavailable.';await preserve(h,lastKey,'naya_note',reason);status('BLOCKED AT NAYA NOTE · '+reason+' · Human Note preserved.',false);return{ok:false,blocked_stage:'naya_note',reason,human_note:h}}const session=(await sb.auth.getSession()).data.session;const pr=await fetch(PIPE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':(await fetch(CONFIG).then(r=>r.json())).publishable_key,'x-idempotency-key':lastKey},body:JSON.stringify({human_note:h,naya_note:nd.naya_note,idempotency_key:lastKey,source:'v7_smart_note_composer'})});const pd=await pr.json().catch(()=>null);if(!pr.ok||!pd?.ok){const reason=pd?.detail||pd?.error||'Smart Note transaction failed.';await preserve(h,lastKey,'smart_note_pipeline',reason);status('BLOCKED AT SMART NOTE PIPELINE · '+reason+' · Human Note preserved.');return{ok:false,blocked_stage:'smart_note_pipeline',reason,human_note:h}}const tx=Array.isArray(pd.transaction)?pd.transaction[0]:pd.transaction;ingest(tx||{});status('VERIFIED · HUMAN → NAYA → MACHINE → INTELLIGENT FEED → BLOCK → HUB → EVIDENCE → PERSISTENCE',true);return{ok:true,transaction:tx}}
  async function hydrate(){await boot();const rows=await rpc('v7_list_smart_notes',{});(rows||[]).forEach(ingest);return rows||[]}
  window.V7SmartNoteRuntime={create,hydrate,duplicateLast:async()=>{if(!lastKey)throw new Error('NO_LAST_IDEMPOTENCY_KEY');await boot();const h=human(document.getElementById('noteInput')?.value?.trim()||notes[0]?.text||'');const s=(await sb.auth.getSession()).data.session;const cfg=await fetch(CONFIG).then(r=>r.json());const nr=await fetch(NAYA,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify({human_note:h})});const nd=await nr.json();if(!nr.ok||!nd.ok)throw new Error('NAYA_STAGE_NOT_AVAILABLE');const pr=await fetch(PIPE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':cfg.publishable_key,'x-idempotency-key':lastKey},body:JSON.stringify({human_note:h,naya_note:nd.naya_note,idempotency_key:lastKey,source:'v7_duplicate_test'})});return pr.json()}};
  document.addEventListener('click',async e=>{const b=e.target.closest('#saveNote');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const input=document.getElementById('noteInput');const text=input?.value?.trim();if(!text){input?.focus();return}b.disabled=true;b.textContent='PROCESSING…';try{const r=await create(text);if(r.ok){input.value='';showPage('notes')} }catch(err){status('SMART NOTE EXECUTION BLOCKED · '+(err.message||err))}finally{b.disabled=false;b.textContent='CREATE INTELLIGENT BLOCK'}},true);
  window.addEventListener('load',()=>hydrate().catch(err=>console.warn('V7 persistence hydration blocked:',err.message)));
})();
</script>'''
          before=len(s)
          s=s.replace('</body></html>',patch+'\n</body></html>',1)
          if len(s)<=before: raise SystemExit('SOURCE_INTEGRITY_ABORT: patch did not change source')
          p.write_text(s,encoding='utf-8')
          print('Patched existing index.html in place; source was preserved.')
      - name: Verify source integrity
        run: |
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -q 'V7_SMART_NOTE_RUNTIME_V2' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -q '<!doctype html>' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
      - name: Commit patched source and remove patch workflow
        run: |
          git config user.name 'Naya Power Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          git commit -m 'V7 wire Smart Note application runtime'
          git rm .github/workflows/v7-smart-note-safe-patch.yml
          git commit -m 'Remove one-time V7 Smart Note patch workflow'
          git push
