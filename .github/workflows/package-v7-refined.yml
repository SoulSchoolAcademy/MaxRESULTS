name: Package V7 Refined Hub

on:
  push:
    branches: [main]
    paths:
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/**'
      - '.github/workflows/package-v7-refined.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V7 source
        uses: actions/checkout@v4
      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/v7-smart-note-runtime.js
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/v7-release-enhancements.js
          grep -Fq 'v7-release-enhancements.js' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'NayaNET — Intelligent Hub V7' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          node --check CLOUDFLARE-INTELLIGENT-HUB-V7/v7-release-enhancements.js
          python - <<'PY'
          from pathlib import Path
          p=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html')
          s=p.read_text()
          assert s.count('<html')==1 and s.count('</html>')==1
          assert p.name=='index.html'
          print('index.html bytes:',len(s.encode()))
          print('refinement bytes:',Path('CLOUDFLARE-INTELLIGENT-HUB-V7/v7-release-enhancements.js').stat().st_size)
          PY
          rm -f NayaNET-Intelligent-Hub-V7-Refined.zip
          zip -qr NayaNET-Intelligent-Hub-V7-Refined.zip CLOUDFLARE-INTELLIGENT-HUB-V7
      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-V7-Refined
          path: NayaNET-Intelligent-Hub-V7-Refined.zip
          if-no-files-found: error
