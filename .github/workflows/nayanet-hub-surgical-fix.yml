name: NayaNET Hub Surgical Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved Hub-only repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('NAYANETHUB.html'); s=p.read_text(encoding='utf-8')
          for name in ['addTodayNav','createTodayPage','activateToday','labelHome','normalizeTopbar','buildToday','sourceItems','todaySnapshot']:
              s=re.sub(r'<script[^>]*>.*?'+re.escape(name)+r'.*?</script>', '', s, flags=re.I|re.S)
          s=re.sub(r'<style[^>]*>.*?nh-v11-today.*?</style>', '', s, flags=re.I|re.S)
          s=s.replace('Your Intelligence Today','').replace('Daily Intelligence Briefing','')
          s=re.sub(r'<script[^>]*id=["\']nayanet-approved-hub-runtime["\'][^>]*>.*?</script>', '', s, flags=re.I|re.S)
          runtime=r'''<script id="nayanet-approved-hub-runtime">(()=>{const A={p:'Personal Feed',c:'Collective Feed',l:'Smart Lists',n:'Smart Notes'},N=()=>document.querySelector('.nav'),q=t=>(t||'').replace(/\s+/g,' ').trim().toLowerCase();function nav(){const n=N();if(!n)return;[...n.querySelectorAll('button')].forEach(b=>{let t=q(b.textContent);if(t==='your intelligence today'||t==='daily intelligence briefing')b.remove()});let seen={};[...n.querySelectorAll('button')].forEach(b=>{let t=q(b.textContent);if([A.n,A.p,A.c,A.l].map(q).includes(t)){if(seen[t])b.remove();else seen[t]=1}});[[A.p,'personal-feed'],[A.c,'collective-feed'],[A.l,'smart-lists']].forEach(([l,id])=>{let b=[...n.querySelectorAll('button')].find(x=>q(x.textContent)===q(l));if(!b){b=document.createElement('button');b.textContent=l;n.appendChild(b)}b.dataset.nayaPage=id;b.onclick=()=>show(id,b)})}function page(id,t,s){let e=document.getElementById('page-'+id);if(!e){e=document.createElement('section');e.id='page-'+id;e.className='page';e.innerHTML='<div class="pageHead"><div><h1>'+t+'</h1><p>'+s+'</p></div></div><div class="surface" style="padding:20px"><div data-list="'+id+'"></div></div>';document.querySelector('.main')?.appendChild(e)}}function show(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+id)?.classList.add('active');N()?.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))}function fill(){let p=document.querySelector('[data-list="personal-feed"]'),c=document.querySelector('[data-list="collective-feed"]'),l=document.querySelector('[data-list="smart-lists"]');if(p&&!p.children.length)p.innerHTML='<article class="note"><div class="noteTop"><span>PERSONAL</span><span class="type">PRIVATE</span></div><div class="noteBody"><h3>Your private intelligence lives here.</h3><p>Personal notes remain private unless you deliberately share them externally or circulate them to Collective.</p></div><div class="noteTabs"><button class="noteTab">SHARE</button><button class="noteTab">CIRCULATE TO COLLECTIVE</button><button class="noteTab">SAVE TO LIST</button></div></article>';if(c&&!c.children.length)c.innerHTML='<article class="note"><div class="noteTop"><span>COLLECTIVE</span><span class="type">SOCIAL</span></div><div class="noteBody"><h3>Collective intelligence.</h3><p>The social layer for intentionally shared intelligence.</p></div><div class="noteTabs"><button class="noteTab">LIKE</button><button class="noteTab">COMMENT</button><button class="noteTab">SAVE</button><button class="noteTab">SHARE</button></div></article>';if(l&&!l.children.length)l.innerHTML='<article class="note"><div class="noteTop"><span>SMART LIST</span><span class="type">ORGANIZED</span></div><div class="noteBody"><h3>Organize what matters.</h3><p>Personal and Collective blocks can coexist here. Saving is organization, never publication.</p></div><div class="noteTabs"><button class="noteTab">OPEN LIST</button></div></article>'}function ctx(){let r=document.querySelector('.topbar');if(!r)return;let e=document.getElementById('nayanet-local-context');if(!e){e=document.createElement('div');e.id='nayanet-local-context';e.style.cssText='position:absolute;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;letter-spacing:.06em;color:#bdb8c7;text-align:center;white-space:nowrap;pointer-events:none';r.appendChild(e)}let d=new Date(),h=d.getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';e.textContent=g+', Shawn · '+d.toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})+' · Canada'}function boot(){nav();page('personal-feed',A.p,'Your private intelligence. Not social.');page('collective-feed',A.c,'The social layer for intentionally shared intelligence.');page('smart-lists',A.l,'Personal and Collective blocks can coexist here.');fill();ctx()}document.readyState==='loading'?document.addEventListener('DOMContentLoaded',boot):boot();setInterval(ctx,30000)})()</script>'''
          s=s.replace('</body>',runtime+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'NayaNET Surgical Repair'
          git config user.email 'actions@github.com'
          git add NAYANETHUB.html
          git diff --cached --quiet || (git commit -m 'Surgical repair: approved Hub experience' && git push)
