name: NayaNET Hub Surgical Fix

on:
  push:
    paths:
      - '.github/workflows/nayanet-hub-surgical-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical Hub patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('NAYANETHUB.html')
          s = p.read_text(encoding='utf-8')
          marker = 'NAYANET-HUB-SURGICAL-FIX-2026-09-06'
          if marker in s:
              print('Patch already present; nothing to do.')
              raise SystemExit(0)
          dedupe = r'''<script id="nayanet-hub-surgical-fix">
          (function(){
            'use strict';
            var q=function(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));};
            var esc=function(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'})[c]});};
            var storeKey='nayanetHubV7Notes';
            function notes(){try{return JSON.parse(localStorage.getItem(storeKey)||'[]')}catch(e){return[]}}
            function saveNotes(a){try{localStorage.setItem(storeKey,JSON.stringify(a))}catch(e){}}
            function timeLabel(){var d=new Date(),h=d.getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';return {g:g,date:d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}),time:d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}),country:'Canada'}}
            function ensureStyles(){if(document.getElementById('nh-surgical-style'))return;var st=document.createElement('style');st.id='nh-surgical-style';st.textContent='.nh-context{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nh-context span{padding:7px 10px;border:1px solid #ffffff20;border-radius:999px;background:#09090e;color:#aaa4b1;font-size:8px;font-weight:900;letter-spacing:.06em}.nh-context .live{border-color:#55e39a55;color:#caffdf}.nh-feed-grid{display:grid;gap:12px}.nh-feed-card{padding:17px;border:1px solid #ffffff18;border-radius:18px;background:linear-gradient(145deg,#121219,#09090d);box-shadow:inset 0 1px #fff3,0 15px 32px #0008}.nh-feed-card h3{margin:0 0 7px;font-size:16px}.nh-feed-card p{margin:0;color:#d0cad5;font-size:11px;line-height:1.6}.nh-feed-meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px;color:#8e8895;font-size:7px;font-weight:900;letter-spacing:.08em}.nh-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.nh-action{min-height:34px;padding:0 10px;border:1px solid #8b63ff55;border-radius:10px;background:#08080c;color:#fff;font-size:7px;font-weight:1000;cursor:pointer}.nh-action:hover{border-color:#d86cff}.nh-list{display:grid;gap:10px}.nh-list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid #ffffff16;border-radius:14px;background:#09090d}.nh-list-row b{font-size:10px}.nh-list-row span{color:#99939f;font-size:8px}.nh-empty{padding:35px 20px;text-align:center;border:1px dashed #8b63ff44;border-radius:16px;color:#9e98a5;font-size:10px;line-height:1.6}';document.head.appendChild(st)}
            function dedupeNav(){var seen=false;q('button[data-page="notes"]').forEach(function(b){if(!seen){seen=true}else{b.remove()}})}
            function addContext(){var hero=document.querySelector('#page-home .heroIntro');if(!hero)return;var h=hero.querySelector('h1');if(h){var t=timeLabel();h.textContent=t.g+', Shawn.'}var old=document.getElementById('nh-local-context');if(old)old.remove();var t=timeLabel(),d=document.createElement('div');d.id='nh-local-context';d.className='nh-context';d.innerHTML='<span class="live">LOCAL TIME · '+esc(t.time)+'</span><span>'+esc(t.date)+'</span><span>'+esc(t.country)+'</span>';hero.appendChild(d)}
            function navButton(label,icon,page,group){var target=null;q('.navlabel').forEach(function(x){if(x.textContent.trim()===group)target=x.nextElementSibling});if(!target)return;if(target.querySelector('button[data-page="'+page+'"]'))return;var b=document.createElement('button');b.setAttribute('data-page',page);b.innerHTML='<span class="ico">'+icon+'</span>'+label;target.appendChild(b)}
            function makePage(id,title,eyebrow,desc){if(document.getElementById(id))return null;var s=document.createElement('section');s.className='page';s.id=id;s.innerHTML='<div class="pageHead"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p>'+desc+'</p></div></div><div id="'+id+'-content"></div>';document.querySelector('main').appendChild(s);return s}
            function showPage(id,title){q('.page').forEach(function(p){p.classList.toggle('active',p.id===id)});q('.nav button[data-page]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-page')===id)});var pt=document.getElementById('pageTitle');if(pt)pt.textContent=title;window.scrollTo({top:0,behavior:'smooth'})}
            function personalCard(n,i){return '<article class="nh-feed-card"><div class="nh-feed-meta"><span>PERSONAL · '+esc(n.type||'NOTE')+'</span><span>'+esc(n.date||'JUST NOW')+'</span></div><h3>'+esc(n.title||'Smart Note')+'</h3><p>'+esc(n.text||n.body||'')+'</p><div class="nh-actions"><button class="nh-action" data-share="'+i+'">SHARE</button><button class="nh-action" data-circulate="'+i+'">CIRCULATE TO COLLECTIVE</button><button class="nh-action" data-save="'+i+'">SAVE TO LIST</button></div></article>'}
            function renderPersonal(){var c=document.getElementById('page-personal-feed-content');if(!c)return;var ns=notes();c.innerHTML=ns.length?'<div class="nh-feed-grid">'+ns.map(personalCard).join('')+'</div>':'<div class="nh-empty">Your Personal Feed is private by default. Create a Smart Note and it will appear here.</div>';q('[data-share]',c).forEach(function(b){b.onclick=function(){var n=ns[+b.dataset.share]||{};var text=(n.title||'Smart Note')+' — '+(n.text||n.body||'');if(navigator.share)navigator.share({title:n.title||'NayaNET Smart Note',text:text}).catch(function(){});else navigator.clipboard&&navigator.clipboard.writeText(text)}});q('[data-circulate]',c).forEach(function(b){b.onclick=function(){var n=ns[+b.dataset.circulate];if(!n)return;n.collectiveEligible=true;saveNotes(ns);alert('Marked for deliberate circulation to Collective.');renderPersonal()}});q('[data-save]',c).forEach(function(b){b.onclick=function(){localStorage.setItem('nayanetSmartListLast',String(+b.dataset.save));alert('Saved to Smart Lists.')}})}
            function renderCollective(){var c=document.getElementById('page-collective-feed-content');if(!c)return;var ns=notes().filter(function(n){return n.collectiveEligible});c.innerHTML=ns.length?'<div class="nh-feed-grid">'+ns.map(function(n,i){return '<article class="nh-feed-card"><div class="nh-feed-meta"><span>COLLECTIVE · DE-IDENTIFIED</span><span>'+esc(n.date||'RECENT')+'</span></div><h3>'+esc(n.title||'Collective Intelligence')+'</h3><p>'+esc(n.text||n.body||'')+'</p><div class="nh-actions"><button class="nh-action" data-like="'+i+'">LIKE</button><button class="nh-action" data-comment="'+i+'">COMMENT</button><button class="nh-action" data-savec="'+i+'">SAVE</button><button class="nh-action" data-sharec="'+i+'">SHARE</button></div></article>'}).join('')+'</div>':'<div class="nh-empty">Nothing has been deliberately circulated to Collective yet. Personal intelligence stays private until you choose to circulate it.</div>';q('[data-like],[data-comment],[data-savec],[data-sharec]',c).forEach(function(b){b.onclick=function(){if(b.dataset.comment){var x=prompt('Comment on this collective intelligence:');if(x)alert('Comment captured locally.')}else if(b.dataset.sharec){var x='Collective intelligence from NayaNET';if(navigator.share)navigator.share({title:x,text:x}).catch(function(){});else navigator.clipboard&&navigator.clipboard.writeText(x)}else if(b.dataset.savec){localStorage.setItem('nayanetCollectiveSaved',String(Date.now()));alert('Saved.')}else{b.textContent='LIKED'}}})}
            function renderLists(){var c=document.getElementById('page-smart-lists-content');if(!c)return;var ns=notes();c.innerHTML='<div class="nh-list"><div class="nh-list-row"><div><b>All Intelligence</b><span>Personal + Collective items</span></div><span>'+ns.length+' items</span></div><div class="nh-list-row"><div><b>Personal</b><span>Private intelligence</span></div><span>'+ns.length+' items</span></div><div class="nh-list-row"><div><b>Circulated</b><span>Deliberately shared to Collective</span></div><span>'+ns.filter(function(n){return n.collectiveEligible}).length+' items</span></div></div>'}
            function initPages(){navButton('Personal Feed','◉','personal-feed','PERSONAL');navButton('Smart Lists','☷','smart-lists','PERSONAL');navButton('Collective Feed','◉','collective-feed','COLLECTIVE');makePage('page-personal-feed','Personal Feed','PRIVATE INTELLIGENCE','Your private stream of Smart Notes. Saving organizes; it never publishes.');makePage('page-collective-feed','Collective Feed','COLLECTIVE INTELLIGENCE','The social layer. Only deliberately circulated, eligible intelligence appears here.');makePage('page-smart-lists','Smart Lists','ORGANIZE','Personal and Collective intelligence can coexist in your lists.');if(window.__nhSurgicalClickBound)return;window.__nhSurgicalClickBound=true;document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button[data-page]');if(!b)return;var id=b.getAttribute('data-page');if(id==='personal-feed'){showPage(id,'Personal Feed');renderPersonal()}else if(id==='collective-feed'){showPage(id,'Collective Feed');renderCollective()}else if(id==='smart-lists'){showPage(id,'Smart Lists');renderLists()}})}
            function refresh(){addContext();dedupeNav();initPages();setTimeout(refresh,60000)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){ensureStyles();refresh()});else{ensureStyles();refresh()}
          })();
          </script>'''
          s=s.replace('</body>',dedupe+'</body>')
          p.write_text(s,encoding='utf-8')
          print('Surgical Hub patch applied.')
      - name: Commit patch
        run: |
          git config user.name 'NayaNET Surgical Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add NAYANETHUB.html
          git diff --cached --quiet && echo 'No changes to commit.' && exit 0
          git commit -m 'Surgical Hub: greeting, local context, feeds, lists, sharing'
          git push origin HEAD:main
      - name: Remove one-shot workflow
        if: success()
        run: |
          rm -f .github/workflows/nayanet-hub-surgical-fix.yml
          git add .github/workflows/nayanet-hub-surgical-fix.yml
          git commit -m 'Remove one-shot Hub surgical workflow'
          git push origin HEAD:main
# trigger