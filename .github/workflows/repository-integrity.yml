name: MAXESS Repository Integrity

on:
  push:
    branches: [maxess-results-v21-working]
  pull_request:
    branches: [maxess-results-v21-working]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository identity and map gate
        run: |
          test "${GITHUB_REPOSITORY}" = "SoulSchoolAcademy/MaxRESULTS"
          test -f README.md
          test -f START-HERE.md
          test -f docs/REPOSITORY-MAP.md
          test -f NAYA-REPO-LOCK.md
          test -f NAYA-OS.md
          test -f docs/SMART-NOTES.md
          test -f docs/smart-notes/INDEX.md
          test -d docs/smart-notes
          test -f docs/NAYA-NITRO-MODE.md
          test -f docs/MAXESS-RESULTS-PRODUCT-SPEC.md
          test -f docs/DEPLOYMENT-CONTRACT.md
          test -f docs/RELEASE-CHECKLIST.md
          test -f '20260817 912am RESULTS PAGE CODE'
          test -f BASELINE-WORKING.html
          test -f tools/nitro_aaa_upgrade.py

      - name: Smart Notes integrity gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          protocol = Path('docs/SMART-NOTES.md').read_text(encoding='utf-8')
          index = Path('docs/smart-notes/INDEX.md').read_text(encoding='utf-8')
          daily_files = sorted(Path('docs/smart-notes').glob('20??-??-??.md'))
          assert 'Default capture law' in protocol
          assert 'Retrieval law' in protocol
          assert 'Smart Notes are **memory, not authority**' in protocol
          assert 'Entry ID' in protocol
          assert 'Keywords' in protocol
          assert 'Every new durable note gets:' in index
          assert daily_files, 'No dated Smart Notes file exists'
          assert re.search(r'SN-\d{8}-\d{3}', index), 'No indexed Smart Notes entry found'
          latest = daily_files[-1].name
          assert latest in index, f'Latest daily Smart Notes file is not indexed: {latest}'
          print('SMART NOTES INTEGRITY GATE: PASS')
          print('latest:', latest)
          PY

      - name: Source authority gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('20260817 912am RESULTS PAGE CODE')
          s = p.read_text(encoding='utf-8')
          assert 'window.MAXESS_RESULT' in s
          assert '<html' in s.lower()
          assert s.lower().count('</html>') == 1
          assert not re.search(r'(^|\n)(<<<<<<<|=======|>>>>>>>)( |\n|$)', s)
          assert len(s.encode()) > 500_000
          assert len(s.splitlines()) > 6500
          print('SOURCE AUTHORITY GATE: PASS')
          print('bytes:', len(s.encode()))
          print('lines:', len(s.splitlines()))
          PY

      - name: Python syntax gate
        run: python -m py_compile tools/*.py

      - name: Runtime contract QA
        run: python tools/qa_v21_runtime_contract.py

      - name: System flow QA
        run: python tools/qa_v21_system_flow.py
