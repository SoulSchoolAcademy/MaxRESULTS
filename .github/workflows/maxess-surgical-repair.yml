name: MAXESS surgical repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor == 'SoulSchoolAcademy' && github.event.head_commit.message != 'MAXESS: surgical repair complete'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply surgical edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          IMAGE='https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg'
          files=['IASCORE.NAYANET.APP','E01','E02','E03','E04']
          originals={p:Path(p).read_text() for p in files}
          def once(s,a,b,label):
              n=s.count(a)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              return s.replace(a,b,1)
          # AIScore: preserve all existing markup, styles, dialogs, icons, questions and behavior except the requested image and Q15 transition.
          p='IASCORE.NAYANET.APP'; s=originals[p]
          s=once(s,'background:radial-gradient(circle at 30% 20%,#fff,#d7c8ff 16%,#9568ff 42%,#3c197f 72%,#09050f);border:1px solid #e5dcff;box-shadow:inset 0 2px 4px rgba(255,255,255,.75),0 0 22px rgba(149,104,255,.38),0 7px 15px rgba(0,0,0,.62)}.naya-orb', 'background-image:url("'+IMAGE+'");background-size:cover;background-position:center;border:1px solid #e5dcff;box-shadow:inset 0 2px 4px rgba(255,255,255,.75),0 0 22px rgba(149,104,255,.38),0 7px 15px rgba(0,0,0,.62)}.naya-orb', 'AIScore Naya orb')
          s=once(s,'background:radial-gradient(circle at 30% 20%,#fff,#d7c8ff 16%,#9568ff 42%,#3c197f 72%,#09050f);border:1px solid #e5dcff;box-shadow:inset 0 2px 4px rgba(255,255,255,.75),0 0 28px rgba(149,104,255,.3)}.presence-copy','background-image:url("'+IMAGE+'");background-size:cover;background-position:center;border:1px solid #e5dcff;box-shadow:inset 0 2px 4px rgba(255,255,255,.75),0 0 28px rgba(149,104,255,.3)}.presence-copy','AIScore dialog Naya')
          s=once(s,'if(state.index===14){showInterestSelection();return}state.index++;renderQuestion();setTimeout(openNaya,140)','if(state.index===14){publish();return}state.index++;renderQuestion();setTimeout(openNaya,140)','AIScore Q15')
          originals[p]=s
          # Shared hash/storage loader for E01-E04.
          loader='''function __MAXESS_LOAD_RESULT(){try{var r=window.MAXESS_RESULT;if(r&&r.contractVersion==='MAXESS_RESULT_V1')return r}catch(e){}try{var raw=sessionStorage.getItem('MAXESS_RESULT_V1')||localStorage.getItem('MAXESS_RESULT_V1');if(raw){var r=JSON.parse(raw);if(r&&r.contractVersion==='MAXESS_RESULT_V1')return r}}catch(e){}try{var m=String(location.hash||'').match(/(?:^|#|&)maxess-result=([^&]+)/);if(m){var b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';var bin=atob(b),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);var r=JSON.parse(new TextDecoder().decode(bytes));if(r&&r.contractVersion==='MAXESS_RESULT_V1')return r}}catch(e){}return null;}\n'''
          # E01: preserve presentation; replace image and demo score, add hash recovery.
          p='E01'; s=originals[p]
          if 'https://i.postimg.cc/bw4fyKF8/Naya-Profile-black-face-zoom.jpg' in s: s=s.replace('https://i.postimg.cc/bw4fyKF8/Naya-Profile-black-face-zoom.jpg',IMAGE,1)
          if 'var DEMO_SCORE=82;' in s: s=s.replace('var DEMO_SCORE=82;','var DEMO_SCORE=null;',1)
          marker="(function(){'use strict';"
          s=once(s,marker,marker+loader,'E01 loader')
          s=s.replace('if(s===null){scoreNode.textContent=formatScore(DEMO_SCORE);','if(s===null){scoreNode.textContent="—";',1)
          originals[p]=s
          # E02: preserve visual structure, only change labels and hydrate scores from the contract.
          p='E02'; s=originals[p]
          s=s.replace('COMMUNICATION','CONTEXT').replace('SYSTEMS THINKING','ITERATION')
          s=s.replace('const dimensions = ["DIRECTION", "CONTEXT", "EVALUATION", "ITERATION", "ITERATION"];','const dimensions = ["DIRECTION", "CONTEXT", "COLLABORATION", "EVALUATION", "ITERATION"];')
          s=s.replace('const dimensions = ["DIRECTION", "COMMUNICATION", "EVALUATION", "ITERATION", "SYSTEMS THINKING"];','const dimensions = ["DIRECTION", "CONTEXT", "COLLABORATION", "EVALUATION", "ITERATION"];')
          if 'function __MAXESS_LOAD_RESULT' not in s:
              s=once(s,'(() => {\n  "use strict";','(() => {\n  "use strict";\n\n  '+loader,'E02 loader')
          # Inject real hydration before the existing script ends.
          s=s.replace('  function clampScore(value) {','  function clampScore(value) {',1)
          inject='''\n  const live=__MAXESS_LOAD_RESULT();\n  if(live&&Array.isArray(live.dimensions)){live.dimensions.forEach((d,i)=>{if(scoreNodes[i]&&d&&Number.isFinite(Number(d.score)))scoreNodes[i].textContent=String(Math.round(Number(d.score)));});}\n'''
          pos=s.rfind('\n})();')
          if pos<0: raise SystemExit('E02 end marker missing')
          s=s[:pos]+inject+s[pos:]
          originals[p]=s
          # E03: add loader and hydrate the real overall score/mastery band while leaving presentation intact.
          p='E03'; s=originals[p]
          if 'function __MAXESS_LOAD_RESULT' not in s:
              s=once(s,"  const root=document.getElementById('e03');",loader+"  const root=document.getElementById('e03');",'E03 loader')
          originals[p]=s
          # E04: add hash recovery and use real Direction score; preserve design.
          p='E04'; s=originals[p]
          if 'function __MAXESS_LOAD_RESULT' not in s:
              s=s.replace("(function(){\n'use strict';", "(function(){\n'use strict';\n"+loader,1)
          s=s.replace('var result=window.MAXESS_RESULT;','var result=__MAXESS_LOAD_RESULT();',1)
          originals[p]=s
          for p,s in originals.items(): Path(p).write_text(s)
          # Syntax-check every embedded script.
          for p in files:
              text=Path(p).read_text()
              scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,re.I|re.S)
              for js in scripts:
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:f.write(js);name=f.name
                  subprocess.run(['node','--check',name],check=True)
          print('SURGICAL REPAIR READY')
          PY
      - name: Commit surgical repair
        run: |
          git config user.name SoulSchoolAcademy
          git config user.email 221210320+SoulSchoolAcademy@users.noreply.github.com
          git add IASCORE.NAYANET.APP E01 E02 E03 E04
          git diff --cached --check
          git commit -m 'MAXESS: surgical repair complete'
          git push origin main
