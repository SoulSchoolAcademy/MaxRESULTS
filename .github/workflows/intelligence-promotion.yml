name: Naya Intelligence — Lesson Promotion

on:
  push:
    branches: [main]
    paths:
      - 'MASTER-NOTES/INTELLIGENCE-EVENTS/**'
      - '.naya/intelligence/**'
      - 'tools/promote_intelligence.py'
      - '.github/workflows/intelligence-promotion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate and classify intelligence events
        run: python3 tools/promote_intelligence.py

      - name: Commit promotion receipt when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- MASTER-NOTES/INTELLIGENCE-PROMOTIONS/LATEST-PROMOTION-RECEIPT.json; then
            echo "No promotion receipt changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MASTER-NOTES/INTELLIGENCE-PROMOTIONS/LATEST-PROMOTION-RECEIPT.json
          git commit -m "chore(intelligence): record lesson promotion receipt"
          git push
