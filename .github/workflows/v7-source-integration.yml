name: V7 source-preserving runtime integration

on:
  push:
    branches: [main]
    paths:
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/index.html'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/v7-smart-note-runtime.js'
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/v7-release-enhancements.js'
      - '.github/workflows/v7-source-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v7-source-integration
  cancel-in-progress: true

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'V7 source-preserving runtime integration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Surgical source integration
        shell: python
        run: |
          from pathlib import Path
          p=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- V7 SMART NOTE RUNTIME V1 -->'
          if marker not in s:
              print('V7 runtime marker absent; source already integrated or intentionally different.')
          else:
              start=s.index(marker)
              end=s.index('</script>', start)+len('</script>')
              replacement='''<!-- V7 SMART NOTE RUNTIME — externalized without changing the application shell -->\n<script src="v7-smart-note-runtime.js"></script>\n<script src="v7-release-enhancements.js"></script>'''
              s=s[:start]+replacement+s[end:]
              p.write_text(s,encoding='utf-8')
              print('Replaced only the legacy V7 runtime block; application shell preserved wholesale.')

      - name: Validate preserved source
        shell: bash
        run: |
          set -euo pipefail
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/v7-smart-note-runtime.js
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/v7-release-enhancements.js
          grep -Fq 'v7-smart-note-runtime.js' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'v7-release-enhancements.js' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'NayaNET — Intelligent Hub V7' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'Good morning, Shawn.' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'page-evidence' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'page-settings' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html

      - name: Commit surgical integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          if git diff --cached --quiet; then echo 'No source change required.'; exit 0; fi
          git commit -m 'V7 source-preserving runtime integration'
          git push
