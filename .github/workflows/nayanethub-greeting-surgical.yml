name: NayaNET Hub Greeting — One-Time Surgical Release
on:
  push:
    paths:
      - '.github/workflows/nayanethub-greeting-surgical.yml'
permissions:
  contents: write
jobs:
  surgical:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgical edit — canonical NAYANETHUB.html only
        shell: python
        run: |
          from pathlib import Path
          p = Path('NAYANETHUB.html')
          s = p.read_text(encoding='utf-8')
          old = '#page-home .heroIntro,#page-home .hero{display:none!important}'
          new = '#page-home .hero{display:none!important}'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one canonical hide rule; found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='')
          if '#page-home .heroIntro{display:none!important}' in s:
              raise SystemExit('Greeting remains hidden')
          if 'id="nh-greeting"' not in s or 'id="nh-greeting-script"' not in s:
              raise SystemExit('Canonical greeting implementation missing')
      - name: Verify minimal diff
        run: |
          git diff --check
          git diff --stat
          git diff -- NAYANETHUB.html
      - name: Commit canonical source edit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NAYANETHUB.html
          git diff --cached --quiet && exit 0
          git commit -m 'Surgical: show dynamic Hub greeting at top'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/nayanethub-greeting-surgical.yml
          git commit -m 'Remove one-time greeting release workflow'
          git push
