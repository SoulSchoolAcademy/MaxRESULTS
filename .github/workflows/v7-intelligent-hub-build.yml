name: NayaNET V7 Intelligent Hub Build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v7-intelligent-upgrade.js'
      - 'scripts/v7-intelligent-hub-refinement.js'
      - 'scripts/v7-intelligent-feed-excellence.js'
      - '.github/workflows/v7-intelligent-hub-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Validate upgrade JavaScript
        run: |
          node --check scripts/v7-intelligent-upgrade.js
          node --check scripts/v7-intelligent-hub-refinement.js
          node --check scripts/v7-intelligent-feed-excellence.js

      - name: Apply surgical upgrade layers to NAYAHUB.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('NAYAHUB.html')
          html = p.read_text(encoding='utf-8')
          layers = [
              ('NAYANET-V7-INTELLIGENT-UPGRADE-V2', 'nayanet-v7-intelligent-upgrade', Path('scripts/v7-intelligent-upgrade.js')),
              ('NAYANET-V7-INTELLIGENT-HUB-REFINEMENT-V1', 'nayanet-v7-intelligent-hub-refinement', Path('scripts/v7-intelligent-hub-refinement.js')),
              ('NAYANET-V7-INTELLIGENT-FEED-EXCELLENCE-V1', 'nayanet-v7-intelligent-feed-excellence', Path('scripts/v7-intelligent-feed-excellence.js')),
          ]
          for marker, script_id, patch_path in layers:
              patch = patch_path.read_text(encoding='utf-8')
              comment = '<!-- '+marker+' -->'
              tag = '<script id="'+script_id+'">'
              replacement = comment + tag + patch + '\n</script>'
              if marker not in html:
                  html = html.replace('</body>', replacement + '</body>', 1)
              else:
                  start = html.find(comment)
                  script_start = html.find(tag, start)
                  script_end = html.find('</script>', script_start)
                  html = html[:start] + replacement + html[script_end+9:]
          p.write_text(html, encoding='utf-8')
          Path('index.html').write_text(html, encoding='utf-8')

      - name: Validate HTML artifact markers
        run: |
          test -f index.html
          grep -q 'YOUR INTELLIGENCE TODAY' index.html
          grep -q 'NAYANET-V7-INTELLIGENT-UPGRADE-V2' index.html
          grep -q 'NAYANET-V7-INTELLIGENT-HUB-REFINEMENT-V1' index.html
          grep -q 'NAYANET-V7-INTELLIGENT-FEED-EXCELLENCE-V1' index.html
          grep -q 'TYPE OR TALK TO NAYA' index.html
          grep -q 'Naya Lists' index.html
          grep -q 'SMART NOTES' index.html
          grep -q '＋ SHARE' index.html
          grep -q '★ RANK' index.html
          grep -q '💬 COMMENT' index.html
          grep -q '🔖 SAVE' index.html

      - name: Commit surgical upgrade and release artifact
        run: |
          git config user.name 'NayaNET Build'
          git config user.email 'actions@nayanet.xyz'
          git add NAYAHUB.html index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Elevate V7 Intelligent Feed to premium Smart Posts'
            git push
          fi
