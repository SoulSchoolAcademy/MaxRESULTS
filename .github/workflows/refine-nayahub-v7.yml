name: Refine NayaNET Intelligent Hub V7

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  refine-and-package:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply surgical V7 refinement to the exact NAYAHUB source
        run: python3 tools/refine_nayahub_v7.py

      - name: Validate HTML integrity
        run: |
          test -s NAYAHUB.html
          grep -q 'NayaNET — Intelligent Hub V7' NAYAHUB.html
          grep -q 'nayanet-v7-refinement-style' NAYAHUB.html
          grep -q 'nayanet-v7-refinement-runtime' NAYAHUB.html
          grep -q 'Intelligence Library' NAYAHUB.html
          grep -q 'WHAT MATTERED' NAYAHUB.html
          grep -q 'WHAT WAS LEARNED' NAYAHUB.html
          grep -q 'WHAT CARRIES FORWARD' NAYAHUB.html
          grep -q 'WHAT DESERVES ATTENTION NEXT' NAYAHUB.html

      - name: Commit surgical refinement into the PR branch
        run: |
          git config user.name "NayaNET Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add NAYAHUB.html
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Refine NayaNET Intelligent Hub V7 source"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Package the actual refined NAYAHUB
        run: |
          mkdir -p dist
          cp NAYAHUB.html dist/NAYAHUB.html
          cp tools/refine_nayahub_v7.py dist/refine_nayahub_v7.py
          printf '%s\n' 'NayaNET Intelligent Hub V7 — surgical refinement' 'Source preserved: NAYAHUB.html' 'Includes Smart Notes memory organization, Daily Intelligence report structure, Intelligence Library, stronger OFF→ON controls, and mobile hardening.' > dist/README.txt
          cd dist
          zip -9 NayaNET-Intelligent-Hub-V7-Refined.zip NAYAHUB.html README.txt refine_nayahub_v7.py

      - name: Upload actual HTML package
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-V7-Refined
          path: dist/NayaNET-Intelligent-Hub-V7-Refined.zip
          if-no-files-found: error
