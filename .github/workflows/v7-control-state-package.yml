name: V7 Control State Package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v7-control-state-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Apply surgical control-state and mobile polish to package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html')
          s=p.read_text(encoding='utf-8')
          marker='NAYA_V7_CONTROL_STATE_POLISH_20260906'
          if marker not in s:
            css=r'''<style id="NAYA_V7_CONTROL_STATE_POLISH_20260906">
          :root{--v7-purple:#b27cff;--v7-purple-soft:#b27cff66;--v7-green:#55e39a}
          .btn,.featureButton,.filter,.noteTab,.mobileNav button,.hubAction,.hubSeg button,.hubRailButton,.ibf-brief,.mailTab,.mailAction,.actions .btn{position:relative;isolation:isolate}
          .btn,.hubAction,.hubRailButton,.ibf-brief,.mailAction,.actions .btn{border-color:var(--v7-purple-soft)!important;box-shadow:inset 0 1px #fff5,0 0 0 1px #b27cff18,0 0 28px #b27cff30,0 10px 26px #000a!important}
          .btn:hover,.hubAction:hover,.hubRailButton:hover,.ibf-brief:hover,.mailAction:hover,.actions .btn:hover{border-color:#b27cff!important;box-shadow:inset 0 1px #fff7,0 0 0 2px #b27cff22,0 0 42px #b27cff52,0 16px 34px #000b!important}
          .btn:active,.btn.active,.btn[aria-pressed="true"],.hubAction:active,.hubRailButton:active,.ibf-brief:active,.mailAction:active,.actions .btn:active{border-color:var(--v7-green)!important;background:linear-gradient(145deg,#163322,#0b1710)!important;color:#fff!important;box-shadow:inset 0 1px #dffff0,0 0 0 2px #55e39a24,0 0 42px #55e39a62,0 10px 28px #000b!important}
          .featureButton{border-color:#b27cff88!important;background:linear-gradient(145deg,#171022,#0b0910)!important;color:#fff!important;box-shadow:inset 0 1px #fff6,0 0 0 1px #b27cff18,0 0 34px #b27cff3d,0 12px 30px #000c!important}
          .featureButton:hover{border-color:#b27cff!important;background:linear-gradient(145deg,#241536,#100b18)!important;box-shadow:inset 0 1px #fff8,0 0 0 2px #b27cff25,0 0 48px #b27cff66,0 18px 38px #000d!important}
          .featureButton:active,.featureButton.active,[aria-pressed="true"].featureButton{border-color:var(--v7-green)!important;background:linear-gradient(145deg,#163b28,#0b1710)!important;box-shadow:inset 0 1px #eafff2,0 0 0 2px #55e39a2b,0 0 52px #55e39a70,0 10px 24px #000d!important}
          .nav button{border-color:#b27cff30!important;box-shadow:0 0 18px #b27cff12!important}.nav button:hover{border-color:#b27cff88!important;box-shadow:inset 0 1px #fff5,0 0 30px #b27cff30,0 12px 25px #0008!important}.nav button.active{border-color:var(--v7-green)!important;background:linear-gradient(145deg,#11251a,#0b0f0d)!important;box-shadow:inset 0 1px #fff7,0 0 0 2px #55e39a18,0 0 32px #55e39a45,0 15px 32px #000a!important}.nav button.active:after{background:var(--v7-green)!important;box-shadow:0 0 18px var(--v7-green),0 0 38px #55e39a88!important}
          .filter,.noteTab{border-color:#b27cff42!important;box-shadow:0 0 18px #b27cff18!important}.filter:hover,.noteTab:hover{border-color:#b27cff!important;box-shadow:0 0 28px #b27cff38!important}.filter.active,.noteTab.active{background:linear-gradient(145deg,#173b29,#0d1912)!important;color:#fff!important;border-color:var(--v7-green)!important;box-shadow:0 0 0 2px #55e39a1e,0 0 32px #55e39a55!important}
          .mobileNav{border-color:#b27cff50!important;box-shadow:0 0 34px #b27cff1e,0 20px 60px #000e!important}.mobileNav button{border:1px solid #b27cff28!important}.mobileNav button.active{background:linear-gradient(145deg,#173b29,#0b1710)!important;color:#fff!important;border-color:var(--v7-green)!important;box-shadow:0 0 0 2px #55e39a1b,0 0 28px #55e39a4d!important}.mobileNav button.active:after{background:var(--v7-green)!important;box-shadow:0 0 14px var(--v7-green)!important}
          .search,.compose textarea,.mailCompose input,.mailCompose textarea{border-color:#b27cff38!important;box-shadow:inset 0 1px #fff3,0 0 20px #b27cff12,0 10px 25px #0008!important}.search:focus,.compose textarea:focus,.mailCompose input:focus,.mailCompose textarea:focus{border-color:var(--v7-green)!important;box-shadow:inset 0 1px #fff5,0 0 0 2px #55e39a18,0 0 30px #55e39a32!important}
          @media(max-width:900px){html,body{max-width:100%;overflow-x:hidden}.main{width:100%;min-width:0;padding-left:14px;padding-right:14px;padding-bottom:105px}.topright{min-width:0}.connectionPill{max-width:48px;overflow:hidden}.heroState,.surface,.sourceBox,.featureBoard,.card,.noteCard,.mailSurface,.reportStrip{max-width:100%;min-width:0}.featureButton,.btn{min-height:50px}.stateActions .btn,.controls .btn{flex:1 1 180px}.feedRow{min-width:0}.feedRow p,.feedRow b{overflow-wrap:anywhere}.homeIntro h1,.pageHead h1{overflow-wrap:anywhere}.servicePath{width:100%}}
          @media(max-width:520px){.main{padding-left:10px;padding-right:10px}.topbar{height:62px}.crumb strong{font-size:15px}.avatar{width:38px;height:38px}.homeIntro h1{font-size:42px}.stateCopy{padding:22px 18px 20px}.stateCopy h2{font-size:28px}.featureBoard{padding:22px 16px 17px}.featureBoard h3{font-size:24px}.powerOrb{width:132px;height:132px}.orbCore{width:66px;height:66px}.surfaceHeader{padding:18px 15px}.feedRow{grid-template-columns:45px 12px minmax(0,1fr);gap:9px;padding:15px 13px}.reportStrip{padding:20px 17px}.reportStrip h2{font-size:22px}.btn{padding-left:14px;padding-right:14px}.mobileNav{left:7px;right:7px;bottom:7px;height:64px}}
          @media(prefers-reduced-motion:reduce){.btn,.featureButton,.filter,.noteTab,.mobileNav button,.hubAction,.hubRailButton,.ibf-brief{transition:none!important}}
          </style>'''
            s=s.replace('</head>',css+'\n</head>',1)
            p.write_text(s,encoding='utf-8')
          assert marker in p.read_text(encoding='utf-8')
          assert '<html' in p.read_text(encoding='utf-8') and '</html>' in p.read_text(encoding='utf-8')
          PY

      - name: Validate exact V7 package
        shell: bash
        run: |
          set -euo pipefail
          cd CLOUDFLARE-INTELLIGENT-HUB-V7
          test -s index.html
          test -s worker.js
          test -s wrangler.jsonc
          test -s v7-smart-note-runtime.js
          test -s v7-release-enhancements.js
          grep -Fq 'NayaNET — Intelligent Hub V7' index.html
          grep -Fq 'NAYA_V7_CONTROL_STATE_POLISH_20260906' index.html
          grep -Fq 'v7-smart-note-runtime.js' index.html
          grep -Fq 'v7-release-enhancements.js' index.html
          node --check worker.js
          node --check v7-smart-note-runtime.js
          node --check v7-release-enhancements.js
          test "$(grep -o '<html' index.html | wc -l)" -eq 1
          test "$(grep -o '</html>' index.html | wc -l)" -eq 1
          cd ..

      - name: Build ZIP with index.html as root entry point
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cd CLOUDFLARE-INTELLIGENT-HUB-V7
          zip -q -r ../dist/NayaNET-Intelligent-Hub-V7-Control-State.zip index.html worker.js wrangler.jsonc v7-smart-note-runtime.js v7-release-enhancements.js
          cd ..
          unzip -t dist/NayaNET-Intelligent-Hub-V7-Control-State.zip
          unzip -l dist/NayaNET-Intelligent-Hub-V7-Control-State.zip
          test -s dist/NayaNET-Intelligent-Hub-V7-Control-State.zip
          sha256sum dist/NayaNET-Intelligent-Hub-V7-Control-State.zip | tee dist/SHA256SUM.txt

      - name: Upload V7 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-V7-Control-State
          path: |
            dist/NayaNET-Intelligent-Hub-V7-Control-State.zip
            dist/SHA256SUM.txt
          if-no-files-found: error
          retention-days: 30
