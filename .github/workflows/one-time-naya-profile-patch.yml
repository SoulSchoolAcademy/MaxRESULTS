name: One-time MAXESS Naya profile patch
on:
  push:
    branches: [feat/aiscore-clean-v1]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[naya-profile-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aiscore-clean-v1
          fetch-depth: 0
      - name: Patch exact authoritative assessment file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('AIScoreMAXESS-CLEAN-V2-HUMANIZED.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('\n+@keyframes', '\n@keyframes').replace('\n+@media', '\n@media')
          s = s.replace('background:radial-gradient(circle at 30% 20%,#fff,#d7c8ff 16%,#9568ff 42%,#3c197f 72%,#09050f);border:1px solid #e5dcff;', 'background-image:url("https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg");background-size:cover;background-position:center;background-repeat:no-repeat;border:1px solid #e5dcff;')
          s = s.replace('background:radial-gradient(circle at 30% 20%,#fff,#d7c8ff 16%,#9568ff 42%,#3c197f 72%,#09050f);border:2px solid #f3efff;', 'background-image:url("https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg");background-size:cover;background-position:center;background-repeat:no-repeat;border:2px solid #f3efff;')
          s = s.replace('.presence-orb:after{content:"N";', '.presence-orb:after{content:"";')
          s = s.replace('window.NAYA_WELCOME_V2=true;', 'window.NAYA_WELCOME_V2=true;window.NAYA_PROFILE_ASSET="Naya Profile 6.jpg";')
          if s == old:
              raise SystemExit('No expected changes found; refusing mutation.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify patch integrity
        shell: bash
        run: |
          test -s 'AIScoreMAXESS-CLEAN-V2-HUMANIZED.html'
          grep -q 'Naya%20Profile%206.jpg' 'AIScoreMAXESS-CLEAN-V2-HUMANIZED.html'
          ! grep -q '^+@media' 'AIScoreMAXESS-CLEAN-V2-HUMANIZED.html'
          ! grep -q '^+@keyframes' 'AIScoreMAXESS-CLEAN-V2-HUMANIZED.html'
          grep -q 'MAXESS_RESULT_V1' 'AIScoreMAXESS-CLEAN-V2-HUMANIZED.html'
          grep -q 'window.MAXESS_RESULT' 'AIScoreMAXESS-CLEAN-V2-HUMANIZED.html'
      - name: Commit exact file and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git rm '.github/workflows/one-time-naya-profile-patch.yml'
          git add 'AIScoreMAXESS-CLEAN-V2-HUMANIZED.html'
          git commit -m '[naya-profile-patch] Update authoritative MAXESS assessment Naya profile'
          git push origin feat/aiscore-clean-v1
