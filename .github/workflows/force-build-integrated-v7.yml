name: Force Build Integrated NayaNET V7

on:
  push:
    paths:
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/**'

permissions:
  contents: write
  actions: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate complete index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html')
          layer=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/nayanet-v7-surgical-integration.js')
          html=index.read_text(encoding='utf-8')
          marker='<!-- NAYANET-V7-INTEGRATED-INTELLIGENCE-LAYER -->'
          if marker not in html:
              html=html.replace('</body>','\n'+marker+'\n<script>\n'+layer.read_text(encoding='utf-8')+'\n</script>\n</body>')
              index.write_text(html,encoding='utf-8')
          assert html.count('<!doctype html>')==1
          assert html.count('</html>')==1
          assert 'Search your intelligence' in html
          assert 'SHARE INTELLIGENCE' in html
          assert 'ASK NAYA' in html
          assert 'prompt(' not in html
          print('INTEGRATED INDEX BYTES',index.stat().st_size)
          PY
      - name: Build ZIP with top-level index.html
        run: |
          rm -f NayaNET-Intelligent-Hub-V7-Cloudflare-READY.zip
          (cd CLOUDFLARE-INTELLIGENT-HUB-V7 && zip -j ../NayaNET-Intelligent-Hub-V7-Cloudflare-READY.zip index.html)
          unzip -l NayaNET-Intelligent-Hub-V7-Cloudflare-READY.zip
      - name: Upload finished ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-V7-Cloudflare-READY
          path: NayaNET-Intelligent-Hub-V7-Cloudflare-READY.zip
          if-no-files-found: error
      - name: Commit complete index back to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build complete integrated NayaNET V7 index [skip ci]'
          git push
