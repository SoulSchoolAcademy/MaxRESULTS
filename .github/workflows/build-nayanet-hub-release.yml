name: NayaNET Intelligent Hub Release Packager
on:
  push:
    paths:
      - '.github/workflows/build-nayanet-hub-release.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build release artifact from NAYAHUB.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,re
          src=Path('NAYAHUB.html')
          html=src.read_text(encoding='utf-8')
          assert html.count('<!doctype html>')==1 and html.count('</html>')==1
          layer_specs=[
            ('NAYANET-NAYAHUB-INTELLIGENCE-LAYER','CLOUDFLARE-INTELLIGENT-HUB-V7/nayanet-v7-surgical-integration.js','nayanet-nayahub-intelligence'),
            ('NAYANET-NAYAHUB-COLLECTIONS-LAYER','nayanet-hub-collections.js','nayanet-nayahub-collections'),
            ('NAYANET-CANONICAL-HUB-AUTHORITY-V1','scripts/nayanet-hub-authority-correction.js','nayanet-canonical-hub-authority'),
            ('NAYANET-CANONICAL-HUB-FINAL-POLISH-V1','scripts/nayanet-hub-final-polish.js','nayanet-canonical-hub-final-polish'),
            ('NAYANET-HUB-FINAL-EXECUTION-V1','scripts/nayanet-hub-final-execution.js','nayanet-hub-final-execution')]
          for marker,path,sid in layer_specs:
              p=Path(path); body=p.read_text(encoding='utf-8')
              if marker not in html:
                  html=html.replace('</body>',f'\n<!-- {marker} -->\n<script id="{sid}">\n{body}\n</script>\n</body>',1)
          Path('index.html').write_text(html,encoding='utf-8')
          assert len(html)>100000
          checks=['Your Intelligence Today','SMART NOTES','Intelligent Library','DAILY INTELLIGENCE BRIEFING','SHARE TO COLLECTIVE','SAVE TO MY INTELLIGENCE','NAYANET-HUB-FINAL-EXECUTION-V1']
          for x in checks: assert x in html,x
          assert 'prompt(' not in html
          assert html.count('<!doctype html>')==1 and html.count('</html>')==1
          Path('_redirects').write_text('/intelligence/* /index.html 200\n',encoding='utf-8')
          with zipfile.ZipFile('NayaNET-Intelligent-Hub-Cloudflare.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write('index.html','index.html'); z.write('_redirects','_redirects')
          with zipfile.ZipFile('NayaNET-Intelligent-Hub-Cloudflare.zip') as z:
              assert z.namelist()==['index.html','_redirects']
              assert z.getinfo('index.html').file_size>100000
          print('RELEASE_OK',len(html),'bytes')
          PY
      - name: Upload verified Cloudflare ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-Cloudflare
          path: NayaNET-Intelligent-Hub-Cloudflare.zip
          if-no-files-found: error
