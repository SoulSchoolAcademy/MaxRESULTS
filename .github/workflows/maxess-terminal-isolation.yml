name: MAXESS Terminal Isolation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'E00 118'
      - '.github/workflows/maxess-terminal-isolation.yml'

permissions:
  contents: read

jobs:
  terminal-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Inspect and instrument E00 terminal boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('E00 118','utf8');
          const names = ['next','save','publish','calculate','buildResult','valid','persistResult','renderLocalResults','verifyLocalResults','releaseResultsSections','broadcast'];
          console.log('E00_SOURCE_LENGTH=' + src.length);
          console.log('E00_FUNCTION_MATCHES=' + JSON.stringify(names.filter(n => new RegExp('(?:function\\s+'+n+'\\s*\\(|(?:const|let|var)\\s+'+n+'\\s*=)','i').test(src))));
          for (const n of names) {
            const re = new RegExp('.{0,220}(?:function\\s+'+n+'\\s*\\(|(?:const|let|var)\\s+'+n+'\\s*=).{0,700}','is');
            const m = src.match(re);
            if (m) console.log(`E00_SNIPPET_${n}=` + m[0].replace(/\\s+/g,' ').slice(0,1000));
          }
          let out = src;
          const tracePreamble = `<script>window.__MAXESS_TRACE__={events:[],push:function(name,detail){try{this.events.push({t:Date.now(),name:name,detail:detail||null});console.log('MAXESS_TRACE='+JSON.stringify(this.events[this.events.length-1]));}catch(e){}}};</script>`;
          out = out.replace(/<body([^>]*)>/i, '<body$1>' + tracePreamble);
          for (const n of names) {
            const fn = new RegExp(`(function\\s+${n}\\s*\\([^)]*\\)\\s*\\{)`, 'g');
            out = out.replace(fn, `$1 window.__MAXESS_TRACE__&&window.__MAXESS_TRACE__.push('${n}',{responses:window.responses?.length,currentQuestion:window.currentQuestionIndex});`);
          }
          out = out.replace(/<\\/body>/i, `<script>try{const origDispatch=EventTarget.prototype.dispatchEvent;EventTarget.prototype.dispatchEvent=function(e){if(e&&/MAXESS|result/i.test(e.type))window.__MAXESS_TRACE__&&window.__MAXESS_TRACE__.push('dispatchEvent:'+e.type);return origDispatch.call(this,e)};const origSetItem=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){if(/MAXESS/i.test(k))window.__MAXESS_TRACE__&&window.__MAXESS_TRACE__.push('storage:set:'+k,{length:String(v).length});return origSetItem.call(this,k,v)};const origPost=window.postMessage;window.postMessage=function(){window.__MAXESS_TRACE__&&window.__MAXESS_TRACE__.push('window.postMessage');return origPost.apply(this,arguments)};}catch(e){console.error('TRACE_INSTALL_ERROR',e)};</script></body>`);
          fs.writeFileSync('e00-isolated.html',out);
          console.log('INSTRUMENTED_E00_WRITTEN=' + out.length);
          NODE

      - name: Run E00 alone through Q15 and capture terminal contract
        shell: bash
        run: |
          cat > prove-e00.mjs <<'JS'
          import { chromium } from 'playwright';
          import { createServer } from 'node:http';
          import { readFileSync } from 'node:fs';
          const server=createServer((req,res)=>{if(req.url!=='/'){res.writeHead(404);return res.end()}res.writeHead(200,{'content-type':'text/html; charset=utf-8','cache-control':'no-store'});res.end(readFileSync('e00-isolated.html'));});
          await new Promise(r=>server.listen(4174,'127.0.0.1',r));
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[],consoleErrors=[],crashes=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
          page.on('crash',()=>crashes.push('page crashed'));
          await page.goto('http://127.0.0.1:4174/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(700);
          const close=page.locator('#closeNaya'); if(await close.isVisible().catch(()=>false))await close.click();
          for(let i=1;i<=15;i++){
            const answer=page.locator('#answers .answer').first();
            if(await answer.count()!==1)throw new Error(`Q${i}: answer missing`);
            await answer.click();
            const btn=page.locator('#continueButton');
            if(await btn.isDisabled())throw new Error(`Q${i}: Continue disabled`);
            await btn.click({force:true});
            console.log(`Q${i}/15: Continue executed`);
            if(i<15)await page.waitForTimeout(350);
          }
          console.log('Q15_COMPLETE=TRUE');
          await page.waitForTimeout(1500);
          const state=await page.evaluate(()=>({result:window.MAXESS_RESULT||null,trace:window.__MAXESS_TRACE__?.events||[],storage:Object.keys(localStorage).filter(k=>/MAXESS/i.test(k)),responses:window.responses?.length??null,currentQuestionIndex:window.currentQuestionIndex??null,continueText:document.querySelector('#continueButton')?.textContent?.trim()||'',localResultsVisible:!!document.querySelector('.results-local.active')}));
          console.log('E00_STATE='+JSON.stringify(state));
          console.log('PAGE_ERRORS='+JSON.stringify(errors));
          console.log('CONSOLE_ERRORS='+JSON.stringify(consoleErrors));
          console.log('BROWSER_CRASHES='+JSON.stringify(crashes));
          if(crashes.length)throw new Error('Browser crash: '+crashes.join('|'));
          if(errors.length)throw new Error('Page errors: '+errors.join('|'));
          if(!state.result||state.result.contractVersion!=='MAXESS_RESULT_V1')throw new Error('E00 did not produce MAXESS_RESULT_V1');
          if(state.result.responses?.length!==15)throw new Error(`Expected 15 responses; got ${state.result.responses?.length}`);
          if(!Number.isInteger(state.result.overallScore))throw new Error('overallScore missing');
          if(state.result.dimensions?.length!==5)throw new Error('Expected 5 dimensions');
          if(!state.result.masteryBand)throw new Error('masteryBand missing');
          console.log('E00_AUTHORITATIVE_RESULT=PASS');
          await browser.close();server.close();
          JS
          node prove-e00.mjs
