name: V7 Visible Release

on:
  push:
    branches: [main]
    paths:
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/**'
      - '.github/workflows/v7-visible-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n7-visible-release
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(join(github.event.head_commit.modified, ','), 'CLOUDFLARE-INTELLIGENT-HUB-V7/') || contains(join(github.event.head_commit.added, ','), 'CLOUDFLARE-INTELLIGENT-HUB-V7/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLOUDFLARE-INTELLIGENT-HUB-V7
    steps:
      - name: Checkout exact V7 source
        uses: actions/checkout@v4
      - name: Validate V7 source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s v7-smart-note-runtime.js
          test -s v7-release-enhancements.js
          test -s worker.js
          test -s wrangler.jsonc
          grep -Fq 'v7-smart-note-runtime.js' index.html
          grep -Fq 'v7-release-enhancements.js' index.html
          grep -Fq 'NayaNET — Intelligent Hub V7' index.html
          grep -Fq 'Good morning, Shawn.' index.html
          grep -Fq 'id="page-settings"' index.html
          grep -Fq 'id="page-evidence"' index.html
          node --check worker.js
          node --check v7-smart-note-runtime.js
          node --check v7-release-enhancements.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('<html') == 1 and s.count('</html>') == 1
          assert s.count('v7-smart-note-runtime.js') == 1
          assert s.count('v7-release-enhancements.js') == 1
          print('V7 source validation PASS')
          print('INDEX_BYTES', len(s.encode()))
          PY
      - name: Deploy exact V7 assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc
      - name: Record release identity
        shell: bash
        run: |
          echo "V7_SOURCE_COMMIT=$GITHUB_SHA"
          echo "V7_WORKER=nayanet-v7-intelligent-hub"
