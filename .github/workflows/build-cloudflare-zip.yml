name: Build Cloudflare Upload ZIP

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package Cloudflare artifact
        run: |
          cd E02-LIVING-SUN-HUB
          zip -j ../NAYANET-LIVING-SUN-CLOUDFLARE.zip index.html _headers
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAYANET-LIVING-SUN-CLOUDFLARE
          path: NAYANET-LIVING-SUN-CLOUDFLARE.zip
          if-no-files-found: error
# Standalone deployment artifact: index.html + _headers only.
