name: NayaNET Intelligent Hub Build
on:
  push:
    paths:
      - '.github/workflows/fix-nayanethub.yml'
      - 'NAYANETHUB.html'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good V7 source
        run: git fetch --no-tags origin c171a9b0eaeb2064be60b30231ee901edb9daea6 && git checkout c171a9b0eaeb2064be60b30231ee901edb9daea6 -- NAYANETHUB.html
      - name: Apply surgical contract fragment
        shell: python
        run: |
          from pathlib import Path
          p=Path('NAYANETHUB.html')
          s=p.read_text(encoding='utf-8')
          for marker in ('.intelligentFeed','.intelligentBlock','</body>'):
              if marker not in s: raise SystemExit('ABORT: V7 marker missing: '+marker)
          fragment=Path('.github/nayanethub-surgical-fragment.html').read_text(encoding='utf-8')
          if 'NAYANET_SURGICAL_CONTRACT_RUNTIME' not in fragment: raise SystemExit('ABORT: contract fragment missing')
          s=s.replace('</body>',fragment+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate finished artifact
        shell: bash
        run: |
          test -s NAYANETHUB.html
          grep -q 'NAYANET_SURGICAL_CONTRACT_RUNTIME' NAYANETHUB.html
          grep -q 'nayanet_surgical_smart_lists_v1' NAYANETHUB.html
          grep -q 'nayanet_surgical_collective_v1' NAYANETHUB.html
          grep -q 'data-mode="personal"' NAYANETHUB.html
          grep -q 'data-mode="collective"' NAYANETHUB.html
          grep -q 'nayanet_smart_name' NAYANETHUB.html
          grep -q 'SAVE TO SMART LIST' NAYANETHUB.html
          grep -q 'SHARE TO COLLECTIVE' NAYANETHUB.html
          grep -q 'nayanet_v7_live_notes' NAYANETHUB.html
          ! grep -q 'Stacy' NAYANETHUB.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('NAYANETHUB.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          for x in scripts:
              if 'NAYANET_SURGICAL_CONTRACT_RUNTIME' in x:
                  Path('/tmp/surgical.js').write_text(x,encoding='utf-8')
                  break
          else: raise SystemExit('final runtime missing')
          PY
          node --check /tmp/surgical.js
      - name: Commit finished canonical source
        shell: bash
        run: |
          git config user.name 'NayaNET Surgical Builder'
          git config user.email 'nayanet-surgical@users.noreply.github.com'
          git add NAYANETHUB.html
          git diff --cached --quiet || git commit -m 'Surgical Hub contract: identity feeds and Smart Lists'
          git push
      - name: Package finished artifact
        shell: bash
        run: |
          rm -rf dist NayaNET-Intelligent-Hub-UPDATED.zip
          mkdir -p dist/nayanet-intelligent-hub
          cp NAYANETHUB.html dist/nayanet-intelligent-hub/NAYANETHUB.html
          (cd dist && zip -r ../NayaNET-Intelligent-Hub-UPDATED.zip nayanet-intelligent-hub >/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-UPDATED
          path: NayaNET-Intelligent-Hub-UPDATED.zip
