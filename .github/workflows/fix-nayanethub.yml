name: NayaNET Hub source polish
on:
  push:
    paths:
      - '.github/workflows/fix-nayanethub.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hard-coded identity from source greeting
        shell: python
        run: |
          from pathlib import Path
          p=Path('NAYANETHUB.html')
          s=p.read_text(encoding='utf-8')
          old='<h1>Good morning, Shawn.</h1>'
          new='<h1 id="nayaAuthoritativeGreeting">Welcome.</h1>'
          if old not in s: raise SystemExit('Expected legacy greeting not found')
          if s.count(old)!=1: raise SystemExit('Expected exactly one legacy greeting')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          grep -q 'id="nayaAuthoritativeGreeting"' NAYANETHUB.html
          ! grep -q 'Good morning, Shawn.' NAYANETHUB.html
          git config user.name 'NayaNET Surgical Builder'
          git config user.email 'nayanet-surgical@users.noreply.github.com'
          git add NAYANETHUB.html
          git commit -m 'Remove hard-coded Hub greeting identity'
          git push
