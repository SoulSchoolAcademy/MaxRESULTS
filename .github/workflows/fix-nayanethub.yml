name: NayaNET Intelligent Hub Build
on:
  push:
    paths:
      - '.github/workflows/fix-nayanethub.yml'
      - 'NAYANETHUB.html'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good V7 source
        run: git checkout c171a9b0eaeb2064be60b30231ee901edb9daea6 -- NAYANETHUB.html
      - name: Apply surgical Hub contract
        shell: python
        run: |
          from pathlib import Path
          p=Path('NAYANETHUB.html')
          s=p.read_text(encoding='utf-8')
          for marker in ('.intelligentFeed','.intelligentBlock','</body>'):
              if marker not in s: raise SystemExit('ABORT: V7 marker missing: '+marker)
          css=r'''<style id="NAYANET_SURGICAL_CONTRACT_STYLE">
          #nayanetIdentityGate{position:fixed;inset:0;z-index:5000;display:none;place-items:center;padding:20px;background:#000c;backdrop-filter:blur(20px)}#nayanetIdentityGate.open{display:grid}.nh-id-dialog{width:min(520px,100%);padding:28px;border:1px solid #d86cff66;border-radius:24px;background:linear-gradient(145deg,#17121f,#08080d);box-shadow:0 40px 100px #000f}.nh-id-dialog h2{margin:0 0 8px;font-size:30px;letter-spacing:-.05em}.nh-id-dialog p{margin:0 0 18px;color:#aaa4b1;font-size:11px;line-height:1.6}.nh-id-dialog input{width:100%;min-height:50px;padding:0 14px;border:1px solid #8b63ff77;border-radius:12px;background:#07070a;color:#fff;outline:0}.nh-id-dialog button{width:100%;min-height:48px;margin-top:10px;border:1px solid #d86cff88;border-radius:12px;background:#21102d;color:#fff;font-size:9px;font-weight:1000;letter-spacing:.08em}
          .nh-feed-modes{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 15px}.nh-feed-modes button,.nh-smart-list-link{min-height:36px;padding:0 12px;border:1px solid #8b63ff66;border-radius:11px;background:#09090e;color:#bdb7c4;font-size:8px;font-weight:1000;letter-spacing:.07em}.nh-feed-modes button.active,.nh-smart-list-link:hover{border-color:#55e39a;color:#fff;background:#0b1711}
          .nh-block-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px;padding-top:15px;border-top:1px solid #ffffff12}.nh-block-actions button{min-height:38px;padding:0 11px;border:1px solid #8b63ff66;border-radius:10px;background:#08080c;color:#ddd8e3;font-size:7px;font-weight:1000;letter-spacing:.05em}.nh-block-actions button:hover,.nh-block-actions button.on{border-color:#d86cff;color:#fff;background:#1b1023}.nh-block-actions .nh-social{border-color:#e8c76666}
          .nh-list-page .nh-list-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.nh-list-page .nh-list-toolbar input{flex:1;min-width:220px;min-height:44px;border:1px solid #ffffff22;border-radius:12px;background:#07070a;color:#fff;padding:0 12px;outline:0}.nh-list-page .nh-list-toolbar button{min-height:44px;padding:0 14px;border:1px solid #d86cff66;border-radius:12px;background:#160d1d;color:#fff;font-size:8px;font-weight:1000}.nh-list-card{border:1px solid #ffffff18;border-radius:18px;background:linear-gradient(145deg,#121219,#09090d);margin-bottom:12px;overflow:hidden}.nh-list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #ffffff12}.nh-list-head h3{margin:0;font-size:16px}.nh-list-head span{color:#99939f;font-size:7px}.nh-list-items{padding:12px}.nh-list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid #ffffff12;border-radius:11px;background:#08080c;margin-bottom:7px}.nh-list-item b{font-size:9px}.nh-list-item span{display:block;color:#99939f;font-size:7px;margin-top:4px}.nh-list-item button{min-height:31px;padding:0 9px;border:1px solid #ffffff22;border-radius:9px;background:#0b0b10;color:#fff;font-size:7px;font-weight:1000}
          .nh-modal{position:fixed;inset:0;z-index:4800;display:none;place-items:center;padding:18px;background:#000b;backdrop-filter:blur(18px)}.nh-modal.open{display:grid}.nh-dialog{width:min(620px,100%);max-height:88vh;overflow:auto;padding:22px;border:1px solid #d86cff66;border-radius:22px;background:linear-gradient(145deg,#14111b,#08080d);box-shadow:0 40px 100px #000f}.nh-dialog h2{margin:0 0 6px;font-size:24px;letter-spacing:-.04em}.nh-dialog p{margin:0;color:#aaa4b1;font-size:10px;line-height:1.6}.nh-dialog input{width:100%;min-height:44px;margin-top:12px;border:1px solid #ffffff22;border-radius:11px;background:#07070a;color:#fff;padding:0 12px;outline:0}.nh-checks{display:grid;gap:7px;margin:13px 0;max-height:300px;overflow:auto}.nh-check{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #ffffff14;border-radius:10px;background:#09090d;color:#ddd8e3;font-size:9px}.nh-check input{width:auto}.nh-dialog .actions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-top:12px}.nh-dialog .actions button{min-height:40px;padding:0 13px;border:1px solid #ffffff22;border-radius:10px;background:#09090d;color:#fff;font-size:8px;font-weight:1000}.nh-dialog .actions .primary{border-color:#55e39a66;background:#0b1711}
          @media(max-width:700px){.nh-feed-modes{width:100%}.nh-list-item{align-items:flex-start}.nh-list-item button{flex:none}}
          </style>'''
          js=r'''<script id="NAYANET_SURGICAL_CONTRACT_RUNTIME">
          (()=>{'use strict';
          const K={name:'nayanet_smart_name',fav:'nayanet_surgical_favorites_v1',lists:'nayanet_surgical_smart_lists_v1',shared:'nayanet_surgical_collective_v1',social:'nayanet_surgical_collective_social_v1'};
          const read=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};const clean=s=>String(s??'').replace(/\s+/g,' ').trim();const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const slug=s=>clean(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,90);
          const name=()=>clean(read(K.name,''));const saveName=n=>{n=clean(n).slice(0,80);if(n)write(K.name,n);return n};const greeting=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
          function sourceBlocks(){const out=[];try{const ns=JSON.parse(localStorage.getItem('nayanet_v7_live_notes')||'[]');ns.forEach(n=>{const text=String(n.text||''),title=(text.split(/[.!?]\s+/)[0]||'Intelligent Event').replace(/^#+\s*/,'').slice(0,100);out.push({id:String(n.id),title,summary:text,type:n.type||'INSIGHT',createdAt:n.createdAt||new Date().toISOString(),demo:false,raw:n})})}catch(e){}try{if(Array.isArray(window.demoBlocks))window.demoBlocks.forEach(b=>out.push({id:'demo-'+slug(b.title),title:b.title,summary:(b.body||[]).join(' '),type:b.type||'INSIGHT',createdAt:b.time==='DEMO'?'2000-01-01T00:00:00.000Z':new Date().toISOString(),demo:true,raw:b}))}catch(e){}return out}
          const find=id=>sourceBlocks().find(b=>b.id===id);const favs=()=>read(K.fav,{});const lists=()=>read(K.lists,[]);const shared=()=>read(K.shared,[]);const social=()=>read(K.social,{});
          function identityPrompt(){if(name())return;let g=document.getElementById('nayanetIdentityGate');if(g)return;g=document.createElement('div');g.id='nayanetIdentityGate';g.className='open';g.innerHTML='<div class="nh-id-dialog"><h2>Welcome to NayaNET.</h2><p>Enter your name or alias once. This is the single identity used to personalize your Hub.</p><input id="nhIdentityInput" autocomplete="name" maxlength="80" placeholder="Your name or alias"><button id="nhIdentitySave">ENTER YOUR HUB</button></div>';document.body.appendChild(g);const i=g.querySelector('#nhIdentityInput'),submit=()=>{const n=saveName(i.value);if(!n){i.focus();return}g.remove();paintGreeting()};g.querySelector('#nhIdentitySave').onclick=submit;i.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});setTimeout(()=>i.focus(),50)}
          function paintGreeting(){const h=document.querySelector('#page-home .heroIntro h1');if(h)h.textContent=(name()?greeting()+', '+name()+'.':'Welcome.');document.querySelectorAll('#nayanethub-personal-welcome,#naya-live-intelligence-header,#naya-locked-context,#nayanet-local-context').forEach(x=>x.remove())}
          function cleanNav(){const navs=[...document.querySelectorAll('.sidebar .nav')];navs.forEach(nav=>{const bs=[...nav.querySelectorAll('button')];const sn=bs.filter(b=>clean(b.textContent).toLowerCase()==='smart notes');sn.slice(1).forEach(b=>b.remove());bs.filter(b=>/your intelligence today|daily intelligence briefing/i.test(clean(b.textContent))).forEach(b=>b.remove());bs.filter(b=>/^demo reel$|^activity$/i.test(clean(b.textContent))).forEach(b=>b.remove())});const home=document.querySelector('.sidebar .nav button[data-page="home"]');if(home){const ico=home.querySelector('.ico');home.innerHTML='';if(ico)home.appendChild(ico);home.appendChild(document.createTextNode('Home'))}}
          function removeOldLayers(){document.querySelectorAll('.naya-feed-switch,.naya-block-actions,.naya-list-drawer,.nh72-section,.nh72-card,.nh-v11-quote,#nhV11Quote,.nh-authority-quote,#nhAuthorityQuote,#nhV11Today,#nh72Today,#naya-live-intelligence-header,#naya-list-drawer,#page-intelligence-today').forEach(x=>x.remove());document.querySelectorAll('[data-page="intelligence-today"],[data-page="nayalists"]').forEach(x=>x.remove());document.querySelectorAll('.nh72-feedback,.nayanet-v7-actions').forEach(x=>x.remove())}
          function ensureModes(){const t=document.querySelector('#page-home .feedToolbar');if(!t)return;let m=document.getElementById('nhFeedModes');if(!m){m=document.createElement('div');m.id='nhFeedModes';m.className='nh-feed-modes';m.innerHTML='<button data-mode="personal" class="active">PERSONAL</button><button data-mode="collective">COLLECTIVE</button><button class="nh-smart-list-link" data-open-lists>SMART LISTS</button>';t.appendChild(m);m.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;m.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));renderFeed()})}}
          function blockElement(id){return document.querySelector('[data-surgical-block="'+CSS.escape(id)+'"]')}
          function decorateBlock(el,b,mode){el.dataset.surgicalBlock=b.id;el.querySelectorAll('.nh-block-actions').forEach(x=>x.remove());const a=document.createElement('div');a.className='nh-block-actions';let html='<button data-fav="'+esc(b.id)+'">'+(favs()[b.id]?'★ FAVORITED':'☆ FAVORITE')+'</button><button data-save="'+esc(b.id)+'">🔖 SAVE TO SMART LIST</button><button data-share="'+esc(b.id)+'">＋ SHARE EXTERNALLY</button>';if(mode==='personal')html+='<button data-publish="'+esc(b.id)+'">⇧ SHARE TO COLLECTIVE</button>';else{const s=social()[b.id]||{like:false,love:false,rating:0,comments:[]};html+='<button class="nh-social" data-like="'+esc(b.id)+'">👍 '+(s.like?'LIKED':'LIKE')+'</button><button class="nh-social" data-love="'+esc(b.id)+'">♥ '+(s.love?'LOVED':'LOVE')+'</button><button class="nh-social" data-rank="'+esc(b.id)+'">★ '+(s.rating?s.rating+'/5':'RANK 1–5')+'</button><button class="nh-social" data-comment="'+esc(b.id)+'">💬 COMMENT '+((s.comments||[]).length||'')+'</button>'}a.innerHTML=html;el.appendChild(a)}
          function renderFeed(){const root=document.getElementById('homeIntelligentBlocks');if(!root)return;ensureModes();const mode=document.querySelector('#nhFeedModes [data-mode].active')?.dataset.mode||'personal';removeOldLayers();ensureModes();if(mode==='personal'){try{window.renderHomeFeed&&window.renderHomeFeed()}catch(e){}setTimeout(()=>decoratePersonal(),0);return}const ids=shared(),bs=ids.map(find).filter(Boolean);root.innerHTML=bs.length?bs.map((b,i)=>{let html='';try{html=window.renderBlock?window.renderBlock(b.raw||b,i,false):'<article class="intelligentBlock"><header class="blockHeader"><div class="blockIdentity"><div class="blockTitle"><h3>'+esc(b.title)+'</h3></div></div></header><div class="blockBody"><p>'+esc(b.summary)+'</p></div></article>'}catch(e){html='<article class="intelligentBlock"><header class="blockHeader"><div class="blockTitle"><h3>'+esc(b.title)+'</h3></div></header><div class="blockBody"><p>'+esc(b.summary)+'</p></div></article>'}return html}).join(''):'<div class="feedEmpty"><h3>Collective is intentionally empty.</h3><p>Nothing enters Collective until the owner deliberately shares it. Saving to a Smart List never publishes.</p></div>';decorateCollective()}
          function decoratePersonal(){const root=document.getElementById('homeIntelligentBlocks');if(!root)return;const bs=sourceBlocks(),els=[...root.querySelectorAll('.intelligentBlock')];els.forEach((el,i)=>{const title=clean(el.querySelector('.blockTitle h3')?.textContent);const b=bs.find(x=>x.title===title)||bs[i];if(b)decorateBlock(el,b,'personal')})}
          function decorateCollective(){const root=document.getElementById('homeIntelligentBlocks');if(!root)return;const bs=shared().map(find).filter(Boolean),els=[...root.querySelectorAll('.intelligentBlock')];els.forEach((el,i)=>{if(bs[i])decorateBlock(el,bs[i],'collective')})}
          function externalShare(id){const b=find(id);if(!b)return;const text=b.title+'\n\n'+b.summary+'\n\nNayaNET — Create. Connect. Grow with US.';if(navigator.share)navigator.share({title:b.title,text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('Intelligence copied for external sharing.')).catch(()=>alert(text));else alert(text)}
          function saveModal(id){const ls=lists(),m=document.createElement('div');m.className='nh-modal open';m.innerHTML='<div class="nh-dialog"><h2>SAVE TO SMART LIST</h2><p>Saving is private organization. It never publishes the Intelligent Block.</p><input id="nhNewList" placeholder="Create a new Smart List…"><div class="nh-checks">'+(ls.length?ls.map(l=>'<label class="nh-check"><input type="checkbox" value="'+esc(l.id)+'" '+((l.items||[]).includes(id)?'checked':'')+'> '+esc(l.name)+'</label>').join(''):'<div style="color:#99939f;font-size:9px">No lists yet. Create one above.</div>')+'</div><div class="actions"><button data-close>Cancel</button><button class="primary" id="nhSaveList">SAVE</button></div></div>';document.body.appendChild(m);m.querySelector('[data-close]').onclick=()=>m.remove();m.querySelector('#nhSaveList').onclick=()=>{let a=lists(),newName=clean(m.querySelector('#nhNewList').value),checked=[...m.querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value);if(newName){const n={id:'list-'+Date.now().toString(36),name:newName,items:[]};a.push(n);checked.push(n.id)}a=a.map(l=>{const set=new Set(l.items||[]);if(checked.includes(l.id))set.add(id);else set.delete(id);return {...l,items:[...set]}});write(K.lists,a);m.remove();renderLists()}}
          function openLists(){activateLists();renderLists()}
          function activateLists(){let p=document.getElementById('nh-surgical-lists');if(!p){p=document.createElement('section');p.id='nh-surgical-lists';p.className='page nh-list-page';p.innerHTML='<div class="pageHead"><div><div class="eyebrow">PRIVATE ORGANIZATION</div><h1>Smart Lists</h1><p>Named collections that reference the real Intelligent Blocks. Personal and Collective items may coexist.</p></div></div><div class="nh-list-toolbar"><input id="nhListSearch" placeholder="Search Smart Lists and their intelligence…"><button id="nhCreateList">＋ CREATE SMART LIST</button></div><div id="nhListBody"></div>';document.querySelector('main.main')?.appendChild(p);p.querySelector('#nhCreateList').onclick=()=>{const n=prompt('Name your Smart List');if(!n?.trim())return;const a=lists();a.push({id:'list-'+Date.now().toString(36),name:clean(n),items:[]});write(K.lists,a);renderLists()};p.querySelector('#nhListSearch').oninput=renderLists}document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));p.classList.add('active');document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===document.querySelector('[data-page="nh-surgical-lists"]')));document.getElementById('pageTitle').textContent='Smart Lists';window.scrollTo({top:0,behavior:'smooth'})}
          function renderLists(){const p=document.getElementById('nh-surgical-lists');if(!p)return;const q=clean(p.querySelector('#nhListSearch')?.value).toLowerCase(),arr=lists().filter(l=>!q||l.name.toLowerCase().includes(q)||(l.items||[]).some(id=>{const b=find(id);return b&&(b.title+' '+b.summary).toLowerCase().includes(q)})),body=p.querySelector('#nhListBody');body.innerHTML=arr.length?arr.map(l=>{const bs=(l.items||[]).map(find).filter(Boolean);return '<section class="nh-list-card"><div class="nh-list-head"><h3>'+esc(l.name)+'</h3><span>'+bs.length+' INTELLIGENT BLOCKS</span></div><div class="nh-list-items">'+(bs.length?bs.map(b=>'<div class="nh-list-item"><div><b>'+esc(b.title)+'</b><span>'+esc(b.type||'INSIGHT')+' · '+(shared().includes(b.id)?'COLLECTIVE':'PERSONAL')+'</span></div><button data-remove-list="'+esc(l.id)+'" data-remove-block="'+esc(b.id)+'">REMOVE</button></div>').join(''):'<div style="padding:18px;color:#99939f;font-size:9px">This Smart List is empty.</div>')+'</div></section>'}).join(''):'<div class="empty"><b>No matching Smart Lists.</b><span>Create a list or save an Intelligent Block to one.</span></div>'}
          function navLists(){const nav=document.querySelector('.sidebar .nav');if(!nav)return;let b=nav.querySelector('[data-page="nh-surgical-lists"]');if(!b){b=document.createElement('button');b.dataset.page='nh-surgical-lists';b.innerHTML='<span class="ico">▦</span>Smart Lists';nav.appendChild(b)}b.onclick=e=>{e.preventDefault();e.stopPropagation();openLists()}}
          function bind(){document.addEventListener('click',e=>{const f=e.target.closest('[data-fav]');if(f){const a=favs();a[f.dataset.fav]=!a[f.dataset.fav];write(K.fav,a);renderFeed();return}const s=e.target.closest('[data-save]');if(s){saveModal(s.dataset.save);return}const x=e.target.closest('[data-share]');if(x){externalShare(x.dataset.share);return}const p=e.target.closest('[data-publish]');if(p){const a=shared();if(!a.includes(p.dataset.publish)){a.push(p.dataset.publish);write(K.shared,a)}renderFeed();return}const l=e.target.closest('[data-like]');if(l){const a=social(),v=a[l.dataset.like]||{like:false,love:false,rating:0,comments:[]};v.like=!v.like;a[l.dataset.like]=v;write(K.social,a);renderFeed();return}const o=e.target.closest('[data-love]');if(o){const a=social(),v=a[o.dataset.love]||{like:false,love:false,rating:0,comments:[]};v.love=!v.love;a[o.dataset.love]=v;write(K.social,a);renderFeed();return}const r=e.target.closest('[data-rank]');if(r){const v=Number(prompt('Rank this Collective intelligence from 1 to 5.',String((social()[r.dataset.rank]||{}).rating||'')));if(Number.isInteger(v)&&v>=1&&v<=5){const a=social(),x=a[r.dataset.rank]||{like:false,love:false,rating:0,comments:[]};x.rating=v;a[r.dataset.rank]=x;write(K.social,a);renderFeed()}return}const c=e.target.closest('[data-comment]');if(c){const text=prompt('Comment on this Collective intelligence.');if(text?.trim()){const a=social(),v=a[c.dataset.comment]||{like:false,love:false,rating:0,comments:[]};v.comments=v.comments||[];v.comments.push({text:clean(text),createdAt:new Date().toISOString()});a[c.dataset.comment]=v;write(K.social,a);renderFeed()}return}const rm=e.target.closest('[data-remove-list]');if(rm){const a=lists().map(l=>l.id===rm.dataset.removeList?{...l,items:(l.items||[]).filter(id=>id!==rm.dataset.removeBlock)}:l);write(K.lists,a);renderLists();return}const ol=e.target.closest('[data-open-lists]');if(ol){e.preventDefault();e.stopPropagation();openLists();return}const pg=e.target.closest('[data-page="nh-surgical-lists"]');if(pg){e.preventDefault();e.stopPropagation();openLists()}} ,true)}
          function boot(){removeOldLayers();cleanNav();identityPrompt();ensureModes();navLists();paintGreeting();renderFeed();bind()}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();setInterval(()=>{cleanNav();paintGreeting();ensureModes();navLists()},1500);
          })();
          </script>'''
          s=s.replace('</body>',css+js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate finished artifact
        shell: bash
        run: |
          test -s NAYANETHUB.html
          grep -q 'NAYANET_SURGICAL_CONTRACT_RUNTIME' NAYANETHUB.html
          grep -q 'nayanet_surgical_smart_lists_v1' NAYANETHUB.html
          grep -q 'nayanet_surgical_collective_v1' NAYANETHUB.html
          grep -q 'data-mode="personal"' NAYANETHUB.html
          grep -q 'data-mode="collective"' NAYANETHUB.html
          grep -q 'nayanet_smart_name' NAYANETHUB.html
          grep -q 'SAVE TO SMART LIST' NAYANETHUB.html
          grep -q 'SHARE TO COLLECTIVE' NAYANETHUB.html
          grep -q 'nayanet_v7_live_notes' NAYANETHUB.html
          grep -q 'nayanet_v7_live_notes' NAYANETHUB.html
          ! grep -q 'Stacy' NAYANETHUB.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('NAYANETHUB.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          for i,x in enumerate(scripts):
              if 'NAYANET_SURGICAL_CONTRACT_RUNTIME' in x:
                  Path('/tmp/surgical.js').write_text(x,encoding='utf-8')
                  break
          else: raise SystemExit('final runtime missing')
          PY
          node --check /tmp/surgical.js
      - name: Commit finished canonical source
        shell: bash
        run: |
          git config user.name 'NayaNET Surgical Builder'
          git config user.email 'nayanet-surgical@users.noreply.github.com'
          git add NAYANETHUB.html
          git diff --cached --quiet || git commit -m 'Surgical Hub contract: identity feeds and Smart Lists'
          git push
      - name: Package finished artifact
        shell: bash
        run: |
          rm -rf dist NayaNET-Intelligent-Hub-UPDATED.zip
          mkdir -p dist/nayanet-intelligent-hub
          cp NAYANETHUB.html dist/nayanet-intelligent-hub/NAYANETHUB.html
          (cd dist && zip -r ../NayaNET-Intelligent-Hub-UPDATED.zip nayanet-intelligent-hub >/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-UPDATED
          path: NayaNET-Intelligent-Hub-UPDATED.zip
