name: NayaNET Hub artifact package
on:
  push:
    paths:
      - '.github/workflows/fix-nayanethub.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical Hub source
        shell: bash
        run: |
          test -s NAYANETHUB.html
          grep -q 'NAYANET_SURGICAL_CONTRACT_RUNTIME' NAYANETHUB.html
          grep -q 'nayanet_smart_name' NAYANETHUB.html
          grep -q 'nayanet_surgical_smart_lists_v1' NAYANETHUB.html
          grep -q 'nayanet_surgical_collective_v1' NAYANETHUB.html
          ! grep -q 'Good morning, Shawn.' NAYANETHUB.html
          ! grep -q 'Stacy' NAYANETHUB.html
      - name: Package exact canonical source
        shell: bash
        run: |
          rm -rf dist NayaNET-Intelligent-Hub-CANONICAL.zip
          mkdir -p dist/nayanet-intelligent-hub
          cp NAYANETHUB.html dist/nayanet-intelligent-hub/NAYANETHUB.html
          (cd dist && zip -r ../NayaNET-Intelligent-Hub-CANONICAL.zip nayanet-intelligent-hub >/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-CANONICAL
          path: NayaNET-Intelligent-Hub-CANONICAL.zip
