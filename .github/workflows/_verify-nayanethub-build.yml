name: Verify NayaNET Hub build
on:
  push:
    paths:
      - 'NAYANETHUB.html'
      - '.github/workflows/_verify-nayanethub-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and package exact canonical source
        shell: bash
        run: |
          set -euo pipefail
          test -s NAYANETHUB.html
          grep -q 'nh-greeting' NAYANETHUB.html
          grep -q 'nh-greeting-script' NAYANETHUB.html
          grep -q 'GOOD MORNING' NAYANETHUB.html
          cp NAYANETHUB.html index.html
          printf '/index.html 200\n' > _redirects
          zip -9 -j NayaNET-Intelligent-Hub-Cloudflare.zip index.html _redirects NAYANETHUB.html
          unzip -t NayaNET-Intelligent-Hub-Cloudflare.zip
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-Cloudflare-verified
          path: NayaNET-Intelligent-Hub-Cloudflare.zip
          if-no-files-found: error
