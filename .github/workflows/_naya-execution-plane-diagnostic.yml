name: Naya Execution Plane Diagnostic

on:
  push:
    branches:
      - naya-action-delivery-contract-v1

permissions:
  contents: read

jobs:
  execution-plane:
    runs-on: ubuntu-latest
    steps:
      - name: Prove runner execution
        run: |
          echo "EXECUTION_PLANE_OK"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "GITHUB_SHA=$GITHUB_SHA"
