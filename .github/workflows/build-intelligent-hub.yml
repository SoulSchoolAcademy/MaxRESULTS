name: Build NayaNET Intelligent Hub package
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good V7 source
        run: git checkout c171a9b0eaeb2064be60b30231ee901edb9daea6 -- NAYANETHUB.html
      - name: Apply surgical upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NAYANETHUB.html');s=p.read_text(encoding='utf-8')
          for marker in ('.intelligentFeed','.intelligentBlock','</body>'):
              if marker not in s: raise SystemExit('ABORT: V7 marker missing: '+marker)
          add=r'''<style id="NAYA_INTELLIGENCE_UPGRADE_V1">#naya-live-intelligence-header{margin:22px 0 24px;padding:22px 24px 20px;border:1px solid #d86cff42;border-radius:22px;background:linear-gradient(135deg,#181321,#0b0a0f);box-shadow:inset 0 1px #fff4,0 20px 50px #000b}#naya-live-intelligence-header .nayah{font-size:clamp(30px,4.4vw,58px);line-height:.92;letter-spacing:-.065em;font-weight:1000;margin:0}#naya-live-intelligence-header .nayasub{margin-top:10px;color:#cfc9d7;font-size:11px;letter-spacing:.08em;text-transform:uppercase}#naya-live-intelligence-header .nayaplace{margin-top:10px;color:#eeeaf2;font-size:15px}.naya-feed-switch{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.naya-feed-switch button,.naya-org-button{min-height:40px;padding:0 14px;border:1px solid #ffffff22;border-radius:12px;background:#09090d;color:#bdb8c7;font-size:8px;font-weight:1000;letter-spacing:.09em;text-transform:uppercase}.naya-feed-switch button.active{color:#fff;border-color:#d86cff72;background:#25152e}.naya-block-actions{display:flex;flex-wrap:wrap;gap:6px;padding:12px 17px 15px;border-top:1px solid #ffffff10}.naya-block-actions button{min-height:31px;padding:0 9px;border:1px solid #ffffff19;border-radius:9px;background:#08080c;color:#bdb8c4;font-size:7px;font-weight:950}.naya-block-actions .fav.on{color:#e8c766;border-color:#e8c76670}.naya-social{display:none;gap:6px;flex-wrap:wrap;margin-left:auto}.naya-list-drawer{position:fixed;inset:0;z-index:100;display:none;background:#0009;backdrop-filter:blur(10px);align-items:flex-end;justify-content:flex-end}.naya-list-drawer.open{display:flex}.naya-list-panel{width:min(560px,100%);height:min(88vh,760px);background:#09090d;border:1px solid #d86cff45;border-radius:24px 0 0 0;padding:22px;overflow:auto}.naya-list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.naya-list-head h2{margin:0;font-size:24px}.naya-list-close{min-width:40px;height:40px;border:1px solid #ffffff20;border-radius:11px;background:#101016}.naya-list-search{width:100%;min-height:43px;margin-bottom:12px;border:1px solid #ffffff1d;border-radius:11px;background:#07070a;color:#fff;padding:11px}.naya-list-create{display:flex;gap:7px;margin-bottom:14px}.naya-list-create input{flex:1;min-width:0;min-height:40px;border:1px solid #ffffff1d;border-radius:10px;background:#07070a;color:#fff;padding:10px}.naya-list-card{padding:13px;border:1px solid #ffffff16;border-radius:14px;background:#0d0d12;margin-bottom:8px}.naya-list-card b{font-size:11px}.naya-list-card small{display:block;color:#918b99;font-size:8px;margin-top:4px}.naya-list-item{padding:11px;border:1px solid #ffffff12;border-radius:11px;background:#08080c;margin-top:7px}.naya-list-item p{font-size:9px;color:#aaa4b0;line-height:1.45;margin:5px 0}.naya-empty{padding:20px;border:1px dashed #ffffff20;border-radius:14px;color:#9d97a4;font-size:10px;line-height:1.6}@media(max-width:760px){#naya-live-intelligence-header{padding:18px}.naya-list-panel{height:92vh}.naya-social{width:100%;margin-left:0}}</style><div id="naya-list-drawer" class="naya-list-drawer" aria-hidden="true"><section class="naya-list-panel"><div class="naya-list-head"><h2 id="naya-org-title">Smart Lists</h2><button class="naya-list-close" type="button">×</button></div><input id="naya-list-search" class="naya-list-search" placeholder="Search your lists…"><div class="naya-list-create"><input id="naya-new-list-name" placeholder="New Smart List name…"><button id="naya-create-list" class="naya-org-button" type="button">+ New List</button></div><div id="naya-list-body"></div></section></div><script id="NAYA_INTELLIGENCE_UPGRADE_V1_JS">(()=>{const K='naya.intelligence.v1',S=JSON.parse(localStorage.getItem(K)||'{"favorites":[],"lists":{},"feed":"personal"}'),put=()=>localStorage.setItem(K,JSON.stringify(S)),clean=x=>(x||'').replace(/\\s+/g,' ').trim(),id=(b,i)=>b.dataset.nayaId||(b.dataset.nayaId='ib-'+i+'-'+Math.random().toString(36).slice(2,8));function who(){for(const k of ['nayaUserName','naya_user_name','userName','username','displayName','display_name','alias','nayaAlias','naya_alias','name']){const v=clean(localStorage.getItem(k)||sessionStorage.getItem(k));if(v)return v}const e=[...document.querySelectorAll('input,textarea')].find(x=>/(name|alias|username|display)/i.test(x.name||x.id||'')&&clean(x.value));return e?clean(e.value):''}function start(){const m=document.querySelector('.main');if(!m)return;let h=document.getElementById('naya-live-intelligence-header');if(!h){h=document.createElement('section');h.id='naya-live-intelligence-header';h.innerHTML='<h1 class="nayah"></h1><div class="nayasub"></div><div class="nayaplace">Your intelligence has a place to come together.</div>';const t=m.querySelector('.topbar');t?.after(h)}const paint=()=>{const d=new Date(),g=d.getHours()<12?'Good morning':d.getHours()<18?'Good afternoon':'Good evening';h.querySelector('.nayah').textContent=g+(who()?', '+who():'')+'.';h.querySelector('.nayasub').textContent=d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' • '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};paint();if(!h.dataset.timer){h.dataset.timer='1';setInterval(paint,30000)}const f=document.querySelector('.intelligentFeed');if(f&&!f.querySelector('.naya-feed-switch')){const sw=document.createElement('div');sw.className='naya-feed-switch';sw.innerHTML='<button class="active" data-f="personal">Personal</button><button data-f="collective">Collective</button>';f.prepend(sw);sw.onclick=e=>{const b=e.target.closest('button');if(!b)return;S.feed=b.dataset.f;put();sw.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));actions()}}document.querySelectorAll('button,a').forEach(e=>{const t=clean(e.textContent);if(t==='Your Intelligence Today')e.remove();if(t==='Demo Reel'||t==='Activity')e.style.display='none'});const blocks=[...document.querySelectorAll('.intelligentBlock')];blocks.forEach((b,i)=>{const I=id(b,i);if(b.querySelector('.naya-block-actions'))return;const a=document.createElement('div');a.className='naya-block-actions';a.innerHTML='<button class="fav">☆ Favorite</button><button class="save">💾 Save to List</button><button class="share">↗ Share</button><button class="circulate">↗ Share to Collective</button><span class="naya-social"><button>❤️ Love</button><button>👍 Like</button><button>⭐ 1–5 Stars</button><button>💬 Comment</button></span>';b.appendChild(a);a.querySelector('.fav').onclick=()=>{const j=S.favorites.indexOf(I);j>=0?S.favorites.splice(j,1):S.favorites.push(I);put();a.querySelector('.fav').classList.toggle('on',S.favorites.includes(I))};a.querySelector('.share').onclick=()=>navigator.share?navigator.share({title:'NayaNET Intelligence',text:clean(b.textContent).slice(0,600)}).catch(()=>{}):navigator.clipboard?.writeText(clean(b.textContent));a.querySelector('.circulate').onclick=()=>{b.dataset.collective='true';a.querySelector('.circulate').textContent='✓ In Collective'};a.querySelector('.save').onclick=()=>{let n=prompt('Smart List name',Object.keys(S.lists)[0]||'');if(!n)return;n=clean(n);S.lists[n]=S.lists[n]||[];if(!S.lists[n].includes(I))S.lists[n].push(I);put()};a.querySelectorAll('.naya-social button').forEach(x=>x.onclick=()=>x.classList.toggle('active'))});actions()}function actions(){document.querySelectorAll('.intelligentBlock').forEach(b=>{const s=b.querySelector('.naya-social'),c=b.querySelector('.circulate');if(s)s.style.display=S.feed==='collective'?'flex':'none';if(c)c.style.display=S.feed==='personal'?'inline-block':'none'})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();})();</script>'''
          s=s.replace('</body>',add+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('NAYANETHUB.html').read_text(encoding='utf-8')
          tests={'marker':'NAYA_INTELLIGENCE_UPGRADE_V1' in s,'intelligentBlock':'.intelligentBlock' in s,'intelligentFeed':'.intelligentFeed' in s,'personal collective':'data-f="personal"' in s and 'data-f="collective"' in s,'no Stacy':'Stacy' not in s}
          print(tests)
          if not all(tests.values()): raise SystemExit('validation failed')
          PY
      - name: Commit upgraded source and package
        run: |
          git config user.name 'NayaNET Bot'
          git config user.email 'nayanet-bot@users.noreply.github.com'
          git add NAYANETHUB.html
          git diff --cached --quiet || git commit -m 'Surgical Intelligent Hub upgrade'
          git push
          rm -rf dist NayaNET-Intelligent-Hub-UPDATED.zip
          mkdir -p dist/nayanet-intelligent-hub
          cp NAYANETHUB.html dist/nayanet-intelligent-hub/
          (cd dist && zip -r ../NayaNET-Intelligent-Hub-UPDATED.zip nayanet-intelligent-hub >/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-UPDATED
          path: NayaNET-Intelligent-Hub-UPDATED.zip
