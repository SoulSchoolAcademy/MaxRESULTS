name: Build NayaNET Cloudflare Release
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Validate canonical pages, runtime, assets and Worker entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cd NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
          for f in index.html hub.html nayanet-entrance.js nayanet-front-door-overhaul.css nayanet-10-experience.css nayanet-elite.css nayanet-mobile-overflow.css nayanet-intelligence-feed.css nayanet-living-entrance.css nayanet-app-experience-polish.css nayanet-visual-reconstruction.css nayanet-visual-final.css nayanet-experience-rebuild.css nayanet-elite-execution.css nayanet-entrance-command.css nayanet-entrance-orbs.css nayanet-10.js naya-data.js nayanet-intelligence-feed.js powercasts.json _headers 404.html worker.js wrangler.jsonc .assetsignore; do test -s "$f"; done
          grep -Fq 'href="/nayanet-10-experience.css"' index.html
          grep -Fq 'href="/nayanet-front-door-overhaul.css"' index.html
          grep -Fq 'src="/nayanet-entrance.js"' index.html
          grep -Fq 'src="/naya-data.js"' hub.html
          node --check nayanet-entrance.js
          node --check nayanet-10.js
          node --check naya-data.js
          node --check nayanet-intelligence-feed.js
          node --check worker.js
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('powercasts.json','utf8'));
          if(!Array.isArray(x)||x.length!==18) throw new Error('Expected 18 Powercasts');
          if(x.some(c=>!c.n||!c.title||!c.image||!c.audio)) throw new Error('Incomplete Powercast');
          NODE
          python - <<'PY'
          from pathlib import Path
          entrance=Path('index.html').read_text()
          hub=Path('hub.html').read_text()
          for i in ['frontDoor','entryForm','nameInput']:
            if f'id="{i}"' not in entrance: raise SystemExit('Missing entrance contract: '+i)
          for i in ['hub','hubStage','nayaCore','worldMap','player','worldCards','castGrid','worldView','audio']:
            if f'id="{i}"' not in hub: raise SystemExit('Missing hub contract: '+i)
          for x in ['role="slider"','aria-valuemin="0"','aria-valuemax="100"','aria-valuenow="0"','aria-live="polite"']:
            if x not in hub: raise SystemExit('Missing accessibility contract: '+x)
          if 'threshold-oracle' in entrance or 'threshold-oracle' in hub: raise SystemExit('Obsolete side-oracle must be removed')
          cfg=Path('wrangler.jsonc').read_text()
          for token in ['"main": "worker.js"','"directory": "."','"binding": "ASSETS"']:
            if token not in cfg: raise SystemExit('Missing Worker config: '+token)
          print('NayaNET page-by-page Worker release contract: OK')
          PY
      - name: Assemble Worker Static Assets package
        shell: bash
        run: |
          set -euo pipefail
          cd NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
          rm -rf release-package
          mkdir -p release-package/public
          cp index.html hub.html nayanet-entrance.js nayanet-front-door-overhaul.css nayanet-10-experience.css nayanet-elite.css nayanet-mobile-overflow.css nayanet-intelligence-feed.css nayanet-living-entrance.css nayanet-app-experience-polish.css nayanet-visual-reconstruction.css nayanet-visual-final.css nayanet-experience-rebuild.css nayanet-elite-execution.css nayanet-entrance-command.css nayanet-entrance-orbs.css nayanet-front-door.js nayanet-10.js naya-data.js nayanet-intelligence-feed.js powercasts.json _headers 404.html release-package/public/
          cp worker.js wrangler.jsonc release-package/
          cat > release-package/DEPLOY.md <<'EOF'
          # NayaNET Cloudflare Worker Release

          This package uses Cloudflare Workers Static Assets.

          Deploy from this package directory with `wrangler deploy`.
          EOF
      - name: Validate assembled package and create exact ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
          for f in index.html hub.html nayanet-entrance.js nayanet-front-door-overhaul.css nayanet-front-door.js; do test -s "release-package/public/$f"; done
          test -s release-package/public/nayanet-app-experience-polish.css
          test -s release-package/public/nayanet-entrance-command.css
          test -s release-package/public/nayanet-entrance-orbs.css
          test -s release-package/worker.js
          test -s release-package/wrangler.jsonc
          test "$(find release-package/public -maxdepth 1 -type f | wc -l | tr -d ' ')" -ge 20
          cd release-package
          zip -qr ../NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip .
          cd ..
          unzip -t NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip
          sha256sum NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip | tee NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip.sha256
          echo "Commit: $(git rev-parse HEAD)" > NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.PROOF.txt
          echo "Package: Cloudflare Workers Static Assets" >> NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.PROOF.txt
          echo "Artifact SHA-256: $(sha256sum NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip | awk '{print $1}')" >> NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.PROOF.txt
      - name: Upload artifact and proof
        uses: actions/upload-artifact@v4
        with:
          name: NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE
          path: |
            NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE/NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip
            NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE/NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip.sha256
            NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE/NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.PROOF.txt
          if-no-files-found: error
