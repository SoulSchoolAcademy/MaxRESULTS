name: Build Living Sun Cloudflare ZIP

on:
  push:
    branches:
      - nayanet/living-sun-hub-v2
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Assemble exact Cloudflare package
        run: |
          rm -rf dist-cloudflare
          mkdir -p dist-cloudflare
          cp CLOUDFLARE-LIVING-SUN/index.html dist-cloudflare/index.html
          cp CLOUDFLARE-LIVING-SUN/_headers dist-cloudflare/_headers
      - name: Validate source artifact
        run: |
          test -s dist-cloudflare/index.html
          test -s dist-cloudflare/_headers
          test "$(find dist-cloudflare -maxdepth 1 -type f | wc -l)" -eq 2
          grep -q '<!doctype html>' dist-cloudflare/index.html
          grep -q 'LIVING INTELLIGENCE' dist-cloudflare/index.html
          grep -q 'WHAT IS NAYA POWER' dist-cloudflare/index.html
          grep -q 'Compounding Intelligence System' dist-cloudflare/index.html
          grep -q 'Five-Day Challenge' dist-cloudflare/index.html
      - name: Create exact Cloudflare ZIP
        run: |
          cd dist-cloudflare
          zip -9 -j ../NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip index.html _headers
      - name: Verify ZIP contains only deployment files
        run: |
          test "$(unzip -Z1 NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip | wc -l)" -eq 2
          unzip -Z1 NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip | grep -qx 'index.html'
          unzip -Z1 NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip | grep -qx '_headers'
      - name: Upload Cloudflare ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE
          path: NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip
          if-no-files-found: error
          retention-days: 7
