name: Build Living Sun Cloudflare Upload

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Verify current NayaNET release source
        shell: bash
        run: |
          set -euo pipefail
          test -s NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE/index.html
          test -s NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE/_headers
      - name: Create standalone Cloudflare ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
          zip -j ../../../NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip index.html _headers
      - name: Verify exact ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          test "$(unzip -Z1 NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip | sort | tr '\n' ' ')" = "_headers index.html "
      - name: Upload standalone ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE
          path: NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip
          if-no-files-found: error
