name: Build Living Sun Cloudflare Upload

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Verify current NayaNET release source
        shell: bash
        run: |
          set -euo pipefail
          cd NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
          for file in index.html styles.css compat.css app.js living.js _headers 404.html; do test -s "$file"; done
      - name: Create complete standalone Cloudflare ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
          zip -j ../../../NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip \
            index.html styles.css compat.css app.js living.js _headers 404.html
      - name: Verify exact ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          expected="404.html _headers app.js compat.css index.html living.js styles.css "
          actual="$(unzip -Z1 NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip | sort | tr '\n' ' ')"
          test "$actual" = "$expected"
      - name: Upload standalone ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE
          path: NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip
          if-no-files-found: error
