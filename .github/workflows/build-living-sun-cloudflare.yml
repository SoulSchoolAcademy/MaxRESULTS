name: Build Living Sun Cloudflare ZIP

on:
  push:
    branches:
      - nayanet/living-sun-hub-v2
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Assemble Cloudflare package
        run: |
          rm -rf dist-cloudflare
          mkdir -p dist-cloudflare
          cp E02-LIVING-SUN-HUB/index.html dist-cloudflare/index.html
          if [ -f E02-LIVING-SUN-HUB/_headers ]; then cp E02-LIVING-SUN-HUB/_headers dist-cloudflare/_headers; fi
      - name: Validate package
        run: |
          test -s dist-cloudflare/index.html
          test "$(find dist-cloudflare -maxdepth 1 -type f | wc -l)" -ge 1
          grep -q '<!doctype html>' dist-cloudflare/index.html
      - name: Create ZIP
        run: |
          cd dist-cloudflare
          zip -9 -r ../NAYANET-LIVING-SUN-CLOUDFLARE.zip .
      - name: Upload Cloudflare ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAYANET-LIVING-SUN-CLOUDFLARE
          path: NAYANET-LIVING-SUN-CLOUDFLARE.zip
          if-no-files-found: error
          retention-days: 7
