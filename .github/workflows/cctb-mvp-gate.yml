name: CCTB MVP Clean Checkout Gate

on:
  push:
    branches: [cctb-v0.1-proof]

permissions:
  contents: read

concurrency:
  group: cctb-mvp-gate
  cancel-in-progress: false

jobs:
  cctb-mvp:
    name: cctb-mvp-clean-checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Clean checkout exact pushed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: CCTB protocol self-test
        run: python .naya/runtime/cct_protocol.py self-test

      - name: Full CCTB MVP test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_cct_mvp.py

      - name: Execute canonical proof generator
        run: python .naya/runtime/cct_mvp_proof.py --output /tmp/cctb-generated-proof.json

      - name: Assert generated artifact is byte-identical to committed artifact
        run: cmp --silent /tmp/cctb-generated-proof.json proofs/cctb-v0.1-mvp-proof.json

      - name: Execute independent second-pass verifier
        run: |
          cp proofs/cctb-v0.1-mvp-proof.json /tmp/cctb-verified-proof.json
          python .naya/runtime/cct_mvp_second_pass.py /tmp/cctb-verified-proof.json

      - name: Assert independent verifier preserves exact artifact bytes
        run: cmp --silent /tmp/cctb-verified-proof.json proofs/cctb-v0.1-mvp-proof.json

      - name: Independent artifact identity and acceptance verification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.naya/runtime')
          from cct_protocol import block_hash, validate_block, verify_link
          p = json.loads(Path('proofs/cctb-v0.1-mvp-proof.json').read_text(encoding='utf-8'))
          a, b = p['blocks']['a'], p['blocks']['b']
          checks = {
              'a_hash': block_hash(a) == a['block_id'],
              'b_hash': block_hash(b) == b['block_id'],
              'a_valid_for_b': not validate_block(a, consumer_id='naya-b'),
              'b_valid_for_a': not validate_block(b, consumer_id='naya-a'),
              'lineage': not verify_link(b, a),
              'recorded_lineage_id': p['lineage']['parent_block_id'] == a['block_id'],
              'recorded_lineage_hash': p['lineage']['parent_block_hash'] == block_hash(a),
              'first_pass_green': p['first_pass'] == 'GREEN',
              'matrix_all_green': all(v == 'GREEN' for v in p['matrix'].values()),
              'second_pass_green': p['second_pass']['status'] == 'GREEN',
              'verifier_identity': p['second_pass']['verifier'] == 'cct_mvp_second_pass.py',
          }
          print(json.dumps(checks, indent=2))
          assert all(checks.values())
          data = Path('proofs/cctb-v0.1-mvp-proof.json').read_bytes()
          print('GIT_BLOB_SHA=' + hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest())
          print('CCTB MVP CLEAN-CHECKOUT GATE → GREEN')
          PY
