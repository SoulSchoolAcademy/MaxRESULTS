name: NayaNET Runtime QA

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NAYANET/E02-INTELLIGENT-HUB-CLOUDFLARE
    steps:
      - uses: actions/checkout@v4
      - name: Validate Powercast registry
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('powercasts.json','utf8')); if(x.length!==18) process.exit(1); if(x.some(c=>!c.n||!c.title||!c.image||!c.audio)) process.exit(1); console.log('Powercasts:',x.length)"
      - name: Syntax-check runtime JavaScript
        run: |
          for f in app.js living.js naya-runtime.js naya-experience.js naya-final.js naya-data.js; do
            node --check "$f"
          done
      - name: Validate HTML runtime references
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          required=['/styles.css','/app.js','/naya-data.js','/naya-runtime.js','/naya-experience.js','/naya-final.js','/powercasts.json']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing runtime references: '+', '.join(missing))
          for path in ['styles.css','app.js','naya-data.js','naya-runtime.js','naya-experience.js','naya-final.js','powercasts.json','_headers','404.html']:
            if not Path(path).is_file() or Path(path).stat().st_size==0: raise SystemExit('Missing asset: '+path)
          print('HTML/assets: OK')
          PY
      - name: Validate NayaNET worlds and primary actions
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('app.js').read_text()
          for value in ['Naya Power','Super Brain','Smart Identity','Intelligence','MAXESS','5-Day Challenge','Intelligent Spaces','Your Network','Power Player']:
            if value not in js: raise SystemExit('Missing world: '+value)
          for value in ['What are you trying to accomplish?','Smart Note','Five-Day','Smart ID']:
            if value not in Path('naya-runtime.js').read_text(): raise SystemExit('Missing interaction: '+value)
          print('Worlds/interactions: OK')
          PY
