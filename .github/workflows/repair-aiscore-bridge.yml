name: MAXESS Q15 direct-results surgical repair
on:
  push:
    paths:
      - '.github/workflows/repair-aiscore-bridge.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply minimal 447 assessment edit
        shell: python
        run: |
          from pathlib import Path
          p=Path('AISCORE.NAYANET.APP 2026 08 21 447')
          s=p.read_text(encoding='utf-8')
          old="<p>Hi, I\\'m Naya.</p><p>I\\'m going to walk you through this assessment.</p><p>It takes about three minutes.</p><p>I\\'ll help you understand what each question is really asking, then you can answer honestly based on what you actually do today.</p><p>Ready?</p>"
          new="<p class='welcome-title'>Welcome to the MAXESS AI Mastery Assessment</p><p>I\\'m going to walk you through this assessment.</p><p>It takes about three minutes.</p><p>I\\'ll help you understand what each question is really asking, then you can answer honestly based on what you actually do today.</p><p>Ready?</p>"
          if s.count(old)!=1:
              raise SystemExit(f'REFUSING: expected exactly one welcome copy block, found {s.count(old)}')
          s=s.replace(old,new,1)
          css="<style>/* NAYA_WELCOME_SURGICAL_V2 */ .dialog-body.welcome-copy .welcome-title{margin:0 0 18px;color:#fff;font-size:clamp(22px,3.2vw,32px);line-height:1.08;font-weight:950;letter-spacing:-.03em}</style>"
          if 'NAYA_WELCOME_SURGICAL_V2' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')

      - name: Build complete Results page from preserved section sources
        shell: python
        run: |
          from pathlib import Path
          import re
          files=[Path('E01'),Path('E02'),Path('E03'),Path('E04'),Path('E05-SECTION-05-WORKING.html'),Path('E06 LASTEEST CODE')]
          missing=[str(p) for p in files if not p.is_file()]
          if missing:
              raise SystemExit(f'Missing required Results sections: {missing}')
          sections=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              m=re.search(r'<body[^>]*>(.*)</body>\s*</html>\s*$',s,re.I|re.S)
              if m:
                  body=m.group(1)
                  head_styles='\n'.join(re.findall(r'<style[^>]*>.*?</style>',s,re.I|re.S))
                  body=re.sub(r'<style[^>]*>.*?</style>','',body,flags=re.I|re.S)
                  sections.append((head_styles,body))
              else:
                  sections.append(('',s))
          bridge=Path('MAXESS-RESULT-CONSUMER-V2.html').read_text(encoding='utf-8').strip()
          out=['<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAXESS — Complete Results</title>']
          out.extend(style for style,_ in sections if style)
          out.append('</head><body>')
          out.append(bridge)
          out.extend(body for _,body in sections)
          out.append('</body></html>')
          result='\n'.join(out)
          required=['id="e01"','id="maxess-e02-v2"','id="e03"','id="e04"','MAXESS_RESULT_V1','MAXESS_RESULT_READY']
          missing=[x for x in required if x not in result]
          if missing:
              raise SystemExit(f'Integrated Results missing required markers: {missing}')
          if len(result)<100000:
              raise SystemExit(f'Integrated Results unexpectedly small: {len(result)} bytes')
          Path('MAXESS-RESULTS-INTEGRATED-V1.html').write_text(result,encoding='utf-8')
          print(f'Built MAXESS-RESULTS-INTEGRATED-V1.html: {len(result)} bytes')

      - name: Static verification
        shell: bash
        run: |
          test -s 'AISCORE.NAYANET.APP 2026 08 21 447'
          grep -q 'Welcome to the MAXESS AI Mastery Assessment' 'AISCORE.NAYANET.APP 2026 08 21 447'
          grep -q 'NAYA_WELCOME_SURGICAL_V2' 'AISCORE.NAYANET.APP 2026 08 21 447'
          grep -q 'contractVersion.*MAXESS_RESULT_V1' 'AISCORE.NAYANET.APP 2026 08 21 447'
          grep -q 'results.nayanet.app/#maxess-result=' 'AISCORE.NAYANET.APP 2026 08 21 447'
          grep -q 'id="e01"' MAXESS-RESULTS-INTEGRATED-V1.html
          grep -q 'id="maxess-e02-v2"' MAXESS-RESULTS-INTEGRATED-V1.html
          grep -q 'id="e03"' MAXESS-RESULTS-INTEGRATED-V1.html
          grep -q 'id="e04"' MAXESS-RESULTS-INTEGRATED-V1.html
          grep -q 'MAXESS_RESULT_READY' MAXESS-RESULTS-INTEGRATED-V1.html
          grep -q 'maxess:result-updated' MAXESS-RESULTS-INTEGRATED-V1.html
          git diff --check

      - name: Commit target and integrated artifact, then remove executor
        shell: bash
        run: |
          git config user.name 'SoulSchoolAcademy'
          git config user.email '221210320+SoulSchoolAcademy@users.noreply.github.com'
          git add 'AISCORE.NAYANET.APP 2026 08 21 447' 'MAXESS-RESULTS-INTEGRATED-V1.html'
          git rm .github/workflows/repair-aiscore-bridge.yml
          git commit -m 'MAXESS: repair 447 welcome and build complete Results'
          git push