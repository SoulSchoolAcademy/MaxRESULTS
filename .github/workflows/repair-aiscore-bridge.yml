name: MAXESS Q15 direct-results surgical repair
on:
  push:
    paths:
      - '.github/workflows/repair-aiscore-bridge.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal behavioral patch only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('IASCORE.NAYANET.APP')
          s=p.read_text(encoding='utf-8')
          old="function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){showInterestSelection();return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          new="function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.completed=true;try{publish()}catch(e){console.error('MAXESS report publish failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          if s.count(old)!=1:
              raise SystemExit(f'REFUSING: expected exactly one Q15 transition, found {s.count(old)}')
          s=s.replace(old,new,1)
          old2='selectedInterests:Array.from(state.interests)'
          new2='selectedInterests:[]'
          if s.count(old2)!=1:
              raise SystemExit(f'REFUSING: expected exactly one interest payload, found {s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Static safety checks
        shell: bash
        run: |
          grep -q "if(state.index===14){state.completed=true;try{publish()}catch(e){console.error('MAXESS report publish failed',e)}return}" IASCORE.NAYANET.APP
          grep -q 'selectedInterests:\[\]' IASCORE.NAYANET.APP
          grep -q 'NAYA_IMAGE_SURGICAL_V1' IASCORE.NAYANET.APP
          grep -q 'Naya%20Profile%206.jpg' IASCORE.NAYANET.APP
          if grep -q 'if(state.index===14){showInterestSelection();return}' IASCORE.NAYANET.APP; then exit 1; fi
          git diff --check
      - name: Commit target and remove executor
        shell: bash
        run: |
          git config user.name 'SoulSchoolAcademy'
          git config user.email '221210320+SoulSchoolAcademy@users.noreply.github.com'
          git add IASCORE.NAYANET.APP
          git rm .github/workflows/repair-aiscore-bridge.yml
          git commit -m 'MAXESS: Q15 goes directly to real Results'
          git push