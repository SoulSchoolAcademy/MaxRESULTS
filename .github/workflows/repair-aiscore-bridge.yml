name: Repair AIScore bridge safely

on:
  push:
    paths:
      - '.github/workflows/repair-aiscore-bridge.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('AIScoreMAXESS code')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace("const RESULTS_URL = 'https://results.nayanet.xyz/';", "const RESULTS_URL = 'https://results.nayanet.app/';")
          s2 = s2.replace("  ensureNayaFields();\n\n  // Retire the old Results presentation. The new Results product is the sole renderer.\n  window.finishInterestSelection = function(){ publish(); };\n  const oldResults = document.getElementById('resultsView');\n  if(oldResults){\n    oldResults.setAttribute('data-retired-renderer','true');\n    oldResults.style.display = 'none';\n  }", "  // IMPORTANT: do not execute bridge work during assessment initialization.\n  // The bridge is invoked only after the user completes all 15 questions.\n\n  // Retire the old Results renderer by replacing its completion action.\n  // Do not hide the DOM at assessment load; the assessment UI must remain untouched.\n  window.finishInterestSelection = function(){ publish(); };")
          if s2 == s:
              raise SystemExit('Expected AIScore patterns were not found; refusing to modify the file.')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'SoulSchoolAcademy'
          git config user.email '221210320+SoulSchoolAcademy@users.noreply.github.com'
          git add 'AIScoreMAXESS code'
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'Repair AIScore Results bridge without touching assessment UI'
          git push
