name: MAXESS score hydration execution v1

on:
  push:
    paths:
      - '.github/workflows/execute-score-hydration-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Surgical score transport and E02 accuracy patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Canonicalize every assessment-side Results destination to the live .app host.
          for name in [
              'IASCORE.NAYANET.APP',
              'AISCORE.NAYANET.APP 2026 08 21 447',
              'AISCORE.NAYANET.APP 2026 08 21 12:04',
          ]:
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f'MISSING REQUIRED SOURCE: {name}')
              s=p.read_text(encoding='utf-8')
              s2=s.replace('https://results.nayanet.xyz/', 'https://results.nayanet.app/')
              s2=s2.replace('https://results.nayanet.com/', 'https://results.nayanet.app/')
              p.write_text(s2,encoding='utf-8')

          # 2) E02 must never present stale hard-coded scores or stale dimension names.
          p=Path('E02')
          s=p.read_text(encoding='utf-8')
          replacements={
              'data-score="91">\n      91':'data-score="">\n      —',
              'data-score="76">\n      76':'data-score="">\n      —',
              'data-score="88">\n      88':'data-score="">\n      —',
              'data-score="69">\n      69':'data-score="">\n      —',
              'data-score="94">\n      94':'data-score="">\n      —',
              'COMMUNICATION':'CONTEXT',
              'SYSTEMS THINKING':'COLLABORATION',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'REFUSING: E02 expected token missing: {old}')
              s=s.replace(old,new)
          # Keep the runtime lookup authoritative and aligned to the assessment dimensions.
          s=s.replace(
              'const dimensions = ["DIRECTION", "CONTEXT", "EVALUATION", "ITERATION", "COLLABORATION"];',
              'const dimensions = ["DIRECTION", "CONTEXT", "COLLABORATION", "EVALUATION", "ITERATION"];'
          )
          p.write_text(s,encoding='utf-8')

          # 3) The reusable bridge source must also point at the .app Results host.
          p=Path('tools/execute_maxess_result_bridge.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://results.nayanet.xyz/', 'https://results.nayanet.app/')
          p.write_text(s,encoding='utf-8')

          p=Path('.github/workflows/apply-maxess-result-bridge.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'results.nayanet.xyz'", "'results.nayanet.app'")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build the new checkpoint from the protected 4:47 source
        shell: bash
        run: |
          cp 'AISCORE.NAYANET.APP 2026 08 21 447' 'AISCORE.NAYANET.APP 2026 08 21 SCORE-ACCURACY'
          printf '\n<!-- MAXESS SCORE ACCURACY CHECKPOINT: 4:47 baseline + canonical .app transport -->\n' >> 'AISCORE.NAYANET.APP 2026 08 21 SCORE-ACCURACY'

      - name: Static score transport QA
        shell: bash
        run: |
          grep -q 'https://results.nayanet.app/' 'AISCORE.NAYANET.APP 2026 08 21 447'
          grep -q 'https://results.nayanet.app/' 'AISCORE.NAYANET.APP 2026 08 21 SCORE-ACCURACY'
          grep -q 'https://results.nayanet.app/' 'IASCORE.NAYANET.APP'
          ! grep -q 'results.nayanet.xyz' 'AISCORE.NAYANET.APP 2026 08 21 447'
          ! grep -q 'results.nayanet.xyz' 'IASCORE.NAYANET.APP'
          grep -q 'MAXESS_RESULT_V1' 'MAXESS-RESULT-CONSUMER-V2.html'
          grep -q 'window.MAXESS_RESULT' 'MAXESS-RESULT-CONSUMER-V2.html'
          grep -q 'MAXESS_RESULT_READY' 'MAXESS-RESULT-CONSUMER-V2.html'
          grep -q 'DIRECTION' E02
          grep -q 'CONTEXT' E02
          grep -q 'COLLABORATION' E02
          grep -q 'EVALUATION' E02
          grep -q 'ITERATION' E02
          if grep -q 'COMMUNICATION' E02; then exit 1; fi
          if grep -q 'SYSTEMS THINKING' E02; then exit 1; fi
          echo 'MAXESS SCORE HYDRATION STATIC QA: PASS'

      - name: Syntax QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=['E02','MAXESS-RESULT-CONSUMER-V2.html']
          for name in files:
              s=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
              if scripts:
                  Path('/tmp/'+name.replace('/','_')+'.js').write_text('\\n\\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/E02.js
          node --check /tmp/MAXESS-RESULT-CONSUMER-V2.html.js
          echo 'MAXESS SCORE JAVASCRIPT SYNTAX QA: PASS'

      - name: Diff QA
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit executed repair
        shell: bash
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add -- 'IASCORE.NAYANET.APP' 'AISCORE.NAYANET.APP 2026 08 21 447' 'AISCORE.NAYANET.APP 2026 08 21 12:04' 'AISCORE.NAYANET.APP 2026 08 21 SCORE-ACCURACY' 'E02' 'tools/execute_maxess_result_bridge.py' '.github/workflows/apply-maxess-result-bridge.yml'
          git diff --cached --check
          git commit -m 'MAXESS: execute score hydration and canonical Results transport'
          git push

      - name: Remove execution workflow after successful commit
        shell: bash
        run: |
          git rm .github/workflows/execute-score-hydration-v1.yml
          git commit -m 'MAXESS: retire one-shot score hydration executor'
          git push
