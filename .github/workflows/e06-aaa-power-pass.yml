name: E06 AAA Power Presentation Pass

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active E06 engineering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: maxess-results-v21-working

      - name: Apply coherent E06 power presentation upgrade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('E06-SECTION-06-WORKING.html')
          s = path.read_text(encoding='utf-8')
          marker = '/* E06 AAA POWER PRESENTATION PASS */'
          assert 'class="custom" aria-labelledby="custom-title"' in s, 'E06 Naya Power section not found'
          assert marker not in s, 'AAA Power pass already present'

          css = r'''\n/* E06 AAA POWER PRESENTATION PASS */\n.custom{margin-top:104px;padding:clamp(52px,7vw,92px) clamp(18px,5vw,72px);border:1px solid rgba(255,255,255,.18);background:radial-gradient(circle at 50% -8%,rgba(237,66,196,.24),transparent 28%),radial-gradient(circle at 12% 55%,rgba(60,168,255,.12),transparent 30%),radial-gradient(circle at 88% 65%,rgba(53,227,155,.1),transparent 28%),linear-gradient(180deg,#12071d 0%,#08040d 52%,#020203 100%);box-shadow:0 70px 180px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.14),0 0 140px rgba(237,66,196,.08);}\n.custom:after{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.035);border-radius:28px;pointer-events:none;}\n.custom .eyebrow{position:relative;z-index:1;color:#fff;font-size:11px;letter-spacing:.38em;opacity:.82;}\n.custom h2{position:relative;z-index:1;margin:18px auto 0;max-width:980px;line-height:.95;}\n.power-headline-main{display:block;font-size:clamp(44px,6.7vw,82px);font-weight:400;color:#fff;letter-spacing:-.065em;text-shadow:0 12px 45px rgba(0,0,0,.42);}\n.power-headline-sub{display:block;margin-top:10px;font-size:clamp(30px,4.5vw,58px);font-weight:400;color:#fff;letter-spacing:-.055em;line-height:1.02;}\n.power-headline-sub em{font-style:normal;background:linear-gradient(90deg,#ed42c4 0%,#b895ff 38%,#3ca8ff 68%,#35e39b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}\n.power-rail{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:0;max-width:980px;margin:38px auto 0;border:1px solid rgba(255,255,255,.14);border-radius:24px;overflow:hidden;background:rgba(0,0,0,.42);box-shadow:0 24px 70px rgba(0,0,0,.55);}\n.power-rail-item{position:relative;min-height:116px;padding:22px 20px 20px;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.012));}\n.power-rail-item+ .power-rail-item{border-left:1px solid rgba(255,255,255,.1);}\n.power-rail-item:nth-child(1){--rail:#ed42c4}.power-rail-item:nth-child(2){--rail:#b895ff}.power-rail-item:nth-child(3){--rail:#3ca8ff}.power-rail-item:nth-child(4){--rail:#35e39b}\n.power-rail-item:before{content:"";position:absolute;left:20px;right:20px;top:0;height:2px;background:var(--rail);box-shadow:0 0 20px color-mix(in srgb,var(--rail) 55%,transparent);}\n.power-rail-item span{display:block;color:var(--rail);font-size:9px;font-weight:950;letter-spacing:.22em;text-transform:uppercase;}\n.power-rail-item b{display:block;margin-top:8px;color:#fff;font-family:Georgia,serif;font-size:clamp(21px,2.2vw,28px);font-weight:400;letter-spacing:-.035em;}\n.power-rail-item small{display:block;margin-top:5px;color:rgba(255,255,255,.66);font-size:11px;line-height:1.4;}\n.power-intro{position:relative;z-index:1;max-width:850px;margin:34px auto 0;font-size:clamp(16px,1.7vw,20px);line-height:1.62;color:#fff;}\n.operating-system{position:relative;z-index:1;grid-template-columns:1fr 1fr;margin-top:52px;border-color:rgba(255,255,255,.16);border-radius:30px;background:#030303;}\n.os-panel{min-height:320px;padding:42px clamp(22px,4vw,50px);display:flex;flex-direction:column;justify-content:center;}\n.os-panel:first-child{background:linear-gradient(145deg,#09090c,#030305);}\n.os-panel:first-child:after{background:linear-gradient(180deg,transparent,rgba(237,66,196,.55),transparent);}\n.os-panel:last-child{background:radial-gradient(circle at 50% 0,rgba(138,92,255,.46),transparent 58%),linear-gradient(145deg,#241044,#0b0612);}\n.os-panel:last-child:before{content:"02";position:absolute;right:24px;top:18px;color:rgba(255,255,255,.08);font-size:86px;font-weight:900;line-height:1;}\n.os-panel:first-child:before{content:"01";position:absolute;right:24px;top:18px;color:rgba(255,255,255,.06);font-size:86px;font-weight:900;line-height:1;}\n.os-panel h3{position:relative;z-index:1;font-size:clamp(34px,4.1vw,52px);line-height:.98;margin:13px 0 16px;}\n.os-panel p{position:relative;z-index:1;max-width:560px;font-size:clamp(15px,1.55vw,18px);line-height:1.65;}\n.power-benefits{position:relative;z-index:1;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px;max-width:980px;}\n.power-benefit{min-height:210px;padding:28px 24px 27px;border:1px solid rgba(255,255,255,.13);border-radius:24px;background:#050505;box-shadow:0 22px 55px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;}\n.power-benefit:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--benefit);box-shadow:0 0 24px color-mix(in srgb,var(--benefit) 48%,transparent);}\n.power-benefit:nth-child(1){--benefit:#ed42c4;background:linear-gradient(145deg,rgba(237,66,196,.12),#050505 48%);}\n.power-benefit:nth-child(2){--benefit:#3ca8ff;background:linear-gradient(145deg,rgba(60,168,255,.11),#050505 48%);}\n.power-benefit:nth-child(3){--benefit:#35e39b;background:linear-gradient(145deg,rgba(53,227,155,.1),#050505 48%);}\n.benefit-number{color:var(--benefit);}\n.power-benefit h4{font-size:clamp(25px,2.5vw,33px);}\n.offer{position:relative;z-index:1;margin-top:42px;padding:44px clamp(22px,4vw,58px);border:1px solid rgba(255,255,255,.2);background:radial-gradient(circle at 50% -10%,rgba(255,211,77,.13),transparent 30%),radial-gradient(circle at 18% 50%,rgba(237,66,196,.12),transparent 30%),linear-gradient(145deg,#190a2b,#08040e 65%,#020203);}\n.offer-label{color:#ffd34d;}.offer h3{font-size:clamp(39px,5vw,62px);}.offer h3 em{color:#fff;}.offer-value{margin-top:28px;}.offer-price{font-size:clamp(38px,4.2vw,54px);}.offer-price small{color:#ffd34d;}\n@media(max-width:900px){.power-rail{grid-template-columns:1fr 1fr}.power-rail-item:nth-child(3){border-left:0;border-top:1px solid rgba(255,255,255,.1)}.power-rail-item:nth-child(4){border-top:1px solid rgba(255,255,255,.1)}.operating-system{margin-top:40px}.os-panel{min-height:290px}.power-benefits{grid-template-columns:1fr 1fr}.power-benefit:last-child{grid-column:1/-1;min-height:180px}}\n@media(max-width:680px){.custom{margin-top:64px;padding:42px 14px 44px}.custom:after{inset:8px;border-radius:20px}.custom h2{margin-top:14px}.power-headline-main{font-size:clamp(39px,11vw,58px)}.power-headline-sub{font-size:clamp(26px,8vw,39px);margin-top:8px}.power-rail{grid-template-columns:1fr 1fr;margin-top:28px;border-radius:20px}.power-rail-item{min-height:104px;padding:18px 14px}.power-rail-item+ .power-rail-item{border-left:1px solid rgba(255,255,255,.1)}.power-rail-item:nth-child(3),.power-rail-item:nth-child(4){border-top:1px solid rgba(255,255,255,.1)}.power-rail-item b{font-size:20px}.power-rail-item small{font-size:10px}.power-intro{margin-top:28px;font-size:15px}.operating-system{margin-top:34px}.os-panel{min-height:0;padding:30px 20px}.os-panel h3{font-size:34px}.power-benefits{grid-template-columns:1fr;gap:11px}.power-benefit,.power-benefit:last-child{grid-column:auto;min-height:0}.offer{margin-top:30px;padding:30px 18px}.offer h3{font-size:32px}}\n@media(max-width:390px){.power-rail-item{padding:16px 11px}.power-rail-item b{font-size:18px}.power-rail-item small{font-size:9.5px}.os-panel:first-child:before,.os-panel:last-child:before{font-size:68px}.offer h3{font-size:29px}}\n'''
          s = s.replace('</style>', css + '</style>', 1)

          old = '<h2 id="custom-title">Pre-tuned for maximum results.<br><em>Customized for maximum personal fit.</em></h2><p class="power-intro">'
          new = '''<h2 id="custom-title"><span class="power-headline-main">Pre-tuned for maximum results.</span><span class="power-headline-sub"><em>Customized for maximum personal fit.</em></span></h2>\n<div class="power-rail" aria-label="Four reasons Naya Power feels different"><div class="power-rail-item"><span>01 · FOUNDATION</span><b>Pre-tuned</b><small>Start with the operating system already built.</small></div><div class="power-rail-item"><span>02 · RELATIONSHIP</span><b>Personal</b><small>Shape the way Naya works with you.</small></div><div class="power-rail-item"><span>03 · CAPABILITY</span><b>Activated</b><small>Bring memory, initiative and quality into the relationship.</small></div><div class="power-rail-item"><span>04 · FIT</span><b>Yours</b><small>Refine the system as your needs evolve.</small></div></div>\n<p class="power-intro">'''
          assert old in s, 'Expected Naya Power headline markup not found'
          s = s.replace(old, new, 1)
          path.write_text(s, encoding='utf-8')
          print('E06 AAA POWER PRESENTATION PASS: PATCHED')
          PY

      - name: Verify E06 structural integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('E06-SECTION-06-WORKING.html').read_text(encoding='utf-8')
          assert '/* E06 AAA POWER PRESENTATION PASS */' in s
          assert s.count('class="power-rail-item"') == 4
          assert s.count('class="board"') == 9
          assert s.count('class="answer"') == 45
          assert s.count('class="node node-') == 9
          assert 'Pre-tuned for maximum results.' in s
          assert 'Customized for maximum personal fit.' in s
          assert 'iframe' not in s.lower()
          assert '<html' in s.lower() and s.lower().count('</html>') == 1
          print('E06 STRUCTURE: PASS')
          print('bytes:', len(s.encode()))
          print('lines:', len(s.splitlines()))
          PY

      - name: Commit upgraded E06 to active branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Naya Nitro'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add E06-SECTION-06-WORKING.html
          git commit -m 'E06 AAA Power Presentation Pass'
          git push origin maxess-results-v21-working
