name: Patch E00 796 Continue Boundary

on:
  push:
    paths:
      - '.github/workflows/patch-e00-continue.yml'
      - 'PATCH_E00_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch E00 796 deterministically
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('E00 796')
          s=p.read_text()
          original=s

          # 1. Correct the score-matrix contract if the bad Array assertion exists.
          bad="if(!Array.isArray(S)||Object.keys(S).length!==15)"
          if bad in s:
              s=s.replace(
                  "if(!Array.isArray(S)||Object.keys(S).length!==15)\n    throw Error('Invalid score matrix');",
                  "if(!S||typeof S!=='object'||Array.isArray(S)||Object.keys(S).length!==15)\n    throw Error('Invalid score matrix');\n Object.keys(S).forEach(k=>{\n  if(!Array.isArray(S[k])||S[k].length!==5)throw Error('Invalid score matrix row');\n });",
                  1
              )

          # 2. Legacy Continue binding repair.
          legacy="$('continueButton').onclick=next;"
          hardened="""function bindContinue(){
           const root=$('maxess-ai-score');
           const invoke=e=>{
            const btn=e.target&&e.target.closest?e.target.closest('#continueButton'):null;
            if(!btn||!root.contains(btn))return;
            if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
            if(btn.disabled||state.finalizing||state.mode!=='ASSESSMENT'||!state.selected)return;
            e.preventDefault();
            e.stopPropagation();
            next();
           };
           document.addEventListener('click',invoke,true);
           document.addEventListener('pointerup',invoke,true);
           document.addEventListener('keydown',invoke,true);
           const btn=$('continueButton');
           if(btn)btn.onclick=null;
          }
          bindContinue();"""
          if legacy in s:
              s=s.replace(legacy,hardened,1)

          # 3. Current hardened boundary: click/pointer/keyboard events can land on
          # child spans inside the button. Resolve the actual Continue button by
          # closest() instead of requiring event.target === button.
          old_target="if(!btn||e.target!==btn)return;"
          new_target="if(!btn)return;const clicked=e.target&&e.target.closest?e.target.closest('#continueButton'):null;if(clicked!==btn)return;"
          if old_target in s:
              s=s.replace(old_target,new_target,1)

          # 4. Put the complete next() terminal boundary under one error boundary.
          old_next="""function next(){
 if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;

 /*
  * Q15 answer is saved BEFORE any terminal calculation.
  */
 save();

 if(state.i===14){
  publish();
  return;
 }

 state.i++;
 render();

 setTimeout(()=>openNaya(),120);
}"""
          new_next="""function next(){
 if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;
 try{
  save();
  if(state.i===14){
   const ok=publish();
   if(!ok)throw Error('Terminal publish failed');
   return;
  }
  state.i++;
  render();
  setTimeout(()=>openNaya(),120);
 }catch(e){
  console.error('MAXESS Continue execution error',e);
  state.finalizing=false;
  state.mode='ASSESSMENT';
  updateContinue();
  $('continueText').textContent='Continue';
 }
}"""
          if old_next in s:
              s=s.replace(old_next,new_next,1)

          if "function executeContinue(e)" in s and "const clicked=e.target&&e.target.closest?e.target.closest('#continueButton'):null" not in s:
              raise SystemExit('Current Continue handler found but nested-target repair was not applied')

          if s==original:
              raise SystemExit('No E00 mutation required; refusing empty commit')

          p.write_text(s)
          print('E00 796 patched:', len(original), '->', len(s), 'bytes')
          PY

      - name: Static verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('E00 796').read_text()
          checks={
            'score-object-guard': "typeof S!=='object'" in s and "S[k].length!==5" in s,
            'root-scoped-target': "closest('#continueButton')" in s,
            'nested-target-guard': "clicked!==btn" in s,
            'capture-click': "window.addEventListener('click',executeContinue,true)" in s or "document.addEventListener('click',invoke,true)" in s,
            'pointer-boundary': "window.addEventListener('pointerup',executeContinue,true)" in s or "document.addEventListener('pointerup',invoke,true)" in s,
            'keyboard-boundary': "addEventListener('keydown'" in s,
            'next-try-boundary': "MAXESS Continue execution error" in s,
            'q15-save': 'save();' in s,
            'publish': 'publish();' in s,
            'calculate': 'const x=calculate();' in s,
            'build': 'function buildResult()' in s,
            'validate': "function valid(c)" in s,
            'persist': 'persistResult(result);' in s,
            'broadcast': 'broadcast(result);' in s,
            'local-results': 'renderLocalResults(result);' in s,
            'external-handoff': 'attemptResultsHandoff(result);' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad: raise SystemExit('Static verification failed: '+', '.join(bad))
          PY

      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'E00 796'
          git diff --cached --quiet && exit 0
          git commit -m 'fix E00 796 Continue nested-target boundary'
          git push
