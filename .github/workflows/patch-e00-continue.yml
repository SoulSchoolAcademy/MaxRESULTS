name: Patch E00 796 Continue Boundary

on:
  push:
    paths:
      - '.github/workflows/patch-e00-continue.yml'
      - 'PATCH_E00_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch E00 796 deterministically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('E00 796')
          s=p.read_text()
          original=s

          # 1. Correct the score-matrix contract if the bad Array assertion exists.
          s=s.replace(
              "if(!Array.isArray(S)||Object.keys(S).length!==15)throw Error('Score matrix structure invalid');",
              "if(!S||typeof S!=='object'||Array.isArray(S)||Object.keys(S).length!==15)throw Error('Score matrix structure invalid');Object.keys(S).forEach(k=>{if(!/^([1-9]|1[0-5])$/.test(k)||!Array.isArray(S[k])||S[k].length!==5)throw Error('Score matrix row invalid');});",
              1
          )

          # 2. Harden the Continue boundary for click, pointer and keyboard activation.
          old_listener="""document.addEventListener('click',e=>{
  const button=e.target.closest('#maxess-ai-score #continueButton');
  if(!button)return;
  e.preventDefault();
  e.stopPropagation();
  if(button.disabled)return;
  next();
},true);"""
          new_listener="""function executeContinue(e){
  const root=$('maxess-ai-score');
  const button=e.target&&e.target.closest?e.target.closest('#continueButton'):null;
  if(!button||!root||!root.contains(button))return;
  if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
  e.preventDefault();
  e.stopPropagation();
  if(e.stopImmediatePropagation)e.stopImmediatePropagation();
  if(button.disabled||state.finalizing||state.mode!=='ASSESSMENT'||!state.selected)return;
  next();
}
document.addEventListener('click',executeContinue,true);
document.addEventListener('pointerup',executeContinue,true);
document.addEventListener('keydown',executeContinue,true);"""
          if old_listener in s:
              s=s.replace(old_listener,new_listener,1)
          elif "function executeContinue(e)" not in s:
              raise SystemExit('Continue listener anchor not found')

          # 3. Keep the complete Continue transition inside one failure boundary.
          old_next="""function next(){if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;if(state.i===14){publish();return;}save();state.i++;render();setTimeout(()=>openNaya(),120);}"""
          new_next="""function next(){if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;try{if(state.i===14){if(!publish())throw Error('Terminal publish failed');return;}save();state.i++;render();setTimeout(()=>openNaya(),120);}catch(e){console.error('MAXESS Continue execution error',e);state.finalizing=false;state.mode='ASSESSMENT';updateContinue();$('continueText').textContent='Continue';}}"""
          if old_next in s:
              s=s.replace(old_next,new_next,1)

          # 4. Make the terminal Results handoff real. Local Results remain the
          # verified fallback if navigation is unavailable.
          old_publish_tail="""releaseResultsSections(result);window.MAXESS_RESULT_HANDOFF_URL = null; return true;"""
          new_publish_tail="""releaseResultsSections(result);const handedOff=attemptResultsHandoff(result);if(!handedOff)console.warn('MAXESS Results handoff unavailable; verified local Results retained.');return true;"""
          if old_publish_tail in s:
              s=s.replace(old_publish_tail,new_publish_tail,1)
          elif "attemptResultsHandoff(result);" not in s:
              marker="releaseResultsSections(result);"
              if marker not in s:
                  raise SystemExit('Results release anchor not found')
              s=s.replace(marker,marker+"const handedOff=attemptResultsHandoff(result);if(!handedOff)console.warn('MAXESS Results handoff unavailable; verified local Results retained.');",1)

          if s==original:
              raise SystemExit('No E00 mutation required; refusing empty commit')

          p.write_text(s)
          print('E00 796 patched:',len(original),'->',len(s),'bytes')
          PY

      - name: Static verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('E00 796').read_text()
          checks={
            'score-object-guard': "typeof S!=='object'" in s and "S[k].length!==5" in s,
            'root-scoped-target': "closest('#continueButton')" in s,
            'capture-click': "document.addEventListener('click',executeContinue,true)" in s,
            'pointer-boundary': "document.addEventListener('pointerup',executeContinue,true)" in s,
            'keyboard-boundary': "document.addEventListener('keydown',executeContinue,true)" in s,
            'next-try-boundary': "MAXESS Continue execution error" in s,
            'q15-save': 'save();' in s,
            'publish': 'publish();' in s,
            'calculate': 'const x=calculate();' in s,
            'build': 'function buildResult()' in s,
            'validate': 'function valid(c)' in s,
            'persist': 'persistResult(result);' in s,
            'broadcast': 'broadcast(result);' in s,
            'local-results': 'renderLocalResults(result);' in s,
            'external-handoff': 'attemptResultsHandoff(result);' in s,
            'results-domain': 'https://results.nayanet.app/#maxess-result=' in s,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Static verification failed: '+', '.join(bad))
          PY
          node --check <(sed -n '/<script>/,/<\/script>/p' 'E00 796' | sed '1d;$d')

      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'E00 796'
          git diff --cached --quiet && exit 0
          git commit -m 'fix E00 796 Continue and terminal Results handoff'
          git push

# NAYA POWER EXECUTION CONTINUITY: keep this workflow push-triggered so the canonical mutation can execute without a manual dead-end.
