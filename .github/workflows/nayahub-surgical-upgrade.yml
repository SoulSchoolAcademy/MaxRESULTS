# Surgical cleanup after validating the existing V7 implementation
name: NayaHub Surgical Upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nayahub-surgical-upgrade.yml'
      - 'scripts/nayahub-cleanup-surgical-layer.py'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary duplicate layer
        run: python3 scripts/nayahub-cleanup-surgical-layer.py
      - name: Commit clean Hub
        run: |
          git config user.name 'NayaNET Upgrade Bot'
          git config user.email 'nayanet-upgrade-bot@users.noreply.github.com'
          git add NAYAHUB.html
          git diff --cached --quiet && exit 0
          git commit -m 'Keep NayaNET Hub V7 surgical implementation clean'
          git push
