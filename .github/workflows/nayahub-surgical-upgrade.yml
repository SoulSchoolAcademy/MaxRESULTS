name: NayaHub Surgical Upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/nayahub-surgical-upgrade.py'
      - 'NAYAHUB.html'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply remaining Intelligent Hub to-do
        run: python3 scripts/nayahub-surgical-upgrade.py
      - name: Commit upgraded Hub
        run: |
          git config user.name 'NayaNET Upgrade Bot'
          git config user.email 'nayanet-upgrade-bot@users.noreply.github.com'
          git add NAYAHUB.html
          git diff --cached --quiet && exit 0
          git commit -m 'Complete remaining NayaNET Intelligent Hub V7 to-do'
          git push
      - name: Package root HTML
        run: zip -j NAYAHUB-V7-INTELLIGENT-UPGRADE.zip NAYAHUB.html
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAYAHUB-V7-INTELLIGENT-UPGRADE
          path: NAYAHUB-V7-INTELLIGENT-UPGRADE.zip
          retention-days: 30
