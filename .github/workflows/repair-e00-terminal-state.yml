name: MAXESS E00 — Canonical Terminal Results Repair

on:
  push:
    branches: [main]
    paths:
      - 'E00'
      - '.github/workflows/repair-e00-terminal-state.yml'
      - 'START-HERE.md'
      - 'docs/DEPLOYMENT-CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch canonical E00 only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('E00')
          s = p.read_text(encoding='utf-8')
          original = s

          REQUIRED = [
              'id="maxess-ai-score"',
              'MAXESS_RESULT_V1',
              'function renderLocalResults(c)',
              'function publish()',
              "$('continueButton').addEventListener('click',next,true)",
              "results.nayanet.app/#maxess-result=",
          ]
          for marker in REQUIRED:
              if marker not in s:
                  raise SystemExit(f'Canonical E00 marker missing: {marker}')

          if 'MAXESS_E00_TERMINAL_COMPOSITION_V3' not in s:
              anchor = 'function lockHost(){'
              if anchor not in s:
                  raise SystemExit('lockHost anchor missing')

              helper = r'''function setTerminalComposition(resultsActive){
  const docs=[];
  const addDoc=d=>{try{if(d&&!docs.includes(d))docs.push(d)}catch(e){}};
  addDoc(document);
  try{if(window.parent&&window.parent!==window)addDoc(window.parent.document)}catch(e){}
  try{if(window.top&&window.top!==window)addDoc(window.top.document)}catch(e){}
  const apply=doc=>{
    try{
      ['e01','e02','e03','e04','e05','e06','e07','e08','e09'].forEach(id=>{
        const el=doc.getElementById(id);
        if(!el)return;
        if(resultsActive){
          if(el.dataset.maxessHidden==='1'){
            el.style.removeProperty('display');
            el.style.removeProperty('visibility');
            el.style.removeProperty('pointer-events');
            delete el.dataset.maxessHidden;
          }
        }else{
          el.dataset.maxessHidden='1';
          el.style.setProperty('display','none','important');
          el.style.setProperty('visibility','hidden','important');
          el.style.setProperty('pointer-events','none','important');
        }
      });
      const frame=window.frameElement;
      if(frame&&doc===window.parent.document){
        if(resultsActive){
          if(frame.dataset.maxessFrameLocked==='1'){
            frame.style.removeProperty('position');frame.style.removeProperty('inset');frame.style.removeProperty('width');frame.style.removeProperty('height');frame.style.removeProperty('z-index');frame.style.removeProperty('border');
            delete frame.dataset.maxessFrameLocked;
          }
        }else{
          frame.dataset.maxessFrameLocked='1';
          frame.style.setProperty('position','fixed','important');
          frame.style.setProperty('inset','0','important');
          frame.style.setProperty('width','100vw','important');
          frame.style.setProperty('height','100vh','important');
          frame.style.setProperty('z-index','2147483647','important');
          frame.style.setProperty('border','0','important');
        }
      }
    }catch(e){console.warn('MAXESS composition control unavailable in host:',e)}
  };
  docs.forEach(apply);
}

'''
              s = s.replace(anchor, helper + anchor, 1)
              s = s.replace("try{validate();lockHost();render();setTimeout(openNaya,180);", "try{validate();lockHost();setTerminalComposition(false);render();setTimeout(openNaya,180);", 1)
              s = s.replace("function renderLocalResults(c){ROOT.dataset.completed='true';", "function renderLocalResults(c){setTerminalComposition(true);ROOT.dataset.completed='true';", 1)
              old = "try{if(window.top&&window.top!==window){window.top.location.assign(url)}else{window.location.assign(url)}}catch(e){console.warn('External Results handoff blocked; retaining verified local Results state.',e)}"
              new = "try{if(window.top&&window.top!==window){window.top.location.assign(url)}else{window.location.assign(url)}}catch(e){console.warn('External Results handoff blocked; retaining verified local Results state.',e);renderLocalResults(c)}"
              if old not in s:
                  raise SystemExit('canonical handoff block not found')
              s = s.replace(old, new, 1)
              s = s.replace("window.MAXESS_RESULT_BRIDGE_V2=true}", "window.MAXESS_RESULT_BRIDGE_V2=true;window.MAXESS_E00_TERMINAL_COMPOSITION_V3=true}", 1)

          if s == original:
              print('E00 already contains terminal composition repair')
          else:
              p.write_text(s, encoding='utf-8')
              print('Patched canonical E00:', len(s.encode('utf-8')), 'bytes')

      - name: Remove obsolete Results-domain wording
        shell: python
        run: |
          files = ['START-HERE.md', 'docs/DEPLOYMENT-CONTRACT.md']
          replacements = {
              "`.xyz` is obsolete for the MAXESS Results production/public target and MUST NOT be used in Results navigation, redirects, deployment instructions, embeds, prompts, AI instructions, or public-target documentation.\n\n": "",
              "`.xyz` is obsolete for MAXESS Results and MUST NOT be used for Results navigation, redirects, deployment instructions, embeds, prompts, AI instructions, or public-target documentation.\n\n": "",
              "Do not perform a blanket replacement of unrelated `.xyz` domains. This rule applies specifically to MAXESS Results.\n\n": "",
              "This is a Results-specific rule. Do not blindly replace unrelated `.xyz` domains elsewhere in the system.\n\n": "",
          }
          for name in files:
              p = __import__('pathlib').Path(name)
              s = p.read_text(encoding='utf-8')
              old = s
              for a,b in replacements.items(): s = s.replace(a,b)
              if s != old: p.write_text(s, encoding='utf-8')

      - name: Static E00 and domain QA
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'position:fixed' E00 >/dev/null
          grep -F 'height:100dvh' E00 >/dev/null
          grep -F 'z-index:2147483647' E00 >/dev/null
          grep -F 'function renderLocalResults(c)' E00 >/dev/null
          grep -F 'MAXESS_RESULT_V1' E00 >/dev/null
          grep -F 'function setTerminalComposition(resultsActive)' E00 >/dev/null
          grep -F 'MAXESS_E00_TERMINAL_COMPOSITION_V3' E00 >/dev/null
          grep -F 'results.nayanet.app/#maxess-result=' E00 >/dev/null
          ! grep -RIl --exclude-dir=.git 'results.nayanet.xyz' . >/dev/null || { echo 'obsolete Results host remains'; exit 1; }
          ! grep -RIl --exclude-dir=.git 'results.nayanet.xyz' . >/dev/null
          echo 'E00/domain static QA PASS'

      - name: Commit canonical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add E00 START-HERE.md docs/DEPLOYMENT-CONTRACT.md .github/workflows/repair-e00-terminal-state.yml
          if git diff --cached --quiet; then echo 'NO CHANGE'; exit 0; fi
          git commit -m 'fix: make canonical E00 terminal results host-safe'
          git push origin main

  package-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Create standalone Cloudflare upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f E02-LIVING-SUN-HUB/index.html
          test -f E02-LIVING-SUN-HUB/_headers
          cd E02-LIVING-SUN-HUB
          zip -j ../NAYANET-LIVING-SUN-CLOUDFLARE.zip index.html _headers
          unzip -l ../NAYANET-LIVING-SUN-CLOUDFLARE.zip
      - name: Upload standalone Cloudflare ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NAYANET-LIVING-SUN-CLOUDFLARE
          path: NAYANET-LIVING-SUN-CLOUDFLARE.zip
          if-no-files-found: error
