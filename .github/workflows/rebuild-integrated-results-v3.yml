name: MAXESS 447 Canonical Results Build — V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-integrated-results-v3.yml'
      - 'AISCORE.NAYANET.APP 2026 08 21 447'
      - 'MAXESS-RESULTS-INTEGRATED-V1.html'
      - 'E05'
      - 'E06'
      - 'E07'
      - 'E08'
      - 'E09'
      - 'docs/smart-notes/**'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assessment authority
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout Results authority
        uses: actions/checkout@v6
        with:
          ref: maxess-results-v21-working
          path: active-results
          fetch-depth: 1

      - name: Apply surgical 447 Q15 handoff guard
        shell: python
        run: |
          from pathlib import Path
          p = Path('AISCORE.NAYANET.APP 2026 08 21 447')
          s = p.read_text(encoding='utf-8')
          old_state = "const sessionSeed=crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295);const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false};"
          new_state = "const sessionSeed=crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295);const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false,finalizing:false};"
          if old_state in s:
              s=s.replace(old_state,new_state,1)
          old_fn="function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.completed=true;try{publish()}catch(e){console.error('MAXESS report publish failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          new_fn="function continueAssessment(event){if(event){event.preventDefault();event.stopPropagation();if(event.stopImmediatePropagation)event.stopImmediatePropagation()}if(state.finalizing||!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.finalizing=true;state.completed=true;const button=$('continueButton');button.disabled=true;button.setAttribute('aria-disabled','true');$('continueText').textContent='Loading Results…';try{if(!publish())throw new Error('MAXESS final Results publish returned false.')}catch(e){state.finalizing=false;button.disabled=false;button.setAttribute('aria-disabled','false');$('continueText').textContent='Continue';console.error('MAXESS final Results handoff failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          if old_fn in s:
              s=s.replace(old_fn,new_fn,1)
          elif 'function continueAssessment(event)' not in s:
              raise SystemExit('Q15 handler anchor missing')
          listener_old="$('continueButton').addEventListener('click',continueAssessment);"
          listener_new="$('continueButton').addEventListener('click',continueAssessment,true);"
          if listener_old in s:
              s=s.replace(listener_old,listener_new,1)
          marker="window.MAXESS_CLEAN_V1_REPAIR_APPLIED=true;window.NAYA_WELCOME_V1=true;window.MAXESS_RESULT_BRIDGE_V2=true;"
          if 'window.MAXESS_Q15_HANDOFF_V447=true;' not in s:
              if marker not in s: raise SystemExit('Q15 release marker missing')
              s=s.replace(marker,marker+'window.MAXESS_Q15_HANDOFF_V447=true;',1)
          p.write_text(s,encoding='utf-8')

      - name: Assemble complete Results from authoritative section sources
        shell: python
        run: |
          from pathlib import Path
          import hashlib,re,json

          active=Path('active-results')
          baseline_path=active/'BASELINE-WORKING.html'
          if not baseline_path.exists(): raise SystemExit('AUTHORITATIVE BASELINE MISSING')
          baseline=baseline_path.read_text(encoding='utf-8')

          dynamic_sources={
            'e01':active/'E01-SECTION-01-WORKING.html',
            'maxess-e02-v3':active/'E02-SECTION-02-WORKING.html',
            'e03':active/'E03-SECTION-03-WORKING.html',
            'e04':active/'E04-SECTION-04-WORKING.html',
          }
          static_sources={
            'e05':Path('E05'),
            'e06':Path('E06'),
            'e07':Path('E07'),
            'e08':Path('E08'),
            'e09':Path('E09'),
          }
          for sid,p in {**dynamic_sources,**static_sources}.items():
              if not p.exists(): raise SystemExit(f'AUTHORITATIVE SOURCE MISSING: {sid} -> {p}')

          def element_by_id(text,sid):
              pattern = r'''<([A-Za-z][\w:-]*)\b[^>]*\bid=["']''' + re.escape(sid) + r'''["'][^>]*>'''
              m=re.search(pattern,text,re.I)
              if not m:return None
              tag=m.group(1); start=m.start(); pos=m.end(); depth=1
              tok=re.compile(r'</?'+re.escape(tag)+r'\b[^>]*>',re.I)
              for t in tok.finditer(text,pos):
                  raw=t.group(0)
                  if raw.startswith('</'):
                      depth-=1
                      if depth==0:return text[start:t.end()]
                  elif not raw.rstrip().endswith('/>'):
                      depth+=1
              raise SystemExit(f'SECTION END MISSING: {sid}')

          def body(text):
              a=re.search(r'<body\b[^>]*>',text,re.I)
              b=re.search(r'</body\s*>',text,re.I)
              if not a or not b or b.start()<=a.end(): return text
              return text[a.end():b.start()]

          def strip_style_tags(text):
              return re.sub(r'<style\b[^>]*>.*?</style\s*>','',text,flags=re.I|re.S)

          def strip_legacy_scripts(text):
              def repl(m):
                  block=m.group(0).lower()
                  bad=('maxess_result_10_10_bootstrap' in block or '__maxess_result_consumer_v2__' in block or '__maxess_result_consumer_v3__' in block or '__maxess_result_consumer_v4__' in block or 'data-maxess-result-consumer=' in block)
                  return '' if bad else m.group(0)
              return re.sub(r'<script\b[^>]*>.*?</script\s*>',repl,text,flags=re.I|re.S)

          def shell_counts(text):
              cleaned=re.sub(r'<script\b[^>]*>.*?</script\s*>','',text,flags=re.I|re.S)
              cleaned=re.sub(r'<style\b[^>]*>.*?</style\s*>','',cleaned,flags=re.I|re.S)
              return (len(re.findall(r'<html\b[^>]*>',cleaned,re.I)),len(re.findall(r'</html\s*>',cleaned,re.I)))

          open_count,close_count=shell_counts(baseline)
          if open_count==1 and close_count==0:
              body_close=len(re.findall(r'</body\s*>',baseline,re.I))
              if body_close==1: baseline=baseline.rstrip()+'\n</html>\n'
              elif body_close==0: baseline=baseline.rstrip()+'\n</body>\n</html>\n'
              else: raise SystemExit(f'BASELINE INVALID: document shell open={open_count} close={close_count} body-close={body_close}')
              open_count,close_count=shell_counts(baseline)
          if open_count!=1 or close_count!=1: raise SystemExit(f'BASELINE INVALID: document shell open={open_count} close={close_count}')

          baseline=strip_legacy_scripts(baseline)

          def source_section(sid,path):
              raw=path.read_text(encoding='utf-8')
              try:
                  obj=json.loads(raw)
                  src=obj.get('content') if isinstance(obj,dict) else None
                  if not isinstance(src,str): src=raw
              except (json.JSONDecodeError,TypeError):
                  src=raw

              sec=element_by_id(src,sid) or element_by_id(body(src),sid)
              if sec:
                  return strip_legacy_scripts(sec),src

              content=strip_style_tags(body(src)).strip()
              if not content:
                  raise SystemExit(f'AUTHORITATIVE SECTION EMPTY: {sid} in {path}')
              wrapped=f'<section id="{sid}" data-maxess-source="{sid}">\n{strip_legacy_scripts(content)}\n</section>'
              return wrapped,src

          authoritative={}
          all_styles=[]
          for sid,path in {**dynamic_sources,**static_sources}.items():
              sec,src=source_section(sid,path)
              authoritative[sid]=sec
              all_styles.extend(re.findall(r'<style\b[^>]*>.*?</style\s*>',src,flags=re.I|re.S))

          for sid in ['e01','maxess-e02-v3','e03','e04','e05','e06','e07','e08','e09']:
              existing=element_by_id(baseline,sid)
              if existing:
                  baseline=baseline.replace(existing,authoritative[sid],1)

          missing=[sid for sid in ['e01','maxess-e02-v3','e03','e04','e05','e06','e07','e08','e09'] if not element_by_id(baseline,sid)]
          if missing:
              ordered='\n'.join(authoritative[sid] for sid in ['e01','maxess-e02-v3','e03','e04','e05','e06','e07','e08','e09'] if sid in missing)
              e04_existing=element_by_id(baseline,'e04')
              if e04_existing:
                  pos=baseline.find(e04_existing)+len(e04_existing)
                  baseline=baseline[:pos]+'\n'+ordered+'\n'+baseline[pos:]
              else:
                  close=re.search(r'</body\s*>',baseline,re.I)
                  if not close: raise SystemExit('RESULTS BODY CLOSE MISSING')
                  baseline=baseline[:close.start()]+'\n'+ordered+'\n'+baseline[close.start():]

          head=baseline.lower().find('</head>')
          if head<0: raise SystemExit('RESULTS HEAD MISSING')
          existing_style_text=baseline[:head]
          styles_to_add=[]
          for style in all_styles:
              if style not in existing_style_text: styles_to_add.append(style)
          if styles_to_add: baseline=baseline[:head]+'\n'+'\n'.join(styles_to_add)+'\n'+baseline[head:]

          bridge='''<script id="maxess-complete-results-bridge-v5">
(function(){'use strict';if(window.__MAXESS_COMPLETE_RESULTS_BRIDGE_V5__)return;window.__MAXESS_COMPLETE_RESULTS_BRIDGE_V5__=true;var CONTRACT='MAXESS_RESULT_V1';function decode(v){try{var s=decodeURIComponent(String(v||'')).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u);}catch(e){return null;}}function consume(){var h=window.location.hash||'',m=h.match(/(?:^#|&)maxess-result=([^&]*)/i);if(!m)return false;var j=decode(m[1]);if(!j)return false;var r;try{r=JSON.parse(j);}catch(e){return false;}if(!r||typeof r!=='object'||r.contractVersion!==CONTRACT)return false;var score=Number(r.overallScore);if(!Number.isFinite(score)||score<0||score>100)return false;if(!Array.isArray(r.dimensions)||r.dimensions.length!==5)return false;if(!Array.isArray(r.responses)||r.responses.length!==15)return false;window.MAXESS_RESULT=r;try{window.dispatchEvent(new CustomEvent('MAXESS_RESULT_READY',{detail:r}));window.dispatchEvent(new CustomEvent('maxess:result-updated',{detail:r}));}catch(e){}return true;}window.MAXESS_RESULT_CONSUMER_V5={consume:consume,get:function(){return window.MAXESS_RESULT||null;},contractVersion:CONTRACT};function boot(){if(!consume())document.documentElement.setAttribute('data-maxess-result-state','missing-or-invalid');}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();window.addEventListener('hashchange',consume);window.addEventListener('pageshow',consume);})();
</script>'''
          if 'maxess-complete-results-bridge-v5' in baseline:
              raise SystemExit('INTEGRATED QA FAILED: duplicate/pre-existing V5 bridge')
          baseline=baseline[:head]+'\n'+bridge+'\n'+baseline[head:]

          required=['e01','maxess-e02-v3','e03','e04','e05','e06','e07','e08','e09']
          for sid in required:
              count=len(re.findall(r"<[^>]+\bid=['\"]"+re.escape(sid)+r"['\"]",baseline,re.I))
              if count!=1: raise SystemExit(f'INTEGRATED QA FAILED: {sid} count={count}')
          if baseline.count('maxess-complete-results-bridge-v5')!=1: raise SystemExit('INTEGRATED QA FAILED: V5 bridge count')
          lower=baseline.lower()
          if any(x.lower() in lower for x in ['maxess_result_10_10_bootstrap','__maxess_result_consumer_v2__','__maxess_result_consumer_v3__','__maxess_result_consumer_v4__','fixturemode']):
              raise SystemExit('INTEGRATED QA FAILED: legacy/fallback result authority remains')
          final_open,final_close=shell_counts(baseline)
          if final_open!=1 or final_close!=1: raise SystemExit(f'INTEGRATED QA FAILED: document shell open={final_open} close={final_close}')
          if baseline.lower().count('<!doctype html>')>1: raise SystemExit('INTEGRATED QA FAILED: nested document shell')
          if '<<<<<<<' in baseline or '>>>>>>>' in baseline: raise SystemExit('INTEGRATED QA FAILED: conflict marker')

          out=Path('MAXESS-RESULTS-INTEGRATED-V1.html')
          out.write_text(baseline,encoding='utf-8')
          digest=hashlib.sha256(baseline.encode()).hexdigest()
          Path('MAXESS-COMPLETE-INTEGRATED-BUILD.md').write_text('\n'.join([
            '# MAXESS Complete E01-E09 Results Build','',
            '- Assessment authority: 447','- Dynamic authority: E01, E02 V3, E03, E04','- Current main authority: E05, E06, E07, E08, E09','- Runtime authority: window.MAXESS_RESULT','- Result contract: MAXESS_RESULT_V1','- Results bridge: V5','- Structural QA: PASS',f'- SHA-256: {digest}',f'- Bytes: {len(baseline.encode())}',f'- Lines: {len(baseline.splitlines())}',''
          ]),encoding='utf-8')
          print('BUILD PASS')
          print('SHA-256:',digest)
          print('BYTES:',len(baseline.encode()))
          print('LINES:',len(baseline.splitlines()))

      - name: Validate 447 and generated JavaScript
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'function continueAssessment(event)' 'AISCORE.NAYANET.APP 2026 08 21 447'
          grep -F 'window.MAXESS_Q15_HANDOFF_V447=true;' 'AISCORE.NAYANET.APP 2026 08 21 447'
          grep -F 'results.nayanet.app/#maxess-result=' 'AISCORE.NAYANET.APP 2026 08 21 447'
          grep -F 'maxess-complete-results-bridge-v5' MAXESS-RESULTS-INTEGRATED-V1.html
          python - <<'PY'
          import re,subprocess,tempfile
          for fn in ['AISCORE.NAYANET.APP 2026 08 21 447','MAXESS-RESULTS-INTEGRATED-V1.html']:
            s=open(fn,encoding='utf-8').read()
            for js in re.findall(r'<script\b[^>]*>(.*?)</script\s*>',s,re.I|re.S):
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                f.write(js); name=f.name
              subprocess.run(['node','--check',name],check=True)
          print('NODE SYNTAX PASS')
          PY

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MAXESS-RESULTS-INTEGRATED-V1
          path: |
            MAXESS-RESULTS-INTEGRATED-V1.html
            MAXESS-COMPLETE-INTEGRATED-BUILD.md

      - name: Commit verified build
        shell: bash
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add 'AISCORE.NAYANET.APP 2026 08 21 447' 'MAXESS-RESULTS-INTEGRATED-V1.html' 'MAXESS-COMPLETE-INTEGRATED-BUILD.md'
          if git diff --cached --quiet; then
            echo 'NO CHANGES TO COMMIT'
          else
            git commit -m 'Build verified MAXESS 447 Results artifact [skip ci]'
            git push origin main
          fi
