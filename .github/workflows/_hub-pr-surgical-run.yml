name: Hub PR surgical runner
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'hub-surgical-smart-lists'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-surgical-smart-lists
          fetch-depth: 0
      - name: Apply surgical patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('NAYANETHUB.html'); s=p.read_text(encoding='utf-8')
          for sid in ['nayanethub-final-execution','nayanethub-hub-surgical-fix','nayanet-locked-hub-fix','nayanet-approved-hub-runtime']:
              s=re.sub(r'<script\b[^>]*\bid=["\']'+re.escape(sid)+r'["\'][^>]*>.*?</script>\s*','',s,count=1,flags=re.I|re.S)
          js=Path('nayanet-hub-surgical-patch.js').read_text(encoding='utf-8')
          s=s.replace('</body></html>','<!-- NAYANET-SURGICAL-V5 --><script id="nayanet-surgical-v5">'+js+'</script></body></html>')
          p.write_text(s,encoding='utf-8')
          assert s.count('id="nayanet-surgical-v5"')==1
          assert 'Your Intelligence Today' not in s
          assert s.count('id="page-home"')==1 and s.count('class="intelligentBlock"')>=1
          assert 'perspective.human' in s and 'perspective.naya' in s and 'perspective.machine' in s
          print('SURGICAL SOURCE VERIFY',len(s),'bytes')
          PY
      - name: Commit patch to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f nayanet-hub-surgical-patch.js .github/workflows/nayanet-hub-surgical.yml .github/workflows/_hub-pr-surgical-run.yml hub-surgical-trigger.txt hub-surgical-trigger-2.txt
          git add -A
          git commit -m "Surgical NayaNET Hub implementation" || exit 0
          git push origin HEAD:hub-surgical-smart-lists
