name: MAXESS Q15 Direct Results Surgical Repair

on:
  push:
    paths:
      - '.github/workflows/maxess-q15-direct-results.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'MAXESS:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Surgical Q15 flow repair
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('IASCORE.NAYANET.APP')
          text = path.read_text(encoding='utf-8')

          patterns = [
              re.compile(r'if\(state\.currentQuestionIndex===14\)\{showInterestSelection\(\);return\}'),
              re.compile(r'if\s*\(\s*state\.currentQuestionIndex\s*===\s*14\s*\)\s*\{\s*showInterestSelection\(\)\s*;\s*return\s*;?\s*\}')
          ]

          matches = []
          selected = None
          for pattern in patterns:
              found = list(pattern.finditer(text))
              if found:
                  matches = found
                  selected = pattern
                  break

          if len(matches) != 1:
              raise SystemExit(f'ABORT: expected exactly one Q15 interest transition; found {len(matches)}')

          replacement = 'if(state.currentQuestionIndex===14){publish();return}'
          new_text = selected.sub(replacement, text, count=1)
          if new_text == text:
              raise SystemExit('ABORT: no source change produced')

          path.write_text(new_text, encoding='utf-8')
          print('SURGICAL REPAIR VERIFIED: exactly one Q15 transition changed.')

      - name: Guardrail checks
        shell: python
        run: |
          from pathlib import Path
          text = Path('IASCORE.NAYANET.APP').read_text(encoding='utf-8')
          expected = 'if(state.currentQuestionIndex===14){publish();return}'
          if text.count(expected) != 1:
              raise SystemExit('ABORT: expected exactly one direct Q15 publish transition')
          if 'if(state.currentQuestionIndex===14){showInterestSelection();return}' in text:
              raise SystemExit('ABORT: old interest transition still exists')
          if 'Naya Profile 6.jpg' not in text and 'raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg' not in text:
              raise SystemExit('ABORT: Naya image checkpoint marker missing')
          print('GUARDRAILS PASSED.')

      - name: Commit surgical repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'Naya Lead Mode'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IASCORE.NAYANET.APP .github/workflows/maxess-q15-direct-results.yml
          git commit -m 'MAXESS: Q15 goes directly to report'
          git push
