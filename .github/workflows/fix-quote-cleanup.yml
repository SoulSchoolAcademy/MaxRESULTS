name: Fix quote cleanup script
on:
  push:
    branches: [nayanet-hub-release]
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix malformed quote cleanup script'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair cleanup block only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- NAYANET-SURGICAL-QUOTE-CLEANUP -->'
          i = s.find(marker)
          if i < 0:
              raise SystemExit('cleanup marker not found')
          start = s.rfind('\\n', 0, i)
          start = 0 if start < 0 else start + 2
          end = s.find('</body></html>', i)
          if end < 0:
              raise SystemExit('document end not found')
          block = '''<!-- NAYANET-SURGICAL-QUOTE-CLEANUP -->
<script id="nayanet-surgical-quote-cleanup">
(()=>{'use strict';const phrase='Your life creates intelligence every day. Naya helps you capture it, understand it, remember it, compound it, and use it.';const norm=s=>String(s||'').replace(/\\s+/g,' ').trim();function run(){const home=document.getElementById('page-home');const nav=document.querySelector('.nayanet-ecosystem-bar');if(!home||!nav)return;const matches=[...home.querySelectorAll('*')].filter(el=>el.children.length===0&&norm(el.textContent)===phrase);const blocks=[];matches.forEach(el=>{let b=el;while(b.parentElement&&b.parentElement!==home&&norm(b.textContent).includes(phrase)&&b.parentElement.children.length<=3)b=b.parentElement;if(!blocks.includes(b))blocks.push(b)});blocks.forEach(b=>b.remove());let q=document.getElementById('nh-canonical-life-intelligence');if(!q){q=document.createElement('div');q.id='nh-canonical-life-intelligence';q.className='nh-authority-quote';q.textContent=phrase;nav.insertAdjacentElement('afterend',q)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();setTimeout(run,100);setTimeout(run,500);setTimeout(run,1200)})();
</script>
'''
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit repaired file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix malformed quote cleanup script'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/fix-quote-cleanup.yml || true
          git commit -m 'Remove temporary quote cleanup workflow' || true
          git push || true
