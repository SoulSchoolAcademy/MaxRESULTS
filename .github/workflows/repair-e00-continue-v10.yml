name: Repair E00 Continue V10
on:
  push:
    paths:
      - '.github/workflows/repair-e00-continue-v10.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply root-scoped and multi-path Continue hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('E00 796')
          s=p.read_text()

          old="const $=id=>document.getElementById(id);"
          new="""const MAXESS_ROOT=document.currentScript?.closest('#maxess-ai-score')||document.getElementById('maxess-ai-score');
          if(!MAXESS_ROOT)throw Error('MAXESS root not found');
          const $=id=>MAXESS_ROOT.querySelector('#'+CSS.escape(id));"""
          if old not in s:
              raise SystemExit('Root selector anchor not found; refusing blind mutation')
          s=s.replace(old,new,1)

          old="$('continueButton').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();next();},{capture:true});"
          new="""let maxessContinueLast=0;
          function executeContinue(e){
           const btn=$('continueButton');
           if(!btn||e.target!==btn)return;
           if(btn.disabled||state.finalizing||state.mode!=='ASSESSMENT'||!state.selected)return;
           const now=Date.now();
           if(now-maxessContinueLast<300){e.preventDefault();e.stopImmediatePropagation();return;}
           maxessContinueLast=now;
           e.preventDefault();
           e.stopImmediatePropagation();
           try{next();}catch(err){
            console.error('MAXESS Continue boundary failure',err);
            state.finalizing=false;
            updateContinue();
            $('continueText').textContent='Continue';
           }
          }
          window.addEventListener('click',executeContinue,true);
          window.addEventListener('pointerup',executeContinue,true);
          window.addEventListener('mouseup',executeContinue,true);
          window.addEventListener('touchend',executeContinue,true);
          $('continueButton').addEventListener('keydown',e=>{
           if(e.key==='Enter'||e.key===' '){executeContinue(e);}
          },true);"""
          if old not in s:
              raise SystemExit('Continue binding anchor not found; refusing blind mutation')
          s=s.replace(old,new,1)

          old="""function next(){if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;if(state.i===14){publish();return;}save();state.i++;render();setTimeout(()=>openNaya(),120);}"""
          new="""function next(){
           if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;
           try{
            save();
            if(state.i===14){publish();return;}
            state.i++;
            render();
            setTimeout(()=>openNaya(),120);
           }catch(e){
            console.error('MAXESS Continue execution error',e);
            state.finalizing=false;
            updateContinue();
            $('continueText').textContent='Continue';
           }
          }"""
          if old not in s:
              raise SystemExit('next() anchor not found; refusing blind mutation')
          s=s.replace(old,new,1)

          marker="window.MAXESS_AISCORE={questions:Q,dimensions:D,scoreValues:S,buildContract:buildResult,validateContract:valid,publish};"
          inject="""window.MAXESS_AISCORE={questions:Q,dimensions:D,scoreValues:S,buildContract:buildResult,validateContract:valid,publish};
          window.MAXESS_E00_DIAGNOSTICS={
           root:MAXESS_ROOT,
           continueButton:$('continueButton'),
           answerCount:()=>MAXESS_ROOT.querySelectorAll('.answer').length,
           state:state,
           testNext:()=>next()
          };"""
          if marker not in s:
              raise SystemExit('Diagnostics anchor not found; refusing blind mutation')
          s=s.replace(marker,inject,1)

          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'E00 796'
          git diff --cached --quiet && exit 0
          git commit -m 'fix E00 Continue boundary and instance targeting'
          git push
