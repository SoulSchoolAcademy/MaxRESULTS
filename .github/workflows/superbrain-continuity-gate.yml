name: Superbrain Continuity Gate

on:
  push:
    branches: [main]
    paths:
      - 'START-HERE.md'
      - '.naya/SUPERBRAIN-COLD-START-AND-CONTINUITY-CONTRACT.md'
      - '.naya/memory/NAYAPOWER-RUNTIME-BRIEFING.md'
      - '.naya/SUPERBRAIN-COLLECTIVE-RUNNING-FEED.md'
      - '.naya/projects/CURRENT-PROJECT.md'
      - 'tools/qa_superbrain_continuity.py'
  pull_request:
    paths:
      - 'START-HERE.md'
      - '.naya/SUPERBRAIN-COLD-START-AND-CONTINUITY-CONTRACT.md'
      - '.naya/memory/NAYAPOWER-RUNTIME-BRIEFING.md'
      - '.naya/SUPERBRAIN-COLLECTIVE-RUNNING-FEED.md'
      - '.naya/projects/CURRENT-PROJECT.md'
      - 'tools/qa_superbrain_continuity.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ env.TARGET_SHA }}
      - name: Assert exact target commit
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$TARGET_SHA"
          echo "Exact target commit verified: $actual"
      - name: Run Superbrain continuity acceptance
        run: python3 tools/qa_superbrain_continuity.py
