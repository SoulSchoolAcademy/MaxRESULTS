name: NayaNET surgical welcome

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nayanet-surgical-welcome.yml'

permissions:
  contents: write

jobs:
  patch-hub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Insert only the dynamic welcome block
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('NAYANETHUB.html')
          text = path.read_text(encoding='utf-8')
          marker = 'id="nayanet-login-welcome"'
          if marker in text:
              print('Welcome block already present; no change needed.')
          else:
              css = '''<style id="nayanet-login-welcome-style">#nayanet-login-welcome{padding:34px 0 28px;margin:0;border-bottom:1px solid #ffffff12}#nayanet-login-welcome h1{margin:0;font-size:clamp(42px,6vw,78px);line-height:.92;letter-spacing:-.07em;font-weight:900}#nayanet-login-welcome .nhw-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;color:#bdb8c7;font-size:11px;font-weight:700;letter-spacing:.04em}#nayanet-login-welcome .nhw-meta span{padding:7px 10px;border:1px solid #ffffff18;border-radius:10px;background:#09090d}#nayanet-login-welcome .nhw-meta strong{color:#fff} @media(max-width:900px){#nayanet-login-welcome{padding:24px 0 22px}#nayanet-login-welcome h1{font-size:clamp(38px,11vw,58px)}#nayanet-login-welcome .nhw-meta{font-size:10px}}</style>'''
              block = '''<section id="nayanet-login-welcome" aria-label="NayaNET welcome"><h1 id="nayanet-login-greeting">Good evening, Shawn.</h1><div class="nhw-meta"><span id="nayanet-login-time"><strong>--:--</strong></span><span id="nayanet-login-date"><strong>Loading date…</strong></span><span><strong id="nayanet-login-country">Canada</strong></span></div></section><script id="nayanet-login-welcome-runtime">(function(){function updateNayaWelcome(){var now=new Date();var hour=now.getHours();var greeting=hour<12?'Good morning, Shawn.':hour<18?'Good afternoon, Shawn.':'Good evening, Shawn.';var time=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(now);var date=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(now);var region=(navigator.language||'').match(/[-_]([A-Z]{2})$/i);var countryMap={CA:'Canada',US:'United States',GB:'United Kingdom',AU:'Australia',NZ:'New Zealand'};var country=region?countryMap[region[1].toUpperCase()]||'Canada':'Canada';var g=document.getElementById('nayanet-login-greeting'),t=document.getElementById('nayanet-login-time'),d=document.getElementById('nayanet-login-date'),c=document.getElementById('nayanet-login-country');if(g)g.textContent=greeting;if(t)t.innerHTML='<strong>'+time+'</strong>';if(d)d.innerHTML='<strong>'+date+'</strong>';if(c)c.textContent=country}updateNayaWelcome();setInterval(updateNayaWelcome,30000)})();</script>'''
              if '</style><style id="nayanet-surgical-menu-style">' not in text:
                  raise SystemExit('Expected V7 style boundary not found; aborting.')
              text = text.replace('</style><style id="nayanet-surgical-menu-style">', '</style>'+css+'<style id="nayanet-surgical-menu-style">', 1)
              anchor = '<header class="topbar">'
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit('Expected topbar anchor not found; aborting.')
              topbar_end = text.find('</header>', pos)
              if topbar_end < 0:
                  raise SystemExit('Expected topbar closing tag not found; aborting.')
              insert_at = topbar_end + len('</header>')
              text = text[:insert_at] + block + text[insert_at:]
              path.write_text(text, encoding='utf-8')
              print('Inserted one dynamic welcome block.')

          final = path.read_text(encoding='utf-8')
          if final.count('id="nayanet-login-welcome"') != 1:
              raise SystemExit('Verification failed: welcome block count is not exactly 1.')
          if final.count('id="nayanet-login-welcome-runtime"') != 1:
              raise SystemExit('Verification failed: runtime count is not exactly 1.')
          print('Verified exactly one welcome block and one runtime.')
      - name: Commit surgical result and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NAYANETHUB.html
          git rm .github/workflows/nayanet-surgical-welcome.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Add dynamic welcome header to NayaNET Hub"
          git push origin main
