name: Rebuild Complete MAXESS Results Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-integrated-results.yml'
      - 'MAXESS-RESULTS-INTEGRATED-V1.html'
      - 'AISCORE.NAYANET.APP 2026 08 21 447'
      - 'docs/smart-notes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout active Results sections
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          path: active-results
          fetch-depth: 1

      - name: Apply surgical MAXESS 448 final-submit guard
        shell: python
        run: |
          from pathlib import Path
          p=Path('AISCORE.NAYANET.APP 2026 08 21 447')
          text=p.read_text(encoding='utf-8')
          old="""const sessionSeed=crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295);const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false};"""
          new="""const sessionSeed=crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295);const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false,finalizing:false};"""
          if old not in text:
              raise SystemExit('448 PATCH FAILED: state anchor not found')
          text=text.replace(old,new,1)
          old_fn="""function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.completed=true;try{publish()}catch(e){console.error('MAXESS report publish failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"""
          new_fn="""function continueAssessment(event){if(event){event.preventDefault();event.stopPropagation()}if(state.finalizing||!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.finalizing=true;state.completed=true;const button=$('continueButton');button.disabled=true;button.setAttribute('aria-disabled','true');$('continueText').textContent='Loading Results…';try{const c=buildContract();if(!validateContract(c))throw new Error('MAXESS_RESULT_V1 validation failed before final navigation.');broadcastResult(c);const payload=encode(c);const resultUrl='https://results.nayanet.app/#maxess-result='+payload;try{if(window.top&&window.top!==window)window.top.location.href=resultUrl;else window.location.href=resultUrl}catch(navError){window.location.assign(resultUrl)}}catch(e){state.finalizing=false;button.disabled=false;button.setAttribute('aria-disabled','false');$('continueText').textContent='Continue';console.error('MAXESS final Results handoff failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"""
          if old_fn not in text:
              raise SystemExit('448 PATCH FAILED: continue function anchor not found')
          text=text.replace(old_fn,new_fn,1)
          marker="window.MAXESS_RESULT_BRIDGE_V2=true;"
          if marker not in text:
              raise SystemExit('448 PATCH FAILED: release marker anchor not found')
          text=text.replace(marker,marker+"window.MAXESS_Q15_HANDOFF_V448=true;",1)
          p.write_text(text,encoding='utf-8')
          print('448 final-submit guard applied')

      - name: Build complete E01-E09 Results artifact with E01-E04 dynamic sources
        shell: python
        run: |
          from pathlib import Path
          import re, hashlib
          from html.parser import HTMLParser

          active=Path('active-results')
          dynamic_names=[f'E0{i}-SECTION-0{i}-WORKING.html' for i in range(1,5)]
          static_names=['E05-SECTION-05-WORKING.html','E06-SECTION-06-WORKING.html','E08-SECTION-08-WORKING.html','E09-SECTION-09-WORKING.html']
          for name in dynamic_names+static_names:
              if not (active/name).exists():
                  raise SystemExit(f'MISSING SOURCE: active-results/{name}')
          baseline=Path('BASELINE-WORKING.html')
          if not baseline.exists():
              raise SystemExit('MISSING SOURCE: BASELINE-WORKING.html')

          class Extractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.out=[]; self.stack=[]; self.capture_id=None; self.capture_depth=0
                  self.styles=[]; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  raw='<'+tag+''.join((' '+k if v is None else ' '+k+'="'+v+'"') for k,v in attrs)+'>'
                  self.out.append(raw)
                  if tag=='style': self.styles.append([])
                  if tag=='script': self.scripts.append([])
                  if self.capture_id is None and a.get('id'):
                      if a['id'].lower() in {'e01','e02','e03','e04','e05','e06','e07','e08','e09'}:
                          self.capture_id=a['id'].lower(); self.capture_depth=len(self.stack)+1
                  self.stack.append(tag)
              def handle_startendtag(self,tag,attrs): self.handle_starttag(tag,attrs); self.handle_endtag(tag)
              def handle_endtag(self,tag):
                  self.out.append('</'+tag+'>')
                  if self.styles and tag=='style': pass
                  if self.scripts and tag=='script': pass
                  if self.capture_id and len(self.stack)==self.capture_depth:
                      self.capture_id=None; self.capture_depth=0
                  if self.stack: self.stack.pop()
              def handle_data(self,data):
                  self.out.append(data)
                  if self.styles and self.stack and self.stack[-1]=='style': self.styles[-1].append(data)
                  if self.scripts and self.stack and self.stack[-1]=='script': self.scripts[-1].append(data)
              def handle_entityref(self,name): self.out.append('&'+name+';')
              def handle_charref(self,name): self.out.append('&#'+name+';')

          def parse(path):
              p=Extractor(); p.feed(path.read_text(encoding='utf-8')); return p

          dynamic=[]; static=[]
          for name in dynamic_names: dynamic.append((name,parse(active/name)))
          for name in static_names: static.append((name,parse(active/name)))
          base=parse(baseline)

          def find_element(html, target):
              m=re.search(r'<([a-zA-Z][\w:-]*)\b[^>]*\bid=["\']'+re.escape(target)+r'["\'][^>]*>', html, re.I)
              if not m: return None
              tag=m.group(1); pos=m.end(); depth=1
              token=re.compile(r'</?'+re.escape(tag)+r'\b[^>]*>',re.I)
              for t in token.finditer(html,pos):
                  if t.group(0).startswith('</'): depth-=1
                  elif not t.group(0).rstrip().endswith('/>'): depth+=1
                  if depth==0: return html[m.start():t.end()]
              return None

          base_text=baseline.read_text(encoding='utf-8')
          static_sections={}
          for sid in ['e05','e06','e07','e08','e09']:
              section=find_element(base_text,sid)
              if not section:
                  raise SystemExit(f'BASELINE STATIC SECTION MISSING: {sid}')
              static_sections[sid]=section

          def section_from_file(path, sid):
              text=path.read_text(encoding='utf-8')
              section=find_element(text,sid)
              if not section: raise SystemExit(f'DYNAMIC SECTION MISSING: {path.name} -> {sid}')
              return section

          parts=['<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05030a"><meta name="color-scheme" content="dark"><title>MAXESS — Complete Results</title>']
          # Baseline CSS keeps the proven complete-page/static design intact.
          parts.extend('<style data-maxess-baseline="true">'+''.join(x)+'</style>' for x in base.styles)
          # Active E01-E04 CSS is appended so the current dynamic sections remain authoritative.
          for name,p in dynamic:
              parts.extend('<style data-maxess-source="'+name+'">'+''.join(x)+'</style>' for x in p.styles)
          # Static section-specific CSS from their preserved working artifacts.
          for name,p in static:
              parts.extend('<style data-maxess-source="'+name+'">'+''.join(x)+'</style>' for x in p.styles)
          parts.append('''<script id="maxess-complete-results-bridge-v1">(function(){'use strict';function decode(v){try{var s=decodeURIComponent(String(v||''));var b=atob(s.replace(/-/g,'+').replace(/_/g,'/'));var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u));}catch(e){return null}}function valid(r){return !!(r&&r.contractVersion==='MAXESS_RESULT_V1'&&Number.isFinite(Number(r.overallScore))&&Array.isArray(r.dimensions)&&r.dimensions.length===5&&Array.isArray(r.responses)&&r.responses.length===15)}function publish(r){if(!valid(r))return false;window.MAXESS_RESULT=r;window.dispatchEvent(new CustomEvent('MAXESS_RESULT_READY',{detail:r}));window.dispatchEvent(new CustomEvent('maxess:result-updated',{detail:r}));return true}function consume(){var h=location.hash||'',m=h.match(/(?:^#)maxess-result=([^&]*)/i);if(m&&publish(decode(m[1])))return true;try{if(publish(window.MAXESS_RESULT))return true}catch(e){}return false}function run(){if(!consume()){var root=document.body;root.setAttribute('data-maxess-result-state','error')}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();window.addEventListener('hashchange',run);window.MAXESS_COMPLETE_RESULTS_BRIDGE_V448=true})();</script>''')
          parts.append('</head><body>')
          for i in range(1,5): parts.append(section_from_file(active/dynamic_names[i-1],f'e0{i}'))
          for sid in ['e05','e06','e07','e08','e09']: parts.append(static_sections[sid])
          parts.append('<script>window.MAXESS_COMPLETE_RESULTS_ORDER=["e01","e02","e03","e04","e05","e06","e07","e08","e09"];</script>')
          # Dynamic scripts run after the complete DOM exists. Static scripts are preserved from their working files.
          for name,p in dynamic:
              for script in p.scripts: parts.append('<script data-maxess-source="'+name+'">'+''.join(script)+'</script>')
          for name,p in static:
              for script in p.scripts: parts.append('<script data-maxess-source="'+name+'">'+''.join(script)+'</script>')
          parts.append('</body></html>')
          text='\n'.join(parts)+'\n'
          required=['id="e01"','id="e02"','id="e03"','id="e04"','id="e05"','id="e06"','id="e07"','id="e08"','id="e09"','MAXESS_RESULT_V1','MAXESS_COMPLETE_RESULTS_BRIDGE_V448']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('INTEGRATED QA FAILED: '+', '.join(missing))
          for marker in required[0:9]:
              if text.count(marker)!=1: raise SystemExit(f'INTEGRATED QA FAILED: {marker} count={text.count(marker)}')
          if '<script id="maxess-complete-results-bridge-v1">' not in text: raise SystemExit('INTEGRATED QA FAILED: bridge missing')
          if '<<<<<<<' in text or '>>>>>>>' in text: raise SystemExit('INTEGRATED QA FAILED: conflict marker')
          Path('MAXESS-RESULTS-INTEGRATED-V1.html').write_text(text,encoding='utf-8')
          sha=hashlib.sha256(text.encode()).hexdigest()
          report=f'''# MAXESS Complete E01-E09 Integrated Results Build\n\n- Dynamic sources: E01, E02, E03, E04 from `maxess-results-v21-working`\n- Static preserved sections: E05, E06, E07, E08, E09 from the existing complete baseline\n- Runtime authority: `window.MAXESS_RESULT`\n- Result transport: `MAXESS_RESULT_V1` URL hash → bootstrap → E01-E04\n- SHA-256: `{sha}`\n- Bytes: {len(text.encode())}\n- Lines: {len(text.splitlines())}\n- Static integration QA: PASS\n'''
          Path('MAXESS-COMPLETE-INTEGRATED-BUILD.md').write_text(report,encoding='utf-8')
          print(report)

      - name: Commit complete artifact and evidence
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add 'AISCORE.NAYANET.APP 2026 08 21 447' MAXESS-RESULTS-INTEGRATED-V1.html MAXESS-COMPLETE-INTEGRATED-BUILD.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'MAXESS 448: restore complete E01-E09 Results composition'
          git push origin main

# Guardrail: E01-E04 are the only dynamic result sections for this handoff.
# E05-E09 remain present and static; never omit them when producing the complete Results artifact.
# Guardrail: never replace the complete Results page with a tiny renderer, loader, mock, or excerpt.
