name: MAXESS Results — Surgical Q15 Handoff + Complete E01-E09 Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-integrated-results.yml'
      - 'AISCORE.NAYANET.APP 2026 08 21 447'
      - 'MAXESS-RESULTS-INTEGRATED-V1.html'
      - 'docs/smart-notes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout authoritative Results working branch
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          path: active-results
          fetch-depth: 1

      - name: Apply surgical Q15 first-click handoff repair
        shell: python
        run: |
          from pathlib import Path
          p = Path('AISCORE.NAYANET.APP 2026 08 21 447')
          text = p.read_text(encoding='utf-8')

          state_old = "const sessionSeed=crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295);const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false};"
          state_new = "const sessionSeed=crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295);const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false,finalizing:false};"
          if state_old in text:
              text = text.replace(state_old, state_new, 1)

          old_fn = "function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.completed=true;try{publish()}catch(e){console.error('MAXESS report publish failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          new_fn = "function continueAssessment(event){if(event){event.preventDefault();event.stopPropagation();if(event.stopImmediatePropagation)event.stopImmediatePropagation()}if(state.finalizing||!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.finalizing=true;state.completed=true;const button=$('continueButton');button.disabled=true;button.setAttribute('aria-disabled','true');$('continueText').textContent='Loading Results…';try{if(!publish())throw new Error('MAXESS final Results publish returned false.')}catch(e){state.finalizing=false;button.disabled=false;button.setAttribute('aria-disabled','false');$('continueText').textContent='Continue';console.error('MAXESS final Results handoff failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          if old_fn in text:
              text = text.replace(old_fn, new_fn, 1)
          elif 'function continueAssessment(event)' not in text:
              raise SystemExit('Q15 handler anchor missing')

          listener_old = "$('continueButton').addEventListener('click',continueAssessment);"
          listener_new = "$('continueButton').addEventListener('click',continueAssessment,true);"
          if listener_old in text:
              text = text.replace(listener_old, listener_new, 1)

          marker = "window.MAXESS_CLEAN_V1_REPAIR_APPLIED=true;window.NAYA_WELCOME_V1=true;window.MAXESS_RESULT_BRIDGE_V2=true;"
          if marker in text:
              text = text.replace(marker, marker + "window.MAXESS_Q15_HANDOFF_V447=true;", 1)
          elif 'window.MAXESS_Q15_HANDOFF_V447=true;' not in text:
              raise SystemExit('Q15 release marker missing')

          p.write_text(text, encoding='utf-8')
          print('Q15 surgical repair applied')

      - name: Build complete Results from authoritative baseline with E01-E04 overrides
        shell: python
        run: |
          from pathlib import Path
          import re
          import hashlib

          active = Path('active-results')
          baseline = active / 'BASELINE-WORKING.html'
          if not baseline.exists():
              raise SystemExit('AUTHORITATIVE BASELINE MISSING: active-results/BASELINE-WORKING.html')

          dynamic_files = {
              'e01': active / 'E01-SECTION-01-WORKING.html',
              'maxess-e02-v2': active / 'E02-SECTION-02-WORKING.html',
              'e03': active / 'E03-SECTION-03-WORKING.html',
              'e04': active / 'E04-SECTION-04-WORKING.html',
          }
          for sid, path in dynamic_files.items():
              if not path.exists():
                  raise SystemExit(f'DYNAMIC SOURCE MISSING: {path}')

          base = baseline.read_text(encoding='utf-8')

          def body_inner(text):
              m = re.search(r'<body\\b[^>]*>(.*?)</body\\s*>', text, re.I | re.S)
              if not m:
                  raise SystemExit('BODY MISSING in source')
              return m.group(1)

          def element_by_id(text, element_id):
              pat = re.compile(
                  r'<([A-Za-z][\\w:-]*)\\b[^>]*\\bid=["\\']' + re.escape(element_id) + r'["\\'][^>]*>',
                  re.I
              )
              m = pat.search(text)
              if not m:
                  return None
              tag = m.group(1)
              depth = 1
              pos = m.end()
              token = re.compile(r'</?' + re.escape(tag) + r'\\b[^>]*>', re.I)
              for hit in token.finditer(text, pos):
                  raw = hit.group(0)
                  if raw.startswith('</'):
                      depth -= 1
                  elif not raw.rstrip().endswith('/>'):
                      depth += 1
                  if depth == 0:
                      return text[m.start():hit.end()]
              return None

          def remove_consumer_scripts(text):
              patterns = [
                  r'<script[^>]*data-maxess-result-consumer=["\\']v[234]["\\'][^>]*>.*?</script>\\s*',
                  r'<script[^>]*data-maxess-result-consumer=["\\']v3["\\'][^>]*>.*?</script>\\s*',
                  r'<script[^>]*data-maxess-result-consumer=["\\']v2["\\'][^>]*>.*?</script>\\s*',
                  r'<script[^>]*>.*?__MAXESS_RESULT_CONSUMER_V[234]__.*?</script>\\s*',
              ]
              out = text
              for pattern in patterns:
                  out = re.sub(pattern, '', out, flags=re.I | re.S)
              return out

          def clean_dynamic_body(text):
              body = body_inner(text)
              return remove_consumer_scripts(body)

          # Remove any existing dynamic section bodies from the authoritative baseline.
          for sid in dynamic_files:
              existing = element_by_id(base, sid)
              if not existing:
                  raise SystemExit(f'AUTHORITATIVE BASELINE MISSING DYNAMIC SECTION: {sid}')
              base = base.replace(existing, '', 1)

          dynamic_bodies = {sid: clean_dynamic_body(path.read_text(encoding='utf-8')) for sid, path in dynamic_files.items()}

          # Insert each current dynamic source immediately before the first static section.
          first_static = re.search(r'<(?:section|main)\\b[^>]*\\bid=["\\']e05["\\']', base, re.I)
          if not first_static:
              raise SystemExit('COMPLETE BASELINE MISSING E05')
          insertion = '\n'.join(dynamic_bodies[sid] for sid in ['e01','maxess-e02-v2','e03','e04']) + '\n'
          base = base[:first_static.start()] + insertion + base[first_static.start():]

          # Remove any legacy global result-consumer scripts left in the baseline.
          base = remove_consumer_scripts(base)

          bridge = r'''<script id="maxess-complete-results-bridge-v4">
(function(){
  'use strict';
  if(window.__MAXESS_COMPLETE_RESULTS_BRIDGE_V4__)return;
  window.__MAXESS_COMPLETE_RESULTS_BRIDGE_V4__=true;
  var CONTRACT='MAXESS_RESULT_V1',READY='MAXESS_RESULT_READY',UPDATED='maxess:result-updated';
  function emit(name,result){try{window.dispatchEvent(new CustomEvent(name,{detail:result}));}catch(e){}}
  function decode(value){
    try{
      var s=decodeURIComponent(String(value||''));
      s=s.replace(/-/g,'+').replace(/_/g,'/');
      while(s.length%4)s+='=';
      var binary=atob(s),bytes=new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }catch(e){return null;}
  }
  function token(){
    var hash=window.location.hash||'';
    var m=hash.match(/(?:^#|&)maxess-result=([^&]*)/i);
    return m&&m[1]?m[1]:null;
  }
  function valid(r){
    if(!r||typeof r!=='object'||r.contractVersion!==CONTRACT)return false;
    var score=Number(r.overallScore);
    if(!Number.isFinite(score)||score<0||score>100)return false;
    if(!Array.isArray(r.dimensions)||r.dimensions.length!==5)return false;
    if(!Array.isArray(r.responses)||r.responses.length!==15)return false;
    for(var i=0;i<5;i++){
      var d=r.dimensions[i];
      if(!d||typeof d.name!=='string'||!d.name.trim()||!Number.isFinite(Number(d.score)))return false;
    }
    return true;
  }
  function consume(){
    var raw=token();
    if(!raw)return false;
    var json=decode(raw);
    if(!json)return false;
    var result;
    try{result=JSON.parse(json);}catch(e){return false;}
    if(!valid(result))return false;
    window.MAXESS_RESULT=result;
    emit(READY,result);
    emit(UPDATED,result);
    return true;
  }
  function boot(){
    if(consume())return;
    var attempts=0;
    (function retry(){
      if(consume())return;
      if(++attempts<20)window.setTimeout(retry,250);
    })();
  }
  window.MAXESS_RESULT_CONSUMER_V4={consume:consume,get:function(){return window.MAXESS_RESULT||null;},contractVersion:CONTRACT,version:'V4'};
  window.addEventListener('hashchange',boot);
  window.addEventListener('pageshow',boot);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>'''

          # Put the one authoritative consumer in the head so it exists before E01-E04 render listeners initialize.
          if re.search(r'</head\\s*>', base, re.I):
              base = re.sub(r'</head\\s*>', bridge + '\n</head>', base, count=1, flags=re.I)
          else:
              raise SystemExit('RESULTS HEAD MISSING')

          required_ids = ['e01','maxess-e02-v2','e03','e04','e05','e06','e07','e08','e09']
          for sid in required_ids:
              count = len(re.findall(r'\\bid=["\\']' + re.escape(sid) + r'["\\']', base, re.I))
              if count != 1:
                  raise SystemExit(f'INTEGRATED QA FAILED: {sid} count={count}')

          if base.count('maxess-complete-results-bridge-v4') != 1:
              raise SystemExit('INTEGRATED QA FAILED: bridge count')
          if re.search(r'data-maxess-result-consumer=["\\']v[234]["\\']', base, re.I):
              raise SystemExit('INTEGRATED QA FAILED: legacy consumer remains')
          if '<!doctype html>' in base.lower()[base.lower().find('<body'):]:
              raise SystemExit('INTEGRATED QA FAILED: nested document shell')
          if '<html' not in base.lower() or '</html>' not in base.lower():
              raise SystemExit('INTEGRATED QA FAILED: document shell')
          if '<script' not in base.lower():
              raise SystemExit('INTEGRATED QA FAILED: scripts missing')
          if 'MAXESS_RESULT_V1' not in base:
              raise SystemExit('INTEGRATED QA FAILED: contract missing')
          if 'window.MAXESS_RESULT' not in base:
              raise SystemExit('INTEGRATED QA FAILED: runtime authority missing')
          if '<<<<<<<' in base or '>>>>>>>' in base:
              raise SystemExit('INTEGRATED QA FAILED: conflict marker')

          out = Path('MAXESS-RESULTS-INTEGRATED-V1.html')
          out.write_text(base, encoding='utf-8')
          digest = hashlib.sha256(base.encode('utf-8')).hexdigest()
          report = '\n'.join([
              '# MAXESS Complete Results Build',
              '',
              '- Authoritative baseline: `maxess-results-v21-working/BASELINE-WORKING.html`',
              '- Dynamic overrides: E01, E02, E03, E04 only',
              '- Static preserved: E05, E06, E07, E08, E09',
              '- Runtime authority: `window.MAXESS_RESULT`',
              '- Result contract: `MAXESS_RESULT_V1`',
              '- Single result bridge: V4',
              f'- SHA-256: `{digest}`',
              f'- Bytes: {len(base.encode("utf-8"))}',
              f'- Lines: {len(base.splitlines())}',
              '- Structural QA: PASS',
              ''
          ])
          Path('MAXESS-COMPLETE-INTEGRATED-BUILD.md').write_text(report, encoding='utf-8')
          print(report)

      - name: Validate assessment and integrated artifact
        shell: python
        run: |
          from pathlib import Path
          import re
          assessment = Path('AISCORE.NAYANET.APP 2026 08 21 447').read_text(encoding='utf-8')
          results = Path('MAXESS-RESULTS-INTEGRATED-V1.html').read_text(encoding='utf-8')
          required_assessment = [
              'state={firstVisit:true',
              'finalizing:false',
              'function continueAssessment(event)',
              "window.MAXESS_Q15_HANDOFF_V447=true;",
              "location.assign('https://results.nayanet.app/#maxess-result='+payload)",
          ]
          for marker in required_assessment:
              if marker not in assessment:
                  raise SystemExit('ASSESSMENT QA FAILED: '+marker)
          for sid in ['e01','maxess-e02-v2','e03','e04','e05','e06','e07','e08','e09']:
              if len(re.findall(r'\\bid=["\\']'+re.escape(sid)+r'["\\']',results,re.I)) != 1:
                  raise SystemExit('RESULTS QA FAILED: '+sid)
          print('MAXESS assessment + complete Results static QA PASS')

      - name: Commit generated repair
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add 'AISCORE.NAYANET.APP 2026 08 21 447' 'MAXESS-RESULTS-INTEGRATED-V1.html' 'MAXESS-COMPLETE-INTEGRATED-BUILD.md' '.github/workflows/rebuild-integrated-results.yml'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'MAXESS: repair Q15 handoff and restore complete E01-E09 Results artifact'
          git push origin main

# PRIME GUARDRAIL:
# Q15 -> MAXESS_RESULT_V1 -> results.nayanet.app is the handoff.
# E01-E04 are the only dynamic result sections.
# E05-E09 are static/preserved sections and must remain present.
# Never rebuild the Results page from a partial fragment set.
# Never ship raw workflow/source text as the user-facing Groove artifact.
# Never use window.top navigation as the primary Q15 handoff mechanism.
