name: MAXESS Results — Surgical Q15 Handoff + Complete E01-E09 Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-integrated-results.yml'
      - 'AISCORE.NAYANET.APP 2026 08 21 447'
      - 'MAXESS-RESULTS-INTEGRATED-V1.html'
      - 'docs/smart-notes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout authoritative Results working branch
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          path: active-results
          fetch-depth: 1

      - name: Apply surgical Q15 first-click handoff repair
        shell: python
        run: |
          from pathlib import Path
          p = Path('AISCORE.NAYANET.APP 2026 08 21 447')
          text = p.read_text(encoding='utf-8')

          state_old = "const sessionSeed=crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295);const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false};"
          state_new = "const sessionSeed=crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295);const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false,finalizing:false};"
          if state_old in text:
              text = text.replace(state_old, state_new, 1)

          old_fn = "function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.completed=true;try{publish()}catch(e){console.error('MAXESS report publish failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          new_fn = "function continueAssessment(event){if(event){event.preventDefault();event.stopPropagation();if(event.stopImmediatePropagation)event.stopImmediatePropagation()}if(state.finalizing||!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.finalizing=true;state.completed=true;const button=$('continueButton');button.disabled=true;button.setAttribute('aria-disabled','true');$('continueText').textContent='Loading Results…';try{if(!publish())throw new Error('MAXESS final Results publish returned false.')}catch(e){state.finalizing=false;button.disabled=false;button.setAttribute('aria-disabled','false');$('continueText').textContent='Continue';console.error('MAXESS final Results handoff failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          if old_fn in text:
              text = text.replace(old_fn, new_fn, 1)
          elif 'function continueAssessment(event)' not in text:
              raise SystemExit('Q15 handler anchor missing')

          listener_old = "$('continueButton').addEventListener('click',continueAssessment);"
          listener_new = "$('continueButton').addEventListener('click',continueAssessment,true);"
          if listener_old in text:
              text = text.replace(listener_old, listener_new, 1)

          marker = "window.MAXESS_CLEAN_V1_REPAIR_APPLIED=true;window.NAYA_WELCOME_V1=true;window.MAXESS_RESULT_BRIDGE_V2=true;"
          if marker in text:
              text = text.replace(marker, marker + "window.MAXESS_Q15_HANDOFF_V447=true;", 1)
          elif 'window.MAXESS_Q15_HANDOFF_V447=true;' not in text:
              raise SystemExit('Q15 release marker missing')

          p.write_text(text, encoding='utf-8')
          print('Q15 surgical repair applied')

      - name: Build complete Results from authoritative baseline with E01-E04 overrides
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          active = Path('active-results')
          baseline = active / 'BASELINE-WORKING.html'
          if not baseline.exists():
              raise SystemExit('AUTHORITATIVE BASELINE MISSING: active-results/BASELINE-WORKING.html')

          dynamic_files = {
              'e01': active / 'E01-SECTION-01-WORKING.html',
              'maxess-e02-v2': active / 'E02-SECTION-02-WORKING.html',
              'e03': active / 'E03-SECTION-03-WORKING.html',
              'e04': active / 'E04-SECTION-04-WORKING.html',
          }
          for sid, path in dynamic_files.items():
              if not path.exists():
                  raise SystemExit(f'DYNAMIC SOURCE MISSING: {path}')

          base = baseline.read_text(encoding='utf-8')

          def extract_by_id(text, element_id):
              markers = ['id="' + element_id + '"', "id='" + element_id + "'"]
              marker_pos = -1
              for marker in markers:
                  marker_pos = text.find(marker)
                  if marker_pos >= 0:
                      break
              if marker_pos < 0:
                  return None
              start = text.rfind('<', 0, marker_pos)
              gt = text.find('>', marker_pos)
              if start < 0 or gt < 0:
                  return None
              i = start + 1
              tag = ''
              while i < len(text) and (text[i].isalnum() or text[i] in ':_-'):
                  tag += text[i]
                  i += 1
              if not tag:
                  return None
              depth = 1
              pos = gt + 1
              open_token = '<' + tag
              close_token = '</' + tag
              while True:
                  a = text.find(open_token, pos)
                  b = text.find(close_token, pos)
                  if b < 0:
                      return None
                  if a >= 0 and a < b:
                      gt2 = text.find('>', a)
                      if gt2 < 0:
                          return None
                      raw = text[a:gt2 + 1]
                      if not raw.startswith('</') and not raw.rstrip().endswith('/>'):
                          depth += 1
                      pos = gt2 + 1
                  else:
                      end = text.find('>', b)
                      if end < 0:
                          return None
                      depth -= 1
                      if depth == 0:
                          return text[start:end + 1]
                      pos = end + 1

          def body_inner(text):
              start_tag = text.lower().find('<body')
              if start_tag < 0:
                  raise SystemExit('BODY MISSING in source')
              start = text.find('>', start_tag)
              end = text.lower().rfind('</body>')
              if start < 0 or end < 0 or end <= start:
                  raise SystemExit('BODY BOUNDARY INVALID in source')
              return text[start + 1:end]

          def extract_blocks(text, tag):
              blocks = []
              cursor = 0
              open_token = '<' + tag
              close_token = '</' + tag + '>'
              lower = text.lower()
              while True:
                  a = lower.find(open_token, cursor)
                  if a < 0:
                      break
                  gt = lower.find('>', a)
                  if gt < 0:
                      break
                  b = lower.find(close_token, gt + 1)
                  if b < 0:
                      break
                  blocks.append(text[a:b + len(close_token)])
                  cursor = b + len(close_token)
              return blocks

          def strip_result_consumers(text):
              out = []
              cursor = 0
              lower = text.lower()
              while True:
                  start = lower.find('<script', cursor)
                  if start < 0:
                      out.append(text[cursor:])
                      break
                  out.append(text[cursor:start])
                  gt = lower.find('>', start)
                  end = lower.find('</script>', gt + 1)
                  if gt < 0 or end < 0:
                      raise SystemExit('SCRIPT BOUNDARY INVALID')
                  script = text[start:end + len('</script>')]
                  script_lower = script.lower()
                  if 'data-maxess-result-consumer=' in script_lower or '__maxess_result_consumer_v2__' in script_lower or '__maxess_result_consumer_v3__' in script_lower or '__maxess_result_consumer_v4__' in script_lower:
                      pass
                  else:
                      out.append(script)
                  cursor = end + len('</script>')
              return ''.join(out)

          # Replace only E01-E04 in the complete baseline. E05-E09 stay from the complete baseline.
          dynamic_bodies = {}
          for sid, path in dynamic_files.items():
              source = path.read_text(encoding='utf-8')
              dynamic_bodies[sid] = strip_result_consumers(body_inner(source))
              existing = extract_by_id(base, sid)
              if not existing:
                  raise SystemExit(f'AUTHORITATIVE BASELINE MISSING DYNAMIC SECTION: {sid}')
              base = base.replace(existing, '', 1)

          # Put the current dynamic sections immediately before preserved E05.
          e05_marker = 'id="e05"'
          marker_pos = base.find(e05_marker)
          if marker_pos < 0:
              raise SystemExit('COMPLETE BASELINE MISSING E05')
          insert_pos = base.rfind('<', 0, marker_pos)
          insertion = '\n'.join(dynamic_bodies[sid] for sid in ['e01', 'maxess-e02-v2', 'e03', 'e04']) + '\n'
          base = base[:insert_pos] + insertion + base[insert_pos:]

          # Add the latest dynamic source styles without rebuilding static sections.
          style_blocks = []
          for path in dynamic_files.values():
              style_blocks.extend(extract_blocks(path.read_text(encoding='utf-8'), 'style'))
          head_marker = '</head>'
          head_pos = base.lower().find(head_marker)
          if head_pos < 0:
              raise SystemExit('RESULTS HEAD MISSING')

          bridge = '''<script id="maxess-complete-results-bridge-v4">\n(function(){'use strict';if(window.__MAXESS_COMPLETE_RESULTS_BRIDGE_V4__)return;window.__MAXESS_COMPLETE_RESULTS_BRIDGE_V4__=true;var CONTRACT='MAXESS_RESULT_V1',READY='MAXESS_RESULT_READY',UPDATED='maxess:result-updated';function emit(n,r){try{window.dispatchEvent(new CustomEvent(n,{detail:r}));}catch(e){}}function decode(v){try{var s=decodeURIComponent(String(v||''));s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u);}catch(e){return null;}}function token(){var h=window.location.hash||'',m=h.match(/(?:^#|&)maxess-result=([^&]*)/i);return m&&m[1]?m[1]:null;}function valid(r){if(!r||typeof r!=='object'||r.contractVersion!==CONTRACT)return false;var s=Number(r.overallScore);if(!Number.isFinite(s)||s<0||s>100)return false;if(!Array.isArray(r.dimensions)||r.dimensions.length!==5)return false;if(!Array.isArray(r.responses)||r.responses.length!==15)return false;for(var i=0;i<5;i++){var d=r.dimensions[i];if(!d||typeof d.name!=='string'||!d.name.trim()||!Number.isFinite(Number(d.score)))return false;}return true;}function consume(){var raw=token();if(!raw)return false;var json=decode(raw),r=null;if(!json)return false;try{r=JSON.parse(json);}catch(e){return false;}if(!valid(r))return false;window.MAXESS_RESULT=r;emit(READY,r);emit(UPDATED,r);return true;}function boot(){if(consume())return;var n=0;(function retry(){if(consume())return;if(++n<20)window.setTimeout(retry,250);})();}window.MAXESS_RESULT_CONSUMER_V4={consume:consume,get:function(){return window.MAXESS_RESULT||null;},contractVersion:CONTRACT,version:'V4'};window.addEventListener('hashchange',boot);window.addEventListener('pageshow',boot);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();})();\n</script>'''

          base = base[:head_pos] + '\n' + '\n'.join(style_blocks) + '\n' + bridge + '\n' + base[head_pos:]

          required_ids = ['e01', 'maxess-e02-v2', 'e03', 'e04', 'e05', 'e06', 'e07', 'e08', 'e09']
          for sid in required_ids:
              count = base.count('id="' + sid + '"') + base.count("id='" + sid + "'")
              if count != 1:
                  raise SystemExit(f'INTEGRATED QA FAILED: {sid} count={count}')
          if base.count('maxess-complete-results-bridge-v4') != 1:
              raise SystemExit('INTEGRATED QA FAILED: bridge count')
          if '__MAXESS_RESULT_CONSUMER_V2__' in base or '__MAXESS_RESULT_CONSUMER_V3__' in base or 'data-maxess-result-consumer=' in base:
              raise SystemExit('INTEGRATED QA FAILED: legacy result consumer remains')
          body_pos = base.lower().find('<body')
          if '<!doctype html>' in base.lower()[body_pos:]:
              raise SystemExit('INTEGRATED QA FAILED: nested document shell')
          if base.lower().count('<html') != 1 or base.lower().count('</html>') != 1:
              raise SystemExit('INTEGRATED QA FAILED: document shell count')
          if 'MAXESS_RESULT_V1' not in base or 'window.MAXESS_RESULT' not in base:
              raise SystemExit('INTEGRATED QA FAILED: result authority missing')
          if '<<<<<<<' in base or '>>>>>>>' in base:
              raise SystemExit('INTEGRATED QA FAILED: conflict marker')

          out = Path('MAXESS-RESULTS-INTEGRATED-V1.html')
          out.write_text(base, encoding='utf-8')
          digest = hashlib.sha256(base.encode('utf-8')).hexdigest()
          Path('MAXESS-COMPLETE-INTEGRATED-BUILD.md').write_text('\n'.join([
              '# MAXESS Complete Results Build', '',
              '- Authoritative baseline: `maxess-results-v21-working/BASELINE-WORKING.html`',
              '- Dynamic overrides: E01, E02, E03, E04 only',
              '- Static preserved: E05, E06, E07, E08, E09',
              '- Runtime authority: `window.MAXESS_RESULT`',
              '- Result contract: `MAXESS_RESULT_V1`',
              '- Single global bridge: V4',
              f'- SHA-256: `{digest}`',
              f'- Bytes: {len(base.encode("utf-8"))}',
              f'- Lines: {len(base.splitlines())}',
              '- Structural QA: PASS', '',
          ]), encoding='utf-8')
          print('COMPLETE RESULTS BUILD PASS')
          print('SHA-256:', digest)
          print('BYTES:', len(base.encode('utf-8')))
          print('LINES:', len(base.splitlines()))

      - name: Validate final handoff source and complete artifact
        shell: python
        run: |
          from pathlib import Path
          assessment = Path('AISCORE.NAYANET.APP 2026 08 21 447').read_text(encoding='utf-8')
          results = Path('MAXESS-RESULTS-INTEGRATED-V1.html').read_text(encoding='utf-8')
          for marker in ['finalizing:false', 'function continueAssessment(event)', 'window.MAXESS_Q15_HANDOFF_V447=true;', "location.assign('https://results.nayanet.app/#maxess-result='+payload)"]:
              if marker not in assessment:
                  raise SystemExit('ASSESSMENT QA FAILED: ' + marker)
          for sid in ['e01', 'maxess-e02-v2', 'e03', 'e04', 'e05', 'e06', 'e07', 'e08', 'e09']:
              count = results.count('id="' + sid + '"') + results.count("id='" + sid + "'")
              if count != 1:
                  raise SystemExit('RESULTS QA FAILED: ' + sid)
          print('MAXESS assessment + complete Results static QA PASS')

      - name: Commit generated repair
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add 'AISCORE.NAYANET.APP 2026 08 21 447' 'MAXESS-RESULTS-INTEGRATED-V1.html' 'MAXESS-COMPLETE-INTEGRATED-BUILD.md' '.github/workflows/rebuild-integrated-results.yml'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'MAXESS: repair Q15 handoff and restore complete E01-E09 Results artifact'
          git push origin main

# PRIME GUARDRAIL:
# Q15 -> MAXESS_RESULT_V1 -> results.nayanet.app is the handoff.
# E01-E04 are the only dynamic result sections.
# E05-E09 are static/preserved sections and must remain present.
# Never rebuild the Results page from a partial fragment set.
# Never ship raw workflow/source text as the user-facing Groove artifact.
# Never use window.top navigation as the primary Q15 handoff mechanism.
