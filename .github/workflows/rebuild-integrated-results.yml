name: MAXESS 447 — Surgical Q15 Results Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-integrated-results.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-447:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 447 source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply only the Q15 handoff repair to 447
        shell: python
        run: |
          from pathlib import Path
          p = Path('AISCORE.NAYANET.APP 2026 08 21 447')
          text = p.read_text(encoding='utf-8')

          old_state = "const sessionSeed=crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295);const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false};"
          new_state = "const sessionSeed=crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295);const state={firstVisit:true,nayaText:'',index:0,selected:null,responses:[],nayaPlaying:false,completed:false,finalizing:false};"
          if old_state not in text and 'finalizing:false' not in text:
              raise SystemExit('447 REPAIR FAILED: state anchor not found')
          if old_state in text:
              text = text.replace(old_state, new_state, 1)

          old_fn = "function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.completed=true;try{publish()}catch(e){console.error('MAXESS report publish failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          new_fn = "function continueAssessment(event){if(event){event.preventDefault();event.stopPropagation()}if(state.finalizing||!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.finalizing=true;state.completed=true;const button=$('continueButton');button.disabled=true;button.setAttribute('aria-disabled','true');$('continueText').textContent='Loading Results…';try{const c=buildContract();if(!validateContract(c))throw new Error('MAXESS_RESULT_V1 validation failed before final navigation.');broadcastResult(c);const payload=encode(c);const resultUrl='https://results.nayanet.app/#maxess-result='+payload;if(window.top&&window.top!==window){window.top.location.href=resultUrl}else{window.location.href=resultUrl}}catch(e){state.finalizing=false;button.disabled=false;button.setAttribute('aria-disabled','false');$('continueText').textContent='Continue';console.error('MAXESS final Results handoff failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          if old_fn not in text:
              if 'function continueAssessment(event)' not in text:
                  raise SystemExit('447 REPAIR FAILED: continue function anchor not found')
          else:
              text = text.replace(old_fn, new_fn, 1)

          marker = "window.MAXESS_RESULT_BRIDGE_V2=true;"
          if marker in text and 'MAXESS_Q15_HANDOFF_V447' not in text:
              text = text.replace(marker, marker+"window.MAXESS_Q15_HANDOFF_V447=true;", 1)

          p.write_text(text, encoding='utf-8')
          print('447 surgical Q15 handoff repair applied')

      - name: Verify only the intended 447 changes exist
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('AISCORE.NAYANET.APP 2026 08 21 447').read_text(encoding='utf-8')
          required = [
              'finalizing:false',
              'function continueAssessment(event)',
              "event.preventDefault()",
              "event.stopPropagation()",
              "state.finalizing||!state.selected",
              "const c=buildContract()",
              "validateContract(c)",
              "const payload=encode(c)",
              "https://results.nayanet.app/#maxess-result=",
              "window.top.location.href=resultUrl",
              'MAXESS_Q15_HANDOFF_V447=true'
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('447 STATIC QA FAILED: '+', '.join(missing))
          if text.count('function continueAssessment(event)') != 1: raise SystemExit('447 STATIC QA FAILED: duplicate final handler')
          if text.count('window.MAXESS_Q15_HANDOFF_V447=true;') != 1: raise SystemExit('447 STATIC QA FAILED: release marker')
          if 'MAXESS_Q15_HANDOFF_V448' in text: raise SystemExit('447 STATIC QA FAILED: forbidden 448 marker')
          if '<!doctype html>' not in text.lower() or '</html>' not in text.lower(): raise SystemExit('447 STATIC QA FAILED: HTML shell')
          print('447 surgical handoff QA PASS')

      - name: Commit only 447
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add 'AISCORE.NAYANET.APP 2026 08 21 447'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'MAXESS 447: repair one-click Q15 Results handoff'
          git push origin main

# Guardrail: this workflow edits ONLY the existing 447 assessment artifact.
# It does NOT rebuild, compose, redesign, replace, or regenerate the Results page.
# E01-E04/E05-E09 Results artifacts are outside this repair scope.
# 447 remains the assessment source; results.nayanet.app remains the existing Results destination.
