name: V7 Cloudflare Intelligent Hub Release

on:
  push:
    branches: [main]
    paths:
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/**'
      - '.github/workflows/v7-cloudflare-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-cloudflare-intelligent-hub-production
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLOUDFLARE-INTELLIGENT-HUB-V7
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Validate V7 source and runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s v7-smart-note-runtime.js
          test -s v7-release-enhancements.js
          test -s worker.js
          test -s wrangler.jsonc
          grep -Fq 'v7-smart-note-runtime.js' index.html
          grep -Fq 'v7-release-enhancements.js' index.html
          grep -Fq 'NayaNET — Intelligent Hub V7' index.html
          grep -Fq 'Good morning, Shawn.' index.html
          grep -Fq 'page-evidence' index.html
          grep -Fq 'page-settings' index.html
          grep -Fq '"main": "worker.js"' wrangler.jsonc
          grep -Fq '"directory": "."' wrangler.jsonc
          grep -Fq '"binding": "ASSETS"' wrangler.jsonc
          node --check worker.js
          node --check v7-smart-note-runtime.js
          node --check v7-release-enhancements.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          if s.count('<html') != 1 or s.count('</html>') != 1: raise SystemExit('HTML document boundary invalid')
          if s.count('v7-smart-note-runtime.js') != 1: raise SystemExit('Runtime integration marker count invalid')
          if s.count('v7-release-enhancements.js') != 1: raise SystemExit('Enhancement integration marker count invalid')
          print('V7 source contract: PASS')
          print('index.html bytes:', len(s.encode()))
          PY

      - name: Deploy exact V7 source to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: CLOUDFLARE-INTELLIGENT-HUB-V7
          command: deploy --config wrangler.jsonc

      - name: Record exact runtime identity
        shell: bash
        run: |
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          echo "WORKER=nayanet-v7-intelligent-hub"
