name: NayaNET Hub Surgical Repair
on:
  push:
    branches: [hub-surgical-repair-exec3]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgical Hub repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('NAYANETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='NAYANET_HUB_LOCKED_REPAIR_V1'
          if marker in s:
              print('repair already present')
              raise SystemExit(0)
          js=r'''<style id="nayanet-locked-repair-css">
          .nh-locked-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;color:#bdb8c7;font-size:9px;letter-spacing:.04em}.nh-locked-meta span{padding:7px 10px;border:1px solid #ffffff18;border-radius:999px;background:#09090d}.nh-locked-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.nh-locked-action{min-height:32px;padding:0 10px;border:1px solid #ffffff1b;border-radius:9px;background:#08080c;color:#d9d4df;font-size:7px;font-weight:1000;cursor:pointer}.nh-locked-action:hover{border-color:#d86cff70;transform:translateY(-1px)}.nh-list-panel{margin-top:15px;padding:17px;border:1px solid #ffffff18;border-radius:18px;background:#09090d}.nh-list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #ffffff10}.nh-list-row:last-child{border-bottom:0}.nh-list-row b{font-size:10px}.nh-list-row span{font-size:8px;color:#9e98a5}.nh-list-create{display:flex;gap:8px;margin-top:12px}.nh-list-create input{flex:1;min-height:40px;border:1px solid #ffffff1b;border-radius:10px;background:#07070a;color:#fff;padding:0 11px}.nh-list-create button{min-height:40px;padding:0 12px;border:1px solid #d86cff55;border-radius:10px;background:#120d17;color:#fff;font-size:8px;font-weight:1000}.nh-save-menu{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:100}.nh-save-box{width:min(440px,calc(100vw - 30px));padding:20px;border:1px solid #d86cff55;border-radius:20px;background:#0c0b10;box-shadow:0 30px 80px #000e}.nh-save-box h3{margin:0 0 12px;font-size:18px}.nh-save-box button{display:block;width:100%;margin:7px 0;min-height:40px;border:1px solid #ffffff18;border-radius:10px;background:#08080c;color:#fff;text-align:left;padding:0 12px;font-size:9px}.nh-save-box .new{border-color:#55e39a55}.nh-save-box .cancel{color:#99939f}
          </style>
          <script id="nayanet-locked-repair-js">
          (function(){
            'use strict';
            const KEY='nayanet.smartlists.v1', CKEY='nayanet.collective.v1';
            const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}};
            const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
            const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
            const part=()=>{const h=new Date().getHours();return h<12?'morning':h<18?'afternoon':'evening'};
            function meta(){
              const now=new Date(), tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'Local time';
              const date=new Intl.DateTimeFormat(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(now);
              const time=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'}).format(now);
              const country=(navigator.language||'').split('-')[1]||'Local';
              return {date,time,tz,country};
            }
            function header(){
              document.querySelectorAll('.nav button').forEach(b=>{if((b.textContent||'').trim().toLowerCase()==='smart notes'){b.dataset.nhSmartNotes='1'}});
              const sns=[...document.querySelectorAll('.nav button')].filter(b=>(b.textContent||'').trim().toLowerCase()==='smart notes');
              sns.slice(1).forEach(b=>b.remove());
              const m=meta();
              document.querySelectorAll('.heroIntro p,.heroCopy p').forEach(el=>{if(/Good morning|Good afternoon|Good evening|intelligence place is coming together/i.test(el.textContent||'')){el.textContent=`Good ${part()}, Shawn. Your intelligence place is coming together.`; if(!el.nextElementSibling?.classList.contains('nh-locked-meta')){el.insertAdjacentHTML('afterend',`<div class="nh-locked-meta"><span>🕒 ${esc(m.time)}</span><span>📅 ${esc(m.date)}</span><span>🌎 ${esc(m.country)} · ${esc(m.tz)}</span></div>`)}}});
              const top=document.querySelector('.topbar');
              if(top&&!top.querySelector('.nh-live-meta')){const d=document.createElement('div');d.className='nh-live-meta';d.style.cssText='font-size:8px;color:#aaa4b2;margin-left:12px;white-space:nowrap';d.textContent=`${m.time} · ${m.date} · ${m.country}`;const c=top.querySelector('.crumb');if(c)c.appendChild(d)}
            }
            function noteData(n){const title=n.querySelector('h3')?.textContent?.trim()||'Intelligent block';const body=n.querySelector('.noteBody')?.innerText?.trim()||n.innerText.trim();return {id:n.dataset.nhId||crypto.randomUUID(),title,body,created:new Date().toISOString()};}
            function lists(){return read(KEY,[])}
            function saveList(v){write(KEY,v)}
            function openSave(item){
              const box=document.createElement('div');box.className='nh-save-menu';const inner=document.createElement('div');inner.className='nh-save-box';inner.innerHTML='<h3>Save to Smart List</h3>';
              const ls=lists(); if(!ls.length)inner.insertAdjacentHTML('beforeend','<p style="font-size:9px;color:#aaa4b2">Create your first private Smart List.</p>');
              ls.forEach(l=>{const b=document.createElement('button');b.textContent=`${l.name} · ${l.items.length} items`;b.onclick=()=>{l.items=l.items||[];if(!l.items.some(x=>x.id===item.id))l.items.push(item);saveList(ls);box.remove();renderLists()};inner.appendChild(b)});
              const form=document.createElement('div');form.className='nh-list-create';form.innerHTML='<input placeholder="New list name"><button class="new">Create & Save</button>';form.querySelector('button').onclick=()=>{const name=form.querySelector('input').value.trim();if(!name)return;ls.push({id:crypto.randomUUID(),name,items:[item]});saveList(ls);box.remove();renderLists()};inner.appendChild(form);
              const cancel=document.createElement('button');cancel.className='cancel';cancel.textContent='Cancel';cancel.onclick=()=>box.remove();inner.appendChild(cancel);box.appendChild(inner);document.body.appendChild(box);
            }
            function share(item){const text=`${item.title}\n\n${item.body}`;if(navigator.share)navigator.share({title:item.title,text});else navigator.clipboard?.writeText(text).then(()=>alert('Intelligence copied to clipboard.'))}
            function circulate(item){const c=read(CKEY,[]);if(!c.some(x=>x.id===item.id)){c.push({...item,source:'Personal',circulated:new Date().toISOString()});write(CKEY,c)}alert('Circulated to Collective.');}
            function enhanceNotes(){
              document.querySelectorAll('.note').forEach(n=>{
                if(n.dataset.nhEnhanced)return;n.dataset.nhEnhanced='1';const item=noteData(n);const actions=document.createElement('div');actions.className='nh-locked-actions';
                const b=(label,fn)=>{const x=document.createElement('button');x.className='nh-locked-action';x.textContent=label;x.onclick=e=>{e.stopPropagation();fn()};actions.appendChild(x)};
                b('🔖 Save',()=>openSave(item));b('↗ Share',()=>share(item));
                const page=n.closest('.page');const label=(page?.innerText||'').toLowerCase();
                if(/collective/.test(label)){b('♥ Like',()=>{n.dataset.liked=n.dataset.liked==='1'?'0':'1';b.textContent=n.dataset.liked==='1'?'♥ Liked':'♥ Like'});b('💬 Comment',()=>{const c=prompt('Comment');if(c){const comments=read('nayanet.comments.v1',{});comments[item.id]=[...(comments[item.id]||[]),c];write('nayanet.comments.v1',comments)}})}
                else if(/personal/.test(label))b('⇄ Collective',()=>circulate(item));
                n.appendChild(actions);
              });
            }
            function renderLists(){
              const pages=[...document.querySelectorAll('.page')].filter(p=>/smart lists/i.test(p.innerText||''));if(!pages.length)return;const p=pages[0];let panel=p.querySelector('.nh-list-panel');if(!panel){panel=document.createElement('div');panel.className='nh-list-panel';p.appendChild(panel)}
              const ls=lists();panel.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:12px">Your Smart Lists</b><span style="font-size:8px;color:#99939f">Private organization · never publication</span></div>';
              ls.forEach(l=>{const row=document.createElement('div');row.className='nh-list-row';row.innerHTML=`<div><b>${esc(l.name)}</b><span> · ${l.items?.length||0} intelligent blocks</span></div><button class="nh-locked-action">Open</button>`;row.querySelector('button').onclick=()=>alert((l.items||[]).map(x=>x.title).join('\n')||'This list is empty.');panel.appendChild(row)});
              const form=document.createElement('div');form.className='nh-list-create';form.innerHTML='<input placeholder="Create a Smart List"><button>Create List</button>';form.querySelector('button').onclick=()=>{const name=form.querySelector('input').value.trim();if(!name)return;ls.push({id:crypto.randomUUID(),name,items:[]});saveList(ls);renderLists()};panel.appendChild(form);
            }
            function removeToday(){document.querySelectorAll('[id*="intelligence-today"],.nh-v11-today').forEach(x=>x.remove());document.querySelectorAll('.nav button').forEach(b=>{if(/Your Intelligence Today|Daily Intelligence Briefing/i.test(b.textContent||''))b.remove()})}
            function boot(){removeToday();header();enhanceNotes();renderLists();setInterval(()=>{header()},1000);}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
          })();
          </script>'''
          s=s.replace('</body>',js+'</body>') if '</body>' in s else s+js
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired Hub
        run: |
          git config user.name "NayaNET Repair"
          git config user.email "nayanet-repair@users.noreply.github.com"
          git add NAYANETHUB.html
          git commit -m "fix: complete Intelligent Hub personal collective and smart list flows" || exit 0
          git push
