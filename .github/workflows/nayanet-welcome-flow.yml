name: NayaNET Welcome Flow

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  wire-welcome-to-hub:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Wire welcome identity into Hub
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge = Path('NAYANET Login bridge page')
          hub = Path('NAYAHUB.html')

          bridge_text = bridge.read_text(encoding='utf-8')
          old = "window.location.href = 'https://academy.nayanet.app/';"
          new = "window.location.href = 'NAYAHUB.html?name=' + encodeURIComponent(rawName);"
          if old in bridge_text:
              bridge_text = bridge_text.replace(old, new, 1)
          elif new not in bridge_text:
              raise SystemExit('Expected academy redirect was not found in bridge page.')
          bridge.write_text(bridge_text, encoding='utf-8')

          hub_text = hub.read_text(encoding='utf-8')
          marker = 'NAYANET-WELCOME-IDENTITY-FLOW-V1'
          if marker not in hub_text:
              injection = r'''<style id="nayanet-welcome-identity-style">
          .nh-welcome-flow{margin:0 0 27px;padding:0}
          .nh-welcome-eyebrow{font-size:9px;font-weight:1000;letter-spacing:.22em;color:#bdb8c7;margin-bottom:12px}
          .nh-welcome-flow h1{font-size:clamp(42px,5.6vw,74px);line-height:.92;letter-spacing:-.065em;margin:0}
          .nh-welcome-flow p{margin:14px 0 0;color:#ddd9e4;font-size:13px;line-height:1.5}
          .nh-welcome-chip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;margin:10px 7px 0 0;border:1px solid #d86cff35;border-radius:999px;background:#0b0a10;color:#cfc9d8;font-size:8px;font-weight:950;letter-spacing:.08em;box-shadow:inset 0 1px #fff2,0 8px 20px #0007}
          @media(max-width:700px){.nh-welcome-flow h1{font-size:clamp(38px,11vw,58px)}.nh-welcome-flow p{font-size:12px}}
          </style>
          <script id="nayanet-welcome-identity-runtime">
          (function(){
            'use strict';
            const MARKER='NAYANET-WELCOME-IDENTITY-FLOW-V1';
            if(window.__NAYANET_WELCOME_FLOW__) return;
            window.__NAYANET_WELCOME_FLOW__=true;
            const params=new URLSearchParams(window.location.search);
            const incoming=(params.get('name')||'').trim();
            const stored=(localStorage.getItem('nayanet_smart_name')||localStorage.getItem('nayanet_user_name')||'').trim();
            const name=incoming||stored||'there';
            if(incoming) localStorage.setItem('nayanet_smart_name',incoming);
            const now=new Date();
            const hour=now.getHours();
            const greeting=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
            const locale=navigator.language||'en-CA';
            const timeZone=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
            const region=(locale.match(/[-_]([A-Z]{2})$/)||[])[1]||'';
            const tzCountry={
              'America/Vancouver':'Canada','America/Edmonton':'Canada','America/Winnipeg':'Canada','America/Toronto':'Canada','America/Halifax':'Canada','America/St_Johns':'Canada',
              'America/Los_Angeles':'United States','America/Denver':'United States','America/Chicago':'United States','America/New_York':'United States',
              'Europe/London':'United Kingdom','Europe/Dublin':'Ireland','Europe/Paris':'France','Europe/Berlin':'Germany','Europe/Madrid':'Spain','Europe/Rome':'Italy',
              'Asia/Tokyo':'Japan','Asia/Seoul':'South Korea','Asia/Singapore':'Singapore','Australia/Sydney':'Australia','Pacific/Auckland':'New Zealand'
            };
            const regionCountry={CA:'Canada',US:'United States',GB:'United Kingdom',IE:'Ireland',FR:'France',DE:'Germany',ES:'Spain',IT:'Italy',JP:'Japan',KR:'South Korea',SG:'Singapore',AU:'Australia',NZ:'New Zealand'};
            const country=regionCountry[region]||tzCountry[timeZone]||'Canada';
            const time=new Intl.DateTimeFormat(locale,{hour:'numeric',minute:'2-digit',timeZone}).format(now);
            const date=new Intl.DateTimeFormat(locale,{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone}).format(now);
            const hero=document.querySelector('#page-home .heroIntro')||document.querySelector('.heroIntro');
            if(!hero) return;
            hero.innerHTML='<div class="nh-welcome-flow" data-marker="'+MARKER+'"><div class="nh-welcome-eyebrow">YOUR INTELLIGENCE TODAY</div><h1>'+greeting+', '+name.replace(/[<>]/g,'')+'.</h1><p>Welcome back. Naya is ready to connect with you.</p><div><span class="nh-welcome-chip">LOCAL TIME · '+time+'</span><span class="nh-welcome-chip">'+date+'</span><span class="nh-welcome-chip">'+country+'</span><span class="nh-welcome-chip">PRIVATE BY DEFAULT</span></div></div>';
          })();
          </script>'''
              hub_text = hub_text.replace('</head>', injection + '\n</head>', 1)
          hub.write_text(hub_text, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "NAYANET Login bridge page" NAYAHUB.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Connect NayaNET welcome identity to Intelligent Hub"
          git push origin "${BRANCH}"
