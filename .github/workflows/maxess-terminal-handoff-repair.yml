name: MAXESS terminal handoff repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'MAXESS terminal handoff repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove terminal external navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('E00 118')
          s=p.read_text()
          old='attemptResultsHandoff(result);'
          new="window.MAXESS_RESULT_HANDOFF_URL = null; // Same-page Results release is authoritative."
          if old not in s:
              raise SystemExit('TARGET_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          print('PATCHED')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add 'E00 118'
          git commit -m 'MAXESS terminal handoff repair'
          git push
      # Repair is intentionally executed by Actions so the full source is preserved byte-for-byte except for the terminal handoff.
