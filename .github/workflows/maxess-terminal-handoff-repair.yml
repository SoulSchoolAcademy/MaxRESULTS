name: MAXESS terminal handoff repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair terminal handoff safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('E00 118')
          s=p.read_text()
          bad='window.MAXESS_RESULT_HANDOFF_URL = null; // Same-page Results release is authoritative.return true;'
          good='window.MAXESS_RESULT_HANDOFF_URL = null; return true;'
          if bad in s:
              s=s.replace(bad,good,1)
              p.write_text(s)
              print('REPAIRED_BAD_COMMENT_LINE')
              raise SystemExit(0)
