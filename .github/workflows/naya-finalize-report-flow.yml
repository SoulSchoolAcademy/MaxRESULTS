name: Naya Finalize Report Flow

on:
  push:
    paths:
      - '.github/workflows/naya-finalize-report-flow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply surgical repairs
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) Assessment: after Q15, publish the real MAXESS_RESULT_V1 directly.
          p = Path('IASCORE.NAYANET.APP')
          s = read(p)
          old = "function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){showInterestSelection();return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          new = "function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){state.completed=true;try{publish()}catch(e){console.error('MAXESS report publish failed',e)}return}state.index++;renderQuestion();setTimeout(openNaya,140)}"
          if s.count(old) != 1:
              raise SystemExit(f'IASCORE continueAssessment guard failed: {s.count(old)}')
          s = s.replace(old, new, 1)

          # Remove the interest page from the production assessment DOM.
          interest_html = re.compile(r'<section id="interestStage".*?</section>', re.S)
          s, n = interest_html.subn('', s, count=1)
          if n != 1:
              raise SystemExit(f'IASCORE interest HTML removal guard failed: {n}')

          # Remove the unused completion interstitial; report navigation is now immediate.
          complete_html = re.compile(r'<div id="completeStage".*?</div>\s*</div>\s*</section>', re.S)
          # The exact nested structure is safer to remove by the known opening/closing block.
          marker = '<div id="completeStage" class="complete hidden"'
          if marker in s:
              start = s.index(marker)
              end = s.index('</div>\n</div></section>', start) + len('</div>\n</div></section>')
              block = s[start:end]
              s = s[:start] + '</div></section>' + s[end:]

          # Remove now-dead interest handlers and stage helpers without touching scoring/publish logic.
          replacements = [
              ("function showInterestSelection(){$('assessmentStage').classList.add('hidden');$('interestStage').classList.remove('hidden');renderInterests();$('interestContinue').focus()}\n", ''),
              ("function renderInterests(){const grid=$('interestGrid');grid.innerHTML='';INTERESTS.forEach(([id,name])=>{const b=document.createElement('button');b.type='button';b.className='interest-card';b.classList.toggle('selected',state.interests.has(id));b.setAttribute('aria-pressed',String(state.interests.has(id)));b.innerHTML=`<strong>${escapeHtml(name)}</strong><span>${state.interests.has(id)?'Selected':'Tap to select'}</span>`;b.addEventListener('click',()=>{if(state.interests.has(id))state.interests.delete(id);else state.interests.add(id);renderInterests()});grid.appendChild(b)})}\n", ''),
              ("function finishInterests(){finishAssessment()}\n", ''),
              ("function finishAssessment(){$('assessmentStage').classList.add('hidden');$('completeStage').classList.remove('hidden');state.completed=true;$('continueToResults').focus()}\n", ''),
              ("$('interestContinue').addEventListener('click',finishInterests);$('interestSkip').addEventListener('click',finishInterests);", ''),
              ("$('continueToResults').addEventListener('click',()=>{try{publish()}catch(e){console.error(e)}});", ''),
          ]
          for old2, new2 in replacements:
              if old2 in s:
                  s = s.replace(old2, new2, 1)

          write(p, s)

          # 2) E01: remove the visual-review demo score. No valid result means no invented score.
          p = Path('E01-SECTION-01-WORKING.html')
          s = read(p)
          old = "if(s===null){scoreNode.textContent=formatScore(DEMO_SCORE);scoreNode.dataset.hydrated='true';scoreNode.dataset.demo='true';applyPalette(DEMO_SCORE);scoreDescription.textContent='Preview score '+formatScore(DEMO_SCORE)+' of 100. A live MAXESS result will replace this demo value automatically.';liveNode.textContent='Preview score '+formatScore(DEMO_SCORE)+' of 100. A live MAXESS result will replace this demo value automatically.';unavailableNode.dataset.visible='false';return}"
          new = "if(s===null){scoreNode.textContent='—';scoreNode.dataset.hydrated='true';scoreNode.dataset.demo='false';scoreDescription.textContent='Your AI score is unavailable until a valid MAXESS result is received.';liveNode.textContent='Your AI score is unavailable until a valid MAXESS result is received.';unavailableNode.dataset.visible='true';return}"
          if s.count(old) != 1:
              raise SystemExit(f'E01 demo fallback guard failed: {s.count(old)}')
          s = s.replace(old, new, 1)
          write(p, s)

          # 3) E04: consume the authoritative dimensions array correctly.
          p = Path('E04')
          s = read(p)
          old = "function readDirectionScore(result){\n  if(!result)return null;\n  var candidate=result.directionScore;\n  if(candidate===undefined&&result.dimensions){\n    var d=result.dimensions.direction||result.dimensions.DIRECTION;\n    if(typeof d==='number')candidate=d;\n    else if(d&&typeof d.score==='number')candidate=d.score;\n  }\n  return candidate!==undefined&&isFinite(Number(candidate))?Number(candidate):null;\n}"
          new = "function readDirectionScore(result){\n  if(!result)return null;\n  var candidate=result.directionScore;\n  function findDimension(list){\n    if(!Array.isArray(list))return undefined;\n    var d=list.find(function(item){\n      if(!item||typeof item!=='object')return false;\n      var id=String(item.id||'').toLowerCase().replace(/[^a-z0-9]/g,'');\n      var name=String(item.name||'').toLowerCase().replace(/[^a-z0-9]/g,'');\n      return id==='direction'||name==='direction';\n    });\n    return d&&d.score!==undefined?d.score:undefined;\n  }\n  if(candidate===undefined)candidate=findDimension(result.dimensions);\n  if(candidate===undefined)candidate=findDimension(result.fiveDimensions);\n  if(candidate===undefined&&result.dimensions&&typeof result.dimensions==='object'&&!Array.isArray(result.dimensions)){\n    var d=result.dimensions.direction||result.dimensions.DIRECTION;\n    if(typeof d==='number')candidate=d;\n    else if(d&&typeof d.score==='number')candidate=d.score;\n  }\n  return candidate!==undefined&&isFinite(Number(candidate))?Number(candidate):null;\n}"
          if s.count(old) != 1:
              raise SystemExit(f'E04 direction reader guard failed: {s.count(old)}')
          s = s.replace(old, new, 1)
          write(p, s)

          # 4) Static assertions: authoritative result contract and no live interest route.
          a = read('IASCORE.NAYANET.APP')
          assert "if(state.index===14){state.completed=true;try{publish()}" in a
          assert 'id="interestStage"' not in a
          assert "interestContinue.addEventListener" not in a
          assert 'function publish()' in a and "contractVersion:'MAXESS_RESULT_V1'" in a

          e1 = read('E01-SECTION-01-WORKING.html')
          assert "Preview score 82" not in e1
          assert "dataset.demo='false'" in e1

          e2 = read('E02')
          assert 'window.MAXESS_RESULT' in e2 and 'score === null' in e2
          assert 'data-score="91"' in e2  # baseline markup may remain, but runtime must overwrite it or blank it.

          e3 = read('E03')
          assert 'No demo/fallback result is permitted.' in e3

          e4 = read('E04')
          assert "Array.isArray(list)" in e4

          # Commit only the intended production artifacts and delete this one-shot workflow.
          subprocess.run(['git','config','user.name','naya-execution'], check=True)
          subprocess.run(['git','config','user.email','naya-execution@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','IASCORE.NAYANET.APP','E01-SECTION-01-WORKING.html','E04'], check=True)
          subprocess.run(['git','rm','-f','.github/workflows/naya-finalize-report-flow.yml'], check=True)
          result = subprocess.run(['git','status','--short'], check=True, capture_output=True, text=True)
          print(result.stdout)
          subprocess.run(['git','commit','-m','MAXESS: bypass interest step and hydrate real report data'], check=True)
          subprocess.run(['git','push','origin','HEAD:main'], check=True)
