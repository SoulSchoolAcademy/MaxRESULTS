name: V7 Smart Note Safe Integration
on:
  push:
    paths:
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/.v7-smart-note-runtime-trigger'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and append runtime integration
        shell: python
        run: |
          from pathlib import Path
          p=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html')
          runtime=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/v7-smart-note-runtime.js').read_text(encoding='utf-8')
          source=p.read_text(encoding='utf-8')
          if 'V7 SMART NOTE RUNTIME — source-preserving integration layer.' in source:
              raise SystemExit('runtime already integrated')
          if not source.rstrip().endswith('</body></html>'):
              raise SystemExit('SOURCE_INTEGRITY_FAILED: unexpected index ending')
          marker='<!-- V7 SMART NOTE RUNTIME V1 -->'
          injected='\n'+marker+'\n<script>\n'+runtime.replace('</script>','<\\/script>')+'\n</script>\n'
          source=source.replace('</body></html>',injected+'</body></html>',1)
          p.write_text(source,encoding='utf-8')
          print('APPENDED_BYTES',len(injected.encode('utf-8')))
      - name: Verify source remains a full V7 document
        shell: bash
        run: |
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -q '<!doctype html>' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -q 'NayaNET — Intelligent Hub V7' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -q 'V7 SMART NOTE RUNTIME V1' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -q 'Human → Naya → Machine → Intelligent Feed → Intelligent Block → Hub → Evidence' CLOUDFLARE-INTELLIGENT-HUB-V7/v7-smart-note-runtime.js
      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          git commit -m 'V7 integrate authenticated Smart Note runtime'
          git push
