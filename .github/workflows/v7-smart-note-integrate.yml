name: V7 Smart Note Integration
on:
  push:
    paths:
      - 'CLOUDFLARE-INTELLIGENT-HUB-V7/.v7-smart-note-runtime-trigger'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append runtime without reconstructing V7
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html')
          runtime=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/v7-smart-note-runtime.js')
          s=p.read_text(encoding='utf-8')
          r=runtime.read_text(encoding='utf-8')
          if '__V7_SMART_NOTE_RUNTIME__' in s:
              raise SystemExit('runtime marker already present')
          if len(s) < 100000:
              raise SystemExit(f'source unexpectedly small: {len(s)} bytes')
          if '</body>' not in s or '</html>' not in s:
              raise SystemExit('complete HTML closing structure missing')
          injected='\n<script data-v7-runtime="smart-note">\n'+r+'\n</script>\n'
          s=s.replace('</body>', injected+'</body>', 1)
          p.write_text(s, encoding='utf-8')
          verify=p.read_text(encoding='utf-8')
          if '<!doctype html>' not in verify or '<title>NayaNET — Intelligent Hub V7</title>' not in verify:
              raise SystemExit('original V7 markers missing after integration')
          if '__V7_SMART_NOTE_RUNTIME__' not in verify:
              raise SystemExit('runtime marker missing after integration')
          if len(verify) <= len(s)-1 or len(verify) < 100000:
              raise SystemExit('integrated source size verification failed')
          print(f'INTEGRATED_BYTES={len(verify)}')
          print(f'RUNTIME_BYTES={len(r)}')
          PY
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NayaNET V7 Integrator'
          git config user.email 'noreply@nayanet.xyz'
          git add CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          git commit -m 'feat(v7): attach Smart Note runtime to existing Hub' || exit 0
          git push
