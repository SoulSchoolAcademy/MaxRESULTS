name: AIScore CLEAN V1 deterministic repair
on:
  push:
    branches: [feat/aiscore-clean-v1]
    paths: [AIScoreMAXESS-CLEAN-V1.html, .github/workflows/aiscore-clean-v1-repair.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aiscore-clean-v1
          fetch-depth: 0
      - name: Apply deterministic AIScore repair
        shell: python
        run: |
          from pathlib import Path
          p=Path('AIScoreMAXESS-CLEAN-V1.html')
          s=p.read_text(encoding='utf-8')
          if 'MAXESS_CLEAN_V1_REPAIR_APPLIED' in s:
              raise SystemExit('repair already applied')
          css='''.interest-stage{max-width:1000px;margin:auto;text-align:center}.interest-stage h2{margin:0;font-size:clamp(31px,5vw,50px);letter-spacing:-.045em;line-height:1.03}.interest-stage p{max-width:650px;margin:14px auto 0;color:var(--muted);font-size:16px;line-height:1.55}.interest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}.interest-card{min-height:82px;padding:16px;text-align:left;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:linear-gradient(145deg,#12121a,#08080c);color:#fff;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .2s var(--ease),border-color .2s ease,box-shadow .2s ease}.interest-card:hover,.interest-card.selected{transform:translateY(-2px);border-color:#a981ff;box-shadow:0 14px 32px rgba(0,0,0,.48),0 0 28px rgba(149,104,255,.15)}.interest-card strong{display:block;font-size:14px;font-weight:900}.interest-card span{display:block;margin-top:6px;color:#a9a4b2;font-size:11px;font-weight:650}.interest-actions{display:flex;justify-content:center;gap:11px;margin-top:24px;flex-wrap:wrap}.interest-actions button{min-height:53px;padding:0 24px;border-radius:17px;border:1px solid rgba(195,168,255,.75);background:#09090d;color:#fff;font-weight:950;cursor:pointer;box-shadow:0 12px 28px rgba(0,0,0,.45),0 0 25px rgba(149,104,255,.12)}.interest-actions button.secondary{border-color:rgba(255,255,255,.14);color:#aaa6b3}.complete{max-width:760px;'''
          s=s.replace('.complete{max-width:760px;',css)
          s=s.replace('@media(max-width:420px){','@media(max-width:760px){.interest-grid{grid-template-columns:repeat(2,1fr)}.interest-card{min-height:76px;padding:14px}.interest-stage p{font-size:15px}}\n@media(max-width:420px){')
          marker='<div id="completeStage" class="complete hidden"'
          interest='''<section id="interestStage" class="interest-stage hidden" aria-labelledby="interestTitle"><div class="eyebrow">ONE LAST THING</div><h2 id="interestTitle">Where do you want AI to become more useful to you?</h2><p>Choose anything that interests you. There are no wrong answers. Your choices simply help MAXESS personalize what you explore next.</p><div class="interest-grid" id="interestGrid"></div><div class="interest-actions"><button id="interestContinue" type="button">Continue to My Report <span class="arrow">→</span></button><button id="interestSkip" class="secondary" type="button">Skip this step</button></div></section>\n'''
          if 'id="interestStage"' not in s:
              s=s.replace(marker,interest+marker)
          old='function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){finishAssessment();return}state.index++;renderQuestion();setTimeout(openNaya,140)}'
          new='function continueAssessment(){if(!state.selected)return;saveResponse();stopNaya();if(state.index===14){showInterestSelection();return}state.index++;renderQuestion();setTimeout(openNaya,140)}'
          if old not in s: raise SystemExit('continueAssessment pattern missing')
          s=s.replace(old,new)
          insert='''function showInterestSelection(){$('assessmentStage').classList.add('hidden');$('interestStage').classList.remove('hidden');renderInterests();$('interestContinue').focus()}\nfunction renderInterests(){const grid=$('interestGrid');grid.innerHTML='';INTERESTS.forEach(([id,name])=>{const b=document.createElement('button');b.type='button';b.className='interest-card';b.classList.toggle('selected',state.interests.has(id));b.setAttribute('aria-pressed',String(state.interests.has(id)));b.innerHTML=`<strong>${escapeHtml(name)}</strong><span>${state.interests.has(id)?'Selected':'Tap to select'}</span>`;b.addEventListener('click',()=>{if(state.interests.has(id))state.interests.delete(id);else state.interests.add(id);renderInterests()});grid.appendChild(b)})}\nfunction finishInterests(){finishAssessment()}\n'''
          s=s.replace('function finishAssessment()',insert+'function finishAssessment()')
          s=s.replace("$('continueToResults').addEventListener('click',()=>{try{publish()}catch(e){console.error(e)}});", "$('continueToResults').addEventListener('click',()=>{try{publish()}catch(e){console.error(e)}});$('interestContinue').addEventListener('click',finishInterests);$('interestSkip').addEventListener('click',finishInterests);")
          s=s.replace("const state={index:0,selected:null,responses:[],interests:new Set(),nayaPlaying:false,completed:false};", "const sessionSeed=crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295);const state={index:0,selected:null,responses:[],interests:new Set(),nayaPlaying:false,completed:false};")
          shuffle='''function shuffledAnswers(q){let arr=answerRecords(q).slice();let x=(sessionSeed ^ (q.order*2654435761))>>>0;for(let i=arr.length-1;i>0;i--){x=(Math.imul(x^x>>>16,2246822507))>>>0;x=(Math.imul(x^x>>>13,3266489909))>>>0;const j=x%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}\n'''
          s=s.replace('function renderQuestion(){',shuffle+'function renderQuestion(){')
          s=s.replace('answerRecords(q).forEach(a=>{','shuffledAnswers(q).forEach(a=>{')
          s=s.replace('</script>\n</body>','window.MAXESS_CLEAN_V1_REPAIR_APPLIED=true;\n</script>\n</body>')
          p.write_text(s,encoding='utf-8')
          print('repaired',len(s.encode('utf-8')),'bytes',len(s.splitlines()),'lines')
      - name: Static QA
        run: |
          test -f AIScoreMAXESS-CLEAN-V1.html
          ! grep -q 'DEMO_SCORE=82' AIScoreMAXESS-CLEAN-V1.html
          ! grep -q 'results.nayanet.xyz' AIScoreMAXESS-CLEAN-V1.html
          grep -q 'MAXESS_RESULT_V1' AIScoreMAXESS-CLEAN-V1.html
          grep -q 'results.nayanet.app' AIScoreMAXESS-CLEAN-V1.html
          grep -q 'NAYA_AUDIO_REPORTS' AIScoreMAXESS-CLEAN-V1.html
          grep -q 'shuffledAnswers' AIScoreMAXESS-CLEAN-V1.html
          grep -q 'interestStage' AIScoreMAXESS-CLEAN-V1.html
          grep -q 'score<50' AIScoreMAXESS-CLEAN-V1.html
          grep -q 'score<75' AIScoreMAXESS-CLEAN-V1.html
          grep -q 'score<90' AIScoreMAXESS-CLEAN-V1.html
          grep -q 'raw/60' AIScoreMAXESS-CLEAN-V1.html
          grep -q 'rawScore' AIScoreMAXESS-CLEAN-V1.html
          grep -q 'MAXESS_CLEAN_V1_REPAIR_APPLIED' AIScoreMAXESS-CLEAN-V1.html
          git diff --check
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('AIScoreMAXESS-CLEAN-V1.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/aiscore.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('script blocks:',len(scripts),'bytes:',len(s.encode('utf-8')),'lines:',len(s.splitlines()))
          PY
          node --check /tmp/aiscore.js
      - name: Commit repaired artifact
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add AIScoreMAXESS-CLEAN-V1.html
          git diff --cached --check
          git commit -m 'repair: add interest selection and answer rotation to AIScore CLEAN V1'
          git push origin feat/aiscore-clean-v1
