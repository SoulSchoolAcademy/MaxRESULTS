name: Build verified AIScore app bridge
on:
  push:
    paths:
      - '.github/workflows/build-aiscore-app-bridge.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair canonical E00 796 terminal boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('E00 796')
          s=p.read_text(encoding='utf-8')
          original=s
          bad="if(!Array.isArray(S)||Object.keys(S).length!==15)throw Error('Score matrix structure invalid');"
          good="if(!S||typeof S!=='object'||Array.isArray(S)||Object.keys(S).length!==15)throw Error('Score matrix structure invalid');Object.keys(S).forEach(k=>{if(!/^([1-9]|1[0-5])$/.test(k)||!Array.isArray(S[k])||S[k].length!==5)throw Error('Score matrix row invalid');});"
          if bad in s:
              s=s.replace(bad,good,1)
          listener="""document.addEventListener('click',e=>{
  const button=e.target.closest('#maxess-ai-score #continueButton');
  if(!button)return;
  e.preventDefault();
  e.stopPropagation();
  if(button.disabled)return;
  next();
},true);"""
          hardened="""function executeContinue(e){
  const root=$('maxess-ai-score');
  const button=e.target&&e.target.closest?e.target.closest('#continueButton'):null;
  if(!button||!root||!root.contains(button))return;
  if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
  e.preventDefault();
  e.stopPropagation();
  if(e.stopImmediatePropagation)e.stopImmediatePropagation();
  if(button.disabled||state.finalizing||state.mode!=='ASSESSMENT'||!state.selected)return;
  next();
}
document.addEventListener('click',executeContinue,true);
document.addEventListener('pointerup',executeContinue,true);
document.addEventListener('keydown',executeContinue,true);"""
          if listener in s:
              s=s.replace(listener,hardened,1)
          elif 'function executeContinue(e)' not in s:
              raise SystemExit('E00 Continue listener anchor missing')
          old_next="function next(){if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;if(state.i===14){publish();return;}save();state.i++;render();setTimeout(()=>openNaya(),120);}"
          new_next="function next(){if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;try{if(state.i===14){if(!publish())throw Error('Terminal publish failed');return;}save();state.i++;render();setTimeout(()=>openNaya(),120);}catch(e){console.error('MAXESS Continue execution error',e);state.finalizing=false;state.mode='ASSESSMENT';updateContinue();$('continueText').textContent='Continue';}}"
          if old_next in s:
              s=s.replace(old_next,new_next,1)
          old_tail="releaseResultsSections(result);window.MAXESS_RESULT_HANDOFF_URL = null; return true;"
          new_tail="releaseResultsSections(result);const handedOff=attemptResultsHandoff(result);if(!handedOff)console.warn('MAXESS Results handoff unavailable; verified local Results retained.');return true;"
          if old_tail in s:
              s=s.replace(old_tail,new_tail,1)
          elif 'attemptResultsHandoff(result);' not in s:
              raise SystemExit('E00 Results handoff anchor missing')
          if s==original:
              raise SystemExit('No E00 mutation required')
          p.write_text(s,encoding='utf-8')
          PY
          grep -F "function executeContinue(e)" 'E00 796' >/dev/null
          grep -F "attemptResultsHandoff(result);" 'E00 796' >/dev/null
          sed -n '/<script>/,/<\/script>/p' 'E00 796' | sed '1d;$d' > /tmp/e00.js
          node --check /tmp/e00.js
      - name: Commit E00 repair immediately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SoulSchoolAcademy'
          git config user.email '221210320+SoulSchoolAcademy@users.noreply.github.com'
          git add 'E00 796'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair MAXESS E00 Continue and Results handoff'
          git push
      - name: Refresh checkout after E00 repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Build from known-good AIScore baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('AIScoreMAXESS code')
          baseline = subprocess.check_output(['git','show','f0b4bf5b8bdc895c9895e235791f97b5b041b00f:AIScoreMAXESS code'], text=True)
          old = '''function finishInterestSelection(){

  DOM.interestsView.classList.remove(
    "visible"
  );

  renderResults();

}'''
          new = '''function finishInterestSelection(){

  publishMAXESSResultToApp();

}'''
          if old not in baseline:
              raise SystemExit('Known-good finishInterestSelection block not found.')
          bridge = r'''

/* =========================================================
   MAXESS_RESULT_V1 — APP RESULTS BRIDGE
========================================================= */

function publishMAXESSResultToApp(){

  const results = calculateResults();

  if(!results || !Array.isArray(results.dimensions) || results.dimensions.length !== 5){
    console.error('MAXESS: unable to build Results payload.');
    return;
  }

  if(!Array.isArray(state.responses) || state.responses.length !== 15){
    console.error('MAXESS: refusing to publish an incomplete assessment.');
    return;
  }

  state.results = results;
  state.status = "completed";
  state.completedAt = new Date().toISOString();

  const contract = {
    contractVersion: "MAXESS_RESULT_V1",
    assessmentId: MAXESS_ASSESSMENT.id,
    assessmentVersion: MAXESS_ASSESSMENT.version,
    completedAt: state.completedAt,
    overallScore: Math.round(Number(results.overall) * 10) / 10,
    masteryStage: results.band && results.band.label ? results.band.label : "",
    masteryBand: results.band || null,
    fiveDimensions: results.dimensions,
    dimensions: results.dimensions,
    responses: state.responses.slice(),
    selectedInterests: Array.from(state.selectedInterests || []),
    naya: {
      name: "Naya",
      image: "https://i.postimg.cc/bw4fyKF8/Naya-Profile-black-face-zoom.jpg"
    }
  };

  if(!Number.isFinite(contract.overallScore) ||
     contract.overallScore < 0 ||
     contract.overallScore > 100 ||
     contract.responses.length !== 15){
    console.error('MAXESS: invalid Results payload.');
    return;
  }

  const json = JSON.stringify(contract);
  const bytes = new TextEncoder().encode(json);
  let binary = "";
  bytes.forEach(byte => binary += String.fromCharCode(byte));
  const encoded = btoa(binary)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/g, "");

  try{
    sessionStorage.setItem("MAXESS_RESULT_V1", json);
  }catch(e){}

  try{
    localStorage.setItem("MAXESS_RESULT_V1", json);
  }catch(e){}

  window.MAXESS_RESULT = contract;
  window.dispatchEvent(new CustomEvent("MAXESS_RESULT_READY", {detail:contract}));
  window.dispatchEvent(new CustomEvent("maxess:result-updated", {detail:contract}));

  window.location.assign(
    "https://results.nayanet.app/#maxess-result=" + encoded
  );
}

'''
          marker = '\n</script>'
          if marker not in baseline:
              raise SystemExit('AIScore closing script marker not found.')
          built = baseline.replace(old, new, 1)
          built = built.replace(marker, bridge + marker, 1)
          p.write_text(built, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q 'https://results.nayanet.app/#maxess-result=' 'AIScoreMAXESS code'
          grep -q 'contractVersion: "MAXESS_RESULT_V1"' 'AIScoreMAXESS code'
          grep -q 'state.responses.length !== 15' 'AIScoreMAXESS code'
          grep -q 'function finishInterestSelection(){' 'AIScoreMAXESS code'
          if grep -q 'results.nayanet.xyz' 'AIScoreMAXESS code'; then exit 1; fi
          if grep -q 'oldResults.style.display' 'AIScoreMAXESS code'; then exit 1; fi
          node --check <(sed -n '/<script>/,/<\/script>/p' 'AIScoreMAXESS code' | sed '1d;$d')
      - name: Commit bridge
        shell: bash
        run: |
          git config user.name 'SoulSchoolAcademy'
          git config user.email '221320+SoulSchoolAcademy@users.noreply.github.com'
          git add 'AIScoreMAXESS code'
          git commit -m 'Build verified AIScore to Results app bridge' || exit 0
          git push
