name: Force NayaNET Hub Build Once

on:
  push:
    paths:
      - 'scripts/nayanethub-build-trigger-v1.js'

permissions:
  contents: write

jobs:
  bridge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Touch canonical Hub and remove one-time bridge
        shell: bash
        run: |
          set -e
          marker='<!-- NAYANETHUB-BUILD-BRIDGE-2026-09-06 -->'
          if ! grep -q "$marker" NAYANETHUB.html; then
            python3 - <<'PY'
          from pathlib import Path
          p=Path('NAYANETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- NAYANETHUB-BUILD-BRIDGE-2026-09-06 -->'
          if marker not in s:
              if '</body>' not in s: raise SystemExit('NAYANETHUB.html has no closing body')
              s=s.replace('</body>',marker+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
          fi
          git rm .github/workflows/force-nayanethub-build-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NAYANETHUB.html
          git commit -m 'Trigger canonical NayaNET Hub production build [skip ci]'
          git push
