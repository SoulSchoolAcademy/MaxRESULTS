name: MAXESS V2 Pre-Test Excellence Gate

# Fresh execution marker: validate the corrected hardening boundary on current main.

on:
  push:
    branches: [main]
    paths:
      - 'PROJECTS/MAXESS/E00 MAXESS V2 — AUTHORITATIVE GROOVE.html'
      - 'PROJECTS/MAXESS/ENGINEERING/**'
      - 'PROJECTS/MAXESS/TESTS/**'
      - 'MAXESS-RESULT-CONSUMER-V2.html'
      - 'E01'
      - '.github/workflows/maxess-v2-pretest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maxess-v2-pretest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source of truth
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply deterministic in-scope Groove hardening
        run: node PROJECTS/MAXESS/TESTS/maxess-v2-auto-hardening.mjs

      - name: Static architecture gate
        run: node PROJECTS/MAXESS/TESTS/maxess-v2-pretest-audit.mjs

      - name: Verify browser harness source boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const spec = fs.readFileSync('PROJECTS/MAXESS/TESTS/maxess-v2-browser.spec.mjs','utf8');
          const engine = fs.readFileSync('PROJECTS/MAXESS/ENGINEERING/MAXESS-E00-AUTHORITATIVE-ENGINE-V2.js','utf8');
          if (!spec.includes('runtimeMatches=scriptMatches.filter')) {
            throw new Error('Browser harness runtime extraction is not using the authoritative script boundary.');
          }
          if (spec.includes('runtimeMatch=localGroove.match(/<script>([\\s\\S]*window\\.MAXESS_E00_V2')) {
            throw new Error('Browser harness still contains the retired greedy runtime extraction pattern.');
          }
          if (engine.includes('</script><script>')) {
            throw new Error('Authoritative engine contains embedded HTML/script markup.');
          }
          console.log('Browser harness source boundary: verified');
          NODE

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Browser evidence gate
        run: npx playwright test PROJECTS/MAXESS/TESTS/maxess-v2-browser.spec.mjs --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json

      - name: Preserve browser evidence receipt
        if: always()
        run: |
          mkdir -p playwright-report
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = {
            schema: 'maxess-browser-evidence-receipt/v1',
            run_id: process.env.GITHUB_RUN_ID,
            commit: process.env.GITHUB_SHA,
            workflow: process.env.GITHUB_WORKFLOW,
            generated_at: new Date().toISOString(),
            browser_spec: 'PROJECTS/MAXESS/TESTS/maxess-v2-browser.spec.mjs',
            note: 'Playwright JSON report is preserved separately when generated. This receipt records the exact CI execution identity so successful runs remain durable evidence even when no failure-only trace exists.'
          };
          fs.writeFileSync('playwright-report/maxess-browser-run-receipt.json',JSON.stringify(receipt,null,2));
          NODE

      - name: Upload browser evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxess-v2-browser-evidence-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Commit verified hardening if changed
        if: success()
        run: |
          if git diff --quiet; then
            echo 'No source changes produced by hardening.'
          else
            git config user.name 'Naya Power Automation'
            git config user.email 'naya-power-automation@users.noreply.github.com'
            git add 'PROJECTS/MAXESS/E00 MAXESS V2 — AUTHORITATIVE GROOVE.html' 'E01'
            git commit -m 'MAXESS: harden authoritative result handoff [skip ci]'
            git push
          fi

# Documentation/Smart Note commits intentionally do not trigger this expensive
# browser gate. Code/test changes and manual dispatch remain authoritative triggers.
# Evidence preservation is intentionally part of the gate: successful browser runs
# must leave a durable machine-readable receipt/report, not disappear because the
# test suite only emits traces on failure.
