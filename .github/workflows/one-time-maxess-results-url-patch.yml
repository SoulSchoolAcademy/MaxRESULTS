name: One-time MAXESS Results URL patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AIScoreMAXESS Results destination
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('AIScoreMAXESS code')
          s = p.read_text()
          old = "const RESULTS_URL = 'https://results.nayanet.xyz/';"
          new = "const RESULTS_URL = 'https://results.nayanet.app/';"
          if old not in s:
              raise SystemExit('Expected old Results URL not found; refusing to modify file.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "AIScoreMAXESS code"
          git commit -m "Connect MAXESS assessment to new app Results page"
          git push
