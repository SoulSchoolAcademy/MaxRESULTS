name: Package Intelligent Hub

on:
  push:
    paths:
      - 'nayanet-hub-v3/**'
      - '.github/workflows/package-intelligent-hub.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Cloudflare-ready Hub
        run: |
          mkdir -p dist
          cd nayanet-hub-v3
          zip -r ../dist/nayanet-intelligent-hub-v3-cloudflare.zip . -x '*.DS_Store'
          cd ..

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: nayanet-intelligent-hub-v3-cloudflare
          path: dist/nayanet-intelligent-hub-v3-cloudflare.zip
          if-no-files-found: error
          retention-days: 30
