name: Patch Hub build baseline fetch
on:
  push:
    paths:
      - '.github/workflows/patch-hub-build.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix baseline fetch
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/fix-nayanethub.yml')
          s=p.read_text(encoding='utf-8')
          old='run: git checkout c171a9b0eaeb2064be60b30231ee901edb9daea6 -- NAYANETHUB.html'
          new='run: git fetch --no-tags origin c171a9b0eaeb2064be60b30231ee901edb9daea6 && git checkout c171a9b0eaeb2064be60b30231ee901edb9daea6 -- NAYANETHUB.html'
          if old not in s:
              raise SystemExit('expected baseline restore line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'NayaNET Surgical Builder'
          git config user.email 'nayanet-surgical@users.noreply.github.com'
          git add .github/workflows/fix-nayanethub.yml
          git rm .github/workflows/patch-hub-build.yml
          git commit -m 'Fix Hub builder baseline fetch'
          git push
