name: V7 Surgical Feed Patch
on:
  push:
    paths:
      - '.github/workflows/v7-surgical-feed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last-good V7 and apply surgical feed change
        shell: bash
        run: |
          set -euo pipefail
          git checkout 6a6b6e5958866c20a9a82e8e2b163a62a45d5a80 -- CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html')
          s=p.read_text()
          marker='</head>'
          css=r'''<style id="NAYA_V7_SURGICAL_INTELLIGENT_FEED_20260906">
/* SURGICAL CHANGE ONLY: preserve the approved V7 shell; activation rail left, intelligence feed centered. */
#page-home.page.active{display:grid;grid-template-columns:minmax(235px,285px) minmax(0,1fr);column-gap:24px;align-items:start}
#page-home .homeIntro,#page-home .heroState{grid-column:1/-1}
#page-home .servicePath{grid-column:1;grid-row:3;display:grid;grid-template-columns:1fr;gap:12px;margin:0}
#page-home .featureBoard{min-height:0;height:auto;padding:21px 19px 18px;border-radius:23px}
#page-home .powerOrb{width:92px;height:92px;margin:15px auto 14px}
#page-home .orbCore{width:46px;height:46px}
#page-home .orbCore span{font-size:18px}
#page-home .featureBoard h3{font-size:22px}
#page-home .featureBoard .lead{font-size:11px;min-height:0}
#page-home .advantage{margin:13px 0;padding:11px 8px}
#page-home .advantage b{font-size:9px;margin-bottom:4px}
#page-home .advantage span{font-size:9px}
#page-home .featureButton{min-height:49px;font-size:10px}
#page-home .surface.feed{display:none}
#page-home #naya-v7-intelligent-block-feed{grid-column:2;grid-row:3;margin:0}
#page-home .reportStrip{grid-column:2;grid-row:4;margin-top:22px}
#page-home #naya-v7-intelligent-block-feed .ibf-head{padding:26px 28px 22px}
#page-home #naya-v7-intelligent-block-feed .ibf-head h2{font-size:30px}
#page-home #naya-v7-intelligent-block-feed .ibf-head p{font-size:13px;line-height:1.6;max-width:760px}
#page-home #naya-v7-intelligent-block-feed .ibf-block{padding:0 28px}
#page-home #naya-v7-intelligent-block-feed .ibf-main{padding:25px 0;grid-template-columns:78px 20px minmax(0,1fr) 20px;gap:16px}
#page-home #naya-v7-intelligent-block-feed .ibf-time{font-size:10px;padding-top:5px}
#page-home #naya-v7-intelligent-block-feed .ibf-subject b{font-size:21px;line-height:1.22}
#page-home #naya-v7-intelligent-block-feed .ibf-subject p{font-size:13px;line-height:1.65;max-width:820px}
#page-home #naya-v7-intelligent-block-feed .ibf-detail{padding:0 0 28px 114px}
#page-home #naya-v7-intelligent-block-feed .ibf-perspectives{grid-template-columns:1fr;gap:12px}
#page-home #naya-v7-intelligent-block-feed .ibf-perspective{padding:19px 20px;border-radius:18px}
#page-home #naya-v7-intelligent-block-feed .ibf-perspective .label{font-size:9px;margin-bottom:10px}
#page-home #naya-v7-intelligent-block-feed .ibf-perspective .value{font-size:13px;line-height:1.75}
#page-home #naya-v7-intelligent-block-feed .ibf-source{font-size:10px;margin-top:14px}
@media(max-width:1100px){#page-home.page.active{grid-template-columns:235px minmax(0,1fr)}#page-home .servicePath{grid-column:1;grid-row:3}#page-home #naya-v7-intelligent-block-feed{grid-column:2;grid-row:3}#page-home .reportStrip{grid-column:2;grid-row:4}}
@media(max-width:900px){#page-home.page.active{display:block}#page-home .servicePath{display:grid;grid-template-columns:1fr;margin-bottom:18px}#page-home #naya-v7-intelligent-block-feed{margin-top:18px}#page-home .reportStrip{margin-top:18px}#page-home #naya-v7-intelligent-block-feed .ibf-detail{padding-left:0}#page-home #naya-v7-intelligent-block-feed .ibf-main{grid-template-columns:58px 14px minmax(0,1fr) 18px;gap:10px}#page-home #naya-v7-intelligent-block-feed .ibf-perspectives{grid-template-columns:1fr}}
</style>
'''
          s=s.replace(marker,css+marker,1)
          old='''const notes=collect();shell.innerHTML=`<div class="ibf-head"><div><div class="ibf-kicker">LIVING INTELLIGENCE · CHRONOLOGICAL</div><h2>Intelligent Block Feed</h2><p>Your Smart Notes become living blocks — one subject, one moment, four perspectives. Open any block to inspect the Human, Naya, Machine, and Intelligent Feed views.</p></div><button class="ibf-brief" type="button" data-v7-brief>DAILY INTELLIGENCE BRIEFING</button></div><div class="ibf-list">${notes.length?notes.map((n,i)=>{const tone=['#55e39a','#b27cff','#55b9ee','#6675ff'][i%4];return `<article class="ibf-block" style="--tone:${tone}"><div class="ibf-main" data-open-block><div class="ibf-time">${esc(timeOf(n.stamp))}</div><div class="ibf-rail"><span class="ibf-node"></span></div><div class="ibf-subject"><b>${esc(n.subject)}</b><p>${esc(n.feed||n.human||'Intelligent Block captured.')}</p></div><div class="ibf-chevron">⌄</div></div><div class="ibf-detail"><div class="ibf-perspectives">${perspectives(n).map(([c,l,v])=>`<div class="ibf-perspective ${c}"><div class="label">${l}</div><div class="value">${esc(v)}</div></div>`).join('')}</div>${n.source?`<div class="ibf-source">SOURCE · ${esc(n.source)}</div>`:''}</div></article>`}).join(''):`<div class="ibf-empty"><b>Your Intelligent Blocks will appear here.</b><span>Capture a Smart Note or connect your intelligence source. This feed will organize real notes chronologically and reveal the four perspectives as intelligence is produced.</span></div>`}</div>`;'''
          new='''const demo=[
            {subject:'The Hub should feel like intelligence, not a dashboard.',human:'I realized that the center of the Home experience should not be a collection of features. It should be the place where my intelligence actually lives. A Smart Note is not a social post or a tiny notification; it is an intelligence artifact that may contain a paragraph, several paragraphs, or a distilled piece of a much larger body of work.',naya:'The architectural shift is significant: the Intelligent Block becomes the primary object. Tools such as GitHub connection, synchronization, and collective connection remain important, but they are pathways around the intelligence rather than the intelligence itself.',machine:'DEMO RECORD · source: design review · privacy: private · state: example only. No machine evidence is being represented as real user activity.',feed:'The Home feed should preserve the subject, time, source, and multiple perspectives as one coherent intelligence object. The deeper source can remain available while the Smart Note carries the distilled intelligence forward.'},
            {subject:'Keep the activation path beautiful — move it beside the intelligence.',human:'Connect GitHub, Sync Intelligence, and Get Connected already feel like important parts of the Hub. They should remain visible and beautiful, but they should not consume the center of the experience. Moving them into a vertical rail gives the intelligence room to breathe without hiding the actions.',naya:'The activation rail is a set of pathways, not the destination. A narrow vertical rail preserves the original visual language while allowing the center to become a chronological intelligence stream.',machine:'DEMO RECORD · layout decision · source: design review · privacy: private · state: example only. This is not a live deployment receipt.',feed:'Preserve the approved V7 shell, keep all three activation cards, and give the center to the Intelligent Block Feed. The result should read like a premium intelligence network rather than a dashboard of widgets.'},
            {subject:'One Intelligent Block can hold a much larger body of intelligence.',human:'A Smart Note might start with a few paragraphs, or it might be the distilled intelligence from a fifty-three-page conversation or document. The block should give that intelligence enough room to be read, understood, and revisited instead of forcing everything into a one-line card.',naya:'Depth is part of the product. The feed can provide a concise entry point, but opening a block should reveal the actual intelligence artifact and its four perspectives without reducing them to tiny fragments.',machine:'DEMO RECORD · content model · source: Smart Note concept · privacy: private · state: example only. Real machine evidence appears only when an actual connected source provides it.',feed:'Intelligent Blocks are the durable units of compounding intelligence. They can be brief or deep, but they are never merely decorative feed cards.'}
          ];
          const sourceNotes=collect();
          const notes=sourceNotes.length?sourceNotes:demo.map((n,i)=>({...n,stamp:Date.now()-i*3600000,source:'DEMO · NOT REAL ACTIVITY'}));
          shell.innerHTML=`<div class="ibf-head"><div><div class="ibf-kicker">LIVING INTELLIGENCE · CHRONOLOGICAL</div><h2>Intelligent Block Feed</h2><p>One intelligence artifact at a time. Each block can hold substantial Human, Naya, Machine, and Intelligent Feed perspectives — with deeper source intelligence available behind the block.</p></div><button class="ibf-brief" type="button" data-v7-brief>DAILY INTELLIGENCE BRIEFING</button></div><div class="ibf-list">${notes.map((n,i)=>{const tone=['#55e39a','#b27cff','#55b9ee','#6675ff'][i%4];return `<article class="ibf-block" style="--tone:${tone}"><div class="ibf-main" data-open-block><div class="ibf-time">${esc(timeOf(n.stamp))}</div><div class="ibf-rail"><span class="ibf-node"></span></div><div class="ibf-subject"><b>${esc(n.subject)}</b><p>${esc(n.feed||n.human||'Intelligent Block captured.')}</p></div><div class="ibf-chevron">⌄</div></div><div class="ibf-detail"><div class="ibf-perspectives">${perspectives(n).map(([c,l,v])=>`<div class="ibf-perspective ${c}"><div class="label">${l}</div><div class="value">${esc(v)}</div></div>`).join('')}</div><div class="ibf-source">${esc(n.source||'SOURCE · PRESERVED INTELLIGENCE')}</div></div></article>`}).join('')}</div>`;'''
          if old not in s:
              raise SystemExit('target feed renderer not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'NayaNET Surgical Release'
          git config user.email 'nayanet-release@users.noreply.github.com'
          git add CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          git commit -m 'V7: preserve approved shell and center intelligent block feed' || true
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -e
          git rm -f .github/workflows/v7-surgical-feed.yml || true
          git config user.name 'NayaNET Surgical Release'
          git config user.email 'nayanet-release@users.noreply.github.com'
          git commit -m 'chore: remove temporary V7 surgical workflow' || true
          git push || true
