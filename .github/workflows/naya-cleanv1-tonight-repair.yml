name: Naya CLEAN V1 Tonight Repair

on:
  push:
    branches: [feat/aiscore-clean-v1]
    paths:
      - 'AIScoreMAXESS-CLEAN-V1.html'
      - '.github/workflows/naya-cleanv1-tonight-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply surgical assessment repairs
        shell: python
        run: |
          from pathlib import Path
          p = Path('AIScoreMAXESS-CLEAN-V1.html')
          s = p.read_text(encoding='utf-8')

          # 1. Remove only the redundant purple orb from the centered Naya dialog.
          old_presence = '<div class="naya-presence"><div class="naya-portrait" aria-hidden="true"><img src="https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg" alt=""></div><div class="presence-orb" id="presenceOrb" aria-hidden="true"></div><div class="presence-copy"><strong>Naya</strong><span>Let me walk you through this.</span></div></div>'
          new_presence = '<div class="naya-presence"><div class="naya-portrait" aria-hidden="true"><img src="https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg" alt=""></div><div class="presence-copy"><strong>Naya</strong><span>Let me walk you through this.</span></div></div>'
          if old_presence in s:
              s = s.replace(old_presence, new_presence, 1)
          elif '<div class="presence-orb" id="presenceOrb"' in s:
              raise SystemExit('Unexpected Naya dialog structure; refusing blind edit.')

          # Remove the now-unused dialog-orb playing hook without touching the Naya control orb.
          old_playing = "$('presenceOrb').classList.toggle('playing',v);"
          if old_playing in s:
              s = s.replace(old_playing, '', 1)

          # 2. After the 15th answer, interest selection goes directly to the real Results handoff.
          old_finish = "function finishInterests(){finishAssessment()}"
          new_finish = "function finishInterests(){try{publish()}catch(e){console.error(e)}}"
          if old_finish not in s:
              raise SystemExit('Expected finishInterests function not found; refusing edit.')
          s = s.replace(old_finish, new_finish, 1)

          # 3. Keep the legacy completion markup inert rather than showing a duplicate Continue screen.
          old_complete = "function finishAssessment(){$('assessmentStage').classList.add('hidden');$('completeStage').classList.remove('hidden');state.completed=true;$('continueToResults').focus()}"
          new_complete = "function finishAssessment(){state.completed=true}"
          if old_complete in s:
              s = s.replace(old_complete, new_complete, 1)

          # 4. Repair the canonical Results destination. Repository governance identifies .xyz as current public target.
          old_url = "location.assign('https://results.nayanet.app/#maxess-result='+payload);"
          new_url = "location.assign('https://results.nayanet.xyz/#maxess-result='+payload);"
          if old_url not in s:
              raise SystemExit('Expected .app Results handoff not found; refusing URL substitution.')
          s = s.replace(old_url, new_url, 1)

          # 5. Add an explicit repair marker so future work can distinguish this state from older variants.
          marker = 'window.MAXESS_CLEAN_V1_TONIGHT_REPAIR_V1=true;'
          if marker not in s:
              s = s.replace("window.NAYA_WELCOME_V1=true;", "window.NAYA_WELCOME_V1=true;" + marker, 1)

          p.write_text(s, encoding='utf-8')
          print('patched', p)
          print('bytes', len(s.encode('utf-8')))
          print('lines', len(s.splitlines()))

      - name: Static verification
        shell: bash
        run: |
          test -s 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'NAYA_IMAGE_AAA_V1' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'Naya%20Profile%206.jpg' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'MAXESS_RESULT_V1' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'https://results.nayanet.xyz/#maxess-result=' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'function finishInterests(){try{publish()}' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'MAXESS_CLEAN_V1_TONIGHT_REPAIR_V1' 'AIScoreMAXESS-CLEAN-V1.html'
          if grep -q 'id="presenceOrb"' 'AIScoreMAXESS-CLEAN-V1.html'; then exit 1; fi
          if grep -q 'results.nayanet.app/#maxess-result=' 'AIScoreMAXESS-CLEAN-V1.html'; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('AIScoreMAXESS-CLEAN-V1.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/aiscore.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('scripts',len(scripts),'bytes',len(s.encode('utf-8')),'lines',len(s.splitlines()))
          PY
          node --check /tmp/aiscore.js
          git diff --check

      - name: Commit repair and remove temporary runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'AIScoreMAXESS-CLEAN-V1.html'
          git rm -- '.github/workflows/naya-cleanv1-tonight-repair.yml'
          git commit -m 'Repair CLEAN V1 Naya and Results transition'
          git push
