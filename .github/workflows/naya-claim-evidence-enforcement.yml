name: Naya Power Claim Evidence Enforcement
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  claim-evidence:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
      - name: Apply canonical E00 796 terminal repair
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('E00 796')
          s=p.read_text(encoding='utf-8')
          original=s
          bad="if(!Array.isArray(S)||Object.keys(S).length!==15)throw Error('Score matrix structure invalid');"
          good="if(!S||typeof S!=='object'||Array.isArray(S)||Object.keys(S).length!==15)throw Error('Score matrix structure invalid');Object.keys(S).forEach(k=>{if(!/^([1-9]|1[0-5])$/.test(k)||!Array.isArray(S[k])||S[k].length!==5)throw Error('Score matrix row invalid');});"
          if bad in s:
              s=s.replace(bad,good,1)
          listener="""document.addEventListener('click',e=>{
  const button=e.target.closest('#maxess-ai-score #continueButton');
  if(!button)return;
  e.preventDefault();
  e.stopPropagation();
  if(button.disabled)return;
  next();
},true);"""
          hardened="""function executeContinue(e){
  const root=$('maxess-ai-score');
  const button=e.target&&e.target.closest?e.target.closest('#continueButton'):null;
  if(!button||!root||!root.contains(button))return;
  if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
  e.preventDefault();
  e.stopPropagation();
  if(e.stopImmediatePropagation)e.stopImmediatePropagation();
  if(button.disabled||state.finalizing||state.mode!=='ASSESSMENT'||!state.selected)return;
  next();
}
document.addEventListener('click',executeContinue,true);
document.addEventListener('pointerup',executeContinue,true);
document.addEventListener('keydown',executeContinue,true);"""
          if listener in s:
              s=s.replace(listener,hardened,1)
          elif 'function executeContinue(e)' not in s:
              raise SystemExit('E00 Continue listener anchor missing')
          old_next="function next(){if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;if(state.i===14){publish();return;}save();state.i++;render();setTimeout(()=>openNaya(),120);}"
          new_next="function next(){if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;try{if(state.i===14){if(!publish())throw Error('Terminal publish failed');return;}save();state.i++;render();setTimeout(()=>openNaya(),120);}catch(e){console.error('MAXESS Continue execution error',e);state.finalizing=false;state.mode='ASSESSMENT';updateContinue();$('continueText').textContent='Continue';}}"
          if old_next in s:
              s=s.replace(old_next,new_next,1)
          old_tail="releaseResultsSections(result);window.MAXESS_RESULT_HANDOFF_URL = null; return true;"
          new_tail="releaseResultsSections(result);const handedOff=attemptResultsHandoff(result);if(!handedOff)console.warn('MAXESS Results handoff unavailable; verified local Results retained.');return true;"
          if old_tail in s:
              s=s.replace(old_tail,new_tail,1)
          elif 'attemptResultsHandoff(result);' not in s:
              raise SystemExit('E00 Results handoff anchor missing')
          if s==original:
              print('E00 796 already repaired; no commit needed')
              raise SystemExit(0)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F "function executeContinue(e)" 'E00 796' >/dev/null
          grep -F "attemptResultsHandoff(result);" 'E00 796' >/dev/null
          sed -n '/<script>/,/<\/script>/p' 'E00 796' | sed '1d;$d' > /tmp/e00.js
          node --check /tmp/e00.js
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add 'E00 796'
          git commit -m 'fix: repair MAXESS E00 Continue and Results handoff'
          git push origin main
      - name: Assert exact target commit
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$TARGET_SHA"
          echo "Exact target commit verified: $actual"
      - name: Run adversarial Claim/Evidence tests
        shell: bash
        run: |
          set -euo pipefail
          python .naya/runtime/test_evidence_runtime.py 2>&1 | tee /tmp/evidence-test-output.txt
      - name: Run independent Oscar adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python .naya/runtime/test_oscar.py
      - name: Run evidence promotion adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python .naya/runtime/test_promotion_runtime.py
      - name: Generate current-commit evidence and verify claim
        shell: python
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('.naya/evidence')
          (root / 'claims').mkdir(parents=True, exist_ok=True)
          (root / 'records').mkdir(parents=True, exist_ok=True)
          output = Path('/tmp/evidence-test-output.txt').read_text(encoding='utf-8')
          target_sha = os.environ['TARGET_SHA']
          claim_id = f'CL-{os.environ["GITHUB_RUN_ID"]}-evidence-runtime'
          evidence_id = f'EV-{os.environ["GITHUB_RUN_ID"]}-evidence-runtime'
          now = datetime.now(timezone.utc).isoformat()
          criteria = ['test process exits successfully','all adversarial tests pass']
          claim = {'schema':'naya-power-claim/v1','claim_id':claim_id,'statement':'The Claim/Evidence runtime adversarial test suite passes on the checked-out commit.','success_criteria':criteria,'created_at':now,'status':'VERIFIED','evidence_ids':[evidence_id],'source':f'github-actions:{os.environ["GITHUB_RUN_ID"]}'}
          evidence = {'schema':'naya-power-evidence/v1','evidence_id':evidence_id,'claim_id':claim_id,'observed_at':now,'method':'ci_test','command':'python .naya/runtime/test_evidence_runtime.py','observed_output':output[-12000:],'result':'PASS','commit_sha':target_sha,'environment':'github-actions','source':f'workflow-run:{os.environ["GITHUB_RUN_ID"]}','criteria_covered':criteria}
          (root/'claims'/f'{claim_id}.json').write_text(json.dumps(claim,indent=2)+'\n',encoding='utf-8')
          (root/'records'/f'{evidence_id}.json').write_text(json.dumps(evidence,indent=2)+'\n',encoding='utf-8')
      - name: Validate evidence store against exact commit
        shell: bash
        run: |
          set -euo pipefail
          python .naya/runtime/evidence_runtime.py validate --commit "$TARGET_SHA"
          claim_path=$(find .naya/evidence/claims -name '*.json' -print -quit)
          claim_id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["claim_id"])' "$claim_path")
          python .naya/runtime/evidence_runtime.py verify "$claim_id" --commit "$TARGET_SHA"
      - name: Independently challenge verification with Oscar
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          claim_path=$(find .naya/evidence/claims -name '*.json' -print -quit)
          evidence_path=$(find .naya/evidence/records -name '*.json' -print -quit)
          python .naya/runtime/oscar.py "$claim_path" "$evidence_path" --commit "$TARGET_SHA" --run-id "$GITHUB_RUN_ID" | tee .naya/evidence/oscar-result.json
      - name: Evaluate current evidence promotion boundary
        shell: python
        run: |
          import json
          from pathlib import Path
          claim_path = next(Path('.naya/evidence/claims').glob('*.json'))
          evidence_paths = sorted(Path('.naya/evidence/records').glob('*.json'))
          package = {'claim':json.loads(claim_path.read_text(encoding='utf-8')),'evidence':[json.loads(p.read_text(encoding='utf-8')) for p in evidence_paths],'oscar':json.loads(Path('.naya/evidence/oscar-result.json').read_text(encoding='utf-8')),'target':'OSCAR_ACCEPTED'}
          Path('/tmp/promotion-package.json').write_text(json.dumps(package,indent=2)+'\n',encoding='utf-8')
          import subprocess, sys
          subprocess.run([sys.executable,'.naya/runtime/promotion_runtime.py','/tmp/promotion-package.json','--commit',__import__('os').environ['TARGET_SHA']],check=True)
      - name: Publish machine-readable evidence and Oscar result
        uses: actions/upload-artifact@v4
        with:
          name: naya-claim-evidence-${{ env.TARGET_SHA }}
          path: .naya/evidence/
          if-no-files-found: error
