name: MAXESS E00 — One-Click Results Handoff V2

on:
  push:
    branches: [main]
    paths:
      - 'E00'
      - 'MAXESS-RESULT-CONSUMER-V2.html'
      - '.github/workflows/repair-e00-results-handoff-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maxess-e00-results-handoff-v2
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply smallest deterministic E00 handoff repair
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('E00')
          s = p.read_text(encoding='utf-8')
          state_pattern = re.compile(r"const state=\{\n  firstVisit:true,\n  nayaText:'',\n  index:0,\n  selected:null,\n  responses:\[\],\n  nayaPlaying:false,\n  completed:false\n\};")
          state_replacement = "const state={\n  firstVisit:true,\n  nayaText:'',\n  index:0,\n  selected:null,\n  responses:[],\n  nayaPlaying:false,\n  completed:false,\n  finalizing:false\n};"
          s, state_count = state_pattern.subn(state_replacement, s, count=1)
          if state_count not in (0, 1):
              raise SystemExit(f'Unexpected state replacement count: {state_count}')
          continue_pattern = re.compile(r"function continueAssessment\(\)\{.*?\n\}\n\n/\* ========================================================\n   AUDIO PREVIEW", re.S)
          continue_replacement = '''function continueAssessment(event){

  if(event){
    event.preventDefault();
    event.stopPropagation();
    if(event.stopImmediatePropagation) event.stopImmediatePropagation();
  }

  if(state.finalizing || !state.selected){
    return;
  }

  saveResponse();
  stopNaya();

  if(state.index===14){

    state.finalizing=true;
    state.completed=true;

    const button=$('maxessContinueButton');

    button.disabled=true;
    button.setAttribute('aria-disabled','true');
    $('maxessContinueText').textContent='Loading Results…';

    try{
      completeAssessment();
    }catch(e){
      state.finalizing=false;
      state.completed=false;
      button.disabled=false;
      button.setAttribute('aria-disabled','false');
      $('maxessContinueText').textContent='Continue';
      console.error('MAXESS final Results handoff failed:',e);
    }

    return;
  }

  state.index++;
  renderQuestion();
  setTimeout(openNaya,140);

}

/* ========================================================
   AUDIO PREVIEW'''
          s, continue_count = continue_pattern.subn(continue_replacement, s, count=1)
          if continue_count not in (0, 1):
              raise SystemExit(f'Unexpected continueAssessment replacement count: {continue_count}')
          marker = "  broadcastResult(c);\n\n  state.completed=true;"
          handoff = """  broadcastResult(c);

  const encoded=encode(c);
  if(!encoded){
    throw new Error('MAXESS_RESULT_V1 encoding failed before Results handoff.');
  }

  const resultsUrl=
    'https://results.nayanet.app/#maxess-result='+
    encoded;

  state.completed=true;

  ROOT.dataset.completed='true';
  ROOT.dataset.resultReady='true';
  ROOT.dataset.contractVersion='MAXESS_RESULT_V1';

  try{
    if(window.top && window.top!==window){
      window.top.location.assign(resultsUrl);
    }else{
      window.location.assign(resultsUrl);
    }
  }catch(e){
    try{
      window.location.assign(resultsUrl);
    }catch(_){
      throw new Error('MAXESS Results navigation failed: '+e.message);
    }
  }

  return true;"""
          if marker in s:
              s = s.replace(marker, handoff, 1)
          elif "https://results.nayanet.app/#maxess-result=" not in s:
              raise SystemExit('E00 completion handoff anchor missing')
          if 'window.MAXESS_E00_RESULTS_HANDOFF_V1=true;' not in s:
              version_marker = 'window.MAXESS_E00_ISOLATED_V4=true;'
              if version_marker not in s:
                  raise SystemExit('E00 version marker missing')
              s = s.replace(version_marker, version_marker + "\n\nwindow.MAXESS_E00_RESULTS_HANDOFF_V1=true;", 1)
          p.write_text(s, encoding='utf-8')
          print('E00 repair pass completed.')

      - name: Static source and consumer QA
        shell: bash
        run: |
          set -euo pipefail
          grep -F "window.MAXESS_E00_RESULTS_HANDOFF_V1=true;" E00 >/dev/null
          grep -F "state.finalizing=true;" E00 >/dev/null
          grep -F "Loading Results…" E00 >/dev/null
          grep -F "MAXESS_RESULT_V1" E00 >/dev/null
          grep -F "https://results.nayanet.app/#maxess-result=" E00 >/dev/null
          grep -F "window.top.location.assign(resultsUrl)" E00 >/dev/null
          grep -F "responses.length!==15" E00 >/dev/null
          ! grep -Fq "results.nayanet.xyz" E00
          grep -F "MAXESS_RESULT_V1" MAXESS-RESULT-CONSUMER-V2.html >/dev/null
          grep -F "maxess-result=" MAXESS-RESULT-CONSUMER-V2.html >/dev/null
          grep -F "window.MAXESS_RESULT=r" MAXESS-RESULT-CONSUMER-V2.html >/dev/null
          grep -F "MAXESS_RESULT_READY" MAXESS-RESULT-CONSUMER-V2.html >/dev/null
          grep -F "maxess:result-updated" MAXESS-RESULT-CONSUMER-V2.html >/dev/null
          ! grep -Fq "results.nayanet.xyz" MAXESS-RESULT-CONSUMER-V2.html
          node --check <(sed -n '/<script>/,/<\/script>/p' E00 | sed '1d;$d')
          node --check <(sed -n '/<script>/,/<\/script>/p' MAXESS-RESULT-CONSUMER-V2.html | sed '1d;$d')
          echo 'E00 + Results consumer static QA: PASS'

      - name: Commit only when E00 changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add E00
          if git diff --cached --quiet; then
            echo 'E00 already satisfies the handoff contract — no mutation required.'
          else
            git commit -m 'fix(E00): complete one-click Results handoff'
            git push origin main
          fi

      - name: Final repository-state assertion
        shell: bash
        run: |
          set -euo pipefail
          grep -F "window.MAXESS_E00_RESULTS_HANDOFF_V1=true;" E00 >/dev/null
          grep -F "https://results.nayanet.app/#maxess-result=" E00 >/dev/null
          ! grep -Fq "results.nayanet.xyz" E00
          echo 'FINAL E00 HANDOFF ASSERTION: PASS'
