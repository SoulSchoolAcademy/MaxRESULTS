name: Naya CLEAN V1 Tonight Target Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch to exact repair branch
        shell: bash
        run: |
          git fetch origin fix/aiscore-cleanv1-tonight:refs/remotes/origin/fix/aiscore-cleanv1-tonight
          git checkout --force -B fix/aiscore-cleanv1-tonight origin/fix/aiscore-cleanv1-tonight
      - name: Apply final surgical repair
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('AIScoreMAXESS-CLEAN-V1.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'<div\s+class=["\']naya-presence["\'][^>]*>.*?</div>\s*</div>'
          match=re.search(pattern,s,re.S|re.I)
          if not match:
              raise SystemExit('Naya dialog structure not recognized.')
          block=match.group(0)
          portrait='<div class="naya-portrait" aria-hidden="true"><img src="https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg" alt=""></div>'
          if 'class="naya-portrait"' not in block and "class='naya-portrait'" not in block:
              block=re.sub(r'<div\s+class=["\']presence-orb["\'][^>]*>\s*</div>\s*',portrait,block,count=1,flags=re.S|re.I)
          block=re.sub(r'<div\s+class=["\']presence-orb["\'][^>]*>\s*</div>\s*','',block,count=1,flags=re.S|re.I)
          if 'naya-portrait' not in block:
              raise SystemExit('Naya portrait insertion failed.')
          s=s[:match.start()]+block+s[match.end():]
          s=s.replace("$('presenceOrb').classList.toggle('playing',v);",'',1)
          old_finish='function finishInterests(){finishAssessment()}'
          if old_finish in s: s=s.replace(old_finish,"function finishInterests(){try{publish()}catch(e){console.error(e)}}",1)
          old_url="location.assign('https://results.nayanet.app/#maxess-result='+payload);"
          if old_url in s: s=s.replace(old_url,"location.assign('https://results.nayanet.xyz/#maxess-result='+payload);",1)
          old_complete='<div id="completeStage" class="complete hidden" aria-live="polite"><div class="complete-orb" aria-hidden="true"></div><h2>Your personal report is ready.</h2><p>I\'m sending your real assessment result to MAXESS Results now. Nothing is being invented or substituted.</p><button class="primary" id="continueToResults" type="button">Continue to My Report <span class="arrow">→</span></button></div>'
          s=s.replace(old_complete,'',1)
          old_listener="$('continueToResults').addEventListener('click',()=>{try{publish()}catch(e){console.error(e)}});"
          s=s.replace(old_listener,'',1)
          old_finish_assessment="function finishAssessment(){$('assessmentStage').classList.add('hidden');$('completeStage').classList.remove('hidden');state.completed=true;$('continueToResults').focus()}"
          s=s.replace(old_finish_assessment,"function finishAssessment(){state.completed=true}",1)
          marker='window.MAXESS_CLEAN_V1_TONIGHT_REPAIR_V1=true;'
          if marker not in s: s=s.replace("window.NAYA_WELCOME_V1=true;","window.NAYA_WELCOME_V1=true;"+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify repaired source
        shell: bash
        run: |
          test -s 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'NAYA_IMAGE_AAA_V1' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'MAXESS_RESULT_V1' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'https://results.nayanet.xyz/#maxess-result=' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'MAXESS_CLEAN_V1_TONIGHT_REPAIR_V1' 'AIScoreMAXESS-CLEAN-V1.html'
          grep -q 'function finishInterests(){try{publish()}' 'AIScoreMAXESS-CLEAN-V1.html'
          if grep -q 'id="presenceOrb"' 'AIScoreMAXESS-CLEAN-V1.html'; then exit 1; fi
          if grep -q 'id="completeStage"' 'AIScoreMAXESS-CLEAN-V1.html'; then exit 1; fi
          if grep -q 'id="continueToResults"' 'AIScoreMAXESS-CLEAN-V1.html'; then exit 1; fi
          if grep -qF "$('continueToResults').addEventListener" 'AIScoreMAXESS-CLEAN-V1.html'; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('AIScoreMAXESS-CLEAN-V1.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/aiscore.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('bytes',len(s.encode()),'lines',len(s.splitlines()),'scripts',len(scripts))
          PY
          node --check /tmp/aiscore.js
          git diff --check
      - name: Push repaired source and remove temporary runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add -- 'AIScoreMAXESS-CLEAN-V1.html'
          git rm -- 'NAYA_TONIGHT_REPAIR_TRIGGER_3.txt' || true
          git commit -m 'Repair CLEAN V1 Naya and Results transition'
          git push origin HEAD:fix/aiscore-cleanv1-tonight
          git checkout --force main
          git pull --ff-only origin main
          git rm -- '.github/workflows/naya-cleanv1-tonight-target.yml'
          git commit -m 'Remove temporary CLEAN V1 repair runner'
          git push origin HEAD:main