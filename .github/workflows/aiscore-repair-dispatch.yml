name: Dispatch AIScore Full Repair

on:
  push:
    paths:
      - '.github/workflows/aiscore-repair-dispatch.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maxess-aiscore-tonight-full-repair
          fetch-depth: 0

      - name: Patch full artifact in repair branch
        shell: python
        run: |
          from pathlib import Path
          p=Path('AIScoreMAXESS code')
          s=p.read_text(encoding='utf-8')
          original=len(s)
          s=s.replace("const RESULTS_URL = 'https://results.nayanet.app/';","const RESULTS_URL = 'https://results.kninet.app/';")
          s=s.replace("window.location.assign(`${RESULTS_URL}#maxess-result=${encoded}`);","window.location.assign(`${RESULTS_URL}?result=${encodeURIComponent(encoded)}#maxess-result=${encoded}`);")
          s=s.replace('https://i.postimg.cc/bw4fyKF8/Naya-Profile-black-face-zoom.jpg','https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg')
          css='''\n/* NAYA HUMAN PRESENCE — SURGICAL V2 */\n.interstitial{place-items:center!important;padding:20px!important;background:radial-gradient(circle at 50% 42%,rgba(86,35,151,.30),rgba(7,2,16,.78) 48%,rgba(0,0,0,.94) 82%)!important;backdrop-filter:blur(22px) saturate(115%)!important;-webkit-backdrop-filter:blur(22px) saturate(115%)!important}\n.teaching-cloud{width:min(720px,calc(100vw - 32px))!important;min-height:390px;padding:58px 58px 42px!important;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center!important;border-radius:42px!important;background:radial-gradient(circle at 52% 0%,rgba(142,91,255,.34),transparent 43%),linear-gradient(145deg,#24113f,#0a0612)!important;border:1px solid rgba(202,174,255,.48)!important;box-shadow:0 45px 120px rgba(0,0,0,.78),0 0 100px rgba(116,62,255,.28),inset 0 1px 0 rgba(255,255,255,.15)!important;overflow:visible!important}\n.teaching-cloud .cloud-icon{display:none!important}\n.maxess-naya-human{position:absolute;top:-42px;right:34px;width:96px;height:96px;padding:4px;border-radius:50%;background:linear-gradient(145deg,#fff,#d9c6ff 45%,#8754ed);box-shadow:0 0 0 7px rgba(138,92,255,.14),0 0 40px rgba(138,92,255,.42),0 18px 40px rgba(0,0,0,.58);z-index:8}\n.maxess-naya-human img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 18%;border-radius:50%;border:2px solid rgba(255,255,255,.94)}\n.cloud-title{max-width:560px;margin-top:10px!important;color:#fff!important;font-family:Georgia,"Times New Roman",serif!important;font-size:clamp(34px,5vw,52px)!important;font-weight:400!important;letter-spacing:-.045em!important;line-height:.98!important}\n.cloud-body{max-width:570px!important;margin:18px auto 0!important;color:rgba(255,255,255,.86)!important;font-size:clamp(16px,2vw,19px)!important;line-height:1.62!important;font-weight:500!important}\n.cloud-button{min-height:56px!important;border-radius:18px!important;padding:0 27px!important;background:rgba(7,4,13,.72)!important;border:1px solid rgba(221,205,255,.55)!important;box-shadow:0 14px 30px rgba(0,0,0,.35),0 0 28px rgba(138,92,255,.14)!important}\n@media(max-width:600px){.interstitial{padding:16px!important}.teaching-cloud{width:min(100%,calc(100vw - 24px))!important;min-height:430px;padding:62px 23px 28px!important;border-radius:30px!important}.maxess-naya-human{top:-34px;right:22px;width:78px;height:78px}.cloud-title{font-size:clamp(31px,9vw,43px)!important}.cloud-body{font-size:15px!important}.cloud-actions{flex-direction:column!important}.cloud-button{width:100%!important}}\n@media(prefers-reduced-motion:reduce){.teaching-cloud{animation:none!important}}\n'''
          if 'NAYA HUMAN PRESENCE — SURGICAL V2' not in s:
            i=s.rfind('</style>'); s=s[:i]+css+s[i:]
          js='''\n<script>\n(function(){const I="https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg";let w=false;function e(){const x=document.getElementById("teachingInterstitial");if(!x||!x.classList.contains("visible"))return;const c=x.querySelector(".teaching-cloud");if(!c)return;if(!c.querySelector(".maxess-naya-human")){const p=document.createElement("div");p.className="maxess-naya-human";p.innerHTML='<img src="'+I+'" alt="Naya" loading="eager">';c.appendChild(p)}const a=c.querySelector(".cloud-eyebrow"),t=c.querySelector(".cloud-title"),b=c.querySelector(".cloud-body");if(!w){w=true;if(a)a.textContent="A LITTLE TIME TOGETHER";if(t)t.textContent="I'm here.";if(b)b.innerHTML="Let's look at this together.<br><br>I'll walk you through the questions and help you understand what they're really asking. Just answer based on what you actually do today — not what you think you should be doing.";const p=c.querySelector(".cloud-button:not(.secondary)");if(p)p.textContent="LET'S GO →";const q=c.querySelector(".cloud-button.secondary");if(q)q.textContent="LISTEN TO NAYA"}}new MutationObserver(e).observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:["class"]});setTimeout(e,200)})();\n</script>\n'''
          if 'NAYA HUMAN PRESENCE — RUNTIME ENHANCEMENT' not in s:
            i=s.rfind('</body>'); s=s[:i]+js+s[i:]
          checks=['MAXESS_RESULT_V1' in s,'MAXESS_ASSESSMENT' in s,'Continue to My Report' in s,'results.kninet.app' in s,'?result=${encodeURIComponent(encoded)}' in s,'Naya%20Profile%206.jpg' in s,len(s)>=original*.97]
          print('GUARDRAILS',checks,'bytes',len(s),'lines',len(s.splitlines()))
          if not all(checks): raise SystemExit('repair guardrail failed')
          p.write_text(s,encoding='utf-8')
      - name: Commit repair branch
        shell: bash
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add 'AIScoreMAXESS code'
          git commit -m 'MAXESS AIScore full Naya human and Results repair'
          git push origin maxess-aiscore-tonight-full-repair
