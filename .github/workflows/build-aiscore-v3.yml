name: Build AIScore V3

on:
  push:
    branches: [feat/aiscore-clean-v1]

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message != 'build: full AIScore V3 Naya repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build full V3 from existing V2
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          src = Path('AIScoreMAXESS-CLEAN-V2-HUMANIZED.html')
          out = Path('AIScoreMAXESS-CLEAN-V3-NAYA-HUMAN-PRESENCE.html')
          html = src.read_text(encoding='utf-8')

          # Preserve the existing complete assessment and replace only the Naya presentation layer.
          css = r'''.dialog{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:24px;background:rgba(7,3,16,.72);backdrop-filter:blur(18px)}.dialog.open{display:grid;animation:fade .25s ease both}.dialog-card{position:relative;width:min(760px,92vw);max-height:min(760px,88vh);overflow:auto;padding:48px 54px 42px;text-align:left;border:1px solid rgba(214,188,255,.32);border-radius:44px;background:radial-gradient(circle at 78% 8%,rgba(214,183,255,.20),transparent 24%),radial-gradient(circle at 20% 100%,rgba(138,67,220,.25),transparent 42%),linear-gradient(145deg,#4b1d78,#2d1050 58%,#1b0a31);box-shadow:0 40px 120px rgba(0,0,0,.72),0 0 90px rgba(115,65,225,.24),inset 0 1px 0 rgba(255,255,255,.14);isolation:isolate}.dialog-card:before{content:"";position:absolute;inset:1px;border-radius:43px;background:linear-gradient(120deg,rgba(255,255,255,.08),transparent 28%,transparent 70%,rgba(255,255,255,.04));pointer-events:none}.naya-presence{position:absolute;right:30px;top:-72px;width:176px;height:176px;display:block;z-index:3}.presence-orb{width:176px;height:176px;border-radius:50%;overflow:hidden;background:#32135a;border:4px solid rgba(255,255,255,.95);box-shadow:0 20px 50px rgba(0,0,0,.42),0 0 55px rgba(214,173,255,.28);position:relative}.presence-orb:before{content:"";position:absolute;inset:0;background:url('https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg') center top/cover no-repeat}.presence-orb:after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 -30px 45px rgba(22,5,40,.18)}.presence-copy{display:none}.dialog-kicker{display:none}.dialog-title{position:relative;z-index:2;margin:18px 185px 0 0;font-size:clamp(38px,5vw,56px);line-height:1.02;font-weight:800;letter-spacing:-.045em;color:#fff}.dialog-body{position:relative;z-index:2;max-width:620px;margin:22px 0 0;color:#f4eafa;font-size:clamp(17px,2vw,21px);line-height:1.58;font-weight:500}.dialog-body.welcome-copy p{margin:0 0 12px}.dialog-body.welcome-copy p:last-child{margin-bottom:0}.dialog-actions{position:relative;z-index:2;display:flex;justify-content:flex-start;gap:12px;margin-top:30px;flex-wrap:wrap}.dialog-btn{min-height:56px;padding:0 27px;border-radius:18px;border:1px solid rgba(255,255,255,.82);background:rgba(255,255,255,.10);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 14px 32px rgba(18,3,35,.28);transition:transform .2s ease,background .2s ease,border-color .2s ease}.dialog-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.16);border-color:#fff}.dialog-btn.secondary{background:#fff;color:#3b155e;border-color:#fff}.dialog-btn.is-speaking{background:rgba(255,255,255,.18);border-color:#fff}.dialog-btn .arrow{margin-left:7px}.dialog-card .dialog-title,.dialog-card .dialog-body,.dialog-card .dialog-actions{padding-right:12px}
@media(max-width:760px){.dialog{padding:14px}.dialog-card{width:min(620px,94vw);max-height:90vh;padding:106px 24px 28px;border-radius:32px}.naya-presence{right:22px;top:-58px;width:132px;height:132px}.presence-orb{width:132px;height:132px}.dialog-title{margin:0;font-size:clamp(34px,10vw,46px)}.dialog-body{font-size:16px;line-height:1.52;margin-top:18px}.dialog-actions{flex-direction:column;margin-top:24px}.dialog-btn{width:100%}}
'''
          pattern = re.compile(r"\.dialog\{.*?\.dialog-btn\.is-speaking\{[^}]*\}", re.S)
          if not pattern.search(html):
              raise SystemExit('Could not locate existing Naya dialog CSS; refusing to modify.')
          html = pattern.sub(css.rstrip(), html, count=1)

          old_dialog = re.compile(r'<div class="dialog" id="nayaDialog".*?</div>\s*<script>', re.S)
          new_dialog = '''<div class="dialog" id="nayaDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogBody"><div class="dialog-card"><div class="naya-presence"><div class="presence-orb" id="presenceOrb" role="img" aria-label="Naya — warm portrait"></div><div class="presence-copy"><strong>Naya</strong><span>I'm here. Let's look at this together.</span></div></div><div class="dialog-kicker" id="dialogKicker">DIRECTION · QUESTION 1</div><h2 class="dialog-title" id="dialogTitle">I'm here.</h2><div class="dialog-body" id="dialogBody"></div><div class="dialog-actions"><button class="dialog-btn" id="playNaya" type="button">PLAY NAYA <span class="arrow">▶</span></button><button class="dialog-btn secondary" id="closeNaya" type="button">LET'S GO <span class="arrow">→</span></button></div></div></div><script>'''
          if not old_dialog.search(html):
              raise SystemExit('Could not locate existing Naya dialog markup; refusing to modify.')
          html = old_dialog.sub(new_dialog, html, count=1)

          html = html.replace('https://results.nayanet.xyz/', 'https://results.nayanet.app/')
          html = html.replace("const url=target+'#maxess-result='+payload", "const url=target+'?result='+encodeURIComponent(payload)+'#maxess-result='+payload")
          html = html.replace("window.MAXESS_CLEAN_V2_HUMANIZED=true;", "window.MAXESS_CLEAN_V3_NAYA_HUMAN=true;")
          html = html.replace("window.MAXESS_RESULT_TARGET='https://results.nayanet.xyz/';", "window.MAXESS_RESULT_TARGET='https://results.nayanet.app/';")
          html = html.replace("window.NAYA_WELCOME_V2=true;", "window.NAYA_WELCOME_V3=true;")

          # Keep the welcome copy conversational and remove the extra system-like sentence.
          html = html.replace("<p>Let's take a look.</p>", "<p>I'm here. Let's look at this together.</p>")

          out.write_text(html, encoding='utf-8')
          print(f'Wrote {out} with {len(html.splitlines())} lines / {len(html.encode())} bytes')
          PY

      - name: Verify V3 is complete
        run: |
          test -s AIScoreMAXESS-CLEAN-V3-NAYA-HUMAN-PRESENCE.html
          grep -q "MAXESS_RESULT_V1" AIScoreMAXESS-CLEAN-V3-NAYA-HUMAN-PRESENCE.html
          grep -q "results.nayanet.app" AIScoreMAXESS-CLEAN-V3-NAYA-HUMAN-PRESENCE.html
          grep -q "Naya%20Profile%206.jpg" AIScoreMAXESS-CLEAN-V3-NAYA-HUMAN-PRESENCE.html
          grep -q "function calculate" AIScoreMAXESS-CLEAN-V3-NAYA-HUMAN-PRESENCE.html
          grep -q "function publish" AIScoreMAXESS-CLEAN-V3-NAYA-HUMAN-PRESENCE.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('AIScoreMAXESS-CLEAN-V3-NAYA-HUMAN-PRESENCE.html')
          s=p.read_text()
          assert s.count('<html')==1 and s.count('</html>')==1
          assert s.count('<script>')==1 and s.count('</script>')==1
          print('V3 structural checks passed:', len(s.splitlines()), 'lines', len(s.encode()), 'bytes')
          PY

      - name: Commit full V3 artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AIScoreMAXESS-CLEAN-V3-NAYA-HUMAN-PRESENCE.html
          git commit -m "build: full AIScore V3 Naya repair" || exit 0
          git push
