name: V7 one-shot client wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[v7-wire-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire executable Supabase client loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html')
          s = p.read_text(encoding='utf-8')
          old = "document.head.insertAdjacentHTML('beforeend','<script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js\"><\\/script>');setTimeout(()=>{if(!window.supabase)document.getElementById('composeHint').textContent='Supabase client failed to load. Smart Note creation is blocked rather than simulated.'},800);"
          new = "const supabaseScript=document.createElement('script');supabaseScript.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';supabaseScript.onload=()=>{document.getElementById('composeHint').textContent='Identity ready. CREATE INTELLIGENT BLOCK executes the authenticated V7 transaction.'};supabaseScript.onerror=()=>{document.getElementById('composeHint').textContent='Supabase client failed to load. Smart Note creation is blocked rather than simulated.'};document.head.appendChild(supabaseScript);"
          if old not in s:
              raise SystemExit('Expected V7 loader line not found; refusing to modify source.')
          s = s.replace(old, new, 1)
          marker = '<!-- V7 SMART NOTE CLIENT WIRED -->'
          if marker not in s:
              s = s.replace('</head>', marker + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit wired client and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          git commit -m 'V7 client loader wired [v7-wire-complete]'
          git rm .github/workflows/v7-wire-smart-note-client.yml
          git commit -m 'Remove one-shot V7 wiring workflow [v7-wire-complete]'
          git push
