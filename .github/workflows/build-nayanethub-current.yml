name: Build Current NayaNET Hub from NAYANETHUB

on:
  push:
    paths:
      - 'NAYANETHUB.html'
      - 'scripts/nayanethub-final-execution.js'
      - '.github/workflows/build-nayanethub-current.yml'
  pull_request:
    paths:
      - 'NAYANETHUB.html'
      - 'scripts/nayanethub-final-execution.js'
      - '.github/workflows/build-nayanethub-current.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Hub source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace final Hub execution layer with current V4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('NAYANETHUB.html')
          layer=Path('scripts/nayanethub-final-execution.js')
          html=src.read_text(encoding='utf-8')
          body=layer.read_text(encoding='utf-8')
          # Remove any prior generated final-execution layer, regardless of its version.
          html=re.sub(r'\s*<!-- NAYANETHUB-FINAL-EXECUTION-V\d+ -->\s*<script id="nayanethub-final-execution">.*?</script>\s*', '\n', html, count=1, flags=re.S)
          marker='<!-- NAYANETHUB-FINAL-EXECUTION-V1 -->'
          if '</body>' not in html: raise SystemExit('NAYANETHUB.html has no closing body')
          html=html.replace('</body>',f'\n{marker}\n<script id="nayanethub-final-execution">\n{body}\n</script>\n</body>',1)
          Path('index.html').write_text(html,encoding='utf-8')
          Path('_redirects').write_text('/intelligence/* /index.html 200\n',encoding='utf-8')
          assert 'NAYANETHUB-FINAL-EXECUTION-V4' in html
          assert 'Personal Feed' in html
          assert 'Smart Lists' in html
          assert 'Collective Feed' in html
          assert 'function welcome' in html
          print('CURRENT V4 EXECUTION LAYER VERIFIED')
          print('index bytes:',Path('index.html').stat().st_size)
          PY
      - name: Create Cloudflare package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('NayaNET-Intelligent-Hub-Cloudflare.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write('index.html','index.html')
              z.write('_redirects','_redirects')
          p=Path('NayaNET-Intelligent-Hub-Cloudflare.zip')
          print('ZIP READY:',p.stat().st_size,'bytes')
          PY
      - name: Upload Cloudflare package
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-Cloudflare-CURRENT
          path: |
            NayaNET-Intelligent-Hub-Cloudflare.zip
            index.html
            _redirects
          if-no-files-found: error
      - name: Commit generated production files
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html _redirects
          if git diff --cached --quiet; then echo 'No generated changes'; else git commit -m 'Publish current NayaNET Hub V4 build [skip ci]'; git push; fi

