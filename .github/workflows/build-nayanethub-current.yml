name: Build Current NayaNET Hub from NAYANETHUB

# Canonical Hub release gate. The repository's NAYANETHUB.html is the source of truth;
# this workflow packages the exact source into the Cloudflare-ready root index.html.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'NAYANETHUB.html'
      - '.github/workflows/build-nayanethub-current.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply requested personalized welcome, then restore this workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('NAYANETHUB.html')
          s=p.read_text(encoding='utf-8')
          marker='id="nh-greeting-script"'
          if marker not in s:
            css='''<style id="nh-greeting-style">\n#nh-welcome{margin:18px 0 18px;padding:22px 24px;border:1px solid #d86cff55;border-radius:20px;background:linear-gradient(135deg,#181321,#0b0a0f 65%,#08080b);box-shadow:inset 0 1px #fff5,0 20px 45px #000a;position:relative;overflow:hidden}\n#nh-welcome:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 25%,#d86cff16,transparent 42%);pointer-events:none}\n#nh-greeting{position:relative;margin:0;color:#fff;font-size:clamp(25px,3vw,38px);line-height:1.05;letter-spacing:-.045em}\n#nh-welcome-meta{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}\n.nh-welcome-chip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1px solid #ffffff20;border-radius:999px;background:#08080c;color:#cfc8d6;font-size:8px;font-weight:950;letter-spacing:.08em}\n@media(max-width:900px){#nh-welcome{margin:14px 0;padding:19px 18px}.nh-welcome-chip{font-size:7px}}\n</style>'''
            html='''<section id="nh-welcome" aria-label="Personalized welcome">\n  <h1 id="nh-greeting">Good morning, Shawn.</h1>\n  <div id="nh-welcome-meta" aria-live="polite">\n    <span class="nh-welcome-chip">TIME · <span id="nh-current-time"></span></span>\n    <span class="nh-welcome-chip">DATE · <span id="nh-current-date"></span></span>\n    <span class="nh-welcome-chip">COUNTRY · <span id="nh-current-country"></span></span>\n  </div>\n</section>'''
            js='''<script id="nh-greeting-script">\n(function(){\n  function countryFromTimezone(tz){\n    var map={\n      "America/Vancouver":"Canada","America/Edmonton":"Canada","America/Winnipeg":"Canada","America/Toronto":"Canada","America/Halifax":"Canada","America/St_Johns":"Canada","America/Regina":"Canada","America/Moncton":"Canada","America/Whitehorse":"Canada","America/Dawson":"Canada",\n      "America/Los_Angeles":"United States","America/Denver":"United States","America/Phoenix":"United States","America/Chicago":"United States","America/New_York":"United States","America/Anchorage":"United States","Pacific/Honolulu":"United States",\n      "Europe/London":"United Kingdom","Europe/Dublin":"Ireland","Europe/Paris":"France","Europe/Berlin":"Germany","Europe/Rome":"Italy","Europe/Madrid":"Spain","Europe/Amsterdam":"Netherlands","Europe/Brussels":"Belgium","Europe/Zurich":"Switzerland","Europe/Stockholm":"Sweden","Europe/Oslo":"Norway","Europe/Copenhagen":"Denmark","Europe/Helsinki":"Finland",\n      "Asia/Tokyo":"Japan","Asia/Seoul":"South Korea","Asia/Shanghai":"China","Asia/Singapore":"Singapore","Asia/Kolkata":"India","Asia/Dubai":"United Arab Emirates","Australia/Sydney":"Australia","Australia/Melbourne":"Australia","Pacific/Auckland":"New Zealand"\n    };\n    return map[tz]||((tz||"").split("/")[0]==="America"?"United States":"Local");\n  }\n  function updateIdentity(){\n    var d=new Date(),h=d.getHours();\n    var greeting=h<12?"Good morning, Shawn.":h<17?"Good afternoon, Shawn.":"Good evening, Shawn.";\n    var time=d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});\n    var date=d.toLocaleDateString([], {weekday:"long",year:"numeric",month:"long",day:"numeric"});\n    var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";\n    var country=countryFromTimezone(tz);\n    var g=document.getElementById("nh-greeting"),t=document.getElementById("nh-current-time"),dt=document.getElementById("nh-current-date"),c=document.getElementById("nh-current-country");\n    if(g)g.textContent=greeting;if(t)t.textContent=time;if(dt)dt.textContent=date;if(c)c.textContent=country;\n  }\n  window.updateIdentity=updateIdentity;\n  updateIdentity();\n  setInterval(updateIdentity,1000);\n})();\n</script>'''
            if '</head>' not in s: raise SystemExit('Missing </head> anchor')
            if '<main class="main">' not in s: raise SystemExit('Missing canonical main anchor')
            s=s.replace('</head>',css+'</head>',1)
            s=s.replace('<main class="main">','<main class="main">'+html,1)
            if '</body>' not in s: raise SystemExit('Missing </body> anchor')
            s=s.replace('</body>',js+'</body>',1)
            p.write_text(s,encoding='utf-8')
            print('Surgical personalized welcome inserted into current NAYANETHUB.html')
          else:
            print('Welcome already present; no source change needed')
          PY
          if git diff --quiet -- NAYANETHUB.html; then
            echo 'No Hub source change was made; refusing to commit workflow-only change.'
            exit 0
          fi
          git config user.name 'NayaNET Release Bot'
          git config user.email 'nayanet-release-bot@users.noreply.github.com'
          git checkout HEAD -- .github/workflows/build-nayanethub-current.yml
          git add NAYANETHUB.html .github/workflows/build-nayanethub-current.yml
          git commit -m 'feat: add personalized Hub welcome'
          git push origin HEAD:main
          echo 'Surgical source update committed; stopping this run so the restored canonical workflow packages the exact source on the next run.'
          exit 0
      - name: Normalize canonical Hub authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('NAYANETHUB.html')
          s=p.read_text(encoding='utf-8')
          remove_ids=[
            'nayanet-v7-intelligent-hub-refinement',
            'nayanet-canonical-hub-authority',
            'nayanet-canonical-hub-final-polish',
          ]
          changed=False
          for sid in remove_ids:
            pattern = r"<script[^>]*id=['\"]" + re.escape(sid) + r"['\"][^>]*>.*?</script>"
            s2,n=re.subn(pattern,'',s,flags=re.S)
            if n>1: raise SystemExit(f'Unsafe duplicate script id: {sid} ({n})')
            if n==1: s=s2; changed=True
          old='<strong id="pageTitle">Home</strong>'
          if old in s:
            s=s.replace(old,'<strong id="pageTitle">Your Intelligence Today</strong>',1)
            changed=True
          if 'function updateIdentity(){' not in s: raise SystemExit('Required Intelligent Today runtime missing')
          if 'id="nh-greeting-script"' not in s: raise SystemExit('Required greeting runtime missing')
          if changed: p.write_text(s,encoding='utf-8')
          print('canonical_cleanup_changed=',changed)
          PY
          if ! git diff --quiet -- NAYANETHUB.html; then
            git config user.name 'NayaNET Release Bot'
            git config user.email 'nayanet-release-bot@users.noreply.github.com'
            git add NAYANETHUB.html
            git commit -m 'fix: restore canonical Your Intelligence Today authority'
            git push origin HEAD:main
            echo 'Canonical cleanup committed; stopping this run so the next run packages the resulting source.'
            exit 0
          fi
      - name: Validate canonical source
        run: |
          set -euo pipefail
          test -s NAYANETHUB.html
          test "$(grep -o '<!doctype html>' NAYANETHUB.html | wc -l | tr -d ' ')" -eq 1
          test "$(grep -o '</html>' NAYANETHUB.html | wc -l | tr -d ' ')" -eq 1
          grep -q 'nh-greeting' NAYANETHUB.html
          grep -q 'nh-greeting-script' NAYANETHUB.html
          grep -q 'GOOD MORNING' NAYANETHUB.html
          grep -q 'function updateIdentity' NAYANETHUB.html
          grep -q 'Your Intelligence Today' NAYANETHUB.html
          test "$(grep -o 'id=\"nayanet-canonical-hub-authority\"' NAYANETHUB.html | wc -l)" -eq 0
          test "$(grep -o 'id=\"nayanet-canonical-hub-final-polish\"' NAYANETHUB.html | wc -l)" -eq 0
          test "$(grep -o 'id=\"nayanet-v7-intelligent-hub-refinement\"' NAYANETHUB.html | wc -l)" -eq 0
          git diff --check
      - name: Build exact Cloudflare release ZIP
        run: |
          set -euo pipefail
          cp NAYANETHUB.html index.html
          printf '/index.html 200\n' > _redirects
          test -s index.html
          test "$(wc -c < index.html)" -gt 100000
          zip -9 -j NayaNET-Intelligent-Hub-Cloudflare.zip index.html _redirects NAYANETHUB.html
          unzip -t NayaNET-Intelligent-Hub-Cloudflare.zip
          test "$(unzip -Z1 NayaNET-Intelligent-Hub-Cloudflare.zip | wc -l | tr -d ' ')" -eq 3
          echo "INDEX_BYTES=$(wc -c < index.html)"
          echo "SOURCE_SHA256=$(sha256sum NAYANETHUB.html | awk '{print $1}')"
          echo "INDEX_SHA256=$(sha256sum index.html | awk '{print $1}')"
      - name: Upload production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-Cloudflare
          path: NayaNET-Intelligent-Hub-Cloudflare.zip
          if-no-files-found: error
      - name: Upload canonical source
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Hub-Source-Inspection
          path: NAYANETHUB.html
          if-no-files-found: error
