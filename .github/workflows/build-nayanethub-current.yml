name: Build Current NayaNET Hub from NAYANETHUB

on:
  push:
    paths:
      - 'NAYANETHUB.html'
      - 'scripts/nayanethub-final-execution.js'
      - 'scripts/nayanethub-surgical-v5.js'
      - 'scripts/nayanethub-v5-build-trigger.js'
      - '.github/workflows/build-nayanethub-current.yml'
  pull_request:
    paths:
      - 'NAYANETHUB.html'
      - 'scripts/nayanethub-final-execution.js'
      - 'scripts/nayanethub-surgical-v5.js'
      - 'scripts/nayanethub-v5-build-trigger.js'
      - '.github/workflows/build-nayanethub-current.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Hub source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final Hub execution layer to NAYANETHUB
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('NAYANETHUB.html')
          layer=Path('scripts/nayanethub-final-execution.js')
          html=src.read_text(encoding='utf-8')
          body=layer.read_text(encoding='utf-8')
          marker='<!-- NAYANETHUB-FINAL-EXECUTION-V1 -->'
          if marker not in html:
              if '</body>' not in html: raise SystemExit('NAYANETHUB.html has no closing body')
              html=html.replace('</body>',f'\n{marker}\n<script id="nayanethub-final-execution">\n{body}\n</script>\n</body>',1)
          Path('index.html').write_text(html,encoding='utf-8')
          Path('_redirects').write_text('/intelligence/* /index.html 200\n',encoding='utf-8')
          print('NAYANETHUB bytes:',len(html.encode()))
          print('index bytes:',Path('index.html').stat().st_size)
          PY
      - name: Apply surgical V5 compatibility layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('index.html')
          layer=Path('scripts/nayanethub-surgical-v5.js')
          html=src.read_text(encoding='utf-8')
          body=layer.read_text(encoding='utf-8')
          marker='<!-- NAYANETHUB-FINAL-EXECUTION-V5 -->'
          if marker not in html:
              if '</body>' not in html: raise SystemExit('index.html has no closing body')
              html=html.replace('</body>',f'\n{marker}\n<script id="nayanethub-surgical-v5">\n{body}\n</script>\n</body>',1)
          Path('index.html').write_text(html,encoding='utf-8')
          print('V5 applied; index bytes:',Path('index.html').stat().st_size)
          PY
      - name: Validate requested Hub release and build Cloudflare ZIP
        shell: bash
        run: |
          bad=0
          check(){ if grep -q "$1" "$2"; then echo "PASS: $1 in $2"; else echo "FAIL: $1 in $2"; bad=1; fi; }
          check 'NAYANETHUB-FINAL-EXECUTION-V1' index.html
          check 'NAYANETHUB-FINAL-EXECUTION-V1' NAYANETHUB.html
          check 'NAYANETHUB-FINAL-EXECUTION-V4' index.html
          check 'NAYANETHUB-FINAL-EXECUTION-V5' index.html
          check 'Personal Feed' index.html
          check 'Smart Lists' index.html
          check 'Collective Feed' index.html
          check 'CIRCULATE TO COLLECTIVE' index.html
          check 'Good morning' index.html
          check 'Good afternoon' index.html
          check 'Good evening' index.html
          check 'FAVORITE' index.html
          check 'LOVE' index.html
          check 'data-nh5-star' index.html
          check '<!doctype html>' NAYANETHUB.html
          check '</html>' NAYANETHUB.html
          check '<!doctype html>' index.html
          check '</html>' index.html
          if [ "$bad" -ne 0 ]; then echo 'VALIDATION FAILED'; exit 1; fi
          rm -f NayaNET-Intelligent-Hub-Cloudflare.zip
          zip -q -9 NayaNET-Intelligent-Hub-Cloudflare.zip index.html _redirects
          test -s NayaNET-Intelligent-Hub-Cloudflare.zip
          echo "ZIP READY: $(stat -c%s NayaNET-Intelligent-Hub-Cloudflare.zip) bytes"
      - name: Upload Cloudflare package
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-Cloudflare-CURRENT
          path: |
            NayaNET-Intelligent-Hub-Cloudflare.zip
            index.html
            NAYANETHUB.html
            _redirects
          if-no-files-found: error
      - name: Commit generated production files
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NAYANETHUB.html index.html _redirects
          if git diff --cached --quiet; then echo 'No generated changes'; else git commit -m 'Publish updated NayaNET Hub from NAYANETHUB [skip ci]'; git push; fi

