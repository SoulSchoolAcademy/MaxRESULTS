name: Build Current NayaNET Hub from NAYANETHUB

on:
  push:
    paths:
      - 'NAYANETHUB.html'
      - '.github/workflows/build-nayanethub-current.yml'
  pull_request:
    paths:
      - 'NAYANETHUB.html'
      - '.github/workflows/build-nayanethub-current.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize canonical Hub authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('NAYANETHUB.html')
          s=p.read_text(encoding='utf-8')
          remove_ids=[
            'nayanet-v7-intelligent-hub-refinement',
            'nayanet-canonical-hub-authority',
            'nayanet-canonical-hub-final-polish',
          ]
          changed=False
          for sid in remove_ids:
            pattern = r"<script[^>]*id=['\"]" + re.escape(sid) + r"['\"][^>]*>.*?</script>"
            s2,n=re.subn(pattern,'',s,flags=re.S)
            if n>1:
              raise SystemExit(f'Unsafe duplicate script id: {sid} ({n})')
            if n==1:
              s=s2
              changed=True
          old='<strong id="pageTitle">Home</strong>'
          new='<strong id="pageTitle">Your Intelligence Today</strong>'
          if old in s:
            s=s.replace(old,new,1)
            changed=True
          if 'function updateIdentity(){' not in s:
            raise SystemExit('Required Intelligent Today implementation missing')
          if 'id="nh-greeting-script"' not in s:
            raise SystemExit('Required greeting runtime missing')
          if changed:
            p.write_text(s,encoding='utf-8')
          print('canonical_cleanup_changed=',changed)
          PY
          if git diff --quiet -- NAYANETHUB.html; then
            echo 'No canonical cleanup changes required.'
          else
            git config user.name 'NayaNET Release Bot'
            git config user.email 'nayanet-release-bot@users.noreply.github.com'
            git add NAYANETHUB.html
            git commit -m 'fix: restore canonical Your Intelligence Today authority'
            git push origin HEAD:main
            echo 'Canonical cleanup committed; workflow will re-run against the resulting source.'
            exit 0
          fi
      - name: Validate canonical source
        run: |
          set -e
          test -s NAYANETHUB.html
          grep -q 'nh-greeting' NAYANETHUB.html
          grep -q 'nh-greeting-script' NAYANETHUB.html
          grep -q 'GOOD MORNING' NAYANETHUB.html
          grep -q 'function updateIdentity' NAYANETHUB.html
          test "$(grep -o 'id=\"nayanet-canonical-hub-authority\"' NAYANETHUB.html | wc -l)" -eq 0
          test "$(grep -o 'id=\"nayanet-canonical-hub-final-polish\"' NAYANETHUB.html | wc -l)" -eq 0
          git diff --check
      - name: Package canonical source unchanged
        run: |
          set -e
          cp NAYANETHUB.html index.html
          printf '/index.html 200\n' > _redirects
          zip -9 -j NayaNET-Intelligent-Hub-Cloudflare.zip index.html _redirects NAYANETHUB.html
          unzip -t NayaNET-Intelligent-Hub-Cloudflare.zip
      - name: Upload production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Intelligent-Hub-Cloudflare
          path: NayaNET-Intelligent-Hub-Cloudflare.zip
          if-no-files-found: error
      - name: Upload canonical source for controlled inspection
        uses: actions/upload-artifact@v4
        with:
          name: NayaNET-Hub-Source-Inspection
          path: NAYANETHUB.html
          if-no-files-found: error
