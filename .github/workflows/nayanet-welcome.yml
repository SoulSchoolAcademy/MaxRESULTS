name: NayaNET Welcome Upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add welcome layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NAYAHUB.html')
          s = p.read_text(encoding='utf-8')
          marker = 'NAYANET-PRIVACY-FIRST-WELCOME-V1'
          if marker in s:
              raise SystemExit(0)

          css = '''<style id="nayanet-privacy-welcome-style">
          .nh-welcome{position:relative;margin:0 0 22px;padding:24px 26px;border:2px solid #8b63ff66;border-radius:22px;background:radial-gradient(700px 180px at 18% 0%,#d86cff18,transparent 65%),linear-gradient(145deg,#15111d,#09090d);box-shadow:inset 0 1px #fff5,0 20px 45px #000b,0 0 30px #6675ff12;overflow:hidden}
          .nh-welcome:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(#55e39a,#d86cff,#6675ff);box-shadow:0 0 18px #d86cff66}
          .nh-welcome-eyebrow{font-size:8px;font-weight:1000;letter-spacing:.18em;color:#b99aff;margin-bottom:8px}
          .nh-welcome h1{font-size:clamp(30px,4vw,50px)!important;line-height:1!important;letter-spacing:-.055em!important;margin:0!important}
          .nh-welcome-sub{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;color:#cfc9d6;font-size:10px;line-height:1.5}
          .nh-welcome-chip{padding:6px 9px;border:1px solid #ffffff18;border-radius:999px;background:#08080c;color:#aaa4b1;font-size:7px;font-weight:900;letter-spacing:.06em}
          @media(max-width:900px){.nh-welcome{padding:20px 21px;border-radius:18px}.nh-welcome h1{font-size:32px!important}.nh-welcome-sub{font-size:9px}}
          </style>'''

          js = '''<script id="nayanet-privacy-welcome-runtime">
          (function(){'use strict';
            const name='Shawn';
            const h=document.querySelector('#page-home .heroIntro h1');
            if(!h)return;
            const now=new Date();
            const hour=now.getHours();
            const greeting=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
            const locale=navigator.language||'en-CA';
            const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
            const dateFmt=new Intl.DateTimeFormat(locale,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
            const timeFmt=new Intl.DateTimeFormat(locale,{hour:'numeric',minute:'2-digit'});
            const region=(locale.match(/[-_]([A-Z]{2})$/)||[])[1]||'';
            const zoneCountry={
              'America/Vancouver':'Canada','America/Edmonton':'Canada','America/Winnipeg':'Canada','America/Toronto':'Canada','America/Halifax':'Canada','America/St_Johns':'Canada',
              'America/Los_Angeles':'United States','America/Denver':'United States','America/Chicago':'United States','America/New_York':'United States',
              'Europe/London':'United Kingdom','Europe/Dublin':'Ireland','Europe/Paris':'France','Europe/Berlin':'Germany','Europe/Madrid':'Spain','Europe/Rome':'Italy',
              'Asia/Tokyo':'Japan','Asia/Seoul':'South Korea','Asia/Singapore':'Singapore','Australia/Sydney':'Australia','Pacific/Auckland':'New Zealand'
            };
            const regionCountry={CA:'Canada',US:'United States',GB:'United Kingdom',IE:'Ireland',AU:'Australia',NZ:'New Zealand',FR:'France',DE:'Germany',ES:'Spain',IT:'Italy',JP:'Japan',KR:'South Korea',SG:'Singapore'};
            const country=regionCountry[region]||zoneCountry[tz]||'Your country';
            const wrap=document.createElement('section');
            wrap.className='nh-welcome';
            wrap.innerHTML='<div class="nh-welcome-eyebrow">YOUR INTELLIGENCE TODAY</div><h1>'+greeting+', '+name+'.</h1><div class="nh-welcome-sub"><span class="nh-welcome-chip">LOCAL TIME · '+timeFmt.format(now)+'</span><span class="nh-welcome-chip">'+dateFmt.format(now)+'</span><span class="nh-welcome-chip">'+country+'</span><span class="nh-welcome-chip">PRIVACY-FIRST · COUNTRY LEVEL</span></div>';
            h.parentElement.replaceWith(wrap);
          })();
          </script>'''

          if '</head>' not in s:
              raise SystemExit('Missing </head>')
          s = s.replace('</head>', css + js + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NAYAHUB.html .github/workflows/nayanet-welcome.yml
          git commit -m "Add privacy-first local welcome to NayaNET Hub"
          git rm .github/workflows/nayanet-welcome.yml
          git commit -m "Remove temporary welcome workflow"
          git push
