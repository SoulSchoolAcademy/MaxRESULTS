name: One-shot NayaNET Hub V5 surgical patch
on:
  push:
    paths:
      - 'scripts/nayanethub-surgical-patch-v5.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify surgical patch
        shell: bash
        run: |
          set -e
          python3 scripts/nayanethub-surgical-patch-v5.py
          node --check scripts/nayanethub-final-execution.js
          grep -q 'FAVS' NAYANETHUB.html
          grep -q 'data-love' NAYANETHUB.html
          grep -q 'data-rate' NAYANETHUB.html
          grep -q 'resolveBlock' NAYANETHUB.html
          grep -q 'nh-v4-edit-identity' NAYANETHUB.html
          ! grep -q 'prompt(' NAYANETHUB.html
          test "$(grep -o '<!doctype html>' NAYANETHUB.html | wc -l)" -eq 1
          test "$(grep -o '</html>' NAYANETHUB.html | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NAYANETHUB.html scripts/nayanethub-final-execution.js scripts/nayanethub-surgical-patch-v5.py .github/workflows/nayanethub-surgical-patch-v5.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m 'Surgical Hub V5: identity integrity, favorites, social actions, and Smart List references [skip ci]'
          git push