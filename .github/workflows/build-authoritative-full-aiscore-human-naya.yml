name: build-authoritative-full-aiscore-human-naya
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: contains(github.event.head_commit.message, 'BUILD AUTHORITATIVE FULL AISCORE HUMAN NAYA') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build complete artifact from authoritative full AIScore
        run: |
          git fetch origin feat/aiscore-clean-v1:refs/remotes/origin/feat/aiscore-clean-v1
          git checkout -B feat/aiscore-clean-v1 origin/feat/aiscore-clean-v1
          git show origin/main:'AIScoreMAXESS code' > /tmp/AIScoreMAXESS-full.html
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/AIScoreMAXESS-full.html').read_text(encoding='utf-8')
          src=src.replace("const RESULTS_URL = 'https://results.nayanet.app/';", "const RESULTS_URL = 'https://results.kninet.app/';")
          src=src.replace("window.location.assign(`${RESULTS_URL}#maxess-result=${encoded}`);", "window.location.assign(`${RESULTS_URL}?result=${encoded}#maxess-result=${encoded}`);")
          src=src.replace('https://i.postimg.cc/bw4fyKF8/Naya-Profile-black-face-zoom.jpg','https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg')
          overlay=r'''<style id="MAXESS-NAYA-HUMAN-AAA">
#teachingInterstitial .teaching-cloud{width:min(760px,94vw);min-height:360px;padding:58px 48px 38px;text-align:left;border-radius:38px;background:linear-gradient(145deg,#2b1556 0%,#1b0d38 48%,#100820 100%);border:1px solid rgba(197,160,255,.34);box-shadow:0 38px 110px rgba(0,0,0,.74),0 0 85px rgba(109,53,201,.30),inset 0 1px 0 rgba(255,255,255,.12);overflow:visible}
#teachingInterstitial .cloud-glow,#teachingInterstitial .cloud-icon,#teachingInterstitial .cloud-eyebrow{display:none}
#teachingInterstitial .cloud-title{max-width:590px;margin:0;font-size:clamp(30px,4vw,46px);line-height:1.04;color:#fff}
#teachingInterstitial .cloud-body{max-width:590px;margin:16px 0 0;color:rgba(255,255,255,.78);font-size:17px;line-height:1.62}
#teachingInterstitial .cloud-actions{justify-content:flex-start;margin-top:27px;flex-wrap:wrap}
#teachingInterstitial .cloud-button{min-height:54px;border-radius:17px}
#teachingInterstitial .maxess-naya-human{position:absolute;right:26px;top:-62px;width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:center top;border:5px solid #fff;box-shadow:0 18px 42px rgba(0,0,0,.58),0 0 36px rgba(165,108,255,.46)}
#teachingInterstitial .maxess-naya-human-caption{position:absolute;right:28px;top:98px;color:#fff;font-size:12px;font-weight:900;text-shadow:0 2px 8px #000}
#teachingInterstitial .maxess-naya-listen{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.30)}
@media(max-width:640px){#teachingInterstitial{padding:16px}#teachingInterstitial .teaching-cloud{width:100%;padding:78px 24px 26px;min-height:0;border-radius:30px}#teachingInterstitial .maxess-naya-human{right:20px;top:-52px;width:118px;height:118px}#teachingInterstitial .maxess-naya-human-caption{right:23px;top:73px;font-size:10px}#teachingInterstitial .cloud-title{font-size:31px}#teachingInterstitial .cloud-body{font-size:15px}#teachingInterstitial .cloud-actions{flex-direction:column;align-items:stretch}#teachingInterstitial .cloud-button{width:100%}}
@media(prefers-reduced-motion:reduce){#teachingInterstitial .teaching-cloud{animation:none!important}}
</style>'''
          src=src.replace('</head>',overlay+'\n</head>',1)
          script=r'''<script id="MAXESS-NAYA-HUMAN-AAA-JS">
(function(){
  const interstitial=document.getElementById('teachingInterstitial');if(!interstitial)return;const cloud=interstitial.querySelector('.teaching-cloud');if(!cloud)return;
  let portrait=cloud.querySelector('.maxess-naya-human');if(!portrait){portrait=document.createElement('img');portrait.className='maxess-naya-human';portrait.src='https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg';portrait.alt='Naya';cloud.appendChild(portrait);}
  let caption=cloud.querySelector('.maxess-naya-human-caption');if(!caption){caption=document.createElement('div');caption.className='maxess-naya-human-caption';caption.textContent='Naya';cloud.appendChild(caption);}
  const body=cloud.querySelector('.cloud-body'),title=cloud.querySelector('.cloud-title'),continueButton=document.getElementById('cloudContinue');
  function humanize(){const first=(state.currentQuestionIndex===0&&state.responses.length===0);title.textContent=first?"I'm here.":"Let's look at this together.";const q=typeof currentQuestion==='function'?currentQuestion():null;body.textContent=first?"Let's look at this together. It'll take about three minutes, and I'll help you understand what each question is really asking. Just answer honestly based on what you actually do today.":(q&&q.teaching?q.teaching:"Take a moment and choose the answer that feels most like you today.");if(continueButton)continueButton.innerHTML=(first?"LET'S GO":"GOT IT — LET'S GO")+' <span class="button-arrow">→</span>';}
  const observer=new MutationObserver(()=>{if(interstitial.classList.contains('visible'))humanize();});observer.observe(interstitial,{attributes:true,attributeFilter:['class']});setTimeout(()=>{if(interstitial.classList.contains('visible'))humanize();},220);
  const listen=document.createElement('button');listen.type='button';listen.className='cloud-button maxess-naya-listen';listen.textContent='PLAY NAYA';listen.addEventListener('click',()=>{const q=typeof currentQuestion==='function'?currentQuestion():null;if('speechSynthesis' in window&&q){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.teaching||q.question);u.rate=.94;u.pitch=1.02;speechSynthesis.speak(u);}catch(e){}}});const actions=cloud.querySelector('.cloud-actions');if(actions&&!actions.querySelector('.maxess-naya-listen'))actions.insertBefore(listen,actions.firstChild);
  window.MAXESS_NAYA_HUMANIZED=true;
})();
</script>'''
          src=src.replace('</body>',script+'\n</body>',1)
          Path('AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html').write_text(src,encoding='utf-8')
          print('bytes',len(src.encode()),'lines',len(src.splitlines()))
          PY
          grep -q 'results.kninet.app/?result=' AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          grep -q 'Naya%20Profile%206.jpg' AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          grep -q 'MAXESS-NAYA-HUMAN-AAA' AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          grep -q 'MAXESS_RESULT_V1' AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          grep -q 'function calculateResults' AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          git commit -m 'BUILD AUTHORITATIVE FULL AISCORE HUMAN NAYA'
          git push origin feat/aiscore-clean-v1
