name: NayaNET Hub — Surgical Greeting Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nayanethub-greeting-surgical-once.yml'
permissions:
  contents: write
jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make one surgical greeting change
        shell: python
        run: |
          from pathlib import Path
          p = Path('NAYANETHUB.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="heroIntro"><h1>Good morning, Shawn.</h1><p>Your intelligence has a place to come together.</p></div>'
          new = '''<div class="heroIntro"><h1 id="nh-greeting">Good morning, Shawn.</h1><p id="nh-greeting-meta">Your intelligence has a place to come together.</p></div>'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one existing greeting; found {s.count(old)}')
          s = s.replace(old, new, 1)
          css = '''<style id="nh-greeting-style">#nh-greeting{font-size:clamp(48px,6vw,78px)!important;line-height:.88!important;letter-spacing:-.075em!important}#nh-greeting-meta{margin-top:14px!important;color:#ddd9e4;font-size:13px!important;font-weight:700;letter-spacing:.02em}</style>'''
          js = '''<script id="nh-greeting-script">(()=>{const k='nayanet_smart_name';function run(){const h=document.getElementById('nh-greeting'),m=document.getElementById('nh-greeting-meta');if(!h||!m)return;let n=(localStorage.getItem(k)||'Shawn').trim();const d=new Date(),g=d.getHours()<12?'GOOD MORNING':d.getHours()<18?'GOOD AFTERNOON':'GOOD EVENING';h.textContent=`${g}, ${n.toUpperCase()}`;const time=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),date=d.toLocaleDateString([], {weekday:'long',year:'numeric',month:'long',day:'numeric'}),zone=Intl.DateTimeFormat().resolvedOptions().timeZone||'';const country=zone==='America/Vancouver'?'🇨🇦 Canada':zone.startsWith('America/')?'Canada':'';m.textContent=[time,date,country].filter(Boolean).join(' · ')}run();setInterval(run,60000)})();</script>'''
          marker='</body>'
          if marker not in s: raise SystemExit('No closing body tag')
          s=s.replace(marker,css+js+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify surgical diff shape
        run: |
          git diff --check
          git diff -- NAYANETHUB.html
          grep -q 'id="nh-greeting"' NAYANETHUB.html
          grep -q 'GOOD MORNING' NAYANETHUB.html
          grep -q 'GOOD AFTERNOON' NAYANETHUB.html
          grep -q 'GOOD EVENING' NAYANETHUB.html
          grep -q 'nayanet_smart_name' NAYANETHUB.html
          grep -q 'toLocaleTimeString' NAYANETHUB.html
          grep -q 'toLocaleDateString' NAYANETHUB.html
      - name: Commit source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NAYANETHUB.html
          git diff --cached --check
          git commit -m 'Add dynamic local greeting to NayaNET Hub'
          git push
