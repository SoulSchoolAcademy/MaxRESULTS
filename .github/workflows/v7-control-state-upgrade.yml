name: V7 Control State Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v7-control-state-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Apply surgical control-state and mobile polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('CLOUDFLARE-INTELLIGENT-HUB-V7/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'NAYA_V7_CONTROL_STATE_POLISH_20260906'
          if marker not in s:
              css = r'''<style id="NAYA_V7_CONTROL_STATE_POLISH_20260906">
          /* NAYA V7 CONTROL STATE POLISH — OFF = PURPLE PRESENCE, ON = EMERALD GO */
          :root{--v7-purple:#b27cff;--v7-purple-soft:#b27cff66;--v7-green:#55e39a;--v7-green-soft:#55e39a80;--v7-blue:#55b9ee;--v7-white:#f7f6f2}
          .btn,.featureButton,.filter,.noteTab,.mobileNav button,.hubAction,.hubSeg button,.hubRailButton,.ibf-brief,.mailTab,.mailAction,.actions .btn{position:relative;isolation:isolate}
          .btn,.hubAction,.hubRailButton,.ibf-brief,.mailAction,.actions .btn{border-color:var(--v7-purple-soft)!important;box-shadow:inset 0 1px #fff5,0 0 0 1px #b27cff18,0 0 28px #b27cff30,0 10px 26px #000a!important}
          .btn:hover,.hubAction:hover,.hubRailButton:hover,.ibf-brief:hover,.mailAction:hover,.actions .btn:hover{border-color:var(--v7-purple)!important;box-shadow:inset 0 1px #fff7,0 0 0 2px #b27cff22,0 0 42px #b27cff52,0 16px 34px #000b!important}
          .btn:active,.btn.active,.btn[aria-pressed="true"],.hubAction:active,.hubRailButton:active,.ibf-brief:active,.mailAction:active,.actions .btn:active{border-color:var(--v7-green)!important;background:linear-gradient(145deg,#163322,#0b1710)!important;color:#fff!important;box-shadow:inset 0 1px #dffff0,inset 0 0 22px #55e39a14,0 0 0 2px #55e39a24,0 0 42px #55e39a62,0 10px 28px #000b!important}
          .featureButton{border-color:#b27cff88!important;background:linear-gradient(145deg,#171022,#0b0910)!important;color:#fff!important;box-shadow:inset 0 1px #fff6,0 0 0 1px #b27cff18,0 0 34px #b27cff3d,0 12px 30px #000c!important}
          .featureButton:hover{border-color:#b27cff!important;background:linear-gradient(145deg,#241536,#100b18)!important;box-shadow:inset 0 1px #fff8,0 0 0 2px #b27cff25,0 0 48px #b27cff66,0 18px 38px #000d!important}
          .featureButton:active,.featureButton.active,[aria-pressed="true"].featureButton{border-color:var(--v7-green)!important;background:linear-gradient(145deg,#163b28,#0b1710)!important;box-shadow:inset 0 1px #eafff2,0 0 0 2px #55e39a2b,0 0 52px #55e39a70,0 10px 24px #000d!important}
          .nav button{border-color:#b27cff30!important;box-shadow:0 0 18px #b27cff12!important}
          .nav button:hover{border-color:#b27cff88!important;box-shadow:inset 0 1px #fff5,0 0 30px #b27cff30,0 12px 25px #0008!important}
          .nav button.active{border-color:var(--v7-green)!important;background:linear-gradient(145deg,#11251a,#0b0f0d)!important;box-shadow:inset 0 1px #fff7,0 0 0 2px #55e39a18,0 0 32px #55e39a45,0 15px 32px #000a!important}
          .nav button.active:after{background:var(--v7-green)!important;box-shadow:0 0 18px var(--v7-green),0 0 38px #55e39a88!important}
          .filter,.noteTab{border-color:#b27cff42!important;box-shadow:0 0 18px #b27cff18!important}
          .filter:hover,.noteTab:hover{border-color:#b27cff!important;box-shadow:0 0 28px #b27cff38!important}
          .filter.active,.noteTab.active{background:linear-gradient(145deg,#173b29,#0d1912)!important;color:#fff!important;border-color:var(--v7-green)!important;box-shadow:0 0 0 2px #55e39a1e,0 0 32px #55e39a55!important}
          .mobileNav{border-color:#b27cff50!important;box-shadow:0 0 34px #b27cff1e,0 20px 60px #000e!important}
          .mobileNav button{border:1px solid #b27cff28!important}
          .mobileNav button.active{background:linear-gradient(145deg,#173b29,#0b1710)!important;color:#fff!important;border-color:var(--v7-green)!important;box-shadow:0 0 0 2px #55e39a1b,0 0 28px #55e39a4d!important}
          .mobileNav button.active:after{background:var(--v7-green)!important;box-shadow:0 0 14px var(--v7-green)!important}
          .search,.compose textarea,.mailCompose input,.mailCompose textarea{border-color:#b27cff38!important;box-shadow:inset 0 1px #fff3,0 0 20px #b27cff12,0 10px 25px #0008!important}
          .search:focus,.compose textarea:focus,.mailCompose input:focus,.mailCompose textarea:focus{border-color:var(--v7-green)!important;box-shadow:inset 0 1px #fff5,0 0 0 2px #55e39a18,0 0 30px #55e39a32!important}
          @media(max-width:900px){
            html,body{max-width:100%;overflow-x:hidden}
            .main{width:100%;min-width:0;padding-left:14px;padding-right:14px;padding-bottom:105px}
            .topbar{padding:0 2px}
            .topright{min-width:0}.connectionPill{max-width:48px;overflow:hidden}
            .heroState,.surface,.sourceBox,.featureBoard,.card,.noteCard,.mailSurface,.reportStrip{max-width:100%;min-width:0}
            .featureButton,.btn{min-height:50px}
            .stateActions,.controls,.composeRow,.actions{align-items:stretch}
            .stateActions .btn,.controls .btn{flex:1 1 180px}
            .feedRow{min-width:0}.feedRow p,.feedRow b{overflow-wrap:anywhere}
            .homeIntro h1,.pageHead h1{overflow-wrap:anywhere}
            .servicePath{width:100%}
          }
          @media(max-width:520px){
            .main{padding-left:10px;padding-right:10px}
            .topbar{height:62px}
            .crumb strong{font-size:15px}
            .avatar{width:38px;height:38px}
            .homeIntro h1{font-size:42px}
            .stateCopy{padding:22px 18px 20px}.stateCopy h2{font-size:28px}
            .featureBoard{padding:22px 16px 17px}.featureBoard h3{font-size:24px}
            .powerOrb{width:132px;height:132px}.orbCore{width:66px;height:66px}
            .surfaceHeader{padding:18px 15px}.feedRow{grid-template-columns:45px 12px minmax(0,1fr);gap:9px;padding:15px 13px}
            .reportStrip{padding:20px 17px}.reportStrip h2{font-size:22px}
            .btn{padding-left:14px;padding-right:14px}
            .mobileNav{left:7px;right:7px;bottom:7px;height:64px}
          }
          @media(prefers-reduced-motion:reduce){.btn,.featureButton,.filter,.noteTab,.mobileNav button,.hubAction,.hubRailButton,.ibf-brief{transition:none!important}}
          </style>'''
              s = s.replace('</head>', css+'\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          print('Applied:', marker)
          print('index bytes:', p.stat().st_size)
          PY

      - name: Validate HTML and JavaScript boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'NAYA_V7_CONTROL_STATE_POLISH_20260906' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'NayaNET — Intelligent Hub V7' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'v7-smart-note-runtime.js' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          grep -Fq 'v7-release-enhancements.js' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          test "$(grep -o '<html' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html | wc -l)" -eq 1
          test "$(grep -o '</html>' CLOUDFLARE-INTELLIGENT-HUB-V7/index.html | wc -l)" -eq 1
          node --check CLOUDFLARE-INTELLIGENT-HUB-V7/worker.js
          node --check CLOUDFLARE-INTELLIGENT-HUB-V7/v7-smart-note-runtime.js
          node --check CLOUDFLARE-INTELLIGENT-HUB-V7/v7-release-enhancements.js

      - name: Commit surgical upgrade
        shell: bash
        run: |
          git config user.name 'NayaNET Upgrade Bot'
          git config user.email 'nayanet-upgrade-bot@users.noreply.github.com'
          git add CLOUDFLARE-INTELLIGENT-HUB-V7/index.html
          git commit -m 'V7 control state and mobile polish' || true
          git push
