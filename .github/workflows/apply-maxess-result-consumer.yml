name: Apply MAXESS Results Consumer Guard

on:
  push:
    branches:
      - maxess-results-v21-working
    paths:
      - 'tools/execute_maxess_result_consumer.py'
      - '.github/workflows/apply-maxess-result-consumer.yml'
      - 'MAXESS-RESULT-CONSUMER-V1.html'
      - 'E01-SECTION-01-WORKING.html'
      - 'E02-SECTION-02-WORKING.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maxess-result-consumer
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working Results branch
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          fetch-depth: 0

      - name: Apply canonical transport cleanup
        run: python tools/execute_maxess_result_consumer.py

      - name: Static consumer QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          consumer=Path('MAXESS-RESULT-CONSUMER-V1.html').read_text(encoding='utf-8')
          e01=Path('E01-SECTION-01-WORKING.html').read_text(encoding='utf-8')
          e02=Path('E02-SECTION-02-WORKING.html').read_text(encoding='utf-8')
          required=['MAXESS_RESULT_CONSUMER_V1','MAXESS_RESULT_V1','window.MAXESS_RESULT','MAXESS_RESULT_READY','maxess:result-updated']
          missing=[x for x in required if x not in consumer]
          if missing: raise SystemExit('Missing standalone consumer evidence: '+', '.join(missing))
          if MARKER_COUNT := consumer.count('MAXESS_RESULT_CONSUMER_V1') != 2: raise SystemExit('Standalone consumer marker count failed')
          if 'MAXESS_RESULT_CONSUMER_V1' in e01: raise SystemExit('Embedded E01 consumer remains')
          if 'MAXESS_RESULT_CONSUMER_V1' in e02: raise SystemExit('Embedded E02 consumer remains')
          if 'location.hash' in e01 or 'location.hash' in e02: raise SystemExit('Section-level hash transport remains')
          if 'decodeResultPayload' in e02 or 'hydrateFromHash' in e02 or 'hydrateFromStorage' in e02: raise SystemExit('E02 competing transport remains')
          if 'DEMO_SCORE=82' in e01 or 'Preview score 82' in e01: raise SystemExit('Hard-coded demo score remains')
          for path,text in [('MAXESS-RESULT-CONSUMER-V1.html',consumer),('E01-SECTION-01-WORKING.html',e01),('E02-SECTION-02-WORKING.html',e02)]:
              if re.search(r'(^|\\n)(<<<<<<<|=======|>>>>>>>)( |\\n|$)',text): raise SystemExit(f'Conflict marker in {path}')
          print('RESULT TRANSPORT STATIC QA: PASS')
          print('consumer bytes:',len(consumer.encode()))
          print('E01 bytes:',len(e01.encode()))
          print('E02 bytes:',len(e02.encode()))
          PY

      - name: JavaScript syntax QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          paths=['MAXESS-RESULT-CONSUMER-V1.html','E01-SECTION-01-WORKING.html','E02-SECTION-02-WORKING.html']
          scripts=[]
          for path in paths:
              s=Path(path).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
              scripts.extend(blocks)
          Path('/tmp/maxess-transport-scripts.js').write_text('\\n'.join(scripts),encoding='utf-8')
          print('script blocks:',len(scripts))
          PY
          node --check /tmp/maxess-transport-scripts.js

      - name: Diff proof
        run: |
          git diff --check
          git status --short
          git diff --stat
          git diff -- MAXESS-RESULT-CONSUMER-V1.html E01-SECTION-01-WORKING.html E02-SECTION-02-WORKING.html tools/execute_maxess_result_consumer.py .github/workflows/apply-maxess-result-consumer.yml

      - name: Commit only when cleanup changed tracked source
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add MAXESS-RESULT-CONSUMER-V1.html E01-SECTION-01-WORKING.html E02-SECTION-02-WORKING.html tools/execute_maxess_result_consumer.py .github/workflows/apply-maxess-result-consumer.yml
          git diff --cached --check
          if git diff --cached --quiet; then echo 'TRANSPORT CLEANUP ALREADY APPLIED'; exit 0; fi
          git commit -m 'MAXESS Results — enforce single standalone result consumer'
          git push origin maxess-results-v21-working
