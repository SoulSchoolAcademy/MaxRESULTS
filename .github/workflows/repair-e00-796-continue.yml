name: MAXESS E00 796 — Continue + Terminal Results Hardening

on:
  push:
    branches: [main]
    paths:
      - 'E00 796'
      - '.github/workflows/repair-e00-796-continue.yml'
      - 'PATCH_E00_TRIGGER'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply smallest deterministic E00 796 repair
        shell: python
        run: |
          from pathlib import Path

          p=Path('E00 796')
          s=p.read_text(encoding='utf-8')
          original=s

          required=[
              'id="maxess-ai-score"',
              'function save()',
              'function calculate()',
              'function publish()',
              'function next()',
              'const S=',
              'function attemptResultsHandoff(result)',
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'Marker missing: {marker}')

          # 1. Strict score-object contract. S is a keyed object, not an array.
          bad="if(!Array.isArray(S)||Object.keys(S).length!==15)"
          if bad in s:
              s=s.replace(
                  "if(!Array.isArray(S)||Object.keys(S).length!==15)throw Error('Score matrix structure invalid');",
                  "if(!S||typeof S!=='object'||Array.isArray(S)||Object.keys(S).length!==15)throw Error('Score matrix structure invalid');Object.keys(S).forEach(k=>{if(!/^([1-9]|1[0-5])$/.test(k)||!Array.isArray(S[k])||S[k].length!==5)throw Error('Score matrix row invalid');});",
                  1,
              )

          # 2. Authoritative Continue boundary: capture click + pointer + keyboard,
          # scoped to this MAXESS root, with duplicate-submit protection.
          old_listener="""document.addEventListener('click',e=>{
  const button=e.target.closest('#maxess-ai-score #continueButton');
  if(!button)return;
  e.preventDefault();
  e.stopPropagation();
  if(button.disabled)return;
  next();
},true);"""
          new_listener="""function executeContinue(e){
  const root=$('maxess-ai-score');
  const button=e.target&&e.target.closest?e.target.closest('#continueButton'):null;
  if(!button||!root||!root.contains(button))return;
  if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
  e.preventDefault();
  e.stopPropagation();
  if(e.stopImmediatePropagation)e.stopImmediatePropagation();
  if(button.disabled||state.finalizing||state.mode!=='ASSESSMENT'||!state.selected)return;
  next();
}
document.addEventListener('click',executeContinue,true);
document.addEventListener('pointerup',executeContinue,true);
document.addEventListener('keydown',executeContinue,true);"""
          if old_listener in s:
              s=s.replace(old_listener,new_listener,1)
          elif "function executeContinue(e)" not in s:
              raise SystemExit('Continue boundary anchor missing')

          # 3. Harden the state transition so an exception cannot strand the UI.
          old_next="function next(){if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;if(state.i===14){publish();return;}save();state.i++;render();setTimeout(()=>openNaya(),120);}"
          new_next="function next(){if(state.finalizing||!state.selected||state.mode!=='ASSESSMENT')return;try{if(state.i===14){if(!publish())throw Error('Terminal publish failed');return;}save();state.i++;render();setTimeout(()=>openNaya(),120);}catch(e){console.error('MAXESS Continue execution error',e);state.finalizing=false;state.mode='ASSESSMENT';updateContinue();$('continueText').textContent='Continue';}}"
          if old_next in s:
              s=s.replace(old_next,new_next,1)

          # 4. Terminal boundary: Q15 save -> calculate -> build -> validate ->
          # store -> broadcast -> local verification -> Results handoff.
          old_tail="releaseResultsSections(result);window.MAXESS_RESULT_HANDOFF_URL = null; return true;"
          new_tail="releaseResultsSections(result);const handedOff=attemptResultsHandoff(result);if(!handedOff)console.warn('MAXESS Results handoff unavailable; verified local Results retained.');return true;"
          if old_tail in s:
              s=s.replace(old_tail,new_tail,1)
          elif "attemptResultsHandoff(result);" not in s:
              anchor="releaseResultsSections(result);"
              if anchor not in s:
                  raise SystemExit('Results release anchor missing')
              s=s.replace(anchor,anchor+"const handedOff=attemptResultsHandoff(result);if(!handedOff)console.warn('MAXESS Results handoff unavailable; verified local Results retained.');",1)

          if s==original:
              raise SystemExit('No E00 mutation required; refusing empty repair commit')

          p.write_text(s,encoding='utf-8')
          print('E00 796 patched:',len(original),'->',len(s),'bytes')

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          grep -F "typeof S!=='object'" 'E00 796' >/dev/null
          grep -F "S[k].length!==5" 'E00 796' >/dev/null
          grep -F "function executeContinue(e)" 'E00 796' >/dev/null
          grep -F "document.addEventListener('click',executeContinue,true)" 'E00 796' >/dev/null
          grep -F "document.addEventListener('pointerup',executeContinue,true)" 'E00 796' >/dev/null
          grep -F "document.addEventListener('keydown',executeContinue,true)" 'E00 796' >/dev/null
          grep -F "MAXESS Continue execution error" 'E00 796' >/dev/null
          grep -F "function calculate()" 'E00 796' >/dev/null
          grep -F "function buildResult()" 'E00 796' >/dev/null
          grep -F "function valid(c)" 'E00 796' >/dev/null
          grep -F "persistResult(result);" 'E00 796' >/dev/null
          grep -F "broadcast(result);" 'E00 796' >/dev/null
          grep -F "renderLocalResults(result);" 'E00 796' >/dev/null
          grep -F "attemptResultsHandoff(result);" 'E00 796' >/dev/null
          grep -F "https://results.nayanet.app/#maxess-result=" 'E00 796' >/dev/null
          node --check <(sed -n '/<script>/,/<\/script>/p' 'E00 796' | sed '1d;$d')
          echo 'E00 796 Continue + terminal Results static QA: PASS'

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add 'E00 796'
          if git diff --cached --quiet; then
            echo 'NO CHANGE'
            exit 0
          fi
          git commit -m 'fix: harden MAXESS Continue and terminal Results handoff'
          git push origin main
