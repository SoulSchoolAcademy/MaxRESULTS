name: MAXESS E00 796 — Continue + Scoring Hardening

on:
  push:
    branches: [main]
    paths:
      - 'E00 796'
      - '.github/workflows/repair-e00-796-continue.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch Continue event boundary and scoring guards
        shell: python
        run: |
          from pathlib import Path

          p = Path('E00 796')
          s = p.read_text(encoding='utf-8')
          original = s

          required = [
              'id="maxess-ai-score"',
              'function save()',
              'function calculate()',
              'function publish()',
              "$('continueButton').onclick=next;",
              'function next()',
              'const S=',
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'Marker missing: {marker}')

          # Make the Continue control authoritative at the element boundary.
          # Capture-phase handling prevents host/Groove bubble handlers from
          # swallowing the terminal action before MAXESS receives it.
          s = s.replace(
              "$('continueButton').onclick=next;",
              "$('continueButton').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();next();},{capture:true});",
              1,
          )

          # Add a strict answer-index guard so the score matrix can never be
          # read with an invalid key and silently produce a bad terminal score.
          old_save = "const idx=state.selected.charCodeAt(0)-97;\n\n const r={"
          new_save = "const idx=state.selected.charCodeAt(0)-97;\n if(idx<0||idx>4||!Array.isArray(S[state.i+1])||S[state.i+1].length!==5){throw Error('Invalid answer score mapping');}\n\n const r={"
          if old_save not in s:
              raise SystemExit('save() anchor missing')
          s = s.replace(old_save,new_save,1)

          # Make the terminal scoring matrix self-checking before calculation.
          old_calc = "function calculate(){\n if(state.responses.length!==15)throw Error('Exactly 15 responses required');"
          new_calc = "function calculate(){\n if(state.responses.length!==15)throw Error('Exactly 15 responses required');\n if(!Array.isArray(D)||D.length!==5)throw Error('Invalid dimension matrix');\n if(!Array.isArray(S)||Object.keys(S).length!==15)throw Error('Invalid score matrix');"
          if old_calc not in s:
              raise SystemExit('calculate() anchor missing')
          s = s.replace(old_calc,new_calc,1)

          # Verify the matrix normalization explicitly: 5 questions per
          # dimension, 4 points max per answer, 60 points overall.
          old_raw = "const raw=state.responses.reduce((a,r)=>a+r.score,0);\n\n return{"
          new_raw = "const raw=state.responses.reduce((a,r)=>a+r.score,0);\n if(raw<0||raw>60)throw Error('Overall score outside 0-60 matrix');\n\n return{"
          if old_raw not in s:
              raise SystemExit('overall raw-score anchor missing')
          s = s.replace(old_raw,new_raw,1)

          # Make the publish boundary observable and deterministic.
          old_publish = "state.finalizing=true;\n updateContinue();\n\n try{"
          new_publish = "state.finalizing=true;\n updateContinue();\n\n try{\n  console.info('MAXESS TERMINAL: Q15 saved; beginning authoritative score calculation');"
          if old_publish not in s:
              raise SystemExit('publish() anchor missing')
          s = s.replace(old_publish,new_publish,1)

          if s == original:
              print('NO CHANGE: E00 796 already contains hardening')
          else:
              p.write_text(s,encoding='utf-8')
              print('Patched E00 796:',len(s.encode('utf-8')),'bytes')

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          grep -F "addEventListener('click',e=>{e.preventDefault();e.stopPropagation();next();},{capture:true})" 'E00 796' >/dev/null
          grep -F "Invalid answer score mapping" 'E00 796' >/dev/null
          grep -F "Invalid score matrix" 'E00 796' >/dev/null
          grep -F "Overall score outside 0-60 matrix" 'E00 796' >/dev/null
          grep -F "MAXESS TERMINAL: Q15 saved" 'E00 796' >/dev/null
          echo 'E00 796 static QA PASS'

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Power'
          git config user.email 'naya-power@users.noreply.github.com'
          git add 'E00 796'
          if git diff --cached --quiet; then
            echo 'NO CHANGE'
            exit 0
          fi
          git commit -m 'fix: harden MAXESS Continue terminal scoring path'
          git push origin main
