name: NayaNET Hub Welcome Executor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current Hub
        run: python3 scripts/nayanethub_welcome_patch.py
      - name: Verify and commit source only
        run: |
          set -euo pipefail
          test "$(grep -o 'id=\"nh-greeting-script\"' NAYANETHUB.html | wc -l | tr -d ' ')" -eq 1
          grep -q 'Good morning, Shawn.' NAYANETHUB.html
          grep -q 'Good afternoon, Shawn.' NAYANETHUB.html
          grep -q 'Good evening, Shawn.' NAYANETHUB.html
          grep -q 'nh-current-time' NAYANETHUB.html
          grep -q 'nh-current-date' NAYANETHUB.html
          grep -q 'nh-current-country' NAYANETHUB.html
          grep -q 'function updateIdentity' NAYANETHUB.html
          git diff --check
          git config user.name 'NayaNET Release Bot'
          git config user.email 'nayanet-release-bot@users.noreply.github.com'
          git add NAYANETHUB.html
          git commit -m 'feat: add personalized Hub welcome'
          git rm -f .github/workflows/nayanethub-welcome-executor.yml scripts/nayanethub_welcome_patch.py
          git commit -m 'chore: remove one-shot Hub executor'
          git push origin HEAD:main
