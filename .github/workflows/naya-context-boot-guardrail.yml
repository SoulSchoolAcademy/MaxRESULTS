name: Naya Context Boot — Governance Guardrail

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.naya/NAYA-CONTEXT-BOOT-PROTOCOL.md'
      - '.naya/NAYA-ACTION-DELIVERY-LAW.md'
      - '.naya/naya-context-manifest.json'
      - '.naya/codex/**'
      - '.naya/memory/**'
      - '.naya/runtime/**'
      - 'tools/qa_naya_context_boot.py'
      - 'tools/qa_naya_execution_mode.py'
      - '.github/workflows/naya-context-boot-guardrail.yml'
  pull_request:
    paths:
      - 'README.md'
      - '.naya/NAYA-CONTEXT-BOOT-PROTOCOL.md'
      - '.naya/NAYA-ACTION-DELIVERY-LAW.md'
      - '.naya/naya-context-manifest.json'
      - '.naya/codex/**'
      - '.naya/memory/**'
      - '.naya/runtime/**'
      - 'tools/qa_naya_context_boot.py'
      - 'tools/qa_naya_execution_mode.py'
      - '.github/workflows/naya-context-boot-guardrail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-context-boot:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact governance context
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ env.TARGET_SHA }}

      - name: Assert exact target commit
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$TARGET_SHA"
          echo "Exact target commit verified: $actual"

      - name: Validate Naya Context Boot
        run: python3 tools/qa_naya_context_boot.py

      - name: Validate Execution Mode Action Delivery
        run: python3 tools/qa_naya_execution_mode.py
