name: Naya Context Boot — Governance Guardrail

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.naya/NAYA-CONTEXT-BOOT-PROTOCOL.md'
      - '.naya/naya-context-manifest.json'
      - '.naya/codex/**'
      - '.naya/memory/**'
      - '.naya/runtime/**'
      - 'tools/qa_naya_context_boot.py'
  pull_request:
    paths:
      - 'README.md'
      - '.naya/NAYA-CONTEXT-BOOT-PROTOCOL.md'
      - '.naya/naya-context-manifest.json'
      - '.naya/codex/**'
      - '.naya/memory/**'
      - '.naya/runtime/**'
      - 'tools/qa_naya_context_boot.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-context-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current governance context
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Naya Context Boot
        run: python3 tools/qa_naya_context_boot.py
