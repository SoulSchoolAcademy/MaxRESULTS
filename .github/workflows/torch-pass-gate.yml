name: Naya Continuous Torch-Pass Gate

# CONSOLIDATION TRANCHE 1:
# The substantive torch-pass checks are already part of the authoritative
# Superbrain Gate (`superbrain-gate.yml`, job: brain-gate), including:
# - continuity runtime/test compilation;
# - positive + deliberate-failure continuity regression;
# - current canonical continuity validation;
# - continuity receipt generation and artifact publication.
#
# This workflow remains available for explicit/manual verification only.
# It is no longer an independent push/PR execution surface, which prevents
# duplicate automatic Actions runs while preserving the original checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naya-torch-pass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  torch-pass:
    name: torch-pass-enforcement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile continuity runtime and regression test
        env:
          PYTHONPYCACHEPREFIX: /tmp/naya-torch-pycache
        run: python -m py_compile .naya/runtime/continuity_enforcement.py .naya/tests/test_continuity_enforcement.py

      - name: Run positive and deliberate-failure continuity tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .naya/tests/test_continuity_enforcement.py

      - name: Enforce current canonical continuity contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .naya/runtime/continuity_enforcement.py validate

      - name: Emit continuity receipt
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .naya/runtime/continuity_enforcement.py receipt

      - name: Upload continuity receipt
        uses: actions/upload-artifact@v4
        with:
          name: naya-torch-pass-gate-receipt
          path: .naya/memory/CONTINUITY-GATE-RECEIPT.json
          if-no-files-found: error
