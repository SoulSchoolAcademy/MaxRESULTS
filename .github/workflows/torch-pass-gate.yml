name: Naya Continuous Torch-Pass Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naya-torch-pass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  torch-pass:
    name: torch-pass-enforcement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Repair NayaNET Hub navigation and context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('NAYANETHUB.html')
          s=p.read_text(encoding='utf-8')
          bad=('addTodayNav','createTodayPage','activateToday','labelHome','normalizeTopbar')
          parts=re.split(r'(<script\b[^>]*>.*?</script>)',s,flags=re.I|re.S)
          out=[]
          for part in parts:
              if part.lower().startswith('<script') and any(x in part for x in bad):
                  continue
              out.append(part)
          s=''.join(out)
          s=re.sub(r'<section[^>]*id=["\']page-intelligence-today["\'][\s\S]*?</section>', '', s, flags=re.I)
          if 'nayanet-locked-hub-fix' not in s:
              layer=r'''<script id="nayanet-locked-hub-fix">(function(){
          function navRoot(){return document.querySelector('.nav')||document.querySelector('nav');}
          function buttons(){var n=navRoot();return n?[].slice.call(n.querySelectorAll('button')):[];}
          function txt(b){return (b.textContent||'').replace(/\s+/g,' ').trim();}
          function ensure(label,icon){var n=navRoot();if(!n)return;var bs=buttons(),same=bs.filter(function(b){return txt(b)===label;});if(same.length){same.slice(1).forEach(function(b){b.remove();});return;}var b=document.createElement('button');b.type='button';b.innerHTML='<span class="ico">'+icon+'</span><span>'+label+'</span>';n.appendChild(b);}
          function clean(){var bs=buttons();var smart=bs.filter(function(b){return txt(b)==='Smart Notes'||txt(b)==='Home';});if(smart.length){var keep=smart.find(function(b){return txt(b)==='Smart Notes';})||smart[0];keep.querySelectorAll('span').forEach(function(x){if((x.textContent||'').trim()==='Home')x.textContent='Smart Notes';});smart.filter(function(b){return b!==keep;}).forEach(function(b){b.remove();});}else ensure('Smart Notes','🧠');['Your Intelligence Today','Daily Intelligence Briefing'].forEach(function(x){buttons().filter(function(b){return txt(b).indexOf(x)>=0;}).forEach(function(b){b.remove();});});ensure('Personal Feed','👤');ensure('Collective Feed','🌐');ensure('Smart Lists','📚');}
          function context(){var t=document.querySelector('.topbar');if(!t)return;var e=document.getElementById('naya-locked-context');if(!e){e=document.createElement('div');e.id='naya-locked-context';e.style.cssText='position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap;';t.style.position='sticky';t.appendChild(e);}var d=new Date(),h=d.getHours(),g=h>=5&&h<12?'Good morning':h>=12&&h<18?'Good afternoon':'Good evening';e.innerHTML='<strong style="font-size:12px">'+g+', Shawn.</strong><div style="font-size:8px;color:#a9a4b1;margin-top:3px">'+d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})+' · Canada</div>';}
          function run(){clean();context();}run();setTimeout(run,300);setTimeout(run,1200);setTimeout(run,2500);setInterval(run,60000);
          })();</script>'''
              s=s.replace('</body>',layer+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'NayaNET Repair Bot'
          git config user.email 'nayanet-repair@users.noreply.github.com'
          git add NAYANETHUB.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair NayaNET Hub navigation and local context'
          git push

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile continuity runtime and regression test
        env:
          PYTHONPYCACHEPREFIX: /tmp/naya-torch-pycache
        run: python -m py_compile .naya/runtime/continuity_enforcement.py .naya/tests/test_continuity_enforcement.py

      - name: Run positive and deliberate-failure continuity tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .naya/tests/test_continuity_enforcement.py

      - name: Enforce current canonical continuity contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .naya/runtime/continuity_enforcement.py validate

      - name: Emit continuity receipt
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .naya/runtime/continuity_enforcement.py receipt

      - name: Upload continuity receipt
        uses: actions/upload-artifact@v4
        with:
          name: naya-torch-pass-gate-receipt
          path: .naya/memory/CONTINUITY-GATE-RECEIPT.json
          if-no-files-found: error
