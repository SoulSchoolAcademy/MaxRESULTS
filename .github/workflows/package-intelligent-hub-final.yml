name: Package NayaNET Living Intelligence
on:
  push:
    branches:
      - nayanet/intelligent-hub-final
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Cloudflare source
        run: |
          test -f CLOUDFLARE-LIVING-INTELLIGENCE/index.html
          test -f CLOUDFLARE-LIVING-INTELLIGENCE/_headers
          test "$(find CLOUDFLARE-LIVING-INTELLIGENCE -maxdepth 1 -type f | wc -l)" -eq 2
          grep -q 'LIVING INTELLIGENCE' CLOUDFLARE-LIVING-INTELLIGENCE/index.html
          grep -q 'SMART ID' CLOUDFLARE-LIVING-INTELLIGENCE/index.html
          grep -q 'SMART MAIL' CLOUDFLARE-LIVING-INTELLIGENCE/index.html
          grep -q 'START NAYA POWER' CLOUDFLARE-LIVING-INTELLIGENCE/index.html
      - name: Package
        run: |
          cd CLOUDFLARE-LIVING-INTELLIGENCE
          zip -j ../NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip index.html _headers
      - name: Verify ZIP root
        run: |
          test "$(unzip -Z1 NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip | wc -l)" -eq 2
          unzip -Z1 NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip | grep -qx 'index.html'
          unzip -Z1 NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip | grep -qx '_headers'
      - uses: actions/upload-artifact@v4
        with:
          name: NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE
          path: NAYANET-LIVING-INTELLIGENCE-CLOUDFLARE.zip
          if-no-files-found: error
