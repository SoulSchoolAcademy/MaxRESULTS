name: MAXESS Nitro AAA Build

on:
  push:
    branches: [maxess-results-v21-working]
    paths:
      - '20260817 912am RESULTS PAGE CODE'
      - 'tools/**'
      - '.github/workflows/nitro-aaa-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[nitro-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v21-working
          fetch-depth: 0

      - name: Verify repository lock
        run: |
          test "${GITHUB_REPOSITORY}" = "SoulSchoolAcademy/MaxRESULTS"
          test "${GITHUB_REF_NAME}" = "maxess-results-v21-working"
          grep -q 'CANONICAL REPOSITORY' NAYA-REPO-LOCK.md
          grep -q 'maxess-results-v21-working' NAYA-REPO-LOCK.md
          grep -q '20260817 912am RESULTS PAGE CODE' README.md

      - name: Apply deterministic Nitro AAA upgrade to current authoritative source
        run: python tools/nitro_aaa_upgrade.py

      - name: Syntax and integrity QA
        shell: bash
        run: |
          python -m py_compile tools/nitro_aaa_upgrade.py tools/qa_v21_candidate_v2.py
          python - <<'PY'
          from pathlib import Path
          p=Path('20260817 912am RESULTS PAGE CODE')
          s=p.read_text(encoding='utf-8')
          assert len(s) > 500000, f'Artifact unexpectedly small: {len(s)} bytes'
          assert len(s.splitlines()) > 6500, f'Artifact unexpectedly short: {len(s.splitlines())} lines'
          for x in ['window.MAXESS_RESULT','MAXESS-NITRO-AAA-UPGRADE v1','maxess-nitro-aaa-css','maxess-nitro-aaa-js','data-nitro-aaa','LISTEN TO NAYA']:
              assert x in s, f'Missing required marker: {x}'
          assert s.count('MAXESS-NITRO-AAA-UPGRADE v1') == 1
          assert s.count('maxess-nitro-aaa-css') == 1
          assert s.count('maxess-nitro-aaa-js') == 1
          assert s.lower().count('</html>') == 1
          print('artifact bytes:', len(s.encode()))
          print('artifact lines:', len(s.splitlines()))
          print('required markers: PASS')
          PY

      - name: Candidate QA
        run: python tools/qa_v21_candidate_v2.py

      - name: Commit verified engineering result
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add '20260817 912am RESULTS PAGE CODE' BASELINE-NITRO-20260817.html V21-CANDIDATE-QA-V2.md
          git diff --cached --quiet && echo 'No generated changes to commit.' && exit 0
          git commit -m 'MAXESS AAA Nitro upgrade — verified [nitro-generated]'
          git push origin maxess-results-v21-working

      - name: Final release evidence
        run: |
          echo 'REPOSITORY=SoulSchoolAcademy/MaxRESULTS'
          echo 'BRANCH=maxess-results-v21-working'
          echo "COMMIT=$(git rev-parse HEAD)"
          echo 'ARTIFACT=20260817 912am RESULTS PAGE CODE'
          wc -l '20260817 912am RESULTS PAGE CODE'
          wc -c '20260817 912am RESULTS PAGE CODE'
