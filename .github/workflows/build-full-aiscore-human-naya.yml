name: build-full-aiscore-human-naya
on:
  push:
    branches: [feat/aiscore-clean-v1]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'BUILD FULL AISCORE HUMAN NAYA') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aiscore-clean-v1
      - name: Surgical full-product patch
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('AIScoreMAXESS-CLEAN-V1.html').read_text(encoding='utf-8')
          src = src.replace("location.assign('https://results.nayanet.app/#maxess-result='+payload);", "location.assign('https://results.kninet.app/?result='+payload+'#maxess-result='+payload);")
          needle = "selectedInterests:Array.from(state.interests),"
          insert = "band:result.masteryBand,personalizedAnalysis:buildPersonalizedAnalysis(result,so),nayaNarrative:{overall:NARRATIVES[result.masteryBand]?.overall||'',strongest:so.strongest.name,opportunity:so.opportunity.name},selectedInterests:Array.from(state.interests),"
          src = src.replace(needle, insert, 1)
          marker = "function buildContract(){"
          helper = "function buildPersonalizedAnalysis(result,so){const lead=NARRATIVES[result.masteryBand]?.overall||'';return lead+' Your strongest capability is '+so.strongest.name+' at '+so.strongest.score+'%, while your biggest opportunity is '+so.opportunity.name+' at '+so.opportunity.score+'%. The most useful next step is to deliberately practice the opportunity dimension while preserving what is already working well.'}"
          if helper not in src:
              src = src.replace(marker, helper+"\n"+marker, 1)
          style = r'''<style id="naya-human-full-v1">
:root{--naya-deep:#24104a;--naya-purple:#6d35c9;--naya-purple2:#a56cff;--naya-white:#fff;--naya-soft:rgba(255,255,255,.78)}
#nayaHumanLayer{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 45%,rgba(109,53,201,.24),transparent 48%),rgba(3,1,8,.82);backdrop-filter:blur(22px)}
#nayaHumanLayer.is-open{display:flex;animation:nayaFade .28s ease both}
#nayaHumanCard{position:relative;width:min(760px,94vw);min-height:360px;padding:46px 46px 38px;border:1px solid rgba(197,160,255,.32);border-radius:38px;background:linear-gradient(145deg,#2b1556 0%,#1b0d38 46%,#100820 100%);box-shadow:0 38px 110px rgba(0,0,0,.72),0 0 80px rgba(109,53,201,.28),inset 0 1px 0 rgba(255,255,255,.12);overflow:visible;text-align:left}
#nayaHumanCard:before{content:"";position:absolute;inset:1px;border-radius:37px;pointer-events:none;background:radial-gradient(circle at 86% 8%,rgba(255,255,255,.12),transparent 25%),linear-gradient(180deg,rgba(255,255,255,.05),transparent 30%)}
#nayaHumanPortrait{position:absolute;right:28px;top:-58px;width:142px;height:142px;border-radius:50%;object-fit:cover;object-position:center top;border:5px solid #fff;box-shadow:0 18px 42px rgba(0,0,0,.55),0 0 34px rgba(165,108,255,.42)}
#nayaHumanContent{position:relative;z-index:2;padding-right:92px;max-width:650px}
#nayaHumanGreeting{font-size:clamp(30px,4vw,46px);line-height:1.02;font-weight:900;letter-spacing:-.04em;color:#fff;margin:0}
#nayaHumanSub{margin:14px 0 0;color:rgba(255,255,255,.86);font-size:clamp(18px,2.2vw,23px);line-height:1.38;font-weight:650}
#nayaHumanBody{margin:18px 0 0;color:rgba(255,255,255,.72);font-size:16px;line-height:1.62;max-width:580px}
#nayaHumanActions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.nayaHumanBtn{min-height:54px;padding:0 23px;border-radius:17px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 10px 25px rgba(0,0,0,.24);transition:transform .2s ease,background .2s ease,border-color .2s ease}
.nayaHumanBtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5)}
.nayaHumanBtn.primary{background:linear-gradient(180deg,#a56cff,#6d35c9);border-color:#c9a8ff;box-shadow:0 12px 30px rgba(109,53,201,.38)}
#nayaHumanLayer.question-mode #nayaHumanGreeting{font-size:clamp(27px,3.5vw,38px)}
#nayaHumanLayer.question-mode #nayaHumanSub{font-size:clamp(17px,2vw,21px)}
.dialog{display:none!important}
.naya-orb,.presence-orb{display:none!important}
.naya-btn{padding:6px 15px 6px 9px!important}
.naya-btn:before{content:"";width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:url('https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg') center top/cover no-repeat;border:1px solid rgba(255,255,255,.8);box-shadow:0 5px 18px rgba(0,0,0,.42)}
@keyframes nayaFade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
@media(max-width:640px){#nayaHumanLayer{padding:16px}#nayaHumanCard{width:100%;padding:76px 24px 26px;min-height:0;border-radius:30px}#nayaHumanPortrait{right:22px;top:-50px;width:118px;height:118px}#nayaHumanContent{padding-right:0}#nayaHumanGreeting{font-size:31px}#nayaHumanSub{font-size:18px}#nayaHumanBody{font-size:15px}.nayaHumanBtn{width:100%}}
@media(prefers-reduced-motion:reduce){#nayaHumanLayer{animation:none}#nayaHumanLayer *{transition:none!important}}
</style>'''
          src = src.replace('</head>', style+'\n</head>', 1)
          html = r'''<div id="nayaHumanLayer" role="dialog" aria-modal="true" aria-labelledby="nayaHumanGreeting" aria-describedby="nayaHumanBody">
  <div id="nayaHumanCard">
    <img id="nayaHumanPortrait" src="https://raw.githubusercontent.com/SoulSchoolAcademy/MaxRESULTS/main/Naya%20Profile%206.jpg" alt="Naya">
    <div id="nayaHumanContent">
      <h2 id="nayaHumanGreeting">I'm here.</h2>
      <div id="nayaHumanSub">Let's look at this together.</div>
      <div id="nayaHumanBody"></div>
      <div id="nayaHumanActions">
        <button id="nayaHumanPlay" class="nayaHumanBtn" type="button">▶ PLAY NAYA</button>
        <button id="nayaHumanGo" class="nayaHumanBtn primary" type="button">LET'S GO <span aria-hidden="true">→</span></button>
      </div>
    </div>
  </div>
</div>'''
          js = r'''<script id="naya-human-full-js">
(function(){
  const layer=document.getElementById('nayaHumanLayer'),body=document.getElementById('nayaHumanBody'),greet=document.getElementById('nayaHumanGreeting'),sub=document.getElementById('nayaHumanSub'),go=document.getElementById('nayaHumanGo'),play=document.getElementById('nayaHumanPlay');
  if(!layer)return;
  function open(mode){
    const welcome=mode==='welcome';
    layer.classList.toggle('question-mode',!welcome);
    greet.textContent=welcome?"I'm here.":"Let's look at this together.";
    sub.textContent=welcome?"I'm going to walk you through this.":"Here's what this question is really asking.";
    body.textContent=welcome?"It'll take about three minutes. I'll help you understand what each question is really asking, then you can answer honestly based on what you actually do today.":((typeof current==='function'&&current().teaching)||"Take a moment, think about what you actually do today, and choose the answer that feels most like you.");
    play.hidden=welcome;
    go.innerHTML=welcome?"LET'S GO <span aria-hidden='true'>→</span>":"GOT IT — LET'S GO <span aria-hidden='true'>→</span>";
    layer.classList.add('is-open');
    setTimeout(()=>go.focus(),30);
  }
  function close(){layer.classList.remove('is-open');try{document.getElementById('nayaButton').focus()}catch(e){}}
  go.addEventListener('click',()=>{try{state.firstVisit=false}catch(e){} close();});
  play.addEventListener('click',()=>{try{if(typeof playNaya==='function')playNaya()}catch(e){}});
  const nb=document.getElementById('nayaButton');if(nb)nb.addEventListener('click',()=>setTimeout(()=>open('question'),30));
  const cb=document.getElementById('continueButton');if(cb)cb.addEventListener('click',()=>setTimeout(()=>{if(document.getElementById('interestStage')&&!document.getElementById('interestStage').classList.contains('hidden'))return;open('question')},260));
  setTimeout(()=>open('welcome'),360);
  window.__MAXESS_HUMAN_NAYA_V1={open,close};
})();
</script>'''
          src = src.replace('</body>', html+'\n'+js+'\n</body>', 1)
          Path('AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html').write_text(src,encoding='utf-8')
          print('bytes',len(src.encode()))
          print('lines',len(src.splitlines()))
          print('result', 'results.kninet.app/?result=' in src)
          print('naya', 'Naya%20Profile%206.jpg' in src)
          print('analysis', 'personalizedAnalysis' in src)
          PY
      - name: Verify
        run: |
          test -s AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          grep -q 'results.kninet.app/?result=' AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          grep -q 'Naya%20Profile%206.jpg' AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          grep -q 'personalizedAnalysis' AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          grep -q 'MAXESS_RESULT_V1' AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          grep -q 'function calculate' AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
      - name: Commit
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add AIScoreMAXESS-CLEAN-FULL-HUMAN-NAYA.html
          git commit -m 'BUILD FULL AISCORE HUMAN NAYA'
          git push origin feat/aiscore-clean-v1
