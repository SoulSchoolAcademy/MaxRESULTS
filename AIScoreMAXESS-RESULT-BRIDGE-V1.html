<!--
MAXESS AISCORE → RESULTS BRIDGE V1

PURPOSE
Intercept only the final interest-selection action and send the completed
MAXESS result to the new Results app.

IMPORTANT
- This bridge does NOT alter assessment rendering or initialization.
- This bridge does NOT hide the assessment UI.
- This bridge does NOT execute during page load beyond installing capture listeners.
- The retired built-in Results renderer is bypassed only when the user finishes.
- Destination: https://results.nayanet.app/

GROOVE PLACEMENT
Place this AFTER the main AIScoreMAXESS code on the SAME aiscore.nayanet.app page.
-->
<script>
(function () {
  'use strict';

  if (window.__MAXESS_AISCORE_RESULT_BRIDGE_V1__) return;
  window.__MAXESS_AISCORE_RESULT_BRIDGE_V1__ = true;

  var RESULTS_URL = 'https://results.nayanet.app/';
  var CONTRACT = 'MAXESS_RESULT_V1';
  var installed = false;

  function encodeBase64Url(value) {
    var json = JSON.stringify(value);
    var bytes = new TextEncoder().encode(json);
    var binary = '';
    for (var i = 0; i < bytes.length; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary)
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/g, '');
  }

  function buildContract() {
    if (typeof MAXESS_ASSESSMENT === 'undefined' || typeof state === 'undefined') {
      throw new Error('MAXESS assessment state is unavailable.');
    }

    var questions = Array.isArray(MAXESS_ASSESSMENT.questions)
      ? MAXESS_ASSESSMENT.questions.slice().sort(function (a, b) { return a.order - b.order; })
      : [];
    var responses = Array.isArray(state.responses) ? state.responses.slice() : [];

    if (questions.length !== 15 || responses.length !== 15) {
      throw new Error('MAXESS requires 15 completed responses.');
    }

    var dimensions = (MAXESS_ASSESSMENT.dimensions || []).map(function (dimension) {
      var relevant = responses.filter(function (response) {
        return response.dimensionId === dimension.id;
      });
      if (!relevant.length) return null;

      var raw = relevant.reduce(function (sum, response) {
        return sum + Number(response.score || 0);
      }, 0) / relevant.length;

      var score = Math.round(raw * 10) / 10;

      return {
        id: dimension.id,
        name: dimension.name,
        color: dimension.color,
        weight: dimension.weight,
        score: score,
        level: score >= 90 ? 'MASTERING' : score >= 75 ? 'ADVANCING' : score >= 60 ? 'DEVELOPING' : 'EMERGING'
      };
    }).filter(Boolean);

    if (dimensions.length !== 5) {
      throw new Error('MAXESS requires five dimensions.');
    }

    var weightTotal = dimensions.reduce(function (sum, dimension) {
      return sum + Number(dimension.weight || 0);
    }, 0);

    if (!weightTotal) throw new Error('MAXESS dimension weights are invalid.');

    var overallScore = Math.round(
      (dimensions.reduce(function (sum, dimension) {
        return sum + dimension.score * Number(dimension.weight || 0);
      }, 0) / weightTotal) * 10
    ) / 10;

    var band = (MAXESS_ASSESSMENT.scoreBands || []).find(function (item) {
      return overallScore >= item.min && overallScore <= item.max;
    });

    if (!band) throw new Error('MAXESS score band is invalid.');

    var strongest = dimensions.slice().sort(function (a, b) { return b.score - a.score; })[0];
    var opportunity = dimensions.slice().sort(function (a, b) { return a.score - b.score; })[0];
    var selectedInterests = Array.from(state.selectedInterests || []);
    var selectedInterestMeta = (typeof AI_AREAS !== 'undefined' ? AI_AREAS : []).filter(function (area) {
      return selectedInterests.indexOf(area.id) !== -1;
    });

    return {
      contractVersion: CONTRACT,
      assessmentId: MAXESS_ASSESSMENT.id,
      assessmentVersion: MAXESS_ASSESSMENT.version,
      completedAt: state.completedAt || new Date().toISOString(),
      overallScore: overallScore,
      masteryStage: band.label,
      masteryBand: band,
      fiveDimensions: dimensions,
      dimensions: dimensions,
      strongestCapability: {
        id: strongest.id,
        name: strongest.name,
        score: strongest.score
      },
      highestLeverageOpportunity: {
        id: opportunity.id,
        name: opportunity.name,
        score: opportunity.score
      },
      overallPattern: dimensions.map(function (dimension) {
        return {
          id: dimension.id,
          name: dimension.name,
          score: dimension.score,
          level: dimension.level
        };
      }),
      personalizedInterpretation: {
        strongestCapability: strongest.name,
        strongestScore: strongest.score,
        highestLeverageOpportunity: opportunity.name,
        opportunityScore: opportunity.score,
        masteryStage: band.label,
        summary: band.description
      },
      nextMove: {
        primary: 'Strengthen ' + opportunity.name,
        reason: 'Your highest-leverage opportunity is ' + opportunity.name + '.'
      },
      responses: responses,
      selectedInterests: selectedInterests,
      selectedInterestMeta: selectedInterestMeta,
      naya: {
        name: 'Naya',
        image: 'https://i.postimg.cc/bw4fyKF8/Naya-Profile-black-face-zoom.jpg'
      }
    };
  }

  function publish() {
    var contract = buildContract();
    var encoded = encodeBase64Url(contract);

    try { sessionStorage.setItem(CONTRACT, JSON.stringify(contract)); } catch (e) {}
    try { localStorage.setItem(CONTRACT, JSON.stringify(contract)); } catch (e) {}

    window.MAXESS_RESULT = contract;
    try {
      window.dispatchEvent(new CustomEvent('MAXESS_RESULT_READY', { detail: contract }));
      window.dispatchEvent(new CustomEvent('maxess:result-updated', { detail: contract }));
    } catch (e) {}

    window.location.assign(RESULTS_URL + '#maxess-result=' + encoded);
  }

  function intercept(event) {
    event.preventDefault();
    event.stopImmediatePropagation();

    try {
      publish();
    } catch (error) {
      console.error('MAXESS Results bridge failed:', error);
      alert('MAXESS could not prepare your Results page. Please try again.');
    }
  }

  function install() {
    if (installed) return;

    var continueButton = document.getElementById('interestContinue');
    var skipButton = document.getElementById('interestSkip');

    if (!continueButton || !skipButton) {
      window.setTimeout(install, 100);
      return;
    }

    continueButton.addEventListener('click', intercept, true);
    skipButton.addEventListener('click', intercept, true);
    installed = true;
  }

  window.MAXESS_RESULT_BRIDGE = {
    contractVersion: CONTRACT,
    buildContract: buildContract,
    publish: publish
  };

  install();
})();
</script>
