<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05030a">
<meta name="color-scheme" content="dark">
<meta name="maxess-artifact" content="E02-SECTION-02-WORKING">
<meta name="maxess-version" content="nitro-e02-v05">
<title>MAXESS — Section 02 · Your Five Dimensions</title>
<style>
#e02{
  --bg:#05030a;
  --deep:#020107;
  --pearl:#f2f0eb;
  --ink:#09090c;
  --white:#fff;
  --purple:#9b63ff;
  --magenta:#ed4b87;
  --green:#18c982;
  --blue:#287cf0;
  --gold:#e8a51c;
  position:relative;
  isolation:isolate;
  min-height:100vh;
  width:100%;
  overflow:hidden;
  color:var(--white);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse 70% 46% at 50% 0%,rgba(166,108,255,.10),transparent 68%),
    linear-gradient(180deg,#070609 0%,#05030a 52%,#020107 100%);
}
#e02,#e02 *{box-sizing:border-box}
#e02:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-3;
  pointer-events:none;
  opacity:.055;
  background-image:radial-gradient(rgba(255,255,255,.42) .55px,transparent .7px);
  background-size:5px 5px;
  mask-image:linear-gradient(180deg,#000,transparent 80%);
}
.e02-pearl{
  position:relative;
  width:min(1480px,calc(100% - 24px));
  margin:0 auto;
  min-height:100vh;
  overflow:hidden;
  padding:clamp(34px,5vw,66px) clamp(14px,3.4vw,42px) clamp(70px,8vw,110px);
  border-left:1px solid rgba(255,255,255,.10);
  border-right:1px solid rgba(255,255,255,.10);
  background:
    radial-gradient(ellipse 90% 38% at 50% 0%,rgba(255,255,255,.98),transparent 70%),
    radial-gradient(circle at 50% 48%,rgba(255,255,255,.92),rgba(246,244,239,.88) 48%,rgba(215,211,204,.64) 100%),
    linear-gradient(180deg,#f8f6f1 0%,var(--pearl) 56%,#d9d5ce 100%);
  box-shadow:
    0 0 90px rgba(255,255,255,.07),
    inset 0 1px rgba(255,255,255,.98),
    inset 0 -80px 150px rgba(0,0,0,.08);
}
.e02-pearl:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 42%,rgba(255,255,255,.72),transparent 42%),
    radial-gradient(circle at 15% 50%,rgba(255,255,255,.34),transparent 30%),
    radial-gradient(circle at 85% 50%,rgba(255,255,255,.30),transparent 30%);
}
.e02-wrap{position:relative;z-index:1;width:min(1320px,100%);margin:auto}
.e02-intro{text-align:center;max-width:860px;margin:0 auto}
.e02-marker{
  margin:0;
  color:#5d3aa8;
  font-size:10px;
  line-height:1;
  font-weight:950;
  letter-spacing:.30em;
  text-transform:uppercase;
}
.e02-intro h1{
  margin:13px 0 0;
  color:#101015;
  font-size:clamp(30px,4vw,54px);
  line-height:.98;
  letter-spacing:-.058em;
  font-weight:950;
}
.e02-intro p{
  margin:10px auto 0;
  color:#6c6870;
  font-size:14px;
  line-height:1.4;
}
.e02-node{
  position:relative;
  width:min(500px,100%);
  margin:clamp(28px,4vw,42px) auto 0;
  padding:19px 24px 21px;
  text-align:center;
  color:#fff;
  border:1px solid rgba(255,255,255,.20);
  border-radius:28px;
  background:
    radial-gradient(circle at 50% 0%,rgba(166,108,255,.22),transparent 44%),
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.08),transparent 35%),
    linear-gradient(145deg,#010103 0%,#111117 54%,#020204 100%);
  box-shadow:
    inset 0 1px rgba(255,255,255,.18),
    inset 0 -1px rgba(166,108,255,.18),
    0 28px 70px rgba(0,0,0,.28),
    0 0 70px rgba(139,92,246,.09);
  overflow:hidden;
}
.e02-node:after{
  content:"";
  position:absolute;
  inset:1px;
  border:1px solid rgba(255,255,255,.045);
  border-radius:27px;
  pointer-events:none;
}
.e02-node-label{
  position:relative;
  z-index:1;
  margin:0;
  color:#d9c9ff;
  font-size:9px;
  line-height:1;
  font-weight:950;
  letter-spacing:.28em;
  text-transform:uppercase;
}
.e02-node h2{
  position:relative;
  z-index:1;
  margin:8px 0 0;
  font-size:clamp(22px,2.7vw,34px);
  line-height:1;
  letter-spacing:-.045em;
  font-weight:950;
}
.e02-field{
  position:relative;
  margin:clamp(34px,5vw,58px) auto 0;
  padding:clamp(22px,3.2vw,34px) clamp(8px,1.5vw,16px) clamp(28px,4vw,48px);
  border-radius:48px;
  background:
    radial-gradient(circle at 50% 42%,rgba(255,255,255,.78),transparent 48%),
    linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));
  box-shadow:
    inset 0 1px rgba(255,255,255,.80),
    0 34px 100px rgba(22,18,28,.12);
  overflow:visible;
}
.e02-orbs{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:clamp(8px,1.1vw,16px);
  align-items:start;
}
.e02-dimension{
  --c1:var(--purple);
  --c2:#c4a3ff;
  --rgb:155,99,255;
  position:relative;
  min-width:0;
  text-align:center;
}
.e02-dimension:nth-child(2){--c1:var(--magenta);--c2:#ff9b70;--rgb:237,75,135}
.e02-dimension:nth-child(3){--c1:var(--green);--c2:#55e0a3;--rgb:24,201,130}
.e02-dimension:nth-child(4){--c1:var(--blue);--c2:#63c8ff;--rgb:40,124,240}
.e02-dimension:nth-child(5){--c1:var(--gold);--c2:#ffe28a;--rgb:232,165,28}
.e02-dimension:nth-child(1){transform:translateY(18px)}
.e02-dimension:nth-child(2){transform:translateY(0)}
.e02-dimension:nth-child(3){transform:translateY(-10px)}
.e02-dimension:nth-child(4){transform:translateY(0)}
.e02-dimension:nth-child(5){transform:translateY(18px)}
.e02-orb-stage{
  position:relative;
  width:100%;
  aspect-ratio:1;
  display:grid;
  place-items:center;
}
.e02-orb-stage:before{
  content:"";
  position:absolute;
  width:82%;
  height:20%;
  left:9%;
  bottom:2%;
  border-radius:50%;
  background:rgba(0,0,0,.20);
  filter:blur(18px);
  transform:translateY(28%);
  pointer-events:none;
}
.e02-orb{
  position:relative;
  width:min(100%,260px);
  aspect-ratio:1;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 30% 17%,rgba(255,255,255,.94),transparent 11%),
    radial-gradient(circle at 38% 31%,rgba(var(--rgb),.56),transparent 31%),
    radial-gradient(circle at 55% 59%,rgba(var(--rgb),.22),transparent 55%),
    radial-gradient(circle at 50% 46%,#1d1b22 0 38%,#08070c 73%,#020204 100%);
  border:1px solid rgba(255,255,255,.34);
  box-shadow:
    inset 18px 16px 38px rgba(255,255,255,.07),
    inset -34px -38px 70px rgba(0,0,0,.82),
    inset 0 0 90px rgba(var(--rgb),.22),
    0 34px 60px rgba(0,0,0,.30),
    0 0 66px rgba(var(--rgb),.20);
  animation:e02-orb-breathe 6s ease-in-out infinite;
  transform-origin:center;
  transition:box-shadow .6s ease,filter .6s ease;
}
.e02-orb:before{
  content:"";
  position:absolute;
  inset:2.8%;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:
    inset 0 0 38px rgba(var(--rgb),.13),
    0 0 32px rgba(var(--rgb),.11);
  pointer-events:none;
}
.e02-orb:after{
  content:"";
  position:absolute;
  inset:-6.5%;
  border-radius:50%;
  border:1px solid rgba(var(--rgb),.30);
  box-shadow:0 0 38px rgba(var(--rgb),.18);
  pointer-events:none;
}
.e02-orb-ring{
  position:absolute;
  inset:-10%;
  border:1px solid rgba(var(--rgb),.13);
  border-radius:50%;
  transform:rotate(-18deg);
  pointer-events:none;
}
.e02-orb-bead{
  position:absolute;
  left:50%;
  top:50%;
  width:10px;
  height:10px;
  margin:-5px;
  border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff 0%,#fff 14%,var(--c1) 58%,var(--c2) 100%);
  box-shadow:0 0 10px #fff,0 0 22px rgba(var(--rgb),.72);
  transform-origin:0 0;
  animation:e02-orbit 10s linear infinite;
  pointer-events:none;
  z-index:2;
}
.e02-orb-bead:after{
  content:"";
  position:absolute;
  inset:-3px;
  border:1px solid rgba(var(--rgb),.24);
  border-radius:50%;
}
.e02-orb-glint{
  position:absolute;
  left:20%;
  top:15%;
  width:27%;
  height:18%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.96),transparent 72%);
  filter:blur(3px);
  opacity:.72;
  transform:rotate(-25deg);
  pointer-events:none;
}
.e02-score{
  position:relative;
  z-index:5;
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:4px;
  color:#fff;
  font-size:clamp(52px,5.0vw,82px);
  line-height:.82;
  font-weight:950;
  letter-spacing:-.10em;
  -webkit-text-stroke:1.5px #030305;
  text-shadow:
    0 1px 0 rgba(255,255,255,.30),
    0 3px 0 #000,
    0 7px 0 rgba(0,0,0,.90),
    0 14px 24px rgba(0,0,0,.92),
    0 0 30px rgba(var(--rgb),.56);
  white-space:nowrap;
}
.e02-score small{
  font-size:.23em;
  letter-spacing:-.02em;
  font-weight:900;
  color:rgba(255,255,255,.92);
  -webkit-text-stroke:0;
  text-shadow:none;
  margin-left:1px;
}
.e02-name{
  position:relative;
  margin-top:15px;
  color:#111116;
  font-size:clamp(12px,1.25vw,16px);
  line-height:1.05;
  font-weight:950;
  letter-spacing:-.02em;
}
.e02-rule{
  width:30px;
  height:2px;
  margin:9px auto 0;
  border-radius:2px;
  background:linear-gradient(90deg,var(--c1),var(--c2));
  box-shadow:0 0 12px rgba(var(--rgb),.24);
}
.e02-missing{
  position:relative;
  z-index:2;
  display:none;
  margin:18px auto 0;
  max-width:480px;
  padding:12px 14px;
  border:1px solid rgba(125,85,20,.22);
  border-radius:14px;
  background:rgba(125,85,20,.06);
  color:#554936;
  font-size:12px;
  text-align:center;
}
.e02-missing.show{display:block}
.sr-only{
  position:absolute!important;
  width:1px!important;
  height:1px!important;
  padding:0!important;
  margin:-1px!important;
  overflow:hidden!important;
  clip:rect(0,0,0,0)!important;
  clip-path:inset(50%)!important;
  white-space:nowrap!important;
  border:0!important;
}
@keyframes e02-orb-breathe{
  0%,100%{transform:scale(1) rotate(0deg);filter:brightness(1)}
  50%{transform:scale(1.018) rotate(.22deg);filter:brightness(1.035)}
}
@keyframes e02-orbit{
  0%{transform:rotate(0deg) translateX(148px) rotate(0deg)}
  100%{transform:rotate(360deg) translateX(148px) rotate(-360deg)}
}
@media(max-width:1120px){
  .e02-orbs{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:34px}
  .e02-dimension:nth-child(1),.e02-dimension:nth-child(2),.e02-dimension:nth-child(3),.e02-dimension:nth-child(4),.e02-dimension:nth-child(5){transform:none}
  .e02-dimension:nth-child(4),.e02-dimension:nth-child(5){margin-top:10px}
  .e02-orb{width:min(100%,270px)}
  @keyframes e02-orbit{
    0%{transform:rotate(0deg) translateX(150px) rotate(0deg)}
    100%{transform:rotate(360deg) translateX(150px) rotate(-360deg)}
  }
}
@media(max-width:700px){
  .e02-pearl{width:100%;border-left:0;border-right:0}
  .e02-intro h1{font-size:clamp(28px,8.5vw,42px)}
  .e02-intro p{font-size:12px}
  .e02-node{margin-top:24px;padding:18px 16px;border-radius:24px}
  .e02-node h2{font-size:25px}
  .e02-field{margin-top:32px;padding:20px 8px 30px;border-radius:34px}
  .e02-orbs{grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 10px}
  .e02-dimension:nth-child(5){grid-column:1/-1;margin-top:0}
  .e02-dimension:nth-child(5) .e02-orb{width:min(58vw,250px)}
  .e02-orb{width:min(100%,230px)}
  .e02-score{font-size:clamp(46px,12vw,68px)}
  .e02-name{margin-top:12px;font-size:12px}
  .e02-orb-bead{width:8px;height:8px;margin:-4px}
  @keyframes e02-orbit{
    0%{transform:rotate(0deg) translateX(124px) rotate(0deg)}
    100%{transform:rotate(360deg) translateX(124px) rotate(-360deg)}
  }
}
@media(max-width:430px){
  .e02-pearl{padding-left:10px;padding-right:10px}
  .e02-field{padding-left:4px;padding-right:4px}
  .e02-orbs{gap:28px 6px}
  .e02-orb{width:min(100%,190px)}
  .e02-dimension:nth-child(5) .e02-orb{width:min(58vw,205px)}
  .e02-score{font-size:clamp(40px,12.5vw,58px)}
  .e02-name{font-size:11px}
  @keyframes e02-orbit{
    0%{transform:rotate(0deg) translateX(102px) rotate(0deg)}
    100%{transform:rotate(360deg) translateX(102px) rotate(-360deg)}
  }
}
@media(max-width:360px){
  .e02-orbs{gap:24px 4px}
  .e02-orb{width:min(100%,168px)}
  .e02-dimension:nth-child(5) .e02-orb{width:min(58vw,180px)}
  .e02-score{font-size:40px}
  .e02-name{font-size:10.5px}
  @keyframes e02-orbit{
    0%{transform:rotate(0deg) translateX(90px) rotate(0deg)}
    100%{transform:rotate(360deg) translateX(90px) rotate(-360deg)}
  }
}
@media(prefers-reduced-motion:reduce){
  #e02{scroll-behavior:auto}
  .e02-orb,.e02-orb-bead{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main id="e02" aria-labelledby="e02-title">
<div class="e02-pearl">
<div class="e02-wrap">
<header class="e02-intro">
<p class="e02-marker">YOUR FIVE DIMENSIONS</p>
<h1 id="e02-title">Five dimensions. One capability picture.</h1>
<p>Five living signals show what makes up your AI capability.</p>
</header>

<section class="e02-node" aria-labelledby="e02-capability-title">
<p class="e02-node-label">YOUR AI CAPABILITY</p>
<h2 id="e02-capability-title">Five dimensions. One system.</h2>
</section>

<section class="e02-field" aria-labelledby="e02-field-title">
<h2 id="e02-field-title" class="sr-only">Five MAXESS dimension scores</h2>
<div id="e02-orbs" class="e02-orbs" aria-busy="true" aria-label="Five MAXESS dimension scores"></div>
<div id="e02-missing" class="e02-missing" role="status">Dimension scores are not available yet.</div>
</section>
</div>
</div>
</main>
<script>
(function(){
'use strict';
var root=document.getElementById('e02'),field=document.getElementById('e02-orbs'),missing=document.getElementById('e02-missing');
if(!root||!field)return;
var DIMENSIONS=[
{id:'direction',name:'Direction'},
{id:'communication',name:'Communication'},
{id:'evaluation',name:'Evaluation'},
{id:'iteration',name:'Iteration'},
{id:'systemsThinking',name:'Systems Thinking'}
];
function clamp(v){if(v===null||v===undefined||v==='')return null;var n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,n)):null}
function format(v){return Number.isInteger(v)?String(v):String(Math.round(v*10)/10)}
function key(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function sources(){var out=[];try{if(window.MAXESS_RESULT)out.push(window.MAXESS_RESULT)}catch(e){}try{if(window.parent&&window.parent!==window&&window.parent.MAXESS_RESULT)out.push(window.parent.MAXESS_RESULT)}catch(e){}try{if(window.top&&window.top!==window&&window.top!==window.parent&&window.top.MAXESS_RESULT)out.push(window.top.MAXESS_RESULT)}catch(e){}return out}
function container(result){if(!result||typeof result!=='object')return null;var names=['dimensions','dimensionScores','scores','dimensionResults','fingerprint'];for(var i=0;i<names.length;i++){var v=result[names[i]];if(v&&(Array.isArray(v)||typeof v==='object'))return v}return null}
function read(containerRef,dimension){if(!containerRef)return null;if(Array.isArray(containerRef)){for(var i=0;i<containerRef.length;i++){var item=containerRef[i];if(!item||typeof item!=='object')continue;var id=key(item.id||item.dimensionId||item.name||item.label);if(id===key(dimension.id)||id===key(dimension.name))return clamp(item.score!==undefined?item.score:item.value!==undefined?item.value:item.overallScore)}}else{var keys=Object.keys(containerRef);for(var j=0;j<keys.length;j++){var k=keys[j],v=containerRef[k];if(key(k)===key(dimension.id)||key(k)===key(dimension.name)){if(v&&typeof v==='object')return clamp(v.score!==undefined?v.score:v.value!==undefined?v.value:v.overallScore);return clamp(v)}}}return null}
function live(){var rs=sources();for(var i=0;i<rs.length;i++){var c=container(rs[i]);if(!c)continue;var values=[],valid=0;for(var j=0;j<DIMENSIONS.length;j++){var s=read(c,DIMENSIONS[j]);values.push(s);if(s!==null)valid++}if(valid===DIMENSIONS.length)return values}return null}
function render(){var values=live();field.innerHTML='';field.setAttribute('aria-busy','false');if(!values){missing.classList.add('show');return}missing.classList.remove('show');for(var i=0;i<DIMENSIONS.length;i++){var d=DIMENSIONS[i],score=values[i];var article=document.createElement('article');article.className='e02-dimension';article.setAttribute('aria-label',d.name+' score '+format(score)+' out of 100');var stage=document.createElement('div');stage.className='e02-orb-stage';var orb=document.createElement('div');orb.className='e02-orb';orb.setAttribute('role','img');orb.setAttribute('aria-label',d.name+' '+format(score)+' out of 100');var ring=document.createElement('span');ring.className='e02-orb-ring';ring.setAttribute('aria-hidden','true');var bead=document.createElement('span');bead.className='e02-orb-bead';bead.setAttribute('aria-hidden','true');var glint=document.createElement('span');glint.className='e02-orb-glint';glint.setAttribute('aria-hidden','true');var scoreNode=document.createElement('strong');scoreNode.className='e02-score';scoreNode.innerHTML=format(score)+'<small>/ 100</small>';orb.appendChild(ring);orb.appendChild(bead);orb.appendChild(glint);orb.appendChild(scoreNode);stage.appendChild(orb);var name=document.createElement('div');name.className='e02-name';name.textContent=d.name;var rule=document.createElement('div');rule.className='e02-rule';rule.setAttribute('aria-hidden','true');article.appendChild(stage);article.appendChild(name);article.appendChild(rule);field.appendChild(article)}}
field.setAttribute('aria-busy','true');render();window.addEventListener('maxess:result-updated',render);window.addEventListener('MAXESS_RESULT_READY',render);window.addEventListener('storage',render);
})();
</script>
</body>
</html>
