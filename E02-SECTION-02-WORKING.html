#maxess-e02-v3 .e02-orb{position:relative;width:88%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 29% 18%,rgba(255,255,255,.40),transparent 11%),radial-gradient(circle at 38% 33%,rgba(var(--e02-rgb),.34),transparent 33%),radial-gradient(circle at 54% 57%,rgba(var(--e02-rgb),.15),transparent 55%),radial-gradient(circle at 50% 48%,#242129 0%,#0d0b10 58%,#020204 100%);border:1px solid rgba(255,255,255,.30);box-shadow:inset 11px 10px 30px rgba(255,255,255,.07),inset -28px -32px 56px rgba(0,0,0,.76),inset 0 0 64px rgba(var(--e02-rgb),.18),0 28px 52px rgba(0,0,0,.25),0 0 52px rgba(var(--e02-rgb),.17);animation:e02-breathe 6s ease-in-out infinite;transform-origin:center}
#maxess-e02-v3 .e02-orb:before{content:"";position:absolute;inset:4%;border-radius:50%;border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 0 30px rgba(var(--e02-rgb),.10),0 0 25px rgba(var(--e02-rgb),.09)}
#maxess-e02-v3 .e02-orb:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(var(--e02-rgb),.28);box-shadow:0 0 28px rgba(var(--e02-rgb),.13);pointer-events:none}
#maxess-e02-v3 .e02-core{position:absolute;width:38%;height:38%;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.34),rgba(var(--e02-rgb),.24) 30%,rgba(var(--e02-rgb),.08) 56%,transparent 74%);filter:blur(1px);animation:e02-core 3.5s ease-in-out infinite}
#maxess-e02-v3 .e02-score{position:relative;z-index:4;color:#fff;font-size:clamp(38px,5vw,76px);line-height:.82;font-weight:950;letter-spacing:-.095em;-webkit-text-stroke:1.5px #020204;text-shadow:0 1px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.98),0 6px 0 rgba(0,0,0,.88),0 12px 20px rgba(0,0,0,.86),0 0 27px rgba(var(--e02-rgb),.52)}
#maxess-e02-v3 .e02-score-unit{position:absolute;z-index:5;bottom:24%;left:50%;transform:translateX(-50%);font-size:9px;line-height:1;font-weight:950;letter-spacing:.18em;color:rgba(255,255,255,.68);white-space:nowrap;text-transform:uppercase}
#maxess-e02-v3 .e02-name{margin-top:18px;color:#111016;font-size:clamp(11px,1.25vw,15px);line-height:1.1;font-weight:950;letter-spacing:.06em;text-transform:uppercase}
#maxess-e02-v3 .e02-access{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#maxess-e02-v3 .e02-missing{display:none;margin:22px auto 0;max-width:620px;color:#4e4638;font-size:12px;line-height:1.5;text-align:center}
#maxess-e02-v3 .e02-missing.is-visible{display:block}
@keyframes e02-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
@keyframes e02-core{0%,100%{transform:scale(.94);opacity:.72}50%{transform:scale(1.06);opacity:1}}
@media(max-width:1050px){#maxess-e02-v3 .e02-orbs{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:42px;max-width:820px}#maxess-e02-v3 .e02-dimension:nth-child(4){grid-column:1}#maxess-e02-v3 .e02-dimension:nth-child(5){grid-column:2}}
@media(max-width:640px){#maxess-e02-v3{padding-top:48px;padding-bottom:74px}#maxess-e02-v3 .e02-intro{margin-bottom:32px}#maxess-e02-v3 .e02-title{font-size:clamp(33px,10vw,48px)}#maxess-e02-v3 .e02-subtitle{font-size:14px}#maxess-e02-v3 .e02-node{margin-bottom:34px;border-radius:24px}#maxess-e02-v3 .e02-field{padding:22px 9px 30px;border-radius:32px}#maxess-e02-v3 .e02-orbs{grid-template-columns:repeat(6,minmax(0,1fr));gap:34px 4px;max-width:430px;row-gap:36px}#maxess-e02-v3 .e02-dimension:nth-child(1){grid-column:1 / 3}#maxess-e02-v3 .e02-dimension:nth-child(2){grid-column:3 / 5}#maxess-e02-v3 .e02-dimension:nth-child(3){grid-column:5 / 7}#maxess-e02-v3 .e02-dimension:nth-child(4){grid-column:2 / 4}#maxess-e02-v3 .e02-dimension:nth-child(5){grid-column:4 / 6}#maxess-e02-v3 .e02-score{font-size:clamp(33px,9.5vw,49px)}#maxess-e02-v3 .e02-score-unit{font-size:7px;bottom:22%;letter-spacing:.13em}#maxess-e02-v3 .e02-name{margin-top:14px;font-size:9px;letter-spacing:.04em}}
@media(max-width:370px){#maxess-e02-v3 .e02-orbs{max-width:360px;gap:30px 2px;row-gap:32px}#maxess-e02-v3 .e02-name{font-size:8px}#maxess-e02-v3 .e02-score{font-size:31px}}

</style>
<div class="e02-inner">
<header class="e02-intro">
<p class="e02-eyebrow">YOUR FIVE DIMENSIONS</p>
<h2 class="e02-title" id="maxess-e02-title">Five dimensions. One capability picture.</h2>
<p class="e02-subtitle">Five living signals show what makes up your AI capability.</p>
</header>
<section class="e02-node" aria-labelledby="e02-node-title">
<p class="e02-node-label">YOUR AI CAPABILITY</p>
<h3 class="e02-node-title" id="e02-node-title">Five dimensions. One system.</h3>
</section>
<section class="e02-field" aria-label="Your five dimensions">
<div class="e02-orbs" id="e02-orbs" aria-live="polite"></div>
<p class="e02-missing" id="e02-missing" role="status">Your MAXESS result is not available yet. No production score is being invented.</p>
</section>
</div>
<script>
(()=>{
'use strict';
const root=document.getElementById('maxess-e02-v3');
const host=document.getElementById('e02-orbs');
const missing=document.getElementById('e02-missing');
if(!root||!host)return;
const fallback=[{name:'Direction',key:'direction'},{name:'Context',key:'context'},{name:'Collaboration',key:'collaboration'},{name:'Evaluation',key:'evaluation'},{name:'Iteration',key:'iteration'}];
const colors=['purple','coral','emerald','blue','gold'];
function score(v){const n=Number(v);return Number.isFinite(n)&&n>=0&&n<=100?n:null}
function getDimensions(result){
 if(result&&Array.isArray(result.dimensions)&&result.dimensions.length===5)return result.dimensions.map((d,i)=>({name:d?.name||fallback[i].name,key:d?.id||fallback[i].key,score:score(d?.score)}));
 if(result&&Array.isArray(result.fiveDimensions)&&result.fiveDimensions.length===5)return result.fiveDimensions.map((d,i)=>({name:d?.name||fallback[i].name,key:d?.id||fallback[i].key,score:score(d?.score)}));
 return fallback.map(d=>({...d,score:null}));
}
function render(){
 const result=window.MAXESS_RESULT;const dims=getDimensions(result);const fragment=document.createDocumentFragment();let any=false;
 dims.forEach((dim,index)=>{
  if(dim.score!==null)any=true;
  const article=document.createElement('article');article.className='e02-dimension';article.dataset.dimension=dim.key;article.dataset.color=colors[index];article.setAttribute('aria-label',`${dim.name}: ${dim.score===null?'score unavailable':`${dim.score} out of 100`}`);
  const stage=document.createElement('div');stage.className='e02-orb-stage';
  const aura=document.createElement('div');aura.className='e02-aura';aura.setAttribute('aria-hidden','true');
  const orbit=document.createElement('div');orbit.className='e02-orbit';orbit.setAttribute('aria-hidden','true');
  const orb=document.createElement('div');orb.className='e02-orb';
  const core=document.createElement('div');core.className='e02-core';core.setAttribute('aria-hidden','true');
  const value=document.createElement('div');value.className='e02-score';value.textContent=dim.score===null?'—':String(Math.round(dim.score));
  const unit=document.createElement('div');unit.className='e02-score-unit';unit.textContent='/ 100';
  const access=document.createElement('span');access.className='e02-access';access.textContent=`${dim.name}, ${dim.score===null?'score unavailable':`${Math.round(dim.score)} out of 100`}`;
  orb.append(core,value,unit,access);stage.append(aura,orbit,orb);const name=document.createElement('div');name.className='e02-name';name.textContent=dim.name;article.append(stage,name);fragment.append(article);
 });
 host.replaceChildren(fragment);missing.classList.toggle('is-visible',!any);
}
render();window.addEventListener('MAXESS_RESULT_READY',render);window.addEventListener('maxess:result-updated',render);window.addEventListener('storage',render);
let attempts=0;const timer=setInterval(()=>{attempts++;render();if(window.MAXESS_RESULT||attempts>=20)clearInterval(timer)},250);
})();
</script>
</section>
