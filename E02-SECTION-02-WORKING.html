.e02-orbs{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,1.2vw,18px);align-items:start}.e02-dimension{--c1:var(--purple);--c2:#c4a3ff;--rgb:139,92,246;position:relative;min-width:0;text-align:center}.e02-dimension:nth-child(2){--c1:var(--magenta);--c2:#ff9b70;--rgb:237,75,135}.e02-dimension:nth-child(3){--c1:var(--green);--c2:#55e0a3;--rgb:24,184,121}.e02-dimension:nth-child(4){--c1:var(--blue);--c2:#63c8ff;--rgb:40,124,240}.e02-dimension:nth-child(5){--c1:var(--gold);--c2:#ffe28a;--rgb:232,165,28}.e02-dimension:nth-child(1),.e02-dimension:nth-child(5){transform:translateY(24px)}.e02-dimension:nth-child(3){transform:translateY(-8px)}
.e02-orb-stage{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center}.e02-orb-stage:before{content:"";position:absolute;width:86%;height:24%;left:7%;bottom:3%;border-radius:50%;background:rgba(7,7,10,.12);filter:blur(18px);transform:translateY(22%);pointer-events:none}.e02-orb{position:relative;width:min(100%,238px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 29% 16%,rgba(255,255,255,.98),transparent 10%),radial-gradient(circle at 38% 30%,rgba(var(--rgb),.52),transparent 30%),radial-gradient(circle at 56% 61%,rgba(var(--rgb),.22),transparent 54%),radial-gradient(circle at 50% 47%,#202026 0 38%,#08080c 74%,#020204 100%);border:1px solid rgba(255,255,255,.40);box-shadow:inset 16px 14px 34px rgba(255,255,255,.08),inset -30px -34px 60px rgba(0,0,0,.78),inset 0 0 82px rgba(var(--rgb),.20),0 30px 50px rgba(0,0,0,.28),0 0 58px rgba(var(--rgb),.18);animation:e02-orb-breathe 6s ease-in-out infinite;transform-origin:center;transition:box-shadow .6s ease,filter .6s ease}.e02-orb:before{content:"";position:absolute;inset:3.2%;border-radius:50%;border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 0 34px rgba(var(--rgb),.12),0 0 28px rgba(var(--rgb),.10);pointer-events:none}.e02-orb:after{content:"";position:absolute;inset:-7%;border-radius:50%;border:1px solid rgba(var(--rgb),.28);box-shadow:0 0 34px rgba(var(--rgb),.17);pointer-events:none}.e02-orb-ring{position:absolute;inset:-11%;border:1px solid rgba(var(--rgb),.14);border-radius:50%;transform:rotate(-18deg);pointer-events:none}.e02-orb-bead{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0%,#fff 14%,var(--c1) 58%,var(--c2) 100%);box-shadow:0 0 9px #fff,0 0 20px rgba(var(--rgb),.72);transform-origin:0 0;animation:e02-orbit 10s linear infinite;pointer-events:none}.e02-orb-bead:after{content:"";position:absolute;inset:-3px;border:1px solid rgba(var(--rgb),.25);border-radius:50%}.e02-orb-glint{position:absolute;left:20%;top:15%;width:27%;height:18%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.96),transparent 72%);filter:blur(3px);opacity:.72;transform:rotate(-25deg);pointer-events:none}.e02-score{position:relative;z-index:5;display:flex;align-items:baseline;justify-content:center;gap:4px;color:#fff;font-size:clamp(46px,4.7vw,76px);line-height:.82;font-weight:950;letter-spacing:-.10em;-webkit-text-stroke:1.5px #030305;text-shadow:0 1px 0 rgba(255,255,255,.28),0 3px 0 #000,0 7px 0 rgba(0,0,0,.88),0 13px 22px rgba(0,0,0,.90),0 0 28px rgba(var(--rgb),.54)}.e02-score small{font-size:.23em;letter-spacing:-.02em;font-weight:900;color:rgba(255,255,255,.90);-webkit-text-stroke:0;text-shadow:none;margin-left:1px}.e02-name{position:relative;margin-top:15px;color:#111116;font-size:clamp(12px,1.3vw,16px);line-height:1.05;font-weight:950;letter-spacing:-.02em}.e02-rule{width:28px;height:2px;margin:9px auto 0;border-radius:2px;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 12px rgba(var(--rgb),.24)}.e02-missing{position:relative;z-index:2;display:none;margin:18px auto 0;max-width:480px;padding:12px 14px;border:1px solid rgba(125,85,20,.22);border-radius:14px;background:rgba(125,85,20,.06);color:#554936;font-size:12px;text-align:center}.e02-missing.show{display:block}
@keyframes e02-orb-breathe{0%,100%{transform:scale(1) rotate(0deg);filter:brightness(1)}50%{transform:scale(1.018) rotate(.22deg);filter:brightness(1.035)}}@keyframes e02-orbit{0%{transform:rotate(0deg) translateX(136px) rotate(0deg)}100%{transform:rotate(360deg) translateX(136px) rotate(-360deg)}}
@media(max-width:1040px){.e02-orbs{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:32px}.e02-dimension:nth-child(1),.e02-dimension:nth-child(3),.e02-dimension:nth-child(5){transform:none}.e02-dimension:nth-child(4),.e02-dimension:nth-child(5){margin-top:8px}.e02-orb{width:min(100%,250px)}@keyframes e02-orbit{0%{transform:rotate(0deg) translateX(140px) rotate(0deg)}100%{transform:rotate(360deg) translateX(140px) rotate(-360deg)}}}
@media(max-width:640px){.e02-wrap{padding-left:12px;padding-right:12px}.e02-intro h1{font-size:clamp(28px,9vw,42px)}.e02-intro p{font-size:12px}.e02-node{margin-top:22px;padding:18px 16px;border-radius:21px}.e02-node h2{font-size:25px}.e02-field{margin-top:30px;padding:22px 8px 30px;border-radius:30px}.e02-field-head{margin-bottom:18px}.e02-field-head h2{font-size:15px}.e02-field-head p{font-size:10px}.e02-orbs{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 10px}.e02-dimension:nth-child(5){grid-column:1/-1;margin-top:0}.e02-dimension:nth-child(5) .e02-orb{width:min(66vw,260px)}.e02-score{font-size:clamp(44px,13vw,64px)}.e02-name{margin-top:12px;font-size:12px}.e02-orb-bead{width:8px;height:8px;margin:-4px}@keyframes e02-orbit{0%{transform:rotate(0deg) translateX(112px) rotate(0deg)}100%{transform:rotate(360deg) translateX(112px) rotate(-360deg)}}}
@media(max-width:360px){.e02-orbs{gap:26px 8px}.e02-score{font-size:42px}.e02-name{font-size:11px}.e02-node h2{font-size:23px}@keyframes e02-orbit{0%{transform:rotate(0deg) translateX(98px) rotate(0deg)}100%{transform:rotate(360deg) translateX(98px) rotate(-360deg)}}}
@media(prefers-reduced-motion:reduce){#e02{scroll-behavior:auto}.e02-orb,.e02-orb-bead{animation:none!important;transition:none!important}}

<body>
<main id="e02" aria-labelledby="e02-title">
<div class="e02-wrap">
<header class="e02-intro">
<p class="e02-marker">YOUR FIVE DIMENSIONS</p>
<h1 id="e02-title">Five dimensions. One capability picture.</h1>
<p>Five living signals show what makes up your AI capability.</p>
</header>
<section class="e02-node" aria-labelledby="e02-capability-title">
<p class="e02-node-label">YOUR AI CAPABILITY</p>
<h2 id="e02-capability-title">Five dimensions. One system.</h2>
</section>
<section class="e02-field" aria-labelledby="e02-field-title">
<header class="e02-field-head">
<h2 id="e02-field-title">Your five dimensions</h2>
<p>Five living Orbs. Five scores.</p>
</header>
<div id="e02-orbs" class="e02-orbs" aria-busy="true" aria-label="Five MAXESS dimension scores"></div>

</section>
</div>
</main>
<script>
(function(){
'use strict';
var root=document.getElementById('e02'),field=document.getElementById('e02-orbs'),missing=document.getElementById('e02-missing');
if(!root||!field)return;
var DIMENSIONS=[
{id:'direction',name:'Direction'},
{id:'communication',name:'Communication'},
{id:'evaluation',name:'Evaluation'},
{id:'iteration',name:'Iteration'},
{id:'systemsThinking',name:'Systems Thinking'}
];
function clamp(v){if(v===null||v===undefined||v==='')return null;var n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,n)):null}
function format(v){return Number.isInteger(v)?String(v):String(Math.round(v*10)/10)}
function key(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function sources(){var out=[];try{if(window.MAXESS_RESULT)out.push(window.MAXESS_RESULT)}catch(e){}try{if(window.parent&&window.parent!==window&&window.parent.MAXESS_RESULT)out.push(window.parent.MAXESS_RESULT)}catch(e){}try{if(window.top&&window.top!==window&&window.top!==window.parent&&window.top.MAXESS_RESULT)out.push(window.top.MAXESS_RESULT)}catch(e){}return out}
function container(result){if(!result||typeof result!=='object')return null;var names=['dimensions','dimensionScores','scores','dimensionResults','fingerprint'];for(var i=0;i<names.length;i++){var v=result[names[i]];if(v&&(Array.isArray(v)||typeof v==='object'))return v}return null}
function read(containerRef,dimension){if(!containerRef)return null;if(Array.isArray(containerRef)){for(var i=0;i<containerRef.length;i++){var item=containerRef[i];if(!item||typeof item!=='object')continue;var id=key(item.id||item.dimensionId||item.name||item.label);if(id===key(dimension.id)||id===key(dimension.name))return clamp(item.score!==undefined?item.score:item.value!==undefined?item.value:item.overallScore)}}else{var keys=Object.keys(containerRef);for(var j=0;j<keys.length;j++){var k=keys[j],v=containerRef[k];if(key(k)===key(dimension.id)||key(k)===key(dimension.name)){if(v&&typeof v==='object')return clamp(v.score!==undefined?v.score:v.value!==undefined?v.value:v.overallScore);return clamp(v)}}}return null}
function live(){var rs=sources();for(var i=0;i<rs.length;i++){var c=container(rs[i]);if(!c)continue;var values=[],valid=0;for(var j=0;j<DIMENSIONS.length;j++){var s=read(c,DIMENSIONS[j]);values.push(s);if(s!==null)valid++}if(valid===DIMENSIONS.length)return values}return null}
function render(){var values=live();field.innerHTML='';field.setAttribute('aria-busy','false');if(!values){missing.classList.add('show');return}missing.classList.remove('show');for(var i=0;i<DIMENSIONS.length;i++){var d=DIMENSIONS[i],score=values[i];var article=document.createElement('article');article.className='e02-dimension';article.setAttribute('aria-label',d.name+' score '+format(score)+' out of 100');var stage=document.createElement('div');stage.className='e02-orb-stage';var orb=document.createElement('div');orb.className='e02-orb';orb.setAttribute('role','img');orb.setAttribute('aria-label',d.name+' '+format(score)+' out of 100');var ring=document.createElement('span');ring.className='e02-orb-ring';ring.setAttribute('aria-hidden','true');var bead=document.createElement('span');bead.className='e02-orb-bead';bead.setAttribute('aria-hidden','true');var glint=document.createElement('span');glint.className='e02-orb-glint';glint.setAttribute('aria-hidden','true');var scoreNode=document.createElement('strong');scoreNode.className='e02-score';scoreNode.innerHTML=format(score)+'<small>/ 100</small>';orb.appendChild(ring);orb.appendChild(bead);orb.appendChild(glint);orb.appendChild(scoreNode);stage.appendChild(orb);var name=document.createElement('div');name.className='e02-name';name.textContent=d.name;var rule=document.createElement('div');rule.className='e02-rule';rule.setAttribute('aria-hidden','true');article.appendChild(stage);article.appendChild(name);article.appendChild(rule);field.appendChild(article)}}
field.setAttribute('aria-busy','true');render();window.addEventListener('maxess:result-updated',render);window.addEventListener('MAXESS_RESULT_READY',render);window.addEventListener('storage',render);
})();
</script>
