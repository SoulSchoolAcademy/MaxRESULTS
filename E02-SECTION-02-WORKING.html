<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1eb">
<meta name="color-scheme" content="light">
<meta name="maxess-artifact" content="E02-SECTION-02-WORKING">
<meta name="maxess-version" content="e02-five-orb-locked">
<title>MAXESS — Section 02 · Five Dimensions</title>
<style>
/* E02 ONLY — every visual selector is scoped to #e02. */
#e02{
  --pearl:#f4f1eb;
  --ink:#0b0a10;
  --purple:#9b63ff;
  --magenta:#ed4b87;
  --emerald:#18c982;
  --blue:#287cf0;
  --gold:#e8a51c;
  position:relative;
  isolation:isolate;
  width:100%;
  min-height:92vh;
  overflow:hidden;
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse 82% 24% at 50% 0%,rgba(255,255,255,.98),transparent 72%),
    radial-gradient(ellipse 70% 54% at 50% 42%,rgba(255,255,255,.86),transparent 72%),
    linear-gradient(180deg,#fbfaf7 0%,#f4f1eb 56%,#d9d5ce 100%);
}
#e02,#e02 *{box-sizing:border-box}
#e02::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(circle at 8% 48%,rgba(255,255,255,.30),transparent 25%),
    radial-gradient(circle at 92% 48%,rgba(255,255,255,.27),transparent 25%),
    radial-gradient(circle at 50% 52%,rgba(255,255,255,.62),transparent 46%);
}
#e02::after{
  content:"";
  position:absolute;
  left:50%;
  top:22%;
  width:min(1180px,92vw);
  height:48%;
  transform:translateX(-50%);
  z-index:-1;
  pointer-events:none;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.58),rgba(255,255,255,.18) 45%,transparent 73%);
  filter:blur(22px);
}
#e02 .e02-field{
  position:relative;
  width:min(1500px,100%);
  min-height:92vh;
  margin:0 auto;
  padding:clamp(54px,7vw,92px) clamp(18px,3vw,46px) clamp(72px,9vw,112px);
  display:flex;
  align-items:center;
}
#e02 .e02-orbs{
  position:relative;
  width:100%;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  align-items:start;
  gap:clamp(8px,1.1vw,22px);
}
#e02 .e02-dimension{
  --c1:var(--purple);
  --c2:#c9adff;
  --rgb:155,99,255;
  --orb-size:min(100%,286px);
  --orbit-radius:112px;
  position:relative;
  min-width:0;
  text-align:center;
}
#e02 .e02-dimension:nth-child(1){transform:translateY(30px) scale(.96)}
#e02 .e02-dimension:nth-child(2){--c1:var(--magenta);--c2:#ff9b70;--rgb:237,75,135;--orbit-radius:118px;transform:translateY(8px) scale(1.01)}
#e02 .e02-dimension:nth-child(3){--c1:var(--emerald);--c2:#55e0a3;--rgb:24,201,130;--orbit-radius:124px;transform:translateY(-8px) scale(1.06)}
#e02 .e02-dimension:nth-child(4){--c1:var(--blue);--c2:#63c8ff;--rgb:40,124,240;--orbit-radius:118px;transform:translateY(8px) scale(1.01)}
#e02 .e02-dimension:nth-child(5){--c1:var(--gold);--c2:#ffe28a;--rgb:232,165,28;--orbit-radius:112px;transform:translateY(30px) scale(.96)}
#e02 .e02-orb-stage{
  position:relative;
  width:100%;
  aspect-ratio:1;
  display:grid;
  place-items:center;
}
#e02 .e02-shadow{
  position:absolute;
  left:16%;
  bottom:4%;
  width:68%;
  height:13%;
  border-radius:50%;
  background:rgba(0,0,0,.20);
  filter:blur(20px);
  transform:translateY(35%);
  pointer-events:none;
}
#e02 .e02-orb{
  position:relative;
  width:var(--orb-size);
  aspect-ratio:1;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 30% 16%,rgba(255,255,255,.98),transparent 10%),
    radial-gradient(circle at 38% 30%,rgba(var(--rgb),.58),transparent 30%),
    radial-gradient(circle at 54% 59%,rgba(var(--rgb),.24),transparent 55%),
    radial-gradient(circle at 50% 46%,#1d1b22 0 38%,#08070c 72%,#020204 100%);
  border:1px solid rgba(255,255,255,.38);
  box-shadow:
    inset 18px 16px 38px rgba(255,255,255,.08),
    inset -34px -38px 70px rgba(0,0,0,.84),
    inset 0 0 90px rgba(var(--rgb),.24),
    0 32px 68px rgba(0,0,0,.30),
    0 0 78px rgba(var(--rgb),.22);
  animation:e02-breathe 7s ease-in-out infinite;
  transform-origin:center;
}
#e02 .e02-orb::before{
  content:"";
  position:absolute;
  inset:2.8%;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:inset 0 0 38px rgba(var(--rgb),.14),0 0 34px rgba(var(--rgb),.12);
  pointer-events:none;
}
#e02 .e02-orb::after{
  content:"";
  position:absolute;
  inset:-6.5%;
  border-radius:50%;
  border:1px solid rgba(var(--rgb),.30);
  box-shadow:0 0 42px rgba(var(--rgb),.18);
  pointer-events:none;
}
#e02 .e02-ring{
  position:absolute;
  inset:-8%;
  border:1px solid rgba(var(--rgb),.15);
  border-radius:50%;
  transform:rotate(-18deg);
  pointer-events:none;
}
#e02 .e02-bead{
  position:absolute;
  left:50%;
  top:50%;
  width:10px;
  height:10px;
  margin:-5px;
  border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff 0%,#fff 14%,var(--c1) 58%,var(--c2) 100%);
  box-shadow:0 0 10px #fff,0 0 24px rgba(var(--rgb),.78);
  transform-origin:center;
  animation:e02-orbit 10s linear infinite;
  pointer-events:none;
  z-index:4;
}
#e02 .e02-bead::after{
  content:"";
  position:absolute;
  inset:-3px;
  border:1px solid rgba(var(--rgb),.25);
  border-radius:50%;
}
#e02 .e02-glint{
  position:absolute;
  left:20%;
  top:15%;
  width:27%;
  height:18%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.98),transparent 72%);
  filter:blur(3px);
  opacity:.74;
  transform:rotate(-25deg);
  pointer-events:none;
}
#e02 .e02-score{
  position:relative;
  z-index:5;
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:5px;
  white-space:nowrap;
  color:#fff;
  font-size:clamp(58px,5.1vw,92px);
  line-height:.84;
  font-weight:950;
  letter-spacing:-.095em;
  -webkit-text-stroke:1.5px #030305;
  text-shadow:
    0 1px 0 rgba(255,255,255,.30),
    0 3px 0 #000,
    0 7px 0 rgba(0,0,0,.92),
    0 14px 24px rgba(0,0,0,.92),
    0 0 30px rgba(var(--rgb),.58);
}
#e02 .e02-score small{
  font-size:.31em;
  letter-spacing:-.02em;
  font-weight:900;
  color:rgba(255,255,255,.98);
  -webkit-text-stroke:0;
  text-shadow:0 1px 4px rgba(0,0,0,.90);
}
#e02 .e02-name{
  position:relative;
  margin-top:clamp(12px,1.2vw,18px);
  color:#101015;
  font-size:clamp(11px,1.15vw,16px);
  line-height:1.05;
  font-weight:950;
  letter-spacing:.06em;
  text-transform:uppercase;
}
#e02 .e02-status{
  position:absolute;
  left:-9999px;
  width:1px;
  height:1px;
  overflow:hidden;
}
#e02 .e02-dimension:focus-within .e02-orb{
  outline:3px solid rgba(var(--rgb),.58);
  outline-offset:8px;
}
@keyframes e02-breathe{
  0%,100%{transform:scale(1);filter:brightness(1)}
  50%{transform:scale(1.018);filter:brightness(1.035)}
}
@keyframes e02-orbit{
  0%{transform:rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg)}
  100%{transform:rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg)}
}
@media(max-width:1120px){
  #e02 .e02-orbs{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:48px}
  #e02 .e02-dimension:nth-child(1){transform:translateY(18px) scale(.97)}
  #e02 .e02-dimension:nth-child(2){transform:none}
  #e02 .e02-dimension:nth-child(3){transform:translateY(-10px) scale(1.04)}
  #e02 .e02-dimension:nth-child(4){transform:none}
  #e02 .e02-dimension:nth-child(5){transform:translateY(18px) scale(.97)}
  #e02 .e02-dimension{--orb-size:min(100%,270px);--orbit-radius:102px}
  #e02 .e02-dimension:nth-child(2),#e02 .e02-dimension:nth-child(4){--orbit-radius:106px}
  #e02 .e02-dimension:nth-child(3){--orbit-radius:110px}
}
@media(max-width:700px){
  #e02 .e02-field{min-height:0;padding:42px 12px 72px}
  #e02 .e02-orbs{grid-template-columns:repeat(2,minmax(0,1fr));gap:42px 10px}
  #e02 .e02-dimension,#e02 .e02-dimension:nth-child(1),#e02 .e02-dimension:nth-child(2),#e02 .e02-dimension:nth-child(3),#e02 .e02-dimension:nth-child(4){transform:none}
  #e02 .e02-dimension:nth-child(5){grid-column:1/-1;transform:none;margin-top:2px}
  #e02 .e02-dimension{--orb-size:min(100%,230px);--orbit-radius:90px}
  #e02 .e02-dimension:nth-child(5){--orb-size:min(58vw,230px);--orbit-radius:86px}
  #e02 .e02-score{font-size:clamp(48px,12vw,70px)}
  #e02 .e02-bead{width:8px;height:8px;margin:-4px}
  #e02 .e02-name{font-size:12px;margin-top:13px}
}
@media(max-width:430px){
  #e02 .e02-field{padding-left:8px;padding-right:8px}
  #e02 .e02-orbs{gap:34px 8px}
  #e02 .e02-dimension{--orb-size:min(100%,194px);--orbit-radius:78px}
  #e02 .e02-dimension:nth-child(5){--orb-size:min(58vw,205px);--orbit-radius:82px}
  #e02 .e02-score{font-size:clamp(46px,13vw,64px)}
  #e02 .e02-name{font-size:11px}
}
@media(max-width:360px){
  #e02 .e02-field{padding-left:6px;padding-right:6px}
  #e02 .e02-orbs{gap:30px 6px}
  #e02 .e02-dimension{--orb-size:min(100%,176px);--orbit-radius:70px}
  #e02 .e02-dimension:nth-child(5){--orb-size:min(58vw,188px);--orbit-radius:74px}
  #e02 .e02-score{font-size:48px}
  #e02 .e02-name{font-size:10.5px}
}
@media(prefers-reduced-motion:reduce){
  #e02 .e02-orb,#e02 .e02-bead{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main id="e02" aria-labelledby="e02-accessible-title">
  <h1 id="e02-accessible-title" class="e02-status">Your five capability dimensions</h1>
  <section class="e02-field" aria-label="Five MAXESS capability dimensions">
    <div id="e02-orbs" class="e02-orbs" aria-live="polite" aria-busy="true"></div>
    <div id="e02-status" class="e02-status" role="status"></div>
  </section>
</main>
<script>
(function(){
  'use strict';

  var field=document.getElementById('e02-orbs');
  var status=document.getElementById('e02-status');
  if(!field)return;

  var DIMENSIONS=[
    {id:'direction',name:'Direction',c1:'#9b63ff',c2:'#c9adff',rgb:'155,99,255'},
    {id:'communication',name:'Communication',c1:'#ed4b87',c2:'#ff9b70',rgb:'237,75,135'},
    {id:'evaluation',name:'Evaluation',c1:'#18c982',c2:'#55e0a3',rgb:'24,201,130'},
    {id:'iteration',name:'Iteration',c1:'#287cf0',c2:'#63c8ff',rgb:'40,124,240'},
    {id:'systemsThinking',name:'Systems Thinking',c1:'#e8a51c',c2:'#ffe28a',rgb:'232,165,28'}
  ];

  function clamp(value){
    if(value===null||value===undefined||value==='')return null;
    var number=Number(value);
    return Number.isFinite(number)?Math.max(0,Math.min(100,number)):null;
  }

  function format(value){
    return Number.isInteger(value)?String(value):String(Math.round(value*10)/10);
  }

  function normalize(value){
    return String(value||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  }

  function authoritativeResult(){
    try{
      return window.MAXESS_RESULT&&typeof window.MAXESS_RESULT==='object'?window.MAXESS_RESULT:null;
    }catch(error){
      return null;
    }
  }

  function dimensionContainer(result){
    if(!result)return null;
    var names=['dimensions','dimensionScores','scores','dimensionResults','fingerprint'];
    for(var i=0;i<names.length;i++){
      var candidate=result[names[i]];
      if(candidate&&(Array.isArray(candidate)||typeof candidate==='object'))return candidate;
    }
    return null;
  }

  function readScore(container,dimension){
    if(!container)return null;

    if(Array.isArray(container)){
      for(var i=0;i<container.length;i++){
        var item=container[i];
        if(!item||typeof item!=='object')continue;
        var identity=normalize(item.id||item.dimensionId||item.name||item.label);
        if(identity===normalize(dimension.id)||identity===normalize(dimension.name)){
          return clamp(item.score!==undefined?item.score:item.value!==undefined?item.value:item.overallScore);
        }
      }
      return null;
    }

    var keys=Object.keys(container);
    for(var j=0;j<keys.length;j++){
      var key=keys[j];
      var value=container[key];
      if(normalize(key)!==normalize(dimension.id)&&normalize(key)!==normalize(dimension.name))continue;
      if(value&&typeof value==='object'){
        return clamp(value.score!==undefined?value.score:value.value!==undefined?value.value:value.overallScore);
      }
      return clamp(value);
    }
    return null;
  }

  function readAllScores(){
    var result=authoritativeResult();
    var container=dimensionContainer(result);
    if(!container)return null;

    var scores=[];
    for(var i=0;i<DIMENSIONS.length;i++){
      var score=readScore(container,DIMENSIONS[i]);
      if(score===null)return null;
      scores.push(score);
    }
    return scores;
  }

  function makeOrb(dimension,score){
    var article=document.createElement('article');
    article.className='e02-dimension';
    article.style.setProperty('--c1',dimension.c1);
    article.style.setProperty('--c2',dimension.c2);
    article.style.setProperty('--rgb',dimension.rgb);
    article.setAttribute('aria-label',dimension.name+' score '+format(score)+' out of 100');

    var stage=document.createElement('div');
    stage.className='e02-orb-stage';

    var shadow=document.createElement('span');
    shadow.className='e02-shadow';
    shadow.setAttribute('aria-hidden','true');

    var orb=document.createElement('div');
    orb.className='e02-orb';
    orb.setAttribute('role','img');
    orb.setAttribute('aria-label',dimension.name+' '+format(score)+' out of 100');

    var ring=document.createElement('span');
    ring.className='e02-ring';
    ring.setAttribute('aria-hidden','true');

    var bead=document.createElement('span');
    bead.className='e02-bead';
    bead.setAttribute('aria-hidden','true');

    var glint=document.createElement('span');
    glint.className='e02-glint';
    glint.setAttribute('aria-hidden','true');

    var scoreNode=document.createElement('strong');
    scoreNode.className='e02-score';

    var numberNode=document.createElement('span');
    numberNode.textContent=format(score);

    var outOfNode=document.createElement('small');
    outOfNode.textContent='/ 100';

    scoreNode.appendChild(numberNode);
    scoreNode.appendChild(outOfNode);
    orb.appendChild(ring);
    orb.appendChild(bead);
    orb.appendChild(glint);
    orb.appendChild(scoreNode);
    stage.appendChild(shadow);
    stage.appendChild(orb);

    var name=document.createElement('div');
    name.className='e02-name';
    name.textContent=dimension.name;

    article.appendChild(stage);
    article.appendChild(name);
    return article;
  }

  function render(){
    var scores=readAllScores();
    field.replaceChildren();

    if(!scores){
      field.setAttribute('aria-busy','true');
      if(status)status.textContent='Five dimension scores are not available yet.';
      return;
    }

    if(status)status.textContent='';
    for(var i=0;i<DIMENSIONS.length;i++)field.appendChild(makeOrb(DIMENSIONS[i],scores[i]));
    field.setAttribute('aria-busy','false');
  }

  render();
  window.addEventListener('maxess:result-updated',render);
  window.addEventListener('MAXESS_RESULT_READY',render);
})();
</script>
</body>
</html>
