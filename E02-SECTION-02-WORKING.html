<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1ec">

<title>MAXESS — Section 02 · Your Five Dimensions</title>
<style>
:root{--paper:#f2f0eb;--paper-hi:#fbfaf7;--ink:#08080b;--purple:#8b5cf6}
*{box-sizing:border-box}html{background:var(--paper);overflow-x:clip;scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:clip}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #08080b;outline-offset:5px}
#e02{position:relative;min-height:100vh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 78% 42% at 50% -4%,rgba(139,92,246,.12),transparent 67%),radial-gradient(ellipse 58% 52% at 50% 46%,rgba(255,255,255,.96),transparent 72%),linear-gradient(180deg,var(--paper-hi) 0%,var(--paper) 52%,#e7e4de 100%)}
#e02:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.32;background:radial-gradient(circle at 50% 32%,rgba(255,255,255,.9),transparent 36%),linear-gradient(115deg,rgba(255,255,255,.42),transparent 28%,transparent 72%,rgba(0,0,0,.035));z-index:-2}
#e02:after{content:"";position:absolute;left:50%;top:33%;width:min(1100px,130vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.8),transparent 63%);filter:blur(26px);pointer-events:none;z-index:-3}
.wrap{position:relative;width:min(1320px,100%);margin:auto;padding:clamp(30px,5vw,64px) clamp(15px,4vw,42px) clamp(70px,8vw,110px)}
.hero{text-align:center;margin:0 auto;max-width:850px}.hero .marker{display:inline-block;color:#5f3bb2;font-size:10px;font-weight:950;letter-spacing:.28em;text-transform:uppercase}.hero h1{margin:14px 0 0;font-size:clamp(38px,5.5vw,72px);line-height:.94;letter-spacing:-.065em;font-weight:950}.hero p{margin:13px auto 0;color:#5d5a60;font-size:clamp(14px,1.45vw,18px);line-height:1.45}
.capability-node{position:relative;width:min(660px,100%);margin:clamp(28px,4vw,46px) auto 0;padding:clamp(24px,3vw,34px) 28px;text-align:center;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:28px;background:radial-gradient(circle at 50% 0%,rgba(139,92,246,.22),transparent 42%),linear-gradient(145deg,#030304 0%,#111116 54%,#020203 100%);box-shadow:inset 0 1px rgba(255,255,255,.18),inset 0 -1px rgba(139,92,246,.18),0 28px 70px rgba(0,0,0,.24),0 0 70px rgba(139,92,246,.08);overflow:hidden}.capability-node:after{content:"";position:absolute;inset:1px;border-radius:27px;border:1px solid rgba(255,255,255,.045);pointer-events:none}.capability-node .label{position:relative;z-index:1;margin:0;color:#d9c9ff;font-size:9px;font-weight:950;letter-spacing:.28em;text-transform:uppercase}.capability-node h2{position:relative;z-index:1;margin:8px 0 0;font-size:clamp(25px,3vw,39px);line-height:1;letter-spacing:-.05em;font-weight:950}
.dimension-field{position:relative;margin-top:clamp(44px,6vw,72px);padding:clamp(26px,4vw,52px) clamp(8px,2vw,20px) clamp(28px,4vw,48px);border-radius:48px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.99),rgba(249,248,245,.86) 44%,rgba(224,221,215,.48) 100%);border:1px solid rgba(8,8,11,.08);box-shadow:0 38px 90px rgba(25,22,30,.13),inset 0 1px rgba(255,255,255,.96);overflow:hidden}.dimension-field:before{content:"";position:absolute;left:50%;top:48%;width:min(1100px,120vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.045),transparent 48%),radial-gradient(circle,rgba(255,255,255,.85),transparent 72%);filter:blur(12px);pointer-events:none}.orb-field{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;gap:clamp(8px,1.7vw,26px)}
.dimension{--c1:#8b5cf6;--c2:#c4a3ff;--rgb:139,92,246;position:relative;min-width:0;text-align:center}.dimension:nth-child(2){--c1:#ed4b87;--c2:#ff9b70;--rgb:237,75,135}.dimension:nth-child(3){--c1:#18b879;--c2:#55e0a3;--rgb:24,184,121}.dimension:nth-child(4){--c1:#287cf0;--c2:#63c8ff;--rgb:40,124,240}.dimension:nth-child(5){--c1:#e8a51c;--c2:#ffe28a;--rgb:232,165,28}.dimension:nth-child(1){transform:translateY(18px)}.dimension:nth-child(3){transform:translateY(-8px)}.dimension:nth-child(5){transform:translateY(18px)}
.orb-stage{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center}.orb-stage:before{content:"";position:absolute;width:92%;height:30%;bottom:1%;left:4%;border-radius:50%;background:rgba(8,8,11,.12);filter:blur(18px);transform:translateY(18%);pointer-events:none}.orb{position:relative;width:min(100%,238px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 17%,rgba(255,255,255,.98),transparent 11%),radial-gradient(circle at 38% 30%,rgba(var(--rgb),.48),transparent 31%),radial-gradient(circle at 55% 60%,rgba(var(--rgb),.22),transparent 55%),radial-gradient(circle at 50% 47%,#202026 0 39%,#08080c 77%,#030305 100%);border:1px solid rgba(255,255,255,.38);box-shadow:inset 15px 14px 34px rgba(255,255,255,.075),inset -30px -34px 58px rgba(0,0,0,.76),inset 0 0 82px rgba(var(--rgb),.19),0 28px 48px rgba(0,0,0,.28),0 0 54px rgba(var(--rgb),.17);animation:orb-breathe 6s ease-in-out infinite;transition:box-shadow .6s ease,filter .6s ease}.orb:before{content:"";position:absolute;inset:3.5%;border-radius:50%;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 32px rgba(var(--rgb),.11),0 0 25px rgba(var(--rgb),.09)}.orb:after{content:"";position:absolute;inset:-7%;border-radius:50%;border:1px solid rgba(var(--rgb),.25);box-shadow:0 0 32px rgba(var(--rgb),.16);pointer-events:none}.orb-ring{position:absolute;inset:-11%;border-radius:50%;border:1px solid rgba(var(--rgb),.11);transform:rotate(-18deg);pointer-events:none}.orb-glint{position:absolute;left:20%;top:15%;width:28%;height:18%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),transparent 72%);filter:blur(3px);opacity:.7;transform:rotate(-25deg);pointer-events:none}.orb-score{position:relative;z-index:5;display:flex;align-items:baseline;justify-content:center;gap:4px;color:#fff;font-size:clamp(43px,4.4vw,70px);line-height:.82;font-weight:950;letter-spacing:-.095em;-webkit-text-stroke:1.5px #030305;text-shadow:0 1px 0 rgba(255,255,255,.28),0 3px 0 #000,0 7px 0 rgba(0,0,0,.86),0 13px 22px rgba(0,0,0,.88),0 0 28px rgba(var(--rgb),.52)}.orb-score small{font-size:.22em;letter-spacing:-.02em;font-weight:900;color:rgba(255,255,255,.86);-webkit-text-stroke:0;text-shadow:none;margin-left:1px}
.dimension-name{position:relative;margin-top:15px;color:#101014;font-size:clamp(12px,1.25vw,16px);line-height:1.05;font-weight:950;letter-spacing:-.02em}.dimension-rule{width:30px;height:2px;margin:9px auto 0;border-radius:2px;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 12px rgba(var(--rgb),.25)}
.no-score{position:relative;z-index:2;display:none;margin:24px auto 0;max-width:520px;padding:12px 14px;border:1px solid rgba(125,85,20,.22);border-radius:14px;background:rgba(125,85,20,.06);color:#554936;font-size:12px;text-align:center}.no-score.show{display:block}
@keyframes orb-breathe{0%,100%{transform:scale(1) rotate(0deg);filter:brightness(1)}50%{transform:scale(1.018) rotate(.22deg);filter:brightness(1.035)}}
@media(max-width:980px){.orb-field{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:34px}.dimension:nth-child(1),.dimension:nth-child(3),.dimension:nth-child(5){transform:none}.dimension:nth-child(4),.dimension:nth-child(5){margin-top:8px}.orb{width:min(100%,250px)}}
@media(max-width:640px){.wrap{padding-left:12px;padding-right:12px}.hero h1{font-size:clamp(34px,10vw,48px)}.hero p{font-size:14px}.capability-node{border-radius:23px;padding:22px 18px}.capability-node h2{font-size:28px}.dimension-field{margin-top:36px;padding:24px 10px 30px;border-radius:30px}.orb-field{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 12px}.dimension:nth-child(5){grid-column:1/-1}.dimension:nth-child(5) .orb{width:min(68vw,260px)}.orb-score{font-size:clamp(42px,13vw,62px)}.dimension-name{margin-top:12px;font-size:12px}}
@media(max-width:360px){.orb-field{gap:26px 8px}.orb-score{font-size:40px}.dimension-name{font-size:11px}.capability-node h2{font-size:25px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.orb{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="e02" aria-labelledby="e02-title">
<div class="wrap">
<header class="hero">
<div class="marker">YOUR FIVE DIMENSIONS</div>
<h1 id="e02-title">Five dimensions. One capability picture.</h1>
<p>Five living signals show what makes up your AI capability.</p>
</header>
<section class="capability-node" aria-labelledby="capability-title">
<p class="label">YOUR AI CAPABILITY</p>
<h2 id="capability-title">Five dimensions. One system.</h2>
</section>
<section class="dimension-field" aria-labelledby="dimensions-heading">
<h2 id="dimensions-heading" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Your five dimensions</h2>
<div id="orb-field" class="orb-field" aria-label="Five MAXESS dimension scores"></div>
<div id="no-score" class="no-score" role="status">Dimension scores are not available yet.</div>
</section>
</div>
</main>
<script>
(function(){
'use strict';
var root=document.getElementById('e02');
var field=document.getElementById('orb-field');
var noScore=document.getElementById('no-score');
if(!root||!field)return;
var DIMENSIONS=[
{id:'direction',name:'Direction'},
{id:'communication',name:'Communication'},
{id:'evaluation',name:'Evaluation'},
{id:'iteration',name:'Iteration'},
{id:'systemsThinking',name:'Systems Thinking'}
];
function clamp(v){if(v===null||v===undefined||v==='')return null;var n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,n)):null}
function format(v){return Number.isInteger(v)?String(v):String(Math.round(v*10)/10)}
function key(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function sources(){var out=[];try{if(window.MAXESS_RESULT)out.push(window.MAXESS_RESULT)}catch(e){}try{if(window.parent&&window.parent!==window&&window.parent.MAXESS_RESULT)out.push(window.parent.MAXESS_RESULT)}catch(e){}try{if(window.top&&window.top!==window&&window.top!==window.parent&&window.top.MAXESS_RESULT)out.push(window.top.MAXESS_RESULT)}catch(e){}return out}
function container(result){if(!result||typeof result!=='object')return null;var names=['dimensions','dimensionScores','scores','dimensionResults','fingerprint'];for(var i=0;i<names.length;i++){var v=result[names[i]];if(v&&(Array.isArray(v)||typeof v==='object'))return v}return null}
function read(containerRef,dimension){if(!containerRef)return null;if(Array.isArray(containerRef)){for(var i=0;i<containerRef.length;i++){var item=containerRef[i];if(!item||typeof item!=='object')continue;var id=key(item.id||item.dimensionId||item.name||item.label);if(id===key(dimension.id)||id===key(dimension.name))return clamp(item.score!==undefined?item.score:item.value!==undefined?item.value:item.overallScore)}}else{var keys=Object.keys(containerRef);for(var j=0;j<keys.length;j++){var k=keys[j],v=containerRef[k];if(key(k)===key(dimension.id)||key(k)===key(dimension.name)){if(v&&typeof v==='object')return clamp(v.score!==undefined?v.score:v.value!==undefined?v.value:v.overallScore);return clamp(v)}}}return null}
function live(){var rs=sources();for(var i=0;i<rs.length;i++){var c=container(rs[i]);if(!c)continue;var values=[];var valid=0;for(var j=0;j<DIMENSIONS.length;j++){var s=read(c,DIMENSIONS[j]);values.push(s);if(s!==null)valid++}if(valid===DIMENSIONS.length)return values}return null}
function render(){var values=live();field.setAttribute('aria-busy','false');field.innerHTML='';if(!values){noScore.classList.add('show');field.appendChild(noScore);return}noScore.classList.remove('show');for(var i=0;i<DIMENSIONS.length;i++){var d=DIMENSIONS[i],score=values[i];var article=document.createElement('article');article.className='dimension';article.setAttribute('aria-label',d.name+' score '+format(score)+' out of 100');var stage=document.createElement('div');stage.className='orb-stage';var orb=document.createElement('div');orb.className='orb';orb.setAttribute('role','img');orb.setAttribute('aria-label',d.name+' '+format(score)+' out of 100');var ring=document.createElement('span');ring.className='orb-ring';ring.setAttribute('aria-hidden','true');var glint=document.createElement('span');glint.className='orb-glint';glint.setAttribute('aria-hidden','true');var scoreNode=document.createElement('strong');scoreNode.className='orb-score';scoreNode.innerHTML=format(score)+'<small>/ 100</small>';orb.appendChild(ring);orb.appendChild(glint);orb.appendChild(scoreNode);stage.appendChild(orb);var name=document.createElement('div');name.className='dimension-name';name.textContent=d.name;var rule=document.createElement('div');rule.className='dimension-rule';rule.setAttribute('aria-hidden','true');article.appendChild(stage);article.appendChild(name);article.appendChild(rule);field.appendChild(article)}}
field.setAttribute('aria-busy','true');render();window.addEventListener('maxess:result-updated',render);window.addEventListener('MAXESS_RESULT_READY',render);window.addEventListener('storage',render);
})();
</script>
</body>
</html>
