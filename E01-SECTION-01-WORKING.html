<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040307">
<meta name="maxess-artifact" content="E01-SECTION-01-WORKING">
<title>MAXESS — Section 01 · Naya Welcome + AI Score Reveal</title>
<style>
:root{--bg:#040307;--deep:#030204;--white:#fff;--muted:rgba(255,255,255,.70);--soft:rgba(255,255,255,.48);--purple:#A66CFF;--violet:#D0A8FF;--gold:#F7D58C}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth;overflow-x:clip}body{margin:0;overflow-x:clip;background:var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}button:focus-visible{outline:3px solid #fff;outline-offset:5px}

#e01{min-height:100vh;width:100%;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 80% 42% at 50% 0,rgba(166,108,255,.11),transparent 70%),linear-gradient(180deg,#08060b 0%,var(--bg) 52%,var(--deep) 100%)}
#e01:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;background-image:radial-gradient(rgba(255,255,255,.42) .6px,transparent .7px);background-size:5px 5px;mask-image:linear-gradient(180deg,#000,transparent 72%)}
.shell{width:min(1180px,100%);margin:auto;padding:clamp(22px,4vw,44px) clamp(16px,4vw,42px) clamp(58px,7vw,96px);position:relative}.ambient{position:absolute;left:50%;top:24px;width:min(820px,110vw);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(166,108,255,.075),transparent 66%);filter:blur(30px);pointer-events:none;z-index:-1}

.naya{position:relative;isolation:isolate;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;margin:0 auto;padding:clamp(18px,2.6vw,26px);border:1px solid rgba(208,168,255,.22);border-radius:28px;background:linear-gradient(135deg,rgba(12,10,16,.98) 0%,rgba(18,14,24,.98) 54%,rgba(7,6,10,.98) 100%);box-shadow:0 30px 90px rgba(0,0,0,.46),inset 0 1px rgba(255,255,255,.10);overflow:hidden}
.naya:before{content:"";position:absolute;left:-130px;top:-180px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(166,108,255,.10),transparent 68%);filter:blur(12px);pointer-events:none;z-index:-1}
.avatar-wrap{position:relative;width:88px;height:88px;display:grid;place-items:center}.avatar-wrap:before{content:"";position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(166,108,255,.17),transparent 68%);filter:blur(7px);z-index:-1}.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.90);box-shadow:0 0 0 6px rgba(155,99,255,.09),0 14px 34px rgba(0,0,0,.40)}
.naya-copy{min-width:0}.kicker{margin:0;color:#d8c8ea;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.naya-title{margin:6px 0 0;font-size:clamp(24px,3vw,40px);line-height:1.02;letter-spacing:-.045em;font-weight:900}.naya-sub{max-width:620px;margin:9px 0 0;color:rgba(255,255,255,.68);font-size:15px;line-height:1.5}
.listen{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:184px;min-height:54px;padding:0 21px;border:1px solid rgba(185,144,255,.68);border-radius:999px;background:linear-gradient(180deg,#17131d 0%,#09070d 100%);color:#fff;font:inherit;font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.14),0 10px 24px rgba(0,0,0,.40),0 0 22px rgba(155,99,255,.11);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.listen:hover{transform:translateY(-2px);border-color:#caa8ff;box-shadow:inset 0 1px rgba(255,255,255,.20),0 15px 30px rgba(0,0,0,.48),0 0 30px rgba(155,99,255,.20)}.listen:active{transform:translateY(1px) scale(.988)}.listen-icon{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid rgba(208,168,255,.56);border-radius:50%;color:#e5d5ff;background:rgba(155,99,255,.08);font-size:10px}

.score-intro{text-align:center;padding-top:clamp(42px,6vw,72px)}.score-title{margin:0;color:#fff;font-size:clamp(28px,3.6vw,46px);line-height:1;letter-spacing:-.045em;font-weight:900;text-shadow:0 0 28px rgba(166,108,255,.16)}
.orb-wrap{width:min(560px,100%);aspect-ratio:1;position:relative;margin:clamp(18px,2.8vw,32px) auto 0;display:grid;place-items:center}.orb-atmosphere{position:absolute;inset:1%;border-radius:50%;background:radial-gradient(circle,rgba(166,108,255,.13),transparent 66%);filter:blur(24px)}.orb-track{position:absolute;inset:5%;border-radius:50%;border:1px solid rgba(208,168,255,.16);box-shadow:0 0 42px rgba(155,99,255,.12)}.orb-track:after{content:"";position:absolute;inset:6%;border-radius:50%;border:1px solid rgba(255,255,255,.055)}
.orb{--orb-color:#A66CFF;width:min(500px,82%);aspect-ratio:1;position:relative;display:grid;place-items:center;border-radius:50%;overflow:visible;background:radial-gradient(circle at 31% 19%,rgba(255,255,255,.20),transparent 12%),radial-gradient(circle at 38% 31%,rgba(208,168,255,.17),transparent 32%),radial-gradient(circle at 54% 57%,color-mix(in srgb,var(--orb-color) 22%,transparent),transparent 52%),radial-gradient(circle at 50% 45%,#17121e 0 40%,#09070d 76%);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 0 120px color-mix(in srgb,var(--orb-color) 21%,transparent),inset -34px -42px 82px rgba(0,0,0,.58),inset 18px 16px 54px rgba(255,255,255,.055),0 48px 130px rgba(0,0,0,.62),0 0 120px color-mix(in srgb,var(--orb-color) 18%,transparent);animation:orb-breathe 6s ease-in-out infinite}.orb:before{content:"";position:absolute;inset:2.2%;border-radius:50%;border:1px solid rgba(255,255,255,.11);box-shadow:inset 0 0 42px rgba(208,168,255,.08)}.orb:after{content:"";position:absolute;inset:-15px;border-radius:50%;border:1px solid rgba(208,168,255,.16);box-shadow:0 0 42px rgba(155,99,255,.14);pointer-events:none}
.score{position:relative;z-index:4;display:grid;place-items:center;text-align:center}.score-number{font-size:clamp(86px,14vw,174px);line-height:.78;font-weight:950;letter-spacing:-.095em;text-shadow:0 8px 38px rgba(0,0,0,.52),0 0 34px color-mix(in srgb,var(--orb-color) 24%,transparent);transition:opacity .24s ease,transform .24s ease}.score-number[data-hydrated="false"]{opacity:.55}.score-number[data-hydrated="true"]{opacity:1}
.bead{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#e3c9ff 24%,#9b63ff 58%,#5b2aad 100%);box-shadow:0 0 10px rgba(255,255,255,.55),0 0 26px rgba(155,99,255,.65);transform-origin:0 0;animation:orb-orbit 10s linear infinite;pointer-events:none;z-index:5}.bead:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(208,168,255,.14)}
.unavailable{display:none;max-width:560px;margin:18px auto 0;padding:14px 16px;border:1px solid rgba(247,213,140,.22);border-radius:16px;background:rgba(247,213,140,.06);color:rgba(255,255,255,.76);font-size:13px;text-align:center}.unavailable[data-visible="true"]{display:block}.live{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap;border:0}
@keyframes orb-breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.018);filter:brightness(1.035)}}@keyframes orb-orbit{0%{transform:rotate(0deg) translateX(220px) rotate(0deg)}100%{transform:rotate(360deg) translateX(220px) rotate(-360deg)}}
@media(max-width:820px){.naya{grid-template-columns:auto minmax(0,1fr)}.listen{grid-column:1/-1;width:100%}}@media(max-width:760px){.avatar-wrap,.avatar{width:78px;height:78px}.orb{width:min(280px,78%)}.bead{width:11px;height:11px;margin:-5.5px}@keyframes orb-orbit{0%{transform:rotate(0deg) translateX(140px) rotate(0deg)}100%{transform:rotate(360deg) translateX(140px) rotate(-360deg)}}}@media(max-width:520px){.shell{padding-left:14px;padding-right:14px}.naya{grid-template-columns:1fr;text-align:center;padding:22px 18px;border-radius:24px}.avatar-wrap{margin:0 auto}.naya-sub{margin-left:auto;margin-right:auto}.listen{grid-column:auto;width:100%}.score-intro{padding-top:42px}.orb-wrap{width:min(430px,100%)}.orb{width:min(280px,78%)}}@media(max-width:360px){.score-number{font-size:76px}.score-intro{padding-top:36px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.orb,.bead,.listen,.score-number{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="e01" aria-labelledby="section-title"><div class="shell"><div class="ambient" aria-hidden="true"></div>
<section class="naya" aria-labelledby="naya-title"><div class="avatar-wrap"><img class="avatar" src="https://i.postimg.cc/dVXw7sRN/grok-image-f75a6f12-4e3a-4c99-a334-5684ba0f7401.jpg" alt="Naya, your AI guide" loading="eager" decoding="async"></div>
<div class="naya-copy"><p class="kicker">NAYA</p><h1 id="naya-title" class="naya-title">I’ve got your results.</h1><p class="naya-sub">Let’s see what they reveal about the way you already work with AI.</p></div>
<button id="listen" class="listen" type="button" aria-label="Listen to Naya explain your MAXESS results"><span class="listen-icon" aria-hidden="true">▶</span><span>LISTEN TO NAYA</span></button></section>
<header class="score-intro"><h2 id="section-title" class="score-title">YOUR AI SCORE</h2></header>
<section class="orb-wrap" aria-label="Your AI score visualization"><div class="orb-atmosphere" aria-hidden="true"></div><div class="orb-track" aria-hidden="true"></div>
<div id="orb" class="orb" role="img" aria-labelledby="score-description"><div class="score"><span id="score-number" class="score-number" data-hydrated="false">—</span><span id="score-description" class="live">Your AI score is loading.</span></div></div><span class="bead" aria-hidden="true"></span></section>
<div id="unavailable" class="unavailable" data-visible="false">MAXESS has not received a valid result yet. This experience will not invent a score.</div><div id="live" class="live" aria-live="polite"></div></div></main>
<script>
(function(){'use strict';var root=document.getElementById('e01');if(!root)return;var scoreNode=document.getElementById('score-number'),unavailableNode=document.getElementById('unavailable'),liveNode=document.getElementById('live'),scoreDescription=document.getElementById('score-description'),orb=document.getElementById('orb'),listen=document.getElementById('listen');
function clamp(v){if(v===null||v===undefined||v==='')return null;var n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,n)):null}
function formatScore(v){return Number.isInteger(v)?String(v):String(Math.round(v*10)/10)}
function colorFor(v){var s=clamp(v);if(s===null)return '#A66CFF';var h=178+s*1.05,l=55+s*.10;return 'hsl('+h.toFixed(0)+' 78% '+l.toFixed(0)+'%)'}
function getResult(){if(window.MAXESS_RESULT&&typeof window.MAXESS_RESULT==='object')return window.MAXESS_RESULT;var params=new URLSearchParams(window.location.search);if(params.get('fixture')==='demo'){var fixtureScore=params.get('score');return{overallScore:fixtureScore===null?82:fixtureScore,__e01Fixture:true}}return null}
function render(){var result=getResult(),score=clamp(result&&result.overallScore);if(score===null){scoreNode.textContent='—';scoreNode.setAttribute('data-hydrated','false');unavailableNode.setAttribute('data-visible','true');orb.setAttribute('aria-label','Your MAXESS AI score is not currently available');scoreDescription.textContent='Your MAXESS AI score is not currently available.';liveNode.textContent='MAXESS score unavailable.';return false}var displayScore=formatScore(score),color=colorFor(score);orb.style.setProperty('--orb-color',color);scoreNode.textContent=displayScore;scoreNode.setAttribute('data-hydrated','true');unavailableNode.setAttribute('data-visible','false');orb.setAttribute('aria-label','Your MAXESS AI score is '+displayScore+' out of 100');scoreDescription.textContent='Your MAXESS AI score is '+displayScore+' out of 100.';liveNode.textContent='Your MAXESS AI score is '+displayScore+' out of 100.';return true}
function listenToNaya(){var selectors=['.v21-listen.b1s1-listen','.v21-listen','#maxess-naya-listen'];for(var i=0;i<selectors.length;i++){var nodes=document.querySelectorAll(selectors[i]);for(var j=0;j<nodes.length;j++){var node=nodes[j];if(node&&node!==listen&&getComputedStyle(node).display!=='none'){node.click();return}}}root.dispatchEvent(new CustomEvent('maxess:naya-listen',{bubbles:true,detail:{result:getResult()}}));window.dispatchEvent(new CustomEvent('maxess:naya-listen',{detail:{result:getResult()}}))}
listen.addEventListener('click',listenToNaya);window.MAXESS_E01={artifact:'E01-SECTION-01-WORKING',render:render,listen:listenToNaya};window.MAXESS_E01_ARTIFACT='E01-SECTION-01-WORKING';render();window.addEventListener('load',render,{once:true})();
</script>
</body>
</html>
