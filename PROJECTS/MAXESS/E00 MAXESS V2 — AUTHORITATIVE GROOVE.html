(function(){'use strict';
const ROOT=document.getElementById('MAXESS-E00-V2');
const ENGINE=window.MAXESS_E00_ENGINE_V2;
const DEFINITION=window.MAXESS_AI_SCORE_DEFINITION_V1;
if(!ROOT||!ENGINE||!DEFINITION)throw new Error('MAXESS authoritative dependencies missing');
ENGINE.validateDefinition(DEFINITION);
let state=ENGINE.createState(DEFINITION),releasedResult=null;
const $=id=>{const selector=id.charAt(0)==='#'?id:'#'+id;return ROOT.querySelector(selector)||document.querySelector(selector);};
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const accents=['#ffd45a','#35e39b','#3ca8ff','#765cff','#ed42c4'];
const glyphs=['◆','✦','△','✧','✦'];
function hideResults(){['#e01','#e02','#e03','#e04','#e05','#e06','#e07','#e08','#e09'].forEach(sel=>document.querySelectorAll(sel).forEach(el=>{el.style.display='none'}))}
function showResults(){['#e01','#e02','#e03','#e04','#e05','#e06','#e07','#e08','#e09'].forEach(sel=>document.querySelectorAll(sel).forEach(el=>el.style.removeProperty('display')))}
function render(){
 const q=ENGINE.currentQuestion(state,DEFINITION),n=state.questionIndex+1,total=DEFINITION.questions.length;
 $('#mx-pl').textContent='QUESTION '+n+' OF '+total;
 $('#mx-fill').style.width=(n/total*100)+'%';
 $('#mx-pp').textContent=Math.round(n/total*100)+'%';
 $('#mx-label').textContent=q.label;
 $('#mx-q').textContent=q.question;
 $('#mx-answers').innerHTML='';
 q.answers.forEach((answer,index)=>{
  const button=document.createElement('button');
  button.className='ans';button.type='button';button.style.setProperty('--a',accents[index]);button.setAttribute('aria-pressed','false');
  button.innerHTML='<span class="jewel"><span class="glyph">'+glyphs[index]+'</span></span><span><span class="at">'+esc(answer.title)+'</span><span class="ad">'+esc(answer.description)+'</span></span><span class="ch">›</span>';
  button.addEventListener('click',function(){ENGINE.selectAnswer(state,DEFINITION,answer.id);$('#mx-answers').querySelectorAll('.ans').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));$('#mx-cont').disabled=false;$('#mx-cont').setAttribute('aria-disabled','false');});
  $('#mx-answers').appendChild(button);
 });
 const ready=state.phase==='ANSWER_SELECTED';$('#mx-cont').disabled=!ready;$('#mx-cont').setAttribute('aria-disabled',ready?'false':'true');
}
function release(result){
 if(releasedResult)return releasedResult;
 ENGINE.validateResult(result,DEFINITION);
 releasedResult=ENGINE.freezeResult(result);
 $('#mx-cont').disabled=true;$('#mx-cont').setAttribute('aria-disabled','true');
 window.MAXESS_RESULT=releasedResult;
 window.MAXESS_RESULT_V1=releasedResult;
 window.MAXESS_RESULTS_RELEASED=true;
 window.dispatchEvent(new CustomEvent('MAXESS_RESULT_READY',{detail:releasedResult}));
 window.dispatchEvent(new CustomEvent('maxess:result-updated',{detail:releasedResult}));
 showResults();
 return releasedResult;
}
function advance(){
 if(releasedResult)return;
 if($('#mx-cont').disabled)return;
 const outcome=ENGINE.continueAssessment(state,DEFINITION);
 if(outcome.complete){
  const result=release(outcome.result);
  $('#mx-assess').style.display='none';
  $('#mx-done').classList.add('on');
  $('#mx-score').textContent=result.overallScore;
  return;
 }
 render();
}
$('#mx-cont').addEventListener('click',advance);
$('#mx-naya').addEventListener('click',function(){$('#mx-dtitle').textContent='Naya is with you.';$('#mx-dbody').textContent='Answer honestly based on what you actually do today. MAXESS is here to help you discover capability, not judge you.';$('#mx-dlg').classList.add('on');$('#mx-close').focus()});
$('#mx-close').addEventListener('click',function(){$('#mx-dlg').classList.remove('on')});
$('#mx-play').addEventListener('click',function(){const q=ENGINE.currentQuestion(state,DEFINITION);if('speechSynthesis'in window){window.speechSynthesis.cancel();window.speechSynthesis.speak(new SpeechSynthesisUtterance(q.question))}});
$('#mx-results').addEventListener('click',function(){const e=document.querySelector('#e01');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})});
ROOT.addEventListener('keydown',function(event){if(event.key==='Escape')$('#mx-dlg').classList.remove('on')});
hideResults();
render();
window.MAXESS_E00_V2={version:'2.0.0',engineVersion:ENGINE.ENGINE_VERSION,contractVersion:ENGINE.RESULT_CONTRACT,getState:()=>state,getResult:()=>releasedResult,configure:(definition,participant)=>{if(state.questionIndex||state.responses.length)return false;ENGINE.validateDefinition(definition);state=ENGINE.createState(definition,participant);releasedResult=null;render();return true}};
})();
</script>
