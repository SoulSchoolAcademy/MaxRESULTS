<script>
(function(){
'use strict';
if(window.__MAXESS_RESULT_CONSUMER_V2__)return;
window.__MAXESS_RESULT_CONSUMER_V2__=true;
var CONTRACT='MAXESS_RESULT_V1',READY='MAXESS_RESULT_READY',UPDATED='maxess:result-updated',KEY='MAXESS_RESULT_V1',timer=0,lastSig='';
function emit(name,result,source){try{window.dispatchEvent(new CustomEvent(name,{detail:result}));}catch(e){try{var ev=document.createEvent('CustomEvent');ev.initCustomEvent(name,false,false,result);window.dispatchEvent(ev);}catch(_){}}}
function decode(value){var s=String(value||'');try{s=decodeURIComponent(s);}catch(_){}s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),out='';for(var i=0;i<b.length;i++)out+=String.fromCharCode(b.charCodeAt(i));try{return decodeURIComponent(escape(out));}catch(_){return out;}}
function payload(){
  var h=window.location.hash||'',m=h.match(/(?:^|#|&)maxess-result=([^&]*)/i);
  if(m&&m[1])return m[1];
  try{return new URLSearchParams(window.location.search).get('result')||null;}catch(_){return null;}
}
function valid(r){if(!r||typeof r!=='object'||r.contractVersion!==CONTRACT)return false;var score=Number(r.overallScore);if(!isFinite(score)||score<0||score>100)return false;if(!Array.isArray(r.dimensions)||r.dimensions.length!==5)return false;if(!Array.isArray(r.responses)||r.responses.length!==15)return false;for(var i=0;i<5;i++){var d=r.dimensions[i];if(!d||typeof d.name!=='string'||!d.name.trim())return false;var ds=Number(d.score);if(!isFinite(ds)||ds<0||ds>100)return false;}return true;}
function sig(r){var a=[r.contractVersion,Number(r.overallScore),r.masteryBand||r.masteryStage||''];for(var i=0;i<r.dimensions.length;i++)a.push(String(r.dimensions[i].name)+':'+Number(r.dimensions[i].score));a.push(r.responses.length);return a.join('::');}
function hydrateE01(r){var score=Number(r.overallScore),nodes=document.querySelectorAll('#e01 #score-number,#maxess-e01-v2 #score-number,#maxess-e01-v3 #score-number');for(var i=0;i<nodes.length;i++){nodes[i].textContent=String(Math.round(score*10)/10).replace(/\.0$/,'');nodes[i].setAttribute('data-hydrated','true');nodes[i].setAttribute('data-demo','false');}}
function hydrateE02(r){var roots=document.querySelectorAll('#maxess-e02-v2,#maxess-e02-v3,#e02');for(var x=0;x<roots.length;x++){var names=roots[x].querySelectorAll('.e02-name'),scores=roots[x].querySelectorAll('.e02-score');for(var i=0;i<5;i++){var d=r.dimensions[i],score=Number(d.score);if(names[i])names[i].textContent=String(d.name).toUpperCase();if(scores[i]){scores[i].textContent=String(Math.round(score*10)/10).replace(/\.0$/,'');scores[i].setAttribute('data-score',String(score));scores[i].setAttribute('data-demo','false');}}}}
function hydrateSections(r){try{hydrateE01(r);}catch(_){}try{hydrateE02(r);}catch(_){} }
function publish(r,source,force){if(!valid(r))return false;var s=sig(r),changed=s!==lastSig;window.MAXESS_RESULT=r;try{sessionStorage.setItem(KEY,JSON.stringify(r));}catch(_){}try{localStorage.setItem(KEY,JSON.stringify(r));}catch(_){}hydrateSections(r);if(changed||force){lastSig=s;emit(READY,r,source);emit(UPDATED,r,source);}return true;}
function consume(source){var p=payload(),r=null;if(p){try{r=JSON.parse(decode(p));if(publish(r,source||'payload',false))return true;}catch(_){} }try{r=JSON.parse(sessionStorage.getItem(KEY)||'null');if(publish(r,source||'session',false))return true;}catch(_){}try{r=JSON.parse(localStorage.getItem(KEY)||'null');if(publish(r,source||'local',false))return true;}catch(_){}return false;}
function run(source){var ok=consume(source||'payload');if(ok&&window.MAXESS_RESULT)publish(window.MAXESS_RESULT,'hydration',true);if(timer<40){timer++;window.setTimeout(function(){run('hydration');},250);}}
window.MAXESS_RESULT_CONSUMER_V1={consume:function(){return consume('manual');},get:function(){return window.MAXESS_RESULT||null;},contractVersion:CONTRACT,version:'V2'};
window.MAXESS_RESULT_CONSUMER_V2=window.MAXESS_RESULT_CONSUMER_V1;
window.addEventListener('hashchange',function(){timer=0;lastSig='';run('hash');});
window.addEventListener('pageshow',function(){timer=0;run('pageshow');});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){timer=0;run('dom');},{once:true});else run('immediate');
})();
</script>
