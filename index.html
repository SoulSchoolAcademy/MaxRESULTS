<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a855f7"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="https://raw.githubusercontent.com/SoulSchoolAcademy/NayaPOWER/main/Naya%20ICON%20OFFICAL%20NEW.png"><title>NayaNET Vault</title><style>:root{--bg:#010103;--p:#a855f7;--g:#f4c95d;--muted:#aaa2b2;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,rgba(168,85,247,.14),transparent 38%),var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}.box{width:min(480px,100%);padding:42px 30px 34px;text-align:center;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));box-shadow:0 30px 100px rgba(0,0,0,.55)}.logo{width:96px;height:96px;object-fit:contain;margin:0 auto 24px;display:block}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--g);font-weight:800}h1{font-size:38px;line-height:1.05;margin:10px 0}.status{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:#d8cfe0;margin:4px 0 20px}.dot{width:8px;height:8px;border-radius:50%;background:#72f1b8;box-shadow:0 0 15px #72f1b8}p{color:var(--muted);line-height:1.6;margin:0 auto 28px}.field{display:flex;padding:5px;border:1px solid var(--line);border-radius:16px;background:#050407}.field input{width:100%;padding:14px;border:0;outline:0;background:none;color:#fff;font-size:16px}.cta{width:100%;margin-top:12px;padding:16px;border:0;border-radius:15px;color:#fff;background:linear-gradient(135deg,#8b3dce,#b866ff);font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 30px rgba(168,85,247,.22)}.note{font-size:11px;color:#777;margin-top:17px}</style></head><body><main class="box"><img class="logo" src="https://raw.githubusercontent.com/SoulSchoolAcademy/NayaPOWER/main/Naya%20ICON%20OFFICAL%20NEW.png" alt="NayaNET"><div class="eyebrow">Naya Power Player</div><h1>NayaNET Vault</h1><div class="status"><span class="dot"></span><span id="status">Naya Listening</span></div><p>Enter your name to open your Naya Power Player and continue your journey through the 18 Powercasts.</p><form id="form"><div class="field"><input id="name" autocomplete="name" maxlength="80" placeholder="Enter Your Name" required></div><button class="cta">Enter Power Player →</button></form><div class="note">Your name is remembered locally on this device.</div></main><script>const k='nayanet_user_name',n=document.getElementById('name'),s=document.getElementById('status');n.value=localStorage.getItem(k)||'';document.getElementById('form').onsubmit=e=>{e.preventDefault();let v=n.value.trim();if(!v)return;localStorage.setItem(k,v);s.textContent='Naya Responding';location.href='./hub.html'}</script></body></html>
