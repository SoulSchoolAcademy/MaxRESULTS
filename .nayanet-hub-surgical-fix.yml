name: NayaNET Hub surgical fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical Hub repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NAYANETHUB.html')
          s=p.read_text(encoding='utf-8')
          # Remove rejected legacy Today/briefing runtime blocks by script/function identity.
          import re
          rejected = ['addTodayNav','createTodayPage','activateToday','labelHome','normalizeTopbar','buildToday','sourceItems','todaySnapshot']
          for name in rejected:
              s=re.sub(r'<script[^>]*>.*?'+re.escape(name)+r'.*?</script>', '', s, flags=re.I|re.S)
          s=re.sub(r'<style[^>]*>.*?nh-v11-today.*?</style>', '', s, flags=re.I|re.S)
          s=re.sub(r'<[^>]+id=["\']page-intelligence-today["\'][^>]*>.*?</[^>]+>', '', s, flags=re.I|re.S)
          # Remove the rejected visible concepts wherever they were baked into static markup.
          s=s.replace('Your Intelligence Today','').replace('Daily Intelligence Briefing','')
          # Remove any prior surgical runtime so this repair is the sole authority.
          s=re.sub(r'<script[^>]*id=["\']nayanet-approved-hub-runtime["\'][^>]*>.*?</script>', '', s, flags=re.I|re.S)
          runtime=r'''<script id="nayanet-approved-hub-runtime">
          (()=>{
            const approved={personal:'Personal Feed',collective:'Collective Feed',lists:'Smart Lists',notes:'Smart Notes'};
            const navRoot=()=>document.querySelector('.nav');
            const norm=t=>(t||'').replace(/\s+/g,' ').trim().toLowerCase();
            function cleanNav(){
              const n=navRoot(); if(!n)return;
              [...n.querySelectorAll('button')].forEach(b=>{
                const t=norm(b.textContent);
                if(t==='your intelligence today'||t==='daily intelligence briefing'||t==='home'&&/today|briefing/i.test(b.textContent)) b.remove();
              });
              const seen=new Set();
              [...n.querySelectorAll('button')].forEach(b=>{
                const t=norm(b.textContent); const key=[norm(approved.notes),norm(approved.personal),norm(approved.collective),norm(approved.lists)].find(k=>t===k);
                if(key){if(seen.has(key)) b.remove(); else seen.add(key)}
              });
              ensureNav('🧠',approved.personal,'personal-feed');
              ensureNav('🌐',approved.collective,'collective-feed');
              ensureNav('📚',approved.lists,'smart-lists');
            }
            function ensureNav(icon,label,id){
              const n=navRoot(); if(!n)return;
              let b=[...n.querySelectorAll('button')].find(x=>norm(x.textContent)===norm(label));
              if(!b){b=document.createElement('button');b.innerHTML='<span class="ico">'+icon+'</span><span>'+label+'</span>';n.appendChild(b)}
              b.dataset.nayaPage=id;
              b.onclick=()=>show(id,b);
            }
            function page(id,title,sub){
              let el=document.getElementById('page-'+id); if(!el){el=document.createElement('section');el.id='page-'+id;el.className='page';el.innerHTML='<div class="pageHead"><div><div class="eyebrow">NAYANET</div><h1>'+title+'</h1><p>'+sub+'</p></div></div><div class="surface" style="padding:20px"><div class="noteList" data-list="'+id+'"></div></div>';document.querySelector('.main')?.appendChild(el)} return el;
            }
            function show(id,btn){
              document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
              const el=document.getElementById('page-'+id); if(el)el.classList.add('active');
              navRoot()?.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));
              const c=document.querySelector('.crumb strong'); if(c)c.textContent=btn?.innerText?.trim()||approved.notes;
            }
            function card(label,title,body,actions){
              return '<article class="note"><div class="noteTop"><span>'+label+'</span><span class="type">PRIVATE</span></div><div class="noteBody"><h3>'+title+'</h3><p>'+body+'</p></div><div class="noteTabs">'+actions.map(a=>'<button class="noteTab" type="button">'+a+'</button>').join('')+'</div></article>';
            }
            function populate(){
              const pf=document.querySelector('[data-list="personal-feed"]');
              const cf=document.querySelector('[data-list="collective-feed"]');
              const sl=document.querySelector('[data-list="smart-lists"]');
              if(pf&&!pf.children.length)pf.innerHTML=card('PERSONAL','Your private intelligence lives here.','Personal notes stay personal unless you deliberately share them or circulate them to Collective.',['SHARE','CIRCULATE TO COLLECTIVE','SAVE TO LIST']);
              if(cf&&!cf.children.length){cf.innerHTML=card('COLLECTIVE','Collective intelligence.','The social layer for intelligence intentionally shared with the Collective.',['LIKE','COMMENT','SAVE','SHARE']);cf.querySelectorAll('.noteTab').forEach(b=>b.onclick=()=>b.textContent==='LIKE'?'LIKED':b.textContent)}
              if(sl&&!sl.children.length)sl.innerHTML=card('SMART LIST','Organize what matters.','Personal and Collective blocks can coexist here. Saving organizes; it never publishes.',['OPEN LIST']);
            }
            function context(){
              const root=document.querySelector('.topbar'); if(!root)return;
              let el=document.getElementById('nayanet-local-context'); if(!el){el=document.createElement('div');el.id='nayanet-local-context';el.style.cssText='position:absolute;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;letter-spacing:.06em;color:#bdb8c7;text-align:center;white-space:nowrap;pointer-events:none';root.appendChild(el)}
              const d=new Date(),h=d.getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
              el.textContent=g+', Shawn · '+d.toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})+' · Canada';
            }
            function boot(){
              cleanNav();
              page('personal-feed','Personal Feed','Your private intelligence. Not social.');
              page('collective-feed','Collective Feed','The social layer for intentionally shared intelligence.');
              page('smart-lists','Smart Lists','Organize Personal and Collective blocks together. Saving is organization, never publication.');
              populate(); context();
              if(!document.getElementById('nayanet-hub-style')){const st=document.createElement('style');st.id='nayanet-hub-style';st.textContent='#nayanet-local-context{max-width:55vw}.noteTab{cursor:pointer}@media(max-width:900px){#nayanet-local-context{display:none}}';document.head.appendChild(st)}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
            setInterval(context,30000);
          })();
          </script>'''
          s=s.replace('</body>',runtime+'\n</body>') if '</body>' in s else s+runtime
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'NayaNET Surgical Repair'
          git config user.email 'actions@github.com'
          git add NAYANETHUB.html
          git diff --cached --quiet || git commit -m 'Surgical repair: approved Hub navigation and feeds'
          git push
