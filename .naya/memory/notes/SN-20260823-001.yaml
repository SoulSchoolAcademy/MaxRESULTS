summary: "Naya Power uses a structured GitHub-backed memory runtime so future AI sessions can restore relevant mission context without relying on fragile conversational memory."
source: "Naya Power design work and canonical Naya Notes specification reviewed in SoulSchoolAcademy/MaxRESULTS on 2026-08-23."
what_happened: "The project identified conversational context loss as a major operational failure and defined Restore Context plus Smart Notes as first-class runtime capabilities."
what_we_learned: "Durable memory must be structured, timestamped, classified, semantically retrievable, linked to evidence, explicit about supersession, and separate from governing law."
why_it_matters: "A fresh AI should be able to recover enough verified state to continue the mission without forcing the human to reconstruct prior work."
required_behavior: "When the human says Naya Power — RESTORE CONTEXT, read the canonical bootstrap, authority, mission, handoff, relevant notes, current repository state, conflicts, and stale assumptions, then return restored state plus the next best action."
